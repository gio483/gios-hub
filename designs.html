<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Design Gallery — Gio's Hub</title>
<style>
  :root{--bg:#0b1220;--card:#151f33;--card-hover:#1c2a44;--text:#f1f5f9;--muted:#94a3b8;--line:#26344f;--accent:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #16233e 0%, var(--bg) 55%) fixed;color:var(--text);min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  header{max-width:760px;margin:0 auto 18px}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 2px;font-weight:600;text-decoration:none}
  .back:hover{color:var(--text)}
  .title-row{display:flex;align-items:center;gap:11px;margin-top:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.92rem;margin:6px 4px 0}
  main{max-width:760px;margin:18px auto 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;transition:transform .12s ease,background .12s ease,border-color .12s ease;min-height:132px}
  .card:active{transform:scale(.98)}
  @media(hover:hover){.card:hover{background:var(--card-hover);border-color:#3a4d72;transform:translateY(-2px)}}
  .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.06)}
  .card h3{margin:0;font-size:1.06rem;line-height:1.2}
  .card p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.35}
  .meta{margin-top:auto;font-size:.74rem;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html" id="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      <span id="backLabel">Back</span>
    </a>
    <div class="title-row"><span class="dot" id="dot"></span><h1 id="title">Design Gallery</h1></div>
    <p class="sub" id="sub">Flipbooks, slideshows & visual deliverables — newest first.</p>
  </header>
  <main><div class="grid" id="grid"></div></main>

<script>
// Design pieces per business. Each piece links to its own version-history viewer
// (newest version opens by default). Add new pieces at the TOP of the list.
const DESIGNS = {
  ksh: { company:'KSH Construction', color:'#fbbf24', projects:[
    { name:'Designer Flipbook', desc:'Lookbook & client handbook', updated:'June 2, 2026', versions:2, href:'flipbook.html', icon:'📖' }
  ]},
  sdlr: { company:'San Diego Landscape', color:'#34d399', projects:[] },
  personal: { company:'Personal', color:'#a78bfa', projects:[] }
};

const params = new URLSearchParams(location.search);
const key = params.get('c') || 'ksh';
const data = DESIGNS[key] || DESIGNS.ksh;

document.getElementById('dot').style.background = data.color;
document.getElementById('title').textContent = data.company + ' · Design Gallery';
document.getElementById('backLabel').textContent = data.company;
document.getElementById('back').href = 'index.html#' + key;

const grid = document.getElementById('grid');
if (!data.projects.length) {
  grid.outerHTML = '<div class="empty">No finished designs here yet. Flipbooks, slideshows, and other visual pieces for ' + data.company + ' will appear here automatically.</div>';
} else {
  grid.innerHTML = data.projects.map(p => `
    <a class="card" href="${p.href}">
      <div class="ico" style="background:color-mix(in srgb, ${data.color} 16%, transparent)">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="meta">
        <span class="pill">Updated ${p.updated}</span>
        <span class="pill" style="color:${data.color}">${p.versions} version${p.versions>1?'s':''}</span>
      </div>
    </a>`).join('');
}
</script>
</body>
</html>
