<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Design Gallery — Gio's Hub</title>
<style>
  :root{--bg:#0b1220;--card:#151f33;--card-hover:#1c2a44;--text:#f1f5f9;--muted:#94a3b8;--line:#26344f;--accent:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #16233e 0%, var(--bg) 55%) fixed;color:var(--text);min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  header{max-width:760px;margin:0 auto 18px}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 2px;font-weight:600;text-decoration:none}
  .back:hover{color:var(--text)}
  .title-row{display:flex;align-items:center;gap:11px;margin-top:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.92rem;margin:6px 4px 0}
  main{max-width:760px;margin:18px auto 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;transition:transform .12s ease,background .12s ease,border-color .12s ease;min-height:132px}
  .card:active{transform:scale(.98)}
  @media(hover:hover){.card:hover{background:var(--card-hover);border-color:#3a4d72;transform:translateY(-2px)}}
  .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.06)}
  .card h3{margin:0;font-size:1.06rem;line-height:1.2}
  .card p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.35}
  .meta{margin-top:auto;font-size:.74rem;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .sec{margin:22px 4px 10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .sec:first-child{margin-top:0}
  .chip{border-radius:999px;padding:2px 9px;font-weight:700}
  .chip.final{background:rgba(52,211,153,.16);color:#34d399}
  .chip.review{background:rgba(251,191,36,.16);color:#fbbf24}
  .chip.printed{background:rgba(148,163,184,.16);color:#cbd5e1}
  .chip.reference{background:rgba(56,189,248,.14);color:#7dd3fc}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html" id="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      <span id="backLabel">Back</span>
    </a>
    <div class="title-row"><span class="dot" id="dot"></span><h1 id="title">Design Gallery</h1></div>
    <p class="sub" id="sub">Flipbooks, slideshows & visual deliverables — newest first.</p>
  </header>
  <main><div class="grid" id="grid"></div></main>

<script>
// Design pieces per business. Each piece links to its own version-history viewer
// (newest version opens by default). Add new pieces at the TOP of the list.
const DESIGNS = {
  ksh: { company:'KSH Construction', color:'#fbbf24', projects:[
    { name:'Designer Flipbook', desc:'Lookbook & client handbook', updated:'June 2, 2026', versions:2, href:'flipbook.html', icon:'📖' }
  ]},
  sdlr: { company:'San Diego Landscape', color:'#34d399', projects:[
    // status: final | review (waiting on Gio) | printed (older piece in use, do not reprint) | reference
    // Cleaned up 2026-11-25: every final opens on its final version; captions say what is final and what is still open.
    { status:'final', name:'Coroplast Yard Sign', desc:'Final v10: two-sided 24 × 18 jobsite sign, BACKYARD REMODELS one face and FRONT YARD REMODELS the other, the yard sign number (619) 613-2201 and a QR on each face to the yard sign page. Layered Illustrator file and print PDFs. Not ordered.', updated:'November 25, 2026', versions:10, href:'sdlr-coroplast-sign.html', icon:'\u{1FAA7}' },
    { status:'final', name:'Metal Yard Sign', desc:'Final v6: 36 × 24 aluminum panel for the H-frames (cream top, BACKYARD / FRONT YARD faces) and a two-sided 36 × 6 rider with 613-2201 and the backyard and front yard QRs. Layered Illustrator file and print PDFs. Not ordered.', updated:'November 25, 2026', versions:6, href:'sdlr-metal-sign.html', icon:'\u{1FAA7}' },
    { status:'final', name:'Uniform: Tee + Cap', desc:'Final v3 Black + Gold: black heavyweight tee and cap, everything in SDLR gold, woven logo patch on the cap. For upper management, friends and family. Layered Illustrator file and printer PDF. Not ordered.', updated:'November 24, 2026', versions:3, href:'sdlr-uniform.html', icon:'\u{1F9E2}' },
    { status:'final', name:'Door Hanger', desc:'Final v7: 4.25 × 11 door hanger in the brand Forest green with a cream back, services in capitals you can read from the doorstep. Layered Illustrator file and CMYK printer PDF. Not ordered.', updated:'November 22, 2026', versions:7, href:'sdlr-door-hangers.html', icon:'\u{1F6AA}' },
    { status:'final', name:'Fence Banner', desc:'Final v5: “Backyard in progress” jobsite banner with a full-yard photo, in 8 × 4 and 10 × 4 ft. Print PDFs with bleed. Not ordered.', updated:'November 22, 2026', versions:7, href:'sdlr-fence-banner.html', icon:'\u{1F3F3}\u{FE0F}' },
    { status:'final', name:'Shirts', desc:'Final v2: the printed black tee set and orange crew shirt, rebuilt as layered Illustrator files, with a Forest green version ready for the next print. Outlined printer PDFs.', updated:'November 22, 2026', versions:2, href:'sdlr-shirts.html', icon:'\u{1F455}' },
    { status:'final', name:'Brand Guide', desc:'v1.4: the handover guide for designers, editors and printers (logo, colour, type, layout, photo, video, voice, specs). Forest #2E382B is the one print green.', updated:'November 22, 2026', versions:4, href:'sdlr-brand-guide.html', icon:'\u{1F4D8}' },
    { status:'final', name:'Business Card', desc:'Final v3: two-sided card for Gio and Mike, a pen-and-ink backyard plan with the gold logo in the pool (foil-ready), phone, email, CSLB number and a small QR on the back. Layered Illustrator file and print PDFs. Not ordered.', updated:'November 21, 2026', versions:3, href:'sdlr-business-card.html', icon:'\u{1F4C7}' },
    { status:'final', name:'Wrap Site Plan', desc:'v4: the pen-and-ink aerial site plan line art behind the business card and the car wrap (strip, backyard, Rancho Santa Fe estate and planted backyard). No wording.', updated:'November 20, 2026', versions:4, href:'sdlr-wrap-siteplan.html', icon:'\u{1F58B}\u{FE0F}' },
    { status:'final', name:'Logo Animations', desc:'Three animated logo stings, intro and outro, landscape and vertical: MP4 plus transparent ProRes for video edits.', updated:'November 15, 2026', versions:2, href:'sdlr-logo-animations.html', icon:'\u{1F3AC}' },
    { status:'final', name:'Digital E-Card', desc:'Shareable contact card: tap to call, email or save the contact.', updated:'July 8, 2026', versions:1, href:'sdlr-ecard.html', icon:'\u{1F4B3}' },
    { status:'review', name:'Leave-Behind Kit', desc:'v7: 9 × 12 pocket folder and 12-page booklet a homeowner keeps after the consultation. Open: show all six projects or Chelsea Street only, the claims, and which printer.', updated:'November 23, 2026', versions:7, href:'sdlr-leave-behind-kit.html', icon:'\u{1F4C2}' },
    { status:'review', name:'Outdoor Living Club', desc:'v3: 16 lifestyle tee designs for friends, family, clients and referral partners, each with the full SDLR logo. Waiting on your picks.', updated:'November 22, 2026', versions:3, href:'sdlr-outdoor-living-club.html', icon:'\u{1F3D6}\u{FE0F}' },
    { status:'review', name:'Model Y Wrap', desc:'Newest v12 House Car (one gold crest per front door, phone and website on the back); v10 Midnight was the lead before it. Not chosen yet.', updated:'November 22, 2026', versions:12, href:'sdlr-model-y-wrap.html', icon:'\u{1F697}' },
    { status:'printed', name:'Yard Signs (October)', desc:'The two-sided sign printed in October, with the main line 613-2511 and the older palette. Do not reprint: use the Coroplast Yard Sign v10, so sign calls are counted on their own.', updated:'October 23, 2026', versions:11, href:'sdlr-yard-signs.html', icon:'\u{1FAA7}' },
    { status:'reference', name:'Design Wall', desc:'Every SDLR piece at its latest version on one wall, with a colour, type and wording check across them.', updated:'November 25, 2026', versions:1, href:'sdlr-design-wall.html', icon:'\u{1F9F1}' },
    { status:'reference', name:'Page One Plan', desc:'How SDLR reaches page 1 of Google: the backlink problem, three phases and a live checklist.', updated:'September 23, 2026', versions:1, href:'sdlr-page-one-plan.html', icon:'\u{1F5FA}\u{FE0F}' },
    { status:'reference', name:'Founder-Led Ad Scripts', desc:'Meta video ad script package: 12 hooks, offers, CTAs, 60/30/15 second cuts.', updated:'August 28, 2026', versions:1, href:'sdlr-ad-scripts.html', icon:'\u{1F3AC}' }
  ]},
  personal: { company:'Personal', color:'#a78bfa', projects:[] }
};

const params = new URLSearchParams(location.search);
const key = params.get('c') || 'ksh';
const data = DESIGNS[key] || DESIGNS.ksh;

document.getElementById('dot').style.background = data.color;
document.getElementById('title').textContent = data.company + ' · Design Gallery';
document.getElementById('backLabel').textContent = data.company;
document.getElementById('back').href = 'index.html#' + key;

const grid = document.getElementById('grid');
if (!data.projects.length) {
  grid.outerHTML = '<div class="empty">No finished designs here yet. Flipbooks, slideshows, and other visual pieces for ' + data.company + ' will appear here automatically.</div>';
} else {
  const STATUS = { final:'Final', review:'Waiting on you', printed:'Printed earlier', reference:'Reference' };
  const GROUPS = [
    ['final','Final, ready to use'],
    ['review','Waiting on your decision'],
    ['printed','Printed earlier, do not reprint'],
    ['reference','Plans and references']
  ];
  const card = p => `
    <a class="card" href="${p.href}">
      <div class="ico" style="background:color-mix(in srgb, ${data.color} 16%, transparent)">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="meta">
        ${p.status ? `<span class="chip ${p.status}">${STATUS[p.status]}</span>` : ''}
        <span class="pill">Updated ${p.updated}</span>
        <span class="pill" style="color:${data.color}">${p.versions} version${p.versions>1?'s':''}</span>
      </div>
    </a>`;
  if (data.projects.some(p => p.status)) {
    grid.outerHTML = GROUPS
      .map(([k, label]) => [label, data.projects.filter(p => (p.status || 'reference') === k)])
      .filter(([, list]) => list.length)
      .map(([label, list]) => `<h2 class="sec">${label}</h2><div class="grid">${list.map(card).join('')}</div>`)
      .join('');
  } else {
    grid.innerHTML = data.projects.map(card).join('');
  }
}
</script>
</body>
</html>
