<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Design Gallery — Gio's Hub</title>
<style>
  :root{--bg:#0b1220;--card:#151f33;--card-hover:#1c2a44;--text:#f1f5f9;--muted:#94a3b8;--line:#26344f;--accent:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #16233e 0%, var(--bg) 55%) fixed;color:var(--text);min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  header{max-width:760px;margin:0 auto 18px}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 2px;font-weight:600;text-decoration:none}
  .back:hover{color:var(--text)}
  .title-row{display:flex;align-items:center;gap:11px;margin-top:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.92rem;margin:6px 4px 0}
  main{max-width:760px;margin:18px auto 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;transition:transform .12s ease,background .12s ease,border-color .12s ease;min-height:132px}
  .card:active{transform:scale(.98)}
  @media(hover:hover){.card:hover{background:var(--card-hover);border-color:#3a4d72;transform:translateY(-2px)}}
  .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.06)}
  .card h3{margin:0;font-size:1.06rem;line-height:1.2}
  .card p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.35}
  .meta{margin-top:auto;font-size:.74rem;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html" id="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      <span id="backLabel">Back</span>
    </a>
    <div class="title-row"><span class="dot" id="dot"></span><h1 id="title">Design Gallery</h1></div>
    <p class="sub" id="sub">Flipbooks, slideshows & visual deliverables — newest first.</p>
  </header>
  <main><div class="grid" id="grid"></div></main>

<script>
// Design pieces per business. Each piece links to its own version-history viewer
// (newest version opens by default). Add new pieces at the TOP of the list.
const DESIGNS = {
  ksh: { company:'KSH Construction', color:'#fbbf24', projects:[
    { name:'Designer Flipbook', desc:'Lookbook & client handbook', updated:'June 2, 2026', versions:2, href:'flipbook.html', icon:'📖' }
  ]},
  sdlr: { company:'San Diego Landscape', color:'#34d399', projects:[
    { name:'Uniform: Tee + Cap', desc:'FINAL Black + Gold (Gio\'s pick of five colourways): a black heavyweight tee and black cap for upper management, friends and family, everything in SDLR gold \u2014 full logo on the chest; Designed in San Diego pool-deck plan, logo and website on the back; woven gold-on-black logo patch on the cap; layered Illustrator file and one-ink printer PDF, not ordered', updated:'November 24, 2026', versions:3, href:'sdlr-uniform.html', icon:'\u{1F9E2}' },
    { name:'Metal Yard Sign', desc:'36 \u00d7 24 aluminum jobsite sign for the JustSignFrames H-frame: BACKYARD REMODELS one side, FRONT YARD REMODELS the other, a full-width website and the number + QR on a 36 \u00d7 6 rider; final v6 = the v4 cream top with the yard sign number (619) 613-2201 on a two-sided cream rider (backyard QR under BACKYARD, front yard QR under FRONT YARD); layered Illustrator file and print PDFs', updated:'November 25, 2026', versions:6, href:'sdlr-metal-sign.html', icon:'\u{1FAA7}' },
    { name:'Leave-Behind Kit', desc:'What a homeowner keeps on the counter after the consultation \u2014 a 9 \u00d7 12 pocket folder (full-bleed pergola front, a note from your project manager) and a 12-page stapled booklet (why SDLR and the five-worries table, how we build and the materials we install, the six steps, our work from Chelsea Street to Point Loma, care after we finish), the same for every homeowner; flip through it page by page; layered Illustrator files + CMYK PDFs', updated:'November 23, 2026', versions:7, href:'sdlr-leave-behind-kit.html', icon:'\u{1F4C2}' },
    { name:'Design Wall', desc:'Every SDLR piece at its latest version, side by side on one wall, with a colour, type and wording check to make sure they all read as one brand', updated:'November 22, 2026', versions:1, href:'sdlr-design-wall.html', icon:'\u{1F9F1}' },
    { name:'Outdoor Living Club', desc:'Lifestyle tees from SDLR for friends, family, clients, referral partners and the community \u2014 16 designs over two rounds, and v3 puts the full SDLR logo on every shirt (chest or back yoke plus inside each design); lifestyle mockups and layered Illustrator files', updated:'November 22, 2026', versions:3, href:'sdlr-outdoor-living-club.html', icon:'\u{1F3D6}\u{FE0F}' },
    { name:'Coroplast Yard Sign', desc:'Cheap two-sided 24 \u00d7 18 coroplast jobsite sign, final v9 matches the approved metal sign (cream top): BACKYARD REMODELS one side, FRONT YARD REMODELS the other, Forest website band, the yard sign number (619) 613-2201 + QR to the yard sign page; street test, layered Illustrator file and print PDFs', updated:'November 25, 2026', versions:10, href:'sdlr-coroplast-sign.html', icon:'\u{1FAA7}' },
    { name:'Shirts', desc:'FINAL: the SDLR shirts that were printed, rebuilt as layered Illustrator files with live type \u2014 the black tee set (round San Diego \u00b7 California badge, arch, big gold badge and billboard backs) and the orange safety crew shirt, also in the Forest print green; outlined printer PDFs', updated:'November 22, 2026', versions:2, href:'sdlr-shirts.html', icon:'\u{1F455}' },
    { name:'Door Hanger', desc:'FINAL 4.25 \u00d7 11 door hanger \u2014 in the brand Forest green (matches the business card), the printed-mailer look with a cream back, every line given one job, and the front services in capitals you can read from the doorstep; dusk backyard on the front, front yard on the back; layered Illustrator file and CMYK printer PDF', updated:'November 22, 2026', versions:7, href:'sdlr-door-hangers.html', icon:'\u{1F6AA}' },
    { name:'Business Card', desc:'FINAL two-sided card for Gio and Mike \u2014 pen-and-ink backyard garden plan tone-on-tone with the gold logo in the pool (foil-ready); name-first back with phone, email, CSLB number and a small QR; layered Illustrator file and print PDFs', updated:'November 21, 2026', versions:3, href:'sdlr-business-card.html', icon:'\u{1F4C7}' },
    { name:'Model Y Wrap', desc:'Company-car wrap for the Juniper Model Y \u2014 newest: House Car, a quieter take on Midnight (near-black midnight green metallic flake, one gold SDLR crest on each front door, phone and website on the back); also Midnight, Duotone, Pergola Shade in cream and green, metallic green with a gold site plan; flat lay, proofs, 3D mockups and realistic photos of the real car', updated:'November 22, 2026', versions:12, href:'sdlr-model-y-wrap.html', icon:'\u{1F697}' },
    { name:'Fence Banner', desc:'8 \u00d7 4 or 10 \u00d7 4 ft jobsite banner for a La Jolla fence \u2014 \u201cBackyard in progress\u201d, full-yard photo (kitchen, pergola, fire, pool, turf, fence), print PDF with bleed', updated:'November 22, 2026', versions:7, href:'sdlr-fence-banner.html', icon:'\u{1F3F3}\u{FE0F}' },
    { name:'Wrap Site Plan', desc:'Pen-and-ink aerial site plans \u2014 the Model Y wrap strip, a 4:3 backyard, a Rancho Santa Fe estate and its planted backyard, no wording', updated:'November 20, 2026', versions:4, href:'sdlr-wrap-siteplan.html', icon:'\u{1F58B}\u{FE0F}' },
    { name:'Logo Animations', desc:'Three animated logo stings \u2014 intro and outro, landscape and vertical, MP4 plus transparent ProRes', updated:'November 15, 2026', versions:2, href:'sdlr-logo-animations.html', icon:'\u{1F3AC}' },
    { name:'Brand Guide', desc:'Full handover guide for designers, editors and printers — logo, color, type, layout, photography, video, voice, specs; v1.4 makes Forest #2E382B the one print green', updated:'November 22, 2026', versions:4, href:'sdlr-brand-guide.html', icon:'\u{1F4D8}' },
    { name:'Yard Signs', desc:'FINAL two-sided 24×18 jobsite sign — green face + cream face, print files with bleed', updated:'October 23, 2026', versions:11, href:'sdlr-yard-signs.html', icon:'🪧' },
      { name:'Page One Plan', desc:'How SDLR reaches page 1 — the one-backlink problem, 3 phases, live checklist', updated:'September 23, 2026', versions:1, href:'sdlr-page-one-plan.html', icon:'🗺️' },
    { name:'Founder-Led Ad Scripts', desc:'Meta video ad script package — 12 hooks, offers, CTAs, 60/30/15s cuts', updated:'August 28, 2026', versions:1, href:'sdlr-ad-scripts.html', icon:'🎬' },
    { name:'Digital E-Card', desc:'Shareable contact card — tap to call, email, save', updated:'July 8, 2026', versions:1, href:'sdlr-ecard.html', icon:'💳' }
  ]},
  personal: { company:'Personal', color:'#a78bfa', projects:[] }
};

const params = new URLSearchParams(location.search);
const key = params.get('c') || 'ksh';
const data = DESIGNS[key] || DESIGNS.ksh;

document.getElementById('dot').style.background = data.color;
document.getElementById('title').textContent = data.company + ' · Design Gallery';
document.getElementById('backLabel').textContent = data.company;
document.getElementById('back').href = 'index.html#' + key;

const grid = document.getElementById('grid');
if (!data.projects.length) {
  grid.outerHTML = '<div class="empty">No finished designs here yet. Flipbooks, slideshows, and other visual pieces for ' + data.company + ' will appear here automatically.</div>';
} else {
  grid.innerHTML = data.projects.map(p => `
    <a class="card" href="${p.href}">
      <div class="ico" style="background:color-mix(in srgb, ${data.color} 16%, transparent)">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="meta">
        <span class="pill">Updated ${p.updated}</span>
        <span class="pill" style="color:${data.color}">${p.versions} version${p.versions>1?'s':''}</span>
      </div>
    </a>`).join('');
}
</script>
</body>
</html>
