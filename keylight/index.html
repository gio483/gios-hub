<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keylight">
<meta name="description" content="Keylight is a physically accurate flash simulator for interior architectural photography. Place lights on a floor plan, set exposure, fire the shutter, and get scored against an art director's rubric.">
<title>Keylight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1013'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23e0b25c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23e0b25c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="topbar">
  <div class="brand">KEY<span>LIGHT</span></div>
  <div id="scene-name"></div>
  <div class="spacer"></div>
  <div class="pill" id="pill-mode"></div>
</header>

<div id="shell">
  <nav id="rail" aria-label="Sections">
    <button class="rail-btn" data-mode="learn" aria-label="Learning Center">
      <svg viewBox="0 0 24 24"><path d="M4 6h7a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4zM20 6h-7a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h7z"/></svg>
      Learn
    </button>
    <button class="rail-btn" data-mode="practice" aria-label="Practice">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8.5 6l1.4-2.2h4.2L15.5 6"/></svg>
      Shoot
    </button>
    <button class="rail-btn" data-mode="daily" aria-label="Daily Challenge">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Daily
    </button>
    <button class="rail-btn" data-mode="gear" aria-label="Gear">
      <svg viewBox="0 0 24 24"><path d="M6 3h6l1.6 4H6zM9 7v6M5.5 13h7l1.5 8h-10zM15 5h5v3h-5z"/></svg>
      Gear
    </button>
  </nav>

  <main id="stage">
    <section id="viewer">
      <div id="frame-wrap">
        <div id="frame-box">
          <canvas id="render" width="16" height="9"></canvas>
          <div id="overlay">
            <div class="badge" id="stale-badge">LIVE · AMBIENT ONLY</div>
            <div class="badge" id="warn-badge"></div>
            <div id="hist-wrap"><canvas id="hist"></canvas></div>
          </div>
          <div id="progress"><div class="prog-inner">
            <div id="prog-text">EXPOSING</div>
            <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
          </div></div>
          <div id="coach">
            <button class="coach-close" aria-label="Dismiss">×</button>
            <div class="coach-title" id="coach-title"></div>
            <div id="coach-body"></div>
          </div>
        </div>
      </div>

      <div id="strip">
        <div class="readout" id="ro-aperture"><span class="k">Aperture</span><span class="v"></span></div>
        <div class="readout" id="ro-shutter"><span class="k">Shutter</span><span class="v"></span></div>
        <div class="readout" id="ro-iso"><span class="k">ISO</span><span class="v"></span></div>
        <div class="readout" id="ro-wb"><span class="k">WB</span><span class="v"></span></div>
        <div class="readout" id="ro-focal"><span class="k">Focal</span><span class="v"></span></div>
        <div class="readout flash" id="ro-flash"><span class="k">Flash</span><span class="v"></span></div>
        <button id="shutter">SHOOT</button>
      </div>
    </section>

    <aside id="side">
      <div id="plan-wrap">
        <canvas id="plan"></canvas>
        <div id="plan-tools">
          <button class="mini" id="btn-modeling" title="Simulate the flash live, like a modeling lamp">MODELING</button>
          <button class="mini" id="btn-inspect" title="Orbit the room with the flash held as captured">INSPECT</button>
        </div>
      </div>
      <div id="plan-hint"></div>
      <div id="tabs">
        <button class="tab on" data-tab="camera">Camera</button>
        <button class="tab" data-tab="lights">Lights</button>
        <button class="tab" data-tab="lens">Lens</button>
      </div>
      <div id="panels"></div>
    </aside>

    <section id="learn-panel" class="hidden"></section>
  </main>
</div>

<div id="result">
  <div class="result-head">
    <div><span class="score-big" id="score-big">–</span><span class="score-of"> / 100</span></div>
    <div id="score-verdict" style="font-size:13px;color:var(--muted);line-height:1.5"></div>
  </div>
  <div class="result-body" id="result-body"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
