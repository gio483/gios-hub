<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gio Hub">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<title>Gio's Hub</title>
<style>
  :root{
    --bg:#0c0d0f; --side:#0f1013; --card:#16171a; --card2:#1c1d21; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --text:#eceef0; --muted:#8b8f96; --faint:#5d6168; --accent:#f2b544; --good:#7bc47f; --warn:#e8a33d;
    --shadow:0 18px 40px rgba(0,0,0,.45); --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f2ef; --side:#ebe9e5; --card:#ffffff; --card2:#f7f6f3; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.16);
    --text:#15161a; --muted:#5f636b; --faint:#9a9da3; --accent:#b7790f; --warn:#b26b00; --good:#2f8a37; --shadow:0 14px 30px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);
    padding:max(18px,env(safe-area-inset-top)) 14px 24px;display:flex;flex-direction:column;gap:2px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand b{font-family:var(--cond);font-size:26px;letter-spacing:.04em;line-height:1}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:2px}
  .nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:9px;padding:7px 8px;
    cursor:pointer;text-align:left;color:var(--muted);transition:background .15s,color .15s}
  .nav:hover{background:var(--card);color:var(--text)}
  .nav.on{background:var(--card2);color:var(--text)}
  .nav .k{font-family:var(--cond);font-size:22px;font-weight:600;width:16px;text-align:center;color:var(--text);line-height:1}
  .nav .l{flex:1;font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
  .nav .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .nav .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-left:-4px}
  .sep{height:1px;background:var(--line);margin:10px 8px}
  .side-help{margin-top:auto;padding:16px 8px 0;color:var(--faint);font-size:11px;line-height:1.7}
  .side-help kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted)}

  /* ---------- top bar ---------- */
  .main{min-width:0;padding:0 28px 60px}
  .top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;background:var(--bg);
    padding:max(16px,env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--line)}
  .menu-btn{display:none}
  .search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0 14px;height:42px}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--faint)}
  .btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;
    font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .btn:hover{border-color:var(--text)}
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;height:42px}
  .seg button{border:0;background:var(--card);padding:0 13px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em}
  .seg button.on{background:var(--text);color:var(--bg)}
  .icon-btn{width:42px;padding:0;display:flex;align-items:center;justify-content:center}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
  .chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* ---------- sections ---------- */
  .sec{margin-top:26px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-h.tog{cursor:pointer;user-select:none}
  .sec-h .chev{transition:transform .2s;color:var(--muted)}
  .sec-h.closed .chev{transform:rotate(-90deg)}
  .sec-h h2{margin:0;font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
  .sec-h h3{margin:0;font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  .sec-h .peek{display:flex;gap:4px;margin-left:6px}
  .sec-h .peek span{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden}
  .sec-h .peek img{width:14px;height:14px}
  .sec-h .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sec-h .right button{background:none;border:0;cursor:pointer;font-family:var(--cond);font-weight:600;letter-spacing:.12em;font-size:13px;color:var(--muted)}
  .sec-h .right button:hover{color:var(--text)}
  .sub{color:var(--muted);margin:-6px 0 14px;font-size:13px}

  /* ---------- grid cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 14px}
  .card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer;min-width:0}
  .thumb{position:relative;aspect-ratio:16/9.6;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:var(--c,#222);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .16s ease,box-shadow .16s ease}
  .card:hover .thumb{transform:translateY(-3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--shadow)}
  .thumb.ours{background:none}
  .thumb.ours::before{content:"";position:absolute;inset:0;filter:hue-rotate(var(--h,0deg)) saturate(1.6);
    background:radial-gradient(120% 120% at var(--x,30%) 10%, color-mix(in srgb,var(--c) 78%, #fff) 0%, var(--c) 46%, color-mix(in srgb,var(--c) 60%, #000) 100%)}
  .thumb > *{position:relative}
  .thumb > .pill,.thumb > .pin-mark,.thumb > .edit,.thumb > .bar{position:absolute}
  .thumb.light{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .thumb .emo{font-size:42px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .thumb .logo{width:54px;height:54px;border-radius:13px;object-fit:contain;background:#fff;padding:7px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .thumb.light .logo{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .thumb .mono{width:54px;height:54px;border-radius:13px;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:28px}
  .thumb .bar{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex}
  .thumb .bar span{flex:1}
  .pill{position:absolute;top:8px;left:8px;background:var(--accent);color:#1a1205;border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
  .pill.preview{background:#7fa9db;color:#08131f}
  .pill.local{background:#b39ae6;color:#160d26}
  .pill.building{background:#d9d9d9;color:#111}
  .pill.live{background:#86cf8a;color:#0b1a0c}
  .pin-mark{position:absolute;top:7px;right:10px;font-size:12px}
  .edit{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:7px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
  .card:hover .edit,.edit:focus-visible{opacity:1}
  @media (hover:none){.card .edit{opacity:.8}}
  .meta{display:flex;align-items:baseline;gap:8px;margin-top:9px}
  .meta .nm{flex:1;min-width:0;font-family:var(--cond);font-weight:700;font-size:16.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .price{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .price.set{color:var(--warn);border-bottom:1px dashed currentColor;cursor:pointer}
  .price.free{color:var(--good)}
  .desc{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;gap:8px;margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  /* ---------- list rows ---------- */
  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:grid;grid-template-columns:40px 1fr 150px 70px 110px 30px;align-items:center;gap:14px;padding:9px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line);background:var(--card);cursor:pointer}
  .row:first-child{border-top:0}
  .row:hover{background:var(--card2)}
  .ri{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--c);font-size:21px;overflow:hidden;flex:none}
  .ri img{width:70%;height:70%;border-radius:6px;background:#fff;padding:2px;object-fit:contain}
  .row .rn{font-weight:650;font-size:14px}
  .row .rd{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rk{font-family:var(--cond);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:13px}
  .row .rp{text-align:right}
  .row .tags{margin:0}
  .flat-edit{position:static;opacity:.55;background:none;color:var(--muted);width:28px;height:28px;border:0;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .flat-edit:hover{opacity:1;background:var(--card2)}

  /* ---------- money ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .v{font-family:var(--cond);font-size:38px;font-weight:700;line-height:1;letter-spacing:.01em}
  .kpi .t{font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .kpi .s{color:var(--muted);font-size:12px;margin-top:6px}
  .kpi.warn .v{color:var(--warn)}
  .bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .bar-row:first-child{border-top:0}
  .bar-row .bl{font-weight:600;display:flex;align-items:center;gap:8px}
  .bar-row .bt{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
  .bar-row .bt span{display:block;height:100%;border-radius:5px}
  .bar-row .bv{text-align:right;font-family:var(--mono);font-size:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .mtable{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mrow{display:grid;grid-template-columns:30px 1fr auto 28px;gap:12px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
  .mrow:first-child{border-top:0}
  .mrow .ri{width:30px;height:30px;border-radius:7px;font-size:15px}
  .mrow .mn{font-weight:600}
  .mrow .mb{font-size:11px;color:var(--muted)}
  .mrow .mv{font-family:var(--mono);font-size:12.5px;text-align:right}
  .mrow .mv small{display:block;color:var(--faint);font-size:10.5px}
  .mrow .typ{font-family:var(--cond);font-weight:600;letter-spacing:.1em;font-size:12px;color:var(--muted);text-transform:uppercase}
  .setp{display:flex;gap:6px;align-items:center}
  .setp input{width:72px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 8px;font-family:var(--mono);font-size:12px}
  .setp select{height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:12px}
  .setp button{height:30px;border-radius:7px;border:0;background:var(--text);color:var(--bg);padding:0 10px;font-weight:700;font-size:12px;cursor:pointer}
  .note{color:var(--faint);font-size:12px;margin-top:18px;max-width:720px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}

  /* ---------- dialog ---------- */
  dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--text);padding:0;width:min(520px,calc(100vw - 24px));box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
  .dlg{padding:20px 20px 16px;max-height:calc(100dvh - 40px);overflow:auto}
  .dlg h2{margin:0 0 14px;font-family:var(--cond);font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .f > label{font-family:var(--cond);font-weight:600;letter-spacing:.12em;font-size:13px;text-transform:uppercase;color:var(--muted)}
  .f input,.f select,.f textarea{height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 11px;font:inherit;font-size:15px}
  .f textarea{height:58px;padding:8px 11px;resize:vertical}
  .frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .f input,.f select,.f textarea{width:100%;min-width:0}
  .bizpick{display:flex;flex-wrap:wrap;gap:6px}
  .bizpick label{font-size:12.5px;font-weight:600;color:var(--text);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .bizpick input{display:none}
  .bizpick label:has(input:checked){background:var(--text);color:var(--bg)}
  .dlg-foot{display:flex;gap:8px;align-items:center;margin-top:6px}
  .dlg-foot .del{margin-right:auto;background:none;border:0;color:#e5636b;cursor:pointer;font-weight:600}
  .check{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:12px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);
    padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:all .25s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .scrim{display:none}

  /* ---------- phone ---------- */
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;inset:0 auto 0 0;width:272px;z-index:30;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow)}
    .side.open{transform:none}
    .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29;opacity:0;pointer-events:none;transition:opacity .25s}
    .scrim.open{opacity:1;pointer-events:auto}
    .main{padding:0 16px 50px}
    .menu-btn{display:flex}
    .hide-sm{display:none}
    .top{flex-wrap:wrap}
    .search{order:3;flex-basis:100%}
    .top .spacer{flex:1}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
    .sec-h h2{font-size:26px}
    .row{grid-template-columns:40px 1fr auto 28px;gap:10px}
    .row .tags,.row .rk{display:none}
    .two{grid-template-columns:1fr}
    .bar-row{grid-template-columns:90px 1fr 74px}
    .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none}
    .mrow{grid-template-columns:30px 1fr auto}
    .mrow .flat-edit{display:none}
    .mrow:has(.setp){grid-template-columns:30px 1fr}
    .mrow .setp{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="icon-192.png?v=2" alt=""><div><b>DOCK</b><small id="brandCount"></small></div></div>
    <div id="nav"></div>
    <div class="side-help">Type anywhere to search. <kbd>Alt</kbd>+<kbd>0</kbd>–<kbd>6</kbd> buckets · <kbd>Alt</kbd>+<kbd>O</kbd> ours · <kbd>T</kbd> tools · <kbd>U</kbd> utilities · <kbd>W</kbd> sites · <kbd>M</kbd> money · <kbd>A</kbd> all · <kbd>N</kbd> add</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <button class="btn icon-btn menu-btn" id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search"></label>
      <span class="spacer"></span>
      <button class="btn primary" id="addBtn">+ Add</button>
      <div class="seg" id="layoutSeg"><button data-l="grid">GRID</button><button data-l="list">LIST</button></div>
      <button class="btn icon-btn" id="themeBtn" aria-label="Light or dark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form class="dlg" id="form">
  <h2 id="dlgTitle">Add to dock</h2>
  <div class="f"><label>Name</label><input name="n" required></div>
  <div class="f"><label>Link</label><input name="u" placeholder="https://… or page.html"></div>
  <div class="f"><label>What it does</label><textarea name="d"></textarea></div>
  <div class="frow">
    <div class="f"><label>Kind</label><select name="k">
      <option value="app">App we built</option><option value="site">Website</option><option value="tool">Tool / subscription</option><option value="util">Quick utility (downloader, converter…)</option><option value="course">Course</option><option value="design">Design</option></select></div>
    <div class="f"><label>Status</label><select name="s"><option value="">None</option><option value="live">Live</option><option value="preview">Preview</option><option value="building">Building</option><option value="local">Runs on the Mac</option></select></div>
  </div>
  <div class="f"><label>Businesses</label><div class="bizpick" id="bizPick"></div></div>
  <div class="frow">
    <div class="f"><label>Price</label><input name="amt" inputmode="decimal" placeholder="0.00"></div>
    <div class="f"><label>Billing</label><select name="per">
      <option value="mo">Monthly</option><option value="yr">Yearly</option><option value="life">Lifetime (paid once)</option>
      <option value="free">Free</option><option value="usage">Pay as you go</option><option value="incl">Included with another plan</option><option value="none">Don't know yet</option></select></div>
  </div>
  <div class="frow">
    <div class="f"><label>Emoji</label><input name="i" placeholder="optional"></div>
    <div class="f"><label>Logo from site</label><input name="dom" placeholder="optional, e.g. canva.com"></div>
  </div>
  <div class="frow">
    <div class="f"><label>Card color</label><input name="c" type="color" style="padding:3px"></div>
    <div class="f"><label>We built it?</label><select name="ours"><option value="1">Yes, ours</option><option value="">No, a tool we use</option></select></div>
  </div>
  <label class="check"><input type="checkbox" name="pin"> Pin to the top of Most used</label>
  <div class="dlg-foot">
    <button type="button" class="del" id="delBtn">Remove</button>
    <button type="button" class="btn" id="cancelBtn">Cancel</button>
    <button type="submit" class="btn primary">Save</button>
  </div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="dock-data.js?v=10"></script>
<script>
/* ============ STATE ============ */
const BIZ = window.DOCK_BIZ, BASE = window.DOCK_ITEMS;
const BIZMAP = Object.fromEntries(BIZ.map(b=>[b.id,b]));
const LS = 'gio-dock-v1', LS_UI = 'gio-dock-ui-v1', API = '/api/lifeos?ns=dock';
// what "Most used" shows until the hub has learned from real opens:
// ranked by Chrome visits in the gio@shiftvisionmedia.com profile (2026-11-02)
const SEED = ['magnific','svm-highlevel','youtube','ghl','gdocs','gmail','github','ga4','chatgpt','gdrive','gcal','canva','sdlr-hq','stripe','instagram','site-bni','linkedin','claude','bni-connect','cloudflare'];
const KINDS = { app:'Apps we built', site:'Websites', design:'Designs & decks', tool:'Tools & subscriptions', util:'Quick utilities', course:'Courses & learning' };
const KIND_ORDER = ['app','site','design','tool','util','course'];

let store = read(LS, {});           // synced: it:<id> = edits/additions, op:<id> = open counts
let ui = Object.assign({ view:'used', layout:'grid', theme:'dark', closed:{ recent:true, added:true }, biz:'' }, read(LS_UI, {}));
let dirty = new Set();
let q = '';

function read(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* merged catalog: dock-data.js defaults + Gio's edits/additions, minus removed */
function items(includeHidden){
  const out = {};
  BASE.forEach(it => out[it.id] = Object.assign({}, it));
  for(const [k,v] of Object.entries(store)){
    if(!k.startsWith('it:') || !v) continue;
    const id = k.slice(3);
    if(!out[id] && !(v.data && v.data.n)) continue;
    out[id] = Object.assign(out[id] || { id, user:true }, v.data || {}, { id, hidden: !!v.hidden });
  }
  return Object.values(out).filter(it => includeHidden || !it.hidden);
}
const opens = id => store['op:'+id] || { n:0, t:0 };

/* ============ SYNC (same Blob store as Life OS / BNI Outreach) ============ */
function put(key, val){ val.u = Date.now(); store[key] = val; dirty.add(key); write(LS, store); push(); }
let pushT;
function push(){
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    if(!dirty.size) return;
    const keys = [...dirty], data = {}; keys.forEach(k => data[k] = store[k]);
    try{
      const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ data }) });
      if(r.ok) keys.forEach(k => dirty.delete(k));
    }catch(e){}
  }, 600);
}
async function pull(){
  try{
    const r = await fetch(API, { cache:'no-store' });
    if(!r.ok) return;
    const remote = (await r.json()).data || {};
    let changed = false;
    for(const [k,v] of Object.entries(remote)){
      if(!v || typeof v !== 'object') continue;
      if(Number(v.u||0) > Number((store[k]||{}).u||0)){ store[k] = v; changed = true; }
    }
    for(const [k,v] of Object.entries(store)){ if(Number((v||{}).u||0) > Number((remote[k]||{}).u||0)) dirty.add(k); }
    write(LS, store); push();
    if(changed) render();
  }catch(e){}
}

/* ============ MONEY HELPERS ============ */
const perMonth = p => Array.isArray(p) ? (p[1]==='mo' ? p[0] : p[1]==='yr' ? p[0]/12 : 0) : 0;
const perYear  = p => Array.isArray(p) ? (p[1]==='mo' ? p[0]*12 : p[1]==='yr' ? p[0] : 0) : 0;
function money(v, d){
  const dec = d==null ? (Math.round(v*100)%100 ? 2 : 0) : d;
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function priceLabel(it){
  const p = it.p;
  if(Array.isArray(p)) return p[1]==='life' ? `<span class="price">LIFE · ${money(p[0])}</span>` : `<span class="price">${money(p[0])}/${p[1]}</span>`;
  if(p==='free') return `<span class="price free">FREE</span>`;
  if(p==='usage') return `<span class="price">USAGE</span>`;
  if(p==='incl') return `<span class="price">INCLUDED</span>`;
  if(needsPrice(it)) return `<span class="price set" data-edit="${esc(it.id)}">SET PRICE</span>`;
  return '';
}
const needsPrice = it => (it.k==='tool' || it.k==='course') && !it.ours && it.p==null;

/* ============ RENDER PIECES ============ */
function isLight(hex){
  const h = (hex||'#222').replace('#',''); if(h.length<6) return false;
  const n = parseInt(h,16);
  return ((n>>16&255)*299 + (n>>8&255)*587 + (n&255)*114)/1000 > 170;
}
// small per-item hue/light shift so a row of same-business cards doesn't read as one block
function vary(id){
  let h = 0; for(const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return `--h:${(h % 120) - 60}deg;--x:${15 + (h >>> 7) % 70}%`;
}
const logoUrl = dom => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=128`;
function art(it, small){
  const letter = esc((it.n||'?')[0]);
  if(it.dom && !(it.ours && it.i)){
    const fb = small ? letter : `<span class=&quot;mono&quot;>${letter}</span>`;
    return `<img ${small?'':'class="logo"'} src="${logoUrl(it.dom)}" alt="" loading="lazy" onerror="this.outerHTML='${fb}'">`;
  }
  if(it.i) return small ? esc(it.i) : `<span class="emo">${esc(it.i)}</span>`;
  return small ? letter : `<span class="mono">${letter}</span>`;
}
function linkAttrs(it){
  if(!it.u) return `role="button" tabindex="0" data-local="${esc(it.id)}"`;
  const ext = /^https?:\/\//.test(it.u);
  return `href="${esc(it.u)}" data-open="${esc(it.id)}"${ext ? ' target="_blank" rel="noopener"' : ''}`;
}
const STATUS = { live:'Live', preview:'Preview', local:'On the Mac', building:'Building' };
const PEN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const bizTags = it => (it.b||[]).filter(b=>BIZMAP[b]).map(b => `<span style="color:${BIZMAP[b].c}">${BIZMAP[b].short}</span>`).join('');
function card(it){
  return `<a class="card" ${linkAttrs(it)}>
    <div class="thumb ${it.ours && !it.dom ? 'ours' : ''} ${isLight(it.c)?'light':''}" style="--c:${esc(it.c||'#222')};${vary(it.id)}">
      ${art(it)}
      ${it.s ? `<span class="pill ${esc(it.s)}">${STATUS[it.s]||esc(it.s)}</span>` : ''}
      ${it.pin ? '<span class="pin-mark">📌</span>' : ''}
      <span class="bar">${(it.b||[]).filter(b=>BIZMAP[b]).map(b=>`<span style="background:${BIZMAP[b].c}"></span>`).join('')}</span>
      <button class="edit" data-edit="${esc(it.id)}" aria-label="Edit ${esc(it.n)}">${PEN}</button>
    </div>
    <div class="meta"><span class="nm">${esc(it.n)}</span>${priceLabel(it)}</div>
    <p class="desc">${esc(it.d)}</p>
    <div class="tags">${bizTags(it)}</div>
  </a>`;
}
function row(it){
  return `<a class="row" ${linkAttrs(it)}>
    <span class="ri" style="--c:${esc(it.c||'#222')}">${art(it, true)}</span>
    <span style="min-width:0"><div class="rn">${esc(it.n)}</div><div class="rd">${esc(it.d)}</div></span>
    <span class="tags">${bizTags(it)}</span>
    <span class="rk">${({app:'App',site:'Site',tool:'Tool',util:'Utility',course:'Course',design:'Design'})[it.k]||''}</span>
    <span class="rp">${priceLabel(it) || (it.s ? `<span class="price">${STATUS[it.s]}</span>` : '')}</span>
    <button class="flat-edit" data-edit="${esc(it.id)}" aria-label="Edit ${esc(it.n)}">${PEN}</button>
  </a>`;
}
const collection = list => !list.length ? `<div class="empty">Nothing here yet.</div>`
  : ui.layout==='list' ? `<div class="list">${list.map(row).join('')}</div>` : `<div class="grid">${list.map(card).join('')}</div>`;
function section(id, title, list, opts={}){
  const closed = opts.toggle && ui.closed[id];
  const peek = closed ? `<span class="peek">${list.slice(0,6).map(it=>`<span style="background:${esc(it.c)}">${art(it,true)}</span>`).join('')}</span>` : '';
  const head = title || opts.right ? `<div class="sec-h ${opts.toggle?'tog':''} ${closed?'closed':''}" ${opts.toggle?`data-toggle="${id}"`:''}>
      ${opts.toggle ? '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>' : ''}
      ${opts.big ? `<h2>${title}</h2>` : `<h3>${title}</h3>`}${peek}
      <span class="right">${opts.right||''}${opts.toggle ? `<button>${closed?'EXPAND':'COLLAPSE'}</button>` : ''}</span>
    </div>` : '';
  return `<section class="sec">${head}${closed ? '' : collection(list)}</section>`;
}

/* ============ VIEWS ============ */
function mostUsed(all){
  const by = Object.fromEntries(all.map(i=>[i.id,i])), now = Date.now();
  // opens fade by half every 14 days so the list follows what Gio uses now
  const score = it => { const o = opens(it.id); return o.n ? o.n * Math.pow(.5, (now - o.t) / (14*864e5)) : 0; };
  const list = [...all.filter(i => i.pin), ...all.filter(i => !i.pin && opens(i.id).n).sort((a,b) => score(b) - score(a))];
  for(const id of SEED){ if(list.length >= 20) break; if(by[id] && !list.includes(by[id])) list.push(by[id]); }
  return list.slice(0, 20);
}
const NAV = [
  { id:'used', k:'0', l:'Most used' },
  ...BIZ.map(b => ({ id:b.id, k:b.key, l:b.id==='sdlr' ? 'SDLR' : b.n, dot:b.c })),
  { sep:true },
  { id:'ours', k:'O', l:'Ours' },
  { id:'tool', k:'T', l:'Tools & subs' },
  { id:'site', k:'W', l:'Websites' },
  { id:'design', k:'D', l:'Designs' },
  { id:'util', k:'U', l:'Utilities' },
  { id:'course', k:'C', l:'Courses' },
  { id:'all', k:'A', l:'All' },
  { id:'money', k:'$', l:'Money' },
  { sep:true },
  { id:'add', k:'+', l:'Add to dock' }
];
function countFor(id, all){
  if(id==='used') return mostUsed(all).length;
  if(BIZMAP[id]) return all.filter(i => (i.b||[]).includes(id)).length;
  if(id==='ours') return all.filter(i => i.ours).length;
  if(KINDS[id]) return all.filter(i => i.k===id).length;
  if(id==='all') return all.length;
  if(id==='money'){ const b = all.reduce((s,i)=>s+perMonth(i.p),0); return b ? money(b,0) : ''; }
  return '';
}
function renderNav(all){
  document.getElementById('brandCount').textContent =
    `${all.length} links · ${all.filter(i=>i.ours && i.k!=='site').length} apps · ${all.filter(i=>i.k==='site').length} sites`;
  document.getElementById('nav').innerHTML = NAV.map(n => n.sep ? '<div class="sep"></div>' :
    `<button class="nav ${ui.view===n.id && !q ?'on':''}" data-view="${n.id}">
      <span class="k">${n.k}</span>${n.dot?`<span class="dot" style="background:${n.dot}"></span>`:''}<span class="l">${n.l}</span><span class="n">${countFor(n.id, all)}</span>
    </button>`).join('');
}
const bizChips = () => `<div class="chips"><button class="chip ${!ui.biz?'on':''}" data-biz="">Every business</button>${BIZ.map(b =>
  `<button class="chip ${ui.biz===b.id?'on':''}" data-biz="${b.id}"><i style="background:${b.c}"></i>${b.short}</button>`).join('')}</div>`;
const byBiz = list => ui.biz ? list.filter(i => (i.b||[]).includes(ui.biz)) : list;
const sortTools = (a,b) => (perMonth(b.p) - perMonth(a.p)) || (Array.isArray(b.p) - Array.isArray(a.p)) || a.n.localeCompare(b.n);
const header = (title, right, extra='') => `<section class="sec"><div class="sec-h"><h2>${title}</h2><span class="right">${right}</span></div>${extra}</section>`;

function viewHTML(all){
  if(q){
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hay = it => [it.n, it.d, it.u, it.dom, it.note, KINDS[it.k], ...(it.b||[]).map(b => BIZMAP[b] ? BIZMAP[b].n+' '+BIZMAP[b].short : '')].join(' ').toLowerCase();
    const hits = all.filter(it => terms.every(t => hay(it).includes(t)));
    return section('search', 'Results', hits, { big:true, right:`${hits.length} match${hits.length===1?'':'es'} · Enter opens the first` });
  }
  const v = ui.view;
  if(v==='used'){
    const used = mostUsed(all);
    const recent = all.filter(i => opens(i.id).t).sort((a,b) => opens(b.id).t - opens(a.id).t).slice(0,10);
    const added = all.filter(i => i.add).sort((a,b) => b.add.localeCompare(a.add)).slice(0,10);
    return section('used', 'Most used', used, { big:true, right:'learns from what you open' })
      + (recent.length ? section('recent', 'Recently opened', recent, { toggle:true, right:`${recent.length}` }) : '')
      + section('added', 'Recently added', added, { toggle:true, right:`${added.length}` });
  }
  if(BIZMAP[v]){
    const b = BIZMAP[v], mine = all.filter(i => (i.b||[]).includes(v));
    const burn = mine.reduce((s,i) => s + perMonth(i.p) / Math.max(1,(i.b||[]).length), 0);
    const unknown = mine.filter(needsPrice).length;
    let html = `<section class="sec"><div class="sec-h"><h2 style="color:${b.c}">${esc(b.n)}</h2><span class="right">${mine.length} links</span></div>
      <p class="sub">Known tool costs: <b style="color:var(--text)">${money(burn)}/mo</b>${unknown ? ` · <a href="#money" data-view="money" style="color:var(--warn)">${unknown} still need a price</a>` : ''}</p></section>`;
    for(const k of KIND_ORDER){
      const list = mine.filter(i => i.k===k);
      if(k==='tool') list.sort(sortTools);
      if(list.length) html += section(v+'-'+k, KINDS[k], list, { right:`${list.length}` });
    }
    return html;
  }
  if(v==='ours'){
    const list = byBiz(all.filter(i => i.ours));
    let html = header('Built by us', list.length, bizChips());
    for(const k of ['app','site','design','course']){ const l = list.filter(i=>i.k===k); if(l.length) html += section('ours-'+k, KINDS[k], l, { right:`${l.length}` }); }
    return html;
  }
  if(KINDS[v]){
    const list = byBiz(all.filter(i => i.k===v));
    list.sort(v==='tool' ? sortTools : (a,b) => (b.add||'').localeCompare(a.add||''));
    return header(KINDS[v], list.length, bizChips()) + section(v+'-list', '', list);
  }
  if(v==='all'){
    const list = byBiz(all).sort((a,b) => a.n.localeCompare(b.n));
    const hidden = items(true).filter(i => i.hidden);
    return header('All', list.length, bizChips()) + section('all-list','',list)
      + (hidden.length ? `<section class="sec"><div class="sec-h"><h3>Removed</h3><span class="right">tap to bring back</span></div><div class="chips">${hidden.map(h=>`<button class="chip" data-restore="${esc(h.id)}">↺ ${esc(h.n)}</button>`).join('')}</div></section>` : '');
  }
  if(v==='money') return moneyView(all);
  return '';
}

function moneyView(all){
  const list = byBiz(all.filter(i => i.k==='tool' || i.k==='course' || i.p));
  const sorted = f => list.filter(f).sort((a,b)=>b.p[0]-a.p[0]);
  const monthly = sorted(i => Array.isArray(i.p) && i.p[1]==='mo');
  const yearly  = sorted(i => Array.isArray(i.p) && i.p[1]==='yr');
  const life    = sorted(i => Array.isArray(i.p) && i.p[1]==='life');
  const usage   = list.filter(i => i.p==='usage');
  const free    = list.filter(i => i.p==='free');
  const incl    = list.filter(i => i.p==='incl');
  const unknown = list.filter(needsPrice);
  // with a business picked, a shared tool only counts its share
  const share = i => ui.biz ? 1 / Math.max(1,(i.b||[]).length) : 1;
  const burn = list.reduce((s,i) => s + perMonth(i.p) * share(i), 0);
  const year = list.reduce((s,i) => s + perYear(i.p) * share(i), 0);
  const lifeTotal = life.reduce((s,i) => s + i.p[0] * share(i), 0);

  const perBiz = BIZ.map(b => ({ b, v: all.reduce((s,i) => (i.b||[]).includes(b.id) ? s + perMonth(i.p) / Math.max(1,(i.b||[]).length) : s, 0) }))
    .filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const maxB = Math.max(1, ...perBiz.map(x=>x.v));
  const bizLine = it => (it.b||[]).map(b=>BIZMAP[b]?BIZMAP[b].short:'').join(' · ');
  const mrow = (it, right) => `<div class="mrow"><span class="ri" style="--c:${esc(it.c||'#222')}">${art(it,true)}</span><div style="min-width:0"><div class="mn">${esc(it.n)}</div><div class="mb">${bizLine(it)}${it.note?' · '+esc(it.note):''}</div></div>${right}<button class="flat-edit" data-edit="${esc(it.id)}" aria-label="Edit ${esc(it.n)}">${PEN}</button></div>`;
  const table = (title, rows, fn, sub) => rows.length ? `<section class="sec"><div class="sec-h"><h3>${title}</h3><span class="right">${rows.length}</span></div>${sub?`<p class="sub">${sub}</p>`:''}<div class="mtable">${rows.map(fn).join('')}</div></section>` : '';

  return header('Money', 'what the stack costs', bizChips()) + `
  <section class="sec"><div class="kpis">
    <div class="kpi"><div class="t">Every month</div><div class="v">${money(burn,0)}</div><div class="s">${monthly.length} monthly + ${yearly.length} yearly, spread out</div></div>
    <div class="kpi"><div class="t">Every year</div><div class="v">${money(year,0)}</div><div class="s">All the subscriptions added up</div></div>
    <div class="kpi"><div class="t">Paid once</div><div class="v">${money(lifeTotal,0)}</div><div class="s">${life.length} lifetime license${life.length===1?'':'s'}, never billed again</div></div>
    <div class="kpi warn"><div class="t">Need a price</div><div class="v">${unknown.length}</div><div class="s">Fill these in below and the totals grow</div></div>
  </div></section>
  ${!ui.biz && perBiz.length ? `<section class="sec"><div class="sec-h"><h3>Monthly cost by business</h3></div><p class="sub">A tool two businesses share counts half to each.</p><div class="bars">${perBiz.map(x => `<div class="bar-row"><span class="bl"><i style="width:8px;height:8px;border-radius:50%;background:${x.b.c}"></i>${x.b.short}</span><span class="bt"><span style="width:${(x.v/maxB*100).toFixed(1)}%;background:${x.b.c}"></span></span><span class="bv">${money(x.v)}/mo</span></div>`).join('')}</div></section>` : ''}
  ${table('Still need a price', unknown, it => mrow(it, `<form class="setp" data-setp="${esc(it.id)}"><input name="amt" inputmode="decimal" placeholder="$" aria-label="Price for ${esc(it.n)}"><select name="per" aria-label="Billing"><option value="mo">/mo</option><option value="yr">/yr</option><option value="life"${it.k==='course'?' selected':''}>once</option><option value="free">free</option><option value="usage">usage</option><option value="incl">included</option></select><button>Set</button></form>`),
      'Type what each one costs and tap Set. It saves to every device.')}
  <div class="two">
    ${table('Monthly', monthly, it => mrow(it, `<span class="mv">${money(it.p[0])}<small>${money(it.p[0]*12,0)}/yr</small></span>`))}
    ${table('Yearly', yearly, it => mrow(it, `<span class="mv">${money(it.p[0])}<small>${money(it.p[0]/12)}/mo</small></span>`))}
    ${table('Lifetime', life, it => mrow(it, `<span class="mv">${money(it.p[0])}<small>paid once</small></span>`))}
    ${table('Pay as you go', usage, it => mrow(it, `<span class="typ">Usage</span>`))}
  </div>
  <div class="two">
    ${table('Included with another plan', incl, it => mrow(it, `<span class="typ">Included</span>`))}
    ${table('Free', free, it => mrow(it, `<span class="typ" style="color:var(--good)">Free</span>`))}
  </div>
  <p class="note">Starting prices come from Rocket Money (personal cards, through July 2026) and published list prices. Business-card charges were never in Rocket Money, so most business tools start out needing a price.</p>`;
}

function render(){
  const all = items();
  document.documentElement.dataset.theme = ui.theme;
  document.querySelector('meta[name="theme-color"]').content = ui.theme==='light' ? '#f3f2ef' : '#0c0d0f';
  document.getElementById('q').placeholder = `Search ${all.length} links, ${all.filter(i=>i.ours && i.k!=='site').length} apps, ${all.filter(i=>i.k==='site').length} sites`;
  document.querySelectorAll('#layoutSeg button').forEach(b => b.classList.toggle('on', b.dataset.l===ui.layout));
  renderNav(all);
  document.getElementById('view').innerHTML = viewHTML(all);
}

/* ============ ACTIONS ============ */
function go(view){
  if(view==='add'){ closeSide(); openEditor(); return; }
  ui.view = view; q = ''; qEl.value = '';
  write(LS_UI, ui);
  history.replaceState(null, '', view==='used' ? location.pathname : '#'+view);
  closeSide(); render(); window.scrollTo(0,0);
}
function recordOpen(id){ const o = opens(id); put('op:'+id, { n:(o.n||0)+1, t:Date.now() }); }
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---- editor ---- */
const dlg = document.getElementById('dlg'), form = document.getElementById('form');
let editing = null;
document.getElementById('bizPick').innerHTML = BIZ.map(b => `<label><input type="checkbox" name="b" value="${b.id}"><i style="width:7px;height:7px;border-radius:50%;background:${b.c}"></i>${b.short}</label>`).join('');
function openEditor(id){
  const it = id ? items(true).find(i => i.id===id) : null;
  editing = it ? it.id : null;
  document.getElementById('dlgTitle').textContent = it ? 'Edit' : 'Add to dock';
  document.getElementById('delBtn').style.display = it ? '' : 'none';
  const v = it || { k:'app', ours:true, c:'#2a2d33', p:'free', b: BIZMAP[ui.view] ? [ui.view] : (ui.biz ? [ui.biz] : []) };
  form.n.value = v.n||''; form.u.value = v.u||''; form.d.value = v.d||''; form.k.value = v.k||'app'; form.s.value = v.s||'';
  form.i.value = v.i||''; form.dom.value = v.dom||''; form.c.value = /^#[0-9a-f]{6}$/i.test(v.c||'') ? v.c : '#2a2d33';
  form.ours.value = v.ours ? '1' : ''; form.pin.checked = !!v.pin;
  form.amt.value = Array.isArray(v.p) ? v.p[0] : '';
  form.per.value = Array.isArray(v.p) ? v.p[1] : (v.p==='free' || v.p==='usage' || v.p==='incl' ? v.p : (v.ours ? 'free' : 'none'));
  form.querySelectorAll('input[name=b]').forEach(cb => cb.checked = (v.b||[]).includes(cb.value));
  dlg.showModal();
  if(!it) setTimeout(()=>form.n.focus(), 30);
}
function priceFrom(amt, per){
  if(per==='free' || per==='usage' || per==='incl') return per;
  if(per==='none') return null;
  const a = parseFloat(String(amt).replace(/[$,\s]/g,''));
  return isFinite(a) && a > 0 ? [Math.round(a*100)/100, per] : null;
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    n: form.n.value.trim(), u: form.u.value.trim(), d: form.d.value.trim(), k: form.k.value, s: form.s.value,
    i: form.i.value.trim(), dom: form.dom.value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,''), c: form.c.value,
    ours: !!form.ours.value, pin: form.pin.checked, p: priceFrom(form.amt.value, form.per.value),
    b: [...form.querySelectorAll('input[name=b]:checked')].map(x => x.value)
  };
  if(!data.n) return;
  // "canva.com" → https://canva.com, but leave hub pages like "page.html" or "keylight/" alone
  if(data.u && !/^https?:\/\//.test(data.u) && /^[\w-]+(\.[\w-]+)+(\/|$)/.test(data.u) && !/\.html?(\?|#|$)/.test(data.u)) data.u = 'https://' + data.u;
  let id = editing;
  if(id){ const prev = (store['it:'+id]||{}).data || {}; if(prev.add) data.add = prev.add; }
  else {
    id = data.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'item';
    while(items(true).some(i=>i.id===id)) id += '-2';
    data.add = new Date().toISOString().slice(0,10);
  }
  put('it:'+id, { data });
  dlg.close(); render(); toast(editing ? 'Saved' : 'Added to the dock');
});
document.getElementById('cancelBtn').onclick = () => dlg.close();
document.getElementById('delBtn').onclick = () => {
  if(!editing) return;
  const it = items(true).find(i => i.id===editing);
  if(!confirm(`Remove "${it ? it.n : 'this'}" from the dock? You can bring it back from All.`)) return;
  put('it:'+editing, { data: (store['it:'+editing]||{}).data || {}, hidden:true });
  dlg.close(); render(); toast('Removed. Bring it back from All');
};

/* ---- clicks ---- */
document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if(ed){ e.preventDefault(); e.stopPropagation(); openEditor(ed.dataset.edit); return; }
  const nav = e.target.closest('[data-view]');
  if(nav){ e.preventDefault(); go(nav.dataset.view); return; }
  const bz = e.target.closest('[data-biz]');
  if(bz){ ui.biz = bz.dataset.biz; write(LS_UI, ui); render(); return; }
  const tg = e.target.closest('[data-toggle]');
  if(tg){ ui.closed[tg.dataset.toggle] = !ui.closed[tg.dataset.toggle]; write(LS_UI, ui); render(); return; }
  const rs = e.target.closest('[data-restore]');
  if(rs){ put('it:'+rs.dataset.restore, { data: (store['it:'+rs.dataset.restore]||{}).data || {}, hidden:false }); render(); toast('Back on the dock'); return; }
  if(e.target.closest('.setp')) return;
  const lo = e.target.closest('[data-local]');
  if(lo){ const it = items().find(i=>i.id===lo.dataset.local); recordOpen(lo.dataset.local); toast(it && it.note ? it.note : 'This one runs on the Mac'); return; }
  const op = e.target.closest('[data-open]');
  if(op) recordOpen(op.dataset.open);
});
document.addEventListener('auxclick', e => { const op = e.target.closest('[data-open]'); if(op && e.button===1) recordOpen(op.dataset.open); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-setp]'); if(!f) return;
  e.preventDefault();
  const id = f.dataset.setp, p = priceFrom(f.amt.value, f.per.value);
  if(p==null){ f.amt.focus(); return; }
  const it = items(true).find(i => i.id===id);
  const base = Object.assign({}, it); delete base.hidden; delete base.user;
  put('it:'+id, { data: Object.assign(base, { p }) });
  render(); toast(`${it.n} saved`);
}, true);

/* ---- search + keyboard ---- */
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { q = qEl.value.trim(); render(); });
const KEYMAP = { Digit0:'used', KeyO:'ours', KeyT:'tool', KeyW:'site', KeyD:'design', KeyC:'course', KeyU:'util', KeyA:'all', KeyM:'money', KeyN:'add' };
BIZ.forEach(b => KEYMAP['Digit'+b.key] = b.id);
document.addEventListener('keydown', e => {
  if(dlg.open) return;
  if(e.altKey && KEYMAP[e.code]){ e.preventDefault(); go(KEYMAP[e.code]); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ if(q){ qEl.value=''; q=''; render(); } qEl.blur(); closeSide(); return; }
  if(!typing && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.length===1 && /\S/.test(e.key)) qEl.focus();
  if(e.key==='Enter' && document.activeElement===qEl){ const first = document.querySelector('#view [data-open]'); if(first) first.click(); }
  if(e.key==='Enter' && document.activeElement.dataset && document.activeElement.dataset.local) document.activeElement.click();
});

/* ---- chrome ---- */
document.getElementById('addBtn').onclick = () => openEditor();
document.getElementById('themeBtn').onclick = () => { ui.theme = ui.theme==='light' ? 'dark' : 'light'; write(LS_UI, ui); render(); };
document.getElementById('layoutSeg').onclick = e => { const b = e.target.closest('[data-l]'); if(!b) return; ui.layout = b.dataset.l; write(LS_UI, ui); render(); };
const side = document.getElementById('side'), scrim = document.getElementById('scrim');
function closeSide(){ side.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('menuBtn').onclick = () => { side.classList.add('open'); scrim.classList.add('open'); };
scrim.onclick = closeSide;

/* old hub links (#sdlr, #ksh, #personal …) still land on the right bucket */
function route(){
  const h = location.hash.replace('#','');
  const v = ({ tools:'tool', sites:'site', websites:'site', designs:'design', courses:'course' })[h] || h;
  if(v && (BIZMAP[v] || KINDS[v] || ['used','ours','all','money'].includes(v))) ui.view = v;
}
window.addEventListener('hashchange', () => { route(); render(); });
route(); render(); pull();
document.addEventListener('visibilitychange', () => { if(!document.hidden) pull(); });
</script>
</body>
</html>
