<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gio Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Gio's Hub</title>
<style>
  :root{
    --bg:#0b1220; --card:#151f33; --card-hover:#1c2a44; --text:#f1f5f9; --muted:#94a3b8; --line:#26344f;
    --accent:#38bdf8; --personal:#a78bfa; --ksh:#fbbf24; --sdlr:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16233e 0%, var(--bg) 55%) fixed;
    color:var(--text);min-height:100vh;
    padding:max(24px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
  }
  header{max-width:760px;margin:0 auto 22px;text-align:center}
  .logo{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:800;color:#0b1220;box-shadow:0 10px 30px rgba(56,189,248,.35)}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.95rem;margin:0}
  main{max-width:760px;margin:0 auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
  .tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s ease,background .12s ease,border-color .12s ease;min-height:128px;text-align:left;font:inherit;width:100%}
  .tile:active{transform:scale(.97)}
  @media(hover:hover){.tile:hover{background:var(--card-hover);border-color:#3a4d72;transform:translateY(-2px)}}
  .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.06)}
  .tile h3{margin:0;font-size:1.04rem;line-height:1.2}
  .tile p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.35}
  .tag{margin-top:auto;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-weight:600}
  .back:hover{color:var(--text)}
  .group-title{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;margin:2px 4px 14px}
  .group-dot{width:11px;height:11px;border-radius:50%}

  footer{max-width:760px;margin:34px auto 0;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6}
  .hidden{display:none}
</style>
</head>
<body>
  <header>
    <div class="logo">G</div>
    <h1 id="title">Gio's Hub</h1>
    <p class="sub" id="subtitle">Pick a company to see its apps.</p>
  </header>

  <main>
    <!-- VIEW 1: companies -->
    <div id="home"><div class="grid" id="companyGrid"></div></div>

    <!-- VIEW 2: a company's apps -->
    <div id="company" class="hidden">
      <button class="back" id="backBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        All companies
      </button>
      <div class="group-title"><span class="group-dot" id="groupDot"></span><span id="groupName"></span></div>
      <div class="grid" id="appGrid"></div>
    </div>
  </main>

  <footer>Add to your home screen for an app-like shortcut. Updates automatically on every deploy.</footer>

<script>
const GROUPS = [
  { id:'personal', name:'Personal', color:'var(--personal)', icon:'👤', desc:'Money & life tools', apps:[
    { name:'Daily Life OS', desc:'Energy, sleep, faith & reflection', href:'lifeos.html', icon:'🧭', tag:'Daily' },
    { name:'Money Terminal', desc:'Personal budget & spending tracker', href:'budget.html', icon:'💰', tag:'App' },
    { name:"Gio's Kitchen", desc:'What can I make? Live recipes + cookbook', href:'kitchen.html', icon:'🍳', tag:'App' }
  ]},
  { id:'ksh', name:'KSH Construction', color:'var(--ksh)', icon:'🏗️', desc:'Designs, ads & meetings', apps:[
    { name:'Design Gallery', desc:'Flipbooks & visual deliverables', href:'designs.html?c=ksh', icon:'🎨', tag:'Gallery' },
    { name:'Google Ads', desc:'Ad performance dashboard', href:'ksh-ads-dashboard.html', icon:'📊', tag:'Dashboard' },
    { name:'Meeting Recorder', desc:'Record, transcribe & summarize', href:'ksh-meeting-assistant.html', icon:'🎙️', tag:'Recorder' },
    { name:'Designer Network', desc:'Designers & architects directory', href:'ksh-networking-dashboard.html', icon:'📇', tag:'Dashboard' }
  ]},
  { id:'sdlr', name:'San Diego Landscape', color:'var(--sdlr)', icon:'🌵', desc:'Estimator, social & SEO', apps:[
    { name:'Estimator', desc:'Price jobs & generate client estimates', href:'sdlr-estimator.html', icon:'🧮', tag:'Pricing' },
    { name:'Job Intake', desc:'Capture site details for an estimate', href:'sdlr-intake.html', icon:'📝', tag:'Intake' },
    { name:'90-Day Social', desc:'Social content calendar', href:'sdlr-social-dashboard.html', icon:'📅', tag:'Dashboard' },
    { name:'SEO Grid', desc:'Local rank-tracking grid', href:'sdlr-seo-tracker.html', icon:'📍', tag:'Tracker' },
    { name:'Design Gallery', desc:'Flipbooks & visual deliverables', href:'designs.html?c=sdlr', icon:'🎨', tag:'Gallery' }
  ]},
  { id:'standby', name:'Standby Pro', color:'#c9a86a', icon:'🛟', desc:'Wedding backup network — new venture', apps:[
    { name:'Product Demo', desc:'Clickable app: book, check-ins, activate', href:'standby-prototype.html', icon:'📱', tag:'Prototype' },
    { name:'Demo Reel', desc:'Self-playing product tour', href:'standby-demo.html', icon:'🎬', tag:'Video' }
  ]}
];

const homeView = document.getElementById('home');
const companyView = document.getElementById('company');
const companyGrid = document.getElementById('companyGrid');
const appGrid = document.getElementById('appGrid');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');

function renderHome(){
  companyGrid.innerHTML = GROUPS.map(g => `
    <a class="tile" href="#${g.id}">
      <div class="ico" style="background:color-mix(in srgb, ${g.color} 16%, transparent)">${g.icon}</div>
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <span class="tag" style="color:${g.color}">${g.apps.length} app${g.apps.length>1?'s':''}</span>
    </a>`).join('');
}

function showHome(){
  companyView.classList.add('hidden');
  homeView.classList.remove('hidden');
  title.textContent = "Gio's Hub";
  subtitle.textContent = 'Pick a company to see its apps.';
  window.scrollTo(0,0);
}

function showGroup(id){
  const g = GROUPS.find(x => x.id === id);
  if(!g){ showHome(); return; }
  document.getElementById('groupName').textContent = g.name;
  document.getElementById('groupDot').style.background = g.color;
  title.textContent = g.name;
  subtitle.textContent = g.desc;
  appGrid.innerHTML = g.apps.map(a => `
    <a class="tile" href="${a.href}">
      <div class="ico" style="background:color-mix(in srgb, ${g.color} 16%, transparent)">${a.icon}</div>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <span class="tag" style="color:${g.color}">${a.tag}</span>
    </a>`).join('');
  homeView.classList.add('hidden');
  companyView.classList.remove('hidden');
  window.scrollTo(0,0);
}

document.getElementById('backBtn').onclick = () => { location.hash = ''; };

function route(){
  const id = location.hash.replace('#','');
  if(id) showGroup(id); else showHome();
}
window.addEventListener('hashchange', route);
renderHome();
route();
</script>
</body>
</html>
