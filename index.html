<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gio Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Gio's Hub</title>
<style>
  :root{
    /* Default = "Gio's Hub" mono / techy theme. Overwritten per company by JS. */
    --bg:#07080a; --bg2:#0e1014; --card:rgba(255,255,255,.045); --card-hover:rgba(255,255,255,.085);
    --text:#f4f6f8; --muted:#8b909a; --line:rgba(255,255,255,.12);
    --accent:#ffffff; --accent2:#c6c9d0; --glow:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -12%, var(--bg2) 0%, var(--bg) 58%) fixed,
      var(--bg);
    color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;
    padding:max(26px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
    transition:color .5s ease;
  }
  /* animated background canvas */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
      transition:opacity .5s ease}
  body::before{ /* color wash that fades on theme change */
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 520px at 50% -12%, var(--glow) 0%, transparent 60%);
    transition:background .6s ease;
  }
  header,main,footer{position:relative;z-index:2}

  header{max-width:780px;margin:0 auto 24px;text-align:center}
  .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;
    color:var(--bg);box-shadow:0 12px 34px var(--glow);cursor:pointer;
    transition:background .5s ease,box-shadow .5s ease,transform .15s ease}
  .logo:active{transform:scale(.94)}
  h1{font-size:1.55rem;margin:0 0 5px;letter-spacing:-.02em;transition:color .5s ease}
  .sub{color:var(--muted);font-size:.95rem;margin:0;transition:color .5s ease}
  .kicker{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.66rem;letter-spacing:.32em;
    text-transform:uppercase;color:var(--muted);opacity:.7;margin:0 0 12px}
  main{max-width:780px;margin:0 auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:13px}
  .tile{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    text-decoration:none;color:inherit;cursor:pointer;min-height:130px;text-align:left;font:inherit;width:100%;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .14s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}
  .tile:active{transform:scale(.97)}
  @media(hover:hover){.tile:hover{background:var(--card-hover);transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,.35)}}
  .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:rgba(255,255,255,.06)}
  .tile h3{margin:0;font-size:1.04rem;line-height:1.2}
  .tile p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.35}
  .tag{margin-top:auto;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
  /* brand accent bar that appears on home company tiles + hover */
  .tile .edge{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;opacity:.85}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);
    font-size:.92rem;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-weight:600;transition:color .2s}
  .back:hover{color:var(--text)}
  .group-title{display:flex;align-items:center;gap:11px;font-size:1.18rem;font-weight:700;margin:2px 4px 16px}
  .group-dot{width:11px;height:11px;border-radius:50%}

  footer{max-width:780px;margin:36px auto 0;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6}
  .hidden{display:none}
  @media (prefers-reduced-motion: reduce){#bg{display:none}}
</style>
</head>

/* ---------- THEME APPLY ---------- */
const root = document.documentElement.style;
let currentParticle = HOME_THEME.particle;
function applyTheme(t){
  root.setProperty('--bg', t.bg);
  root.setProperty('--bg2', t.bg2);
  root.setProperty('--card', t.card);
  root.setProperty('--card-hover', t.cardHover);
  root.setProperty('--text', t.text);
  root.setProperty('--muted', t.muted);
  root.setProperty('--line', t.line);
  root.setProperty('--accent', t.accent);
  root.setProperty('--accent2', t.accent2);
  root.setProperty('--glow', t.glow);
  currentParticle = t.particle;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.bg);
}

/* ---------- VIEWS ---------- */
const homeView = document.getElementById('home');
const companyView = document.getElementById('company');
const companyGrid = document.getElementById('companyGrid');
const appGrid = document.getElementById('appGrid');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const kicker = document.getElementById('kicker');
const logoEl = document.getElementById('logo');

/* Render the header box: real company logo (image / svg mark) or a clean monogram. */
function setLogo(spec){
  // reset any inline overrides from a previous view
  logoEl.style.background=''; logoEl.style.padding=''; logoEl.style.color='';
  logoEl.style.fontFamily=''; logoEl.style.overflow='hidden'; logoEl.innerHTML='';
  if(spec && spec.type==='img'){
    logoEl.style.background = spec.bg || '#ffffff';
    logoEl.style.padding = (spec.fit==='cover') ? '0' : '7px';
    logoEl.innerHTML = `<img src="${spec.src}" alt="" style="width:100%;height:100%;object-fit:${spec.fit||'contain'}">`;
  } else if(spec && spec.type==='svg'){
    logoEl.style.background='transparent'; logoEl.style.padding='0';
    logoEl.innerHTML = spec.svg;
  } else { // monogram
    logoEl.textContent = (spec && spec.text) || 'G';
    if(spec && spec.serif) logoEl.style.fontFamily = 'Georgia,"Times New Roman",serif';
  }
}

function renderHome(){
  companyGrid.innerHTML = GROUPS.map(g => `
    <a class="tile" href="#${g.id}">
      <span class="edge" style="background:${g.color}"></span>
      <div class="ico" style="background:color-mix(in srgb, ${g.color} 18%, transparent)">${g.icon}</div>
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <span class="tag" style="color:${g.color}">${g.apps.length} app${g.apps.length>1?'s':''}</span>
    </a>`).join('');
}

function showHome(){
  applyTheme(HOME_THEME);
  companyView.classList.add('hidden');
  homeView.classList.remove('hidden');
  kicker.textContent = 'GIO \u2022 COMMAND HUB';
  title.textContent = "Gio's Hub";
  subtitle.textContent = 'Pick a company to see its apps.';
  setLogo({ type:'mono', text:'G' });
  window.scrollTo(0,0);
}

function showGroup(id){
  const g = GROUPS.find(x => x.id === id);
  if(!g){ showHome(); return; }
  applyTheme(g.theme);
  document.getElementById('groupName').textContent = g.name;
  document.getElementById('groupDot').style.background = g.color;
  kicker.textContent = g.name.toUpperCase() + ' \u2022 WORKSPACE';
  title.textContent = g.name;
  subtitle.textContent = g.desc;
  setLogo(g.logo || { type:'mono', text:(g.name[0]||'G') });
  appGrid.innerHTML = g.apps.map(a => `
    <a class="tile" href="${a.href}">
      <span class="edge" style="background:${g.color}"></span>
      <div class="ico" style="background:color-mix(in srgb, ${g.color} 18%, transparent)">${a.icon}</div>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <span class="tag" style="color:${g.color}">${a.tag}</span>
    </a>`).join('');
  homeView.classList.add('hidden');
  companyView.classList.remove('hidden');
  window.scrollTo(0,0);
}

document.getElementById('backBtn').onclick = () => { location.hash = ''; };
document.getElementById('logo').onclick = () => { location.hash = ''; };

function route(){
  const id = location.hash.replace('#','');
  if(id) showGroup(id); else showHome();
}
window.addEventListener('hashchange', route);
renderHome();
route();

/* ---------- ANIMATED GEOMETRIC BACKGROUND ----------
   Drifting node mesh that connects nearby nodes + links to the cursor,
   over slow-rotating geometric wireframes. Recolors with the active theme. */
(function(){
  const canvas = document.getElementById('bg');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=Math.min(window.devicePixelRatio||1, 2);
  let nodes=[], polys=[], t=0;
  const mouse={x:-9999,y:-9999};

  function hex2rgb(c){
    c=c.trim();
    if(c[0]==='#'){ const n=parseInt(c.slice(1),16);
      return c.length>=7?[n>>16&255,n>>8&255,n&255]:[((n>>8)&15)*17,((n>>4)&15)*17,(n&15)*17]; }
    return [255,255,255];
  }
  function resize(){
    W=canvas.width=Math.floor(innerWidth*DPR);
    H=canvas.height=Math.floor(innerHeight*DPR);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    const target=Math.min(72, Math.round(innerWidth*innerHeight/16000));
    nodes=[];
    for(let i=0;i<target;i++){
      nodes.push({ x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-.5)*.18*DPR, vy:(Math.random()-.5)*.18*DPR,
        r:(Math.random()*1.6+1)*DPR });
    }
    // geometric wireframes (centered polygons that slowly rotate)
    polys=[
      {cx:W*.5, cy:H*.34, R:Math.min(W,H)*.34, sides:6, rot:0, spin:.00022},
      {cx:W*.5, cy:H*.34, R:Math.min(W,H)*.22, sides:3, rot:1, spin:-.00031},
      {cx:W*.5, cy:H*.34, R:Math.min(W,H)*.46, sides:6, rot:.5, spin:.00012}
    ];
  }
  function polygon(p, rgb){
    ctx.beginPath();
    for(let i=0;i<=p.sides;i++){
      const a=p.rot + i/p.sides*Math.PI*2;
      const x=p.cx+Math.cos(a)*p.R, y=p.cy+Math.sin(a)*p.R;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},.05)`;
    ctx.lineWidth=1*DPR; ctx.stroke();
  }
  function frame(){
    t++;
    const rgb=hex2rgb(currentParticle);
    ctx.clearRect(0,0,W,H);

    // wireframes
    for(const p of polys){ p.rot+=p.spin; polygon(p,rgb); }

    const max=140*DPR, maxM=170*DPR;
    // node-node links
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      a.x+=a.vx; a.y+=a.vy;
      if(a.x<0||a.x>W)a.vx*=-1; if(a.y<0||a.y>H)a.vy*=-1;
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d<max){
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(1-d/max)*.18})`;
          ctx.lineWidth=1*DPR; ctx.stroke();
        }
      }
      // link to cursor
      const mdx=a.x-mouse.x, mdy=a.y-mouse.y, md=Math.hypot(mdx,mdy);
      if(md<maxM){
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y);
        ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(1-md/maxM)*.35})`;
        ctx.lineWidth=1*DPR; ctx.stroke();
      }
      // node dot
      const near=md<maxM;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r*(near?1.5:1),0,Math.PI*2);
      ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${near?.9:.5})`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  function setMouse(x,y){ mouse.x=x*DPR; mouse.y=y*DPR; }
  window.addEventListener('mousemove', e=>setMouse(e.clientX,e.clientY));
  window.addEventListener('mouseout', ()=>{mouse.x=-9999;mouse.y=-9999;});
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) setMouse(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
  window.addEventListener('touchend', ()=>{mouse.x=-9999;mouse.y=-9999;});
  let rt; window.addEventListener('resize', ()=>{clearTimeout(rt);rt=setTimeout(resize,150)});
  resize(); frame();
})();
</script>
</body>
