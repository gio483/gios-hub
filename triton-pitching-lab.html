<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triton Lab">
<link rel="preload" as="image" href="bj-hero.jpg" media="(min-width: 821px)">
<link rel="preload" as="image" href="bj-hero-m.jpg" media="(max-width: 820px)">
<title>Triton Pitching Lab</title>
<link rel="apple-touch-icon" href="bj-icon-180.png">
<link rel="manifest" href="bj-manifest.webmanifest">
<meta name="description" content="Branden Jackel pitching performance, recovery and arm-care dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#182B49; --navy-2:#0F1E36; --navy-3:#0A1528; --ink:#081120;
  --gold:#FFCD00; --gold-2:#C69214; --blue:#00629B; --sky:#4FA3E3; --teal:#00C6D7;
  --stitch:#E0544B; --green:#3DDC97; --amber:#FFB547; --red:#FF6B6B;
  --text:#EAF0F8; --muted:#8FA3BF; --line:rgba(143,163,191,.16); --card:#12233F; --card-2:#162A4A;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand-title,.kpi-val,.big{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em}
h1{font-size:34px;margin:0;font-weight:800;text-transform:uppercase}
h2{font-size:22px;margin:0 0 4px;font-weight:700;text-transform:uppercase}
h3{font-size:17px;margin:0;font-weight:700;text-transform:uppercase;color:var(--gold)}
a{color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-3) 100%);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,205,0,.25)}
.brand-mark svg{width:30px;height:30px}
.brand-title{font-size:20px;font-weight:800;text-transform:uppercase;line-height:1}
.brand-sub{color:var(--gold);font-size:12px;font-weight:600;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav button.active{background:rgba(255,205,0,.12);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:18px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
#side-stats{font-size:12px;color:var(--text)}

.main{flex:1;min-width:0;padding:24px 28px 60px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:260px;background:var(--navy) url('bj-hero.jpg') 78% 35%/cover no-repeat;display:flex;align-items:flex-end;margin-bottom:18px;border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,17,32,.95) 0%,rgba(8,17,32,.7) 45%,rgba(8,17,32,.15) 100%)}
.hero-inner{position:relative;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;width:100%;flex-wrap:wrap}
.eyebrow{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:46px;line-height:1;margin:6px 0}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hero-stats{display:flex;gap:22px}
.hero-stat .big{font-size:40px;font-weight:800;color:var(--gold);line-height:1}
.hero-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kpi .kpi-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.kpi .kpi-val{font-size:34px;font-weight:800;line-height:1.05;margin-top:6px}
.kpi .kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.charts{grid-template-columns:repeat(12,1fr)}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}

/* readiness ring */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:76px;height:76px;flex:0 0 76px}

/* segmented */
.seg{display:inline-flex;background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--navy)}

/* inputs */
.input,select.input,textarea.input{background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,0,.15)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:700;background:var(--gold);color:var(--navy);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,107,107,.4)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,205,0,.08)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
label.chk input{accent-color:var(--gold)}

/* table */
.table-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.data{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
table.data th{position:sticky;top:0;background:var(--navy);z-index:2;cursor:pointer;user-select:none;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
table.data th.grp{top:0;color:var(--gold);text-align:left;cursor:default;border-bottom:none}
table.data thead tr:nth-child(2) th{top:31px}
table.data th:hover{color:var(--text)}
table.data th.sorted{color:var(--gold)}
table.data td.txt,table.data th.txt{text-align:left}
table.data td.wrap{white-space:normal;min-width:180px;max-width:280px}
table.data .sticky{position:sticky;left:0;background:var(--navy-2);z-index:1;text-align:left}
table.data th.sticky{z-index:3;background:var(--navy)}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:rgba(255,205,0,.05)}
.p-top{background:rgba(255,205,0,.22)!important;color:#fff;font-weight:700}
.p-hi{background:rgba(61,220,151,.13)}
.p-lo{background:rgba(255,107,107,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dot.blue{background:var(--sky)}

/* bests */
.bests-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.best{display:flex;flex-direction:column;gap:6px}
.best .name{font-weight:700}
.best .big{font-size:30px;font-weight:800;color:var(--gold);line-height:1}
.best .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--navy-3);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.spark{width:100%;height:34px}
.group-title{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* insights */
.r-badge{font-family:"Barlow Condensed";font-size:40px;font-weight:800;line-height:1}
.drivers{display:flex;flex-direction:column;gap:6px}
.driver{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 54px 40px;align-items:center;gap:10px;font-size:12.5px;cursor:pointer;padding:3px 4px;border-radius:6px}
.driver:hover{background:rgba(255,255,255,.04)}
.driver .track{height:10px;background:var(--navy-3);border-radius:6px;position:relative}
.driver .track i{position:absolute;top:0;bottom:0;border-radius:6px}
.driver .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.recipe{width:100%;border-collapse:collapse;font-size:13px}
.recipe td,.recipe th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.recipe th{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:right}
.recipe td:first-child,.recipe th:first-child{text-align:left}
.callout{background:rgba(0,198,215,.08);border:1px solid rgba(0,198,215,.25);border-radius:12px;padding:12px 14px;font-size:13px}

/* form */
.entry-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
details.sec{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
details.sec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-size:20px;color:var(--gold)}
details.sec[open] summary::after{content:"–"}
details.sec .body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field.wide{grid-column:1/-1}
.field .unit{font-size:10px;color:var(--gold-2);margin-left:4px}
.toggle{display:flex;gap:6px}
.toggle button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.toggle button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.scale{display:flex;gap:4px}
.scale button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:7px 0;border-radius:8px;background:var(--navy-3);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.scale button.on{background:var(--gold);color:var(--navy)}
textarea.input{min-height:110px;resize:vertical}
.sticky-panel{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.entry-photo{background:var(--navy) url('bj-jersey.jpg') center 22%/cover no-repeat;min-height:300px;position:relative;overflow:hidden;padding:0}
.ins-pick{grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}

/* journal */
.j-card{display:flex;flex-direction:column;gap:8px}
.j-date{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase}
.j-text{white-space:pre-wrap}
.mini{display:inline-flex;gap:4px;align-items:center;background:var(--navy-3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.mini b{color:var(--gold)}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:0;max-height:320px;overflow:auto;padding-right:6px}
.tl{display:grid;grid-template-columns:70px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.tl .d{color:var(--muted);font-size:12px;text-align:right}
.tl .pin{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:4px;box-shadow:0 0 0 3px rgba(255,205,0,.15)}
.tl .pin.alt{background:var(--sky);box-shadow:0 0 0 3px rgba(79,163,227,.15)}

/* heatmap */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .c{width:13px;height:13px;border-radius:3px;background:var(--navy-3);position:relative}
.heat .c.lift::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sky)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.dropzone{border:2px dashed rgba(255,205,0,.35);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:.2s}
.dropzone.over,.dropzone:hover{background:rgba(255,205,0,.06);border-color:var(--gold)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--navy);font-weight:700;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;text-align:center;color:var(--muted)}

@media (max-width:1100px){
  .span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}
  .entry-layout{grid-template-columns:1fr}
  .sticky-panel{position:static}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{position:sticky;top:0;z-index:20;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;overflow:hidden}
  .brand-sub,.side-foot{display:none}
  .brand-title{font-size:16px}
  .brand-mark{width:34px;height:34px}.brand-mark svg{width:22px;height:22px}
  .nav{flex-direction:row;overflow-x:auto;flex:1}
  .nav button{padding:8px 10px;white-space:nowrap;font-size:13px}
  .nav button.active{box-shadow:inset 0 -2px 0 var(--gold)}
  .nav .ico{display:none}
  .brand > div:last-child{display:none}
  .main{padding:16px 16px 60px}
  .hero h1{font-size:34px}
  .hero-stat .big{font-size:30px}
  .driver{grid-template-columns:1fr 1.2fr 46px}
  .driver .n{display:none}
  .table-wrap{max-height:70vh}
  /* phone */
  .view.active{animation:none}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .side{padding-top:calc(10px + env(safe-area-inset-top))}
  .nav{-webkit-overflow-scrolling:touch;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .input,select.input,textarea.input{font-size:16px}
  .hero{background:#0A1528 url('bj-hero-m.jpg') center top/100% auto no-repeat;min-height:0;border-radius:16px;padding-top:min(68vw,300px)}
  .hero::before{background:linear-gradient(180deg,rgba(10,21,40,0) 0,rgba(10,21,40,0) min(45vw,190px),rgba(10,21,40,.94) min(80vw,340px),#0A1528 100%)}
  .hero-inner{padding:20px 18px}
  .hero-stats{gap:18px;width:100%;justify-content:space-between}
  .hero-stat .big{font-size:28px}
  .hero-tags .tag{font-size:11px}
  h1{font-size:28px} h2{font-size:20px}
  .page-head{margin-bottom:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis .kpi:first-child{grid-column:1/-1}
  .card{padding:13px}
  .kpi .kpi-val{font-size:26px}
  .kpi .kpi-sub{font-size:11px}
  .chart-box{height:220px}.chart-box.tall{height:260px}
  .ins-pick{grid-template-columns:1fr}
  .bests-grid{grid-template-columns:1fr}
  details.sec .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry-layout{display:flex;flex-direction:column}
  .entry-layout > *{width:100%;min-width:0}
  #v-entry .page-head .toolbar{width:100%}
  #v-entry #e-date{flex:1}
  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--ink) 70%,transparent)}
  #v-entry{padding-bottom:70px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .recipe{font-size:12px}
  table.data th,table.data td{padding:6px 8px}
}
@media (max-width:380px){ details.sec .body{grid-template-columns:1fr} .hero h1{font-size:30px} }

/* collapsible sections */
.sec-toggle{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;margin-left:auto;flex:0 0 32px;color:var(--gold)}
.sec-toggle::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.collapsed > .card-head .sec-toggle::before{transform:translateY(2px) rotate(-135deg)}
.sec-toggle:hover{border-color:var(--gold)}
[data-sec].collapsed > :not(.card-head){display:none!important}
[data-sec].collapsed > .card-head{margin-bottom:0}
.card[data-sec].collapsed{padding-top:12px;padding-bottom:12px}
.dash-sec{margin-bottom:14px}
.sec-title{padding:0 2px}
.kpi.tap{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi.tap:hover{border-color:rgba(255,205,0,.45)}
.kpi.tap:active{transform:scale(.98)}
.cmp-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:820px){
  .cmp-pick{grid-template-columns:1fr} .dash-sec .kpis{margin-bottom:0}
  [data-sec] > .card-head > .muted.small{flex-basis:100%;order:3;margin-top:-4px}
}

/* lifting log */
.lift-ex{margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.lift-head{display:flex;gap:8px;align-items:center}
.lift-name{font-weight:700;font-size:15px;flex:1;min-width:0}
.lift-last{font-size:12px;color:var(--muted);background:rgba(0,198,215,.07);border:1px solid rgba(0,198,215,.2);border-radius:8px;padding:6px 10px}
.lift-last b{color:var(--teal);font-weight:700}
.icon-btn{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 40px;font-size:13px}
.icon-btn:hover{color:var(--red);border-color:rgba(255,107,107,.45)}
.set-grid{display:grid;grid-template-columns:30px minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr) 40px;gap:8px;align-items:center}
.set-grid > span{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.set-grid > b{text-align:center;color:var(--gold);font-family:"Barlow Condensed";font-size:19px}
.set-grid .input{text-align:center;font-weight:600}
.lift-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small-btn{padding:8px 13px;font-size:13px}
.lift-note{font-size:13px}
.lift-add{margin-bottom:12px}
.lift-add-row{display:flex;gap:8px}
.lift-add-row .input{flex:1;min-width:0}
.lift-recent{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.lift-recent:hover,.lift-recent.on{background:rgba(255,205,0,.06)}
.lift-recent .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* workload: tabs, classification, dashboard, methods */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.ex-class{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}
.ex-class > span:first-child{font-weight:700;text-transform:capitalize}
.conf{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.conf.hi{color:var(--green);border-color:rgba(61,220,151,.4)}
.conf.mid{color:var(--gold);border-color:rgba(255,205,0,.4)}
.conf.lo{color:var(--stitch);border-color:rgba(224,84,75,.5)}
.chip.warn-chip{color:var(--amber);border-color:rgba(255,181,71,.5);padding:3px 10px}
.lift-more summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;padding:4px 0}
.lift-more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.mk-v{font-family:"Barlow Condensed";font-size:24px;font-weight:800;line-height:1.05}
.mk-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.legend-inline{text-transform:none;letter-spacing:0;margin-left:6px}
.mrow{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.mrow b{text-align:right}.mrow b .muted{font-weight:500;margin-left:2px}
.mbar{height:9px;background:var(--navy-3);border-radius:5px;display:flex;overflow:hidden}
.mbar i{display:block;height:100%}
.flags{margin-top:10px;font-size:12px;color:var(--amber);display:flex;flex-direction:column;gap:4px}
.table-scroll{overflow-x:auto}
.mtable td,.mtable th{white-space:nowrap}
.mtable tr.mgroup td{color:var(--gold);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:12px}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--navy-3)}
.stackbar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;font-family:Inter,sans-serif;vertical-align:middle}
.b-est{background:rgba(61,220,151,.14);color:var(--green)}
.b-evi{background:rgba(79,163,227,.16);color:var(--sky)}
.b-exp{background:rgba(224,84,75,.16);color:#ff8a80}
.ex-row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ex-row:hover,.ex-row.on{background:rgba(255,205,0,.05)}
.ex-row .muted{text-transform:capitalize}
.ex-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.src{font-size:11px;color:var(--muted);font-weight:600}
.ex-editor .field{margin-bottom:8px}
.mus-pick{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.mus-pick .chip{padding:4px 9px;font-size:11.5px}
.codebox{background:var(--navy-3);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:220px;white-space:pre-wrap}
.method .formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--navy-3);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;color:var(--gold)}
.method dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:0}
.method dt{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.method dd{margin:0}
#ls-card{margin-bottom:12px}
#ls-rpe button{min-width:0}
@media (max-width:820px){
  .set-grid{grid-template-columns:24px minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) 36px;gap:6px}
  .icon-btn{width:36px;height:40px;flex-basis:36px}
  .mini-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .method dl{grid-template-columns:1fr}
  .ex-row{flex-direction:column}.ex-meta{flex-direction:row;align-items:center;flex-wrap:wrap}
  .mrow{grid-template-columns:96px 1fr 44px}
}

/* cloud sync status */
.sync{font-size:11px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 7px}
.sync.ok::before{background:var(--green)}
.sync.busy::before{background:var(--gold);animation:pulse 1s infinite}
.sync.warn::before{background:var(--amber)}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:820px){.sync{margin-top:2px;font-size:10.5px}}

/* hamburger menu (phones) */
.burger,.cur-page{display:none}
.burger{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);flex-direction:column;justify-content:center;align-items:center;gap:5px;flex:0 0 44px;margin-left:auto;display:none}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:var(--gold);transition:transform .2s,opacity .2s}
.side.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.side.open .burger span:nth-child(2){opacity:0}
.side.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media (max-width:820px){
  .side{overflow:visible;justify-content:space-between}
  .brand{flex:1;min-width:0;padding:0}
  .brand > div:last-child{display:block;min-width:0}
  .brand-title{font-size:15px;white-space:nowrap}
  .cur-page{display:block;color:var(--gold);font-size:12px;font-weight:700;margin-top:3px}
  .burger{display:flex}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;overflow:visible;mask-image:none;-webkit-mask-image:none;background:var(--navy-2);border-bottom:1px solid var(--line);padding:8px 12px 16px;gap:2px;box-shadow:0 24px 50px rgba(0,0,0,.55)}
  .side.open .nav{display:flex;animation:drop .18s ease}
  .nav button{padding:14px;font-size:16px;white-space:normal}
  .nav .ico{display:inline-block}
  .nav button.active{box-shadow:inset 3px 0 0 var(--gold)}
}
@keyframes drop{from{transform:translateY(-6px)}to{transform:none}}
#top10{overflow-x:auto;-webkit-overflow-scrolling:touch}
#top10 .recipe{min-width:560px}
@media (max-width:820px){.entry-photo{min-height:200px;background-position:center 18%}}

<script>
/* Triton Workload — Exercise Database (component B)
   ------------------------------------------------------------------
   Curated library of exercise classifications. Plain data, no logic, so it
   can be reused by any project (window.TritonExerciseDB or module.exports).

   Every library record is a classification CONVENTION (a coaching/biomechanics
   judgement about which muscles are primary, secondary or stabilisers), not a
   measured activation value. No fractional muscle coefficients are stored.

   Record fields (see schema.json → ExerciseRecord):
     id, name, aliases, pattern, category, primary, secondary, stabilizers,
     equipment, unilateral, axial, explosive, contraction, rom, stability,
     compound, impact, bwLoad, loadComparable, confidence, notes, questions
*/
(function (root) {
  'use strict';

  const DB_VERSION = '1.0.0';

  /* Muscle groups. region drives upper/lower/trunk summaries.
     `extra: true` = additional group beyond the spec's required list. */
  const MUSCLES = [
    { id: 'chest',       label: 'Chest',           region: 'upper' },
    { id: 'upperBack',   label: 'Upper back',      region: 'upper' },
    { id: 'lats',        label: 'Lats',            region: 'upper' },
    { id: 'frontDelt',   label: 'Front deltoids',  region: 'upper' },
    { id: 'sideDelt',    label: 'Side deltoids',   region: 'upper' },
    { id: 'rearDelt',    label: 'Rear deltoids',   region: 'upper' },
    { id: 'biceps',      label: 'Biceps',          region: 'upper' },
    { id: 'triceps',     label: 'Triceps',         region: 'upper' },
    { id: 'forearms',    label: 'Forearms / grip', region: 'upper' },
    { id: 'rotatorCuff', label: 'Rotator cuff',    region: 'upper' },
    { id: 'quads',       label: 'Quads',           region: 'lower' },
    { id: 'hamstrings',  label: 'Hamstrings',      region: 'lower' },
    { id: 'glutes',      label: 'Glutes',          region: 'lower' },
    { id: 'adductors',   label: 'Adductors',       region: 'lower' },
    { id: 'calves',      label: 'Calves',          region: 'lower' },
    { id: 'erectors',    label: 'Spinal erectors', region: 'trunk' },
    { id: 'abs',         label: 'Abdominals (incl. obliques)', region: 'trunk' },
    { id: 'hipFlexors',  label: 'Hip flexors',     region: 'lower', extra: true },
    { id: 'serratus',    label: 'Serratus anterior', region: 'upper', extra: true },
  ];

  const PATTERNS = ['squat', 'hinge', 'single-leg', 'horizontal-push', 'vertical-push', 'horizontal-pull', 'vertical-pull',
    'rotation', 'anti-rotation', 'anti-extension', 'trunk-flexion', 'carry', 'jump', 'landing', 'throw', 'olympic',
    'shoulder-rotation', 'scapular', 'isolation-upper', 'isolation-lower', 'total-body'];
  const CATEGORIES = ['strength', 'power', 'plyometric', 'ballistic', 'accessory', 'core', 'arm-care', 'carry'];
  const EQUIPMENT = ['barbell', 'trap-bar', 'dumbbell', 'kettlebell', 'cable', 'band', 'machine', 'pneumatic', 'landmine',
    'med-ball', 'bodyweight', 'box', 'rope', 'sled', 'other'];

  /* Compact row → record. Order:
     id, name, aliases, pattern, category, primary, secondary, stabilizers, equipment,
     flags string, contraction, extra {}
     flags: U unilateral, A axial, X explosive, C compound, I impact(high), i impact(low) */
  const R = (id, name, aliases, pattern, category, primary, secondary, stabilizers, equipment, flags, contraction, extra) => Object.assign({
    id, name, aliases, pattern, category, primary, secondary, stabilizers, equipment,
    unilateral: flags.includes('U'), axial: flags.includes('A'), explosive: flags.includes('X'),
    compound: flags.includes('C'), impact: flags.includes('I') ? 'high' : flags.includes('i') ? 'low' : 'none',
    contraction: contraction || 'dynamic', rom: 'full', stability: 'stable',
    bwLoad: 0, loadComparable: true, confidence: 0.9, notes: '', questions: [],
  }, extra || {});

    /* ---- lower-body strength ---- */

<script>
/* Triton Workload — Exercise Classification Engine (component A)
   ------------------------------------------------------------------
   Turns an exercise name (+ optional description) into a classification
   record with a confidence level, a plain-English explanation, and
   clarifying questions when the context is not enough.

   Three sources, in order:
     1. Library match  — exact name/alias in TritonExerciseDB          (confidence = library value)
     2. Rule engine    — deterministic keyword rules (offline, instant) (confidence 0.30–0.85)
     3. AI-assisted    — optional: Claude via the hub endpoint, used for
                         names the rules cannot read with confidence  (confidence reported by the model, capped 0.85)

   The classification is an INTERPRETATION used to count sets per muscle.
   It never produces activation percentages or physiological coefficients.
   The deterministic maths lives in engine.js and never calls this file.
*/
(function (root) {
  'use strict';
  const DB = (typeof module !== 'undefined' && module.exports) ? require('./exercise-db.js') : root.TritonExerciseDB;
  const CLASSIFIER_VERSION = '1.0.0';

  const norm = s => String(s || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  const slug = s => norm(s).replace(/ /g, '-').slice(0, 48) || 'exercise';

  /* name → library record (exact name or alias, normalised) */
  const INDEX = new Map();
  for (const ex of DB.LIBRARY) for (const n of [ex.name, ex.id.replace(/-/g, ' '), ...(ex.aliases || [])]) {
    const k = norm(n); if (k && !INDEX.has(k)) INDEX.set(k, ex);
  }
  function libraryMatch(name) { return INDEX.get(norm(name)) || null; }

  /* ---- deterministic keyword rules ---- */
  const has = (t, words) => words.some(w => new RegExp('(^| )' + w + '( |$)').test(t));
  const EQUIP_RULES = [
    ['trap-bar', ['trap bar', 'hex bar', 'trapbar']], ['barbell', ['bb', 'barbell', 'bar', 'zercher', 'safety bar', 'ssb']], ['dumbbell', ['db', 'dumbbell', 'dumbbells', 'dbs']],
    ['kettlebell', ['kb', 'kettlebell']], ['pneumatic', ['keiser']], ['landmine', ['landmine']], ['med-ball', ['med ball', 'medball', 'mb', 'medicine ball', 'slam ball']],
    ['cable', ['cable', 'pulley']], ['band', ['band', 'banded', 'mini band']], ['machine', ['machine', 'smith', 'leg press', 'ghd', 'ghr']], ['sled', ['sled', 'prowler']],
    ['box', ['box', 'depth']], ['rope', ['jump rope', 'rope']],
  ];
  // pattern → [keywords, category, primary, secondary, stabilizers, flags]
  const PATTERN_RULES = [
    ['landing', ['depth drop', 'drop landing', 'snap down', 'stick landing'], 'plyometric', ['quads', 'glutes'], ['calves', 'hamstrings'], ['abs'], { explosive: true, impact: 'high', contraction: 'eccentric' }],
    ['jump', ['jump', 'jumps', 'hop', 'hops', 'bound', 'bounds', 'pogo', 'pogos', 'skip', 'skips', 'cmj', 'leap'], 'plyometric', ['quads', 'glutes', 'calves'], ['hamstrings'], ['abs'], { explosive: true, impact: 'high', contraction: 'stretch-shortening' }],
    ['throw', ['throw', 'toss', 'slam', 'pass', 'shotput', 'shot put', 'scoop'], 'ballistic', ['abs', 'glutes'], ['lats', 'frontDelt', 'triceps'], ['quads'], { explosive: true }],
    ['olympic', ['clean', 'snatch', 'jerk', 'high pull'], 'power', ['glutes', 'quads', 'hamstrings', 'upperBack'], ['erectors', 'calves', 'forearms'], ['abs'], { explosive: true, axial: true, compound: true }],
    // specific shoulder rules must win over the generic "rotation" rule below
    ['shoulder-rotation', ['external rotation', 'internal rotation', 'external rotations', 'internal rotations', 'er', 'ir', '90 90', 'sleeper stretch'], 'arm-care', ['rotatorCuff'], ['rearDelt'], ['upperBack'], {}],
    ['scapular', ['face pull', 'ytw', 'y raise', 't raise', 'w raise', 'scap', 'scapular', 'band pull apart', 'pull apart', 'serratus'], 'arm-care', ['upperBack', 'rearDelt', 'rotatorCuff'], [], [], {}],
    ['carry', ['sled push', 'sled drag', 'sled pull', 'prowler', 'prowler push'], 'carry', ['quads', 'glutes'], ['calves', 'hamstrings'], ['abs'], { compound: true }],
    ['rotation', ['rotational', 'rotation', 'chop', 'lift', 'woodchop', 'twist', 'punch'], 'power', ['abs'], ['glutes', 'frontDelt', 'lats'], ['adductors'], { compound: true }],
    ['anti-rotation', ['pallof', 'anti rotation', 'side plank', 'suitcase'], 'core', ['abs'], [], ['glutes'], { contraction: 'isometric' }],
    ['anti-extension', ['plank', 'dead bug', 'deadbug', 'rollout', 'stir the pot', 'hollow', 'body saw'], 'core', ['abs'], [], ['frontDelt', 'glutes'], { contraction: 'isometric' }],
    ['trunk-flexion', ['crunch', 'sit up', 'situp', 'leg raise', 'leg raises', 'knee raise', 'flutter', 'v up', 'toes to bar'], 'core', ['abs', 'hipFlexors'], [], [], {}],
    ['carry', ['carry', 'walk', 'farmer', 'farmers'], 'carry', ['forearms', 'upperBack'], ['abs', 'glutes'], ['calves'], { contraction: 'isometric', compound: true }],
    ['single-leg', ['split squat', 'rfess', 'bulgarian', 'lunge', 'lunges', 'step up', 'step ups', 'step down', 'step downs', 'cossack', 'pistol', 'skater squat'], 'strength', ['quads', 'glutes'], ['adductors', 'hamstrings'], ['abs', 'calves'], { unilateral: true, compound: true }],
    ['squat', ['squat', 'squats', 'leg press', 'wall sit'], 'strength', ['quads', 'glutes'], ['adductors', 'erectors'], ['abs'], { compound: true }],
    ['hinge', ['deadlift', 'dl', 'rdl', 'good morning', 'swing', 'swings', 'hip thrust', 'bridge', 'pull through', 'hinge', 'back extension', 'hyperextension'], 'strength', ['hamstrings', 'glutes'], ['erectors', 'forearms'], ['abs'], { compound: true }],
    ['vertical-pull', ['pull up', 'pull ups', 'pullup', 'pullups', 'chin up', 'chin ups', 'chinup', 'pulldown', 'pull down'], 'strength', ['lats'], ['biceps', 'upperBack', 'rearDelt', 'forearms'], ['abs'], { compound: true }],
    ['horizontal-pull', ['row', 'rows', 'inverted row'], 'strength', ['upperBack', 'lats'], ['biceps', 'rearDelt', 'forearms'], ['abs'], { compound: true }],
    ['vertical-push', ['overhead press', 'shoulder press', 'military press', 'ohp', 'push press', 'landmine press', 'z press'], 'strength', ['frontDelt', 'triceps'], ['sideDelt', 'upperBack', 'serratus'], ['abs', 'rotatorCuff'], { compound: true }],
    ['horizontal-push', ['bench', 'push up', 'push ups', 'pushup', 'pushups', 'press', 'dip', 'dips', 'fly', 'flye'], 'strength', ['chest', 'triceps'], ['frontDelt'], ['rotatorCuff', 'abs'], { compound: true }],
    ['isolation-upper', ['curl', 'curls', 'extension', 'pushdown', 'skull', 'lateral raise', 'front raise', 'rear delt', 'shrug', 'wrist', 'rice bucket', 'grip'], 'accessory', [], [], [], {}],
    ['isolation-lower', ['leg curl', 'hamstring curl', 'nordic', 'leg extension', 'calf raise', 'adductor', 'abductor', 'copenhagen', 'tib raise'], 'accessory', [], [], [], {}],
  ];
  const ISOLATION_MUSCLE = [
    [['curl', 'curls'], 'biceps', ['forearms']], [['extension', 'pushdown', 'skull'], 'triceps', []],
    [['lateral raise'], 'sideDelt', []], [['front raise'], 'frontDelt', []], [['rear delt', 'reverse fly'], 'rearDelt', ['upperBack']],
    [['shrug'], 'upperBack', ['forearms']], [['wrist', 'rice bucket', 'grip', 'pronation', 'supination'], 'forearms', []],
    [['leg curl', 'hamstring curl', 'nordic'], 'hamstrings', ['calves']], [['leg extension'], 'quads', []],
    [['calf raise'], 'calves', []], [['adductor', 'copenhagen'], 'adductors', ['abs']], [['abductor'], 'glutes', []], [['tib raise'], 'calves', []],
  ];

  function ruleClassify(name, description) {
    const t = norm(name + ' ' + (description || ''));
    const why = [], questions = [];
    let signals = 0;
    const rec = { pattern: null, category: 'strength', primary: [], secondary: [], stabilizers: [], equipment: null,
      unilateral: false, axial: false, explosive: false, compound: false, impact: 'none', contraction: 'dynamic',
      rom: 'full', stability: 'stable', bwLoad: 0, loadComparable: true };

    const pat = PATTERN_RULES.find(p => has(t, p[1]));
    if (pat) {
      const [pattern, , category, pri, sec, stab, flags] = pat;
      Object.assign(rec, { pattern, category, primary: pri.slice(), secondary: sec.slice(), stabilizers: stab.slice() }, flags);
      why.push(`Movement pattern "${pattern}" from the word(s): ${pat[1].filter(w => has(t, [w])).join(', ')}.`);
      signals += 2;
      if (pattern.startsWith('isolation')) {
        const iso = ISOLATION_MUSCLE.find(m => has(t, m[0]));
        if (iso) { rec.primary = [iso[1]]; rec.secondary = iso[2].slice(); why.push(`Isolation target ${iso[1]} from "${iso[0].find(w => has(t, [w]))}".`); signals++; }
        else questions.push('Which muscle does this exercise mainly target?');
      }
    } else {
      questions.push('What kind of movement is this (squat, hinge, lunge, push, pull, jump, throw, rotation, core, carry)?');
      why.push('No movement-pattern keyword recognised.');
    }

    const eq = EQUIP_RULES.find(e => has(t, e[1]));
    if (eq) { rec.equipment = eq[0]; why.push(`Equipment "${eq[0]}" from "${eq[1].find(w => has(t, [w]))}".`); signals++; }
    else if (/(^| )(jump|hop|bound|push up|pull up|chin up|plank|dip)/.test(t)) { rec.equipment = 'bodyweight'; why.push('No equipment word: assumed bodyweight.'); }
    else { rec.equipment = 'other'; questions.push('What equipment is used (barbell, dumbbell, kettlebell, cable, Keiser, med ball, bodyweight)?'); }

    if (has(t, ['single leg', 'sl', 'single arm', 'sa', 'one arm', '1 arm', 'one leg', 'unilateral', 'alternating', 'split'])) { rec.unilateral = true; why.push('Unilateral: name says single-arm/single-leg/split.'); signals++; }
    if (has(t, ['explosive', 'speed', 'power', 'ballistic', 'plyo', 'plyometric', 'clap', 'reactive', 'velocity'])) { rec.explosive = true; why.push('Explosive intent from the name.'); signals++; }
    if (rec.equipment === 'pneumatic') { rec.loadComparable = false; rec.contraction = 'concentric'; why.push('Pneumatic (Keiser) resistance: little eccentric load; volume not comparable with free weights.'); }
    if (['barbell', 'trap-bar'].includes(rec.equipment) && ['squat', 'hinge', 'single-leg', 'olympic', 'vertical-push', 'carry'].includes(rec.pattern)) { rec.axial = true; why.push('Axial loading: barbell/trap bar on a squat, hinge, lunge, overhead or carry pattern.'); }
    if (rec.pattern === 'hinge' && !['bodyweight', 'band'].includes(rec.equipment)) rec.axial = true;
    if (rec.unilateral) { rec.stability = 'unstable'; if (!rec.stabilizers.includes('abs')) rec.stabilizers.push('abs'); }
    if (rec.pattern === 'horizontal-push' && has(t, ['push up', 'push ups', 'pushup', 'pushups'])) { rec.bwLoad = 0.64; rec.equipment = 'bodyweight'; why.push('Push-up external-load convention 64% bodyweight (Ebben et al., 2011).'); }
    if (rec.pattern === 'vertical-pull' && rec.equipment === 'bodyweight') { rec.bwLoad = 1; why.push('Pull-up/chin-up convention: full bodyweight + added load.'); }
    if (has(t, ['dip', 'dips'])) { rec.bwLoad = 1; rec.equipment = 'bodyweight'; why.push('Dip convention: full bodyweight + added load.'); }
    if (rec.pattern === 'rotation' && !rec.explosive) questions.push('Was this performed with explosive intent?');
    if (['horizontal-pull', 'vertical-push', 'horizontal-push'].includes(rec.pattern) && !rec.unilateral && has(t, ['db', 'dumbbell', 'landmine', 'kb'])) questions.push('One arm at a time, or both arms together?');
    rec.compound = rec.compound || (rec.primary.length + rec.secondary.length >= 3);

    const confidence = Math.min(0.85, 0.25 + signals * 0.12) * (rec.pattern ? 1 : 0.6);
    return { record: rec, confidence: Math.round(confidence * 100) / 100, explanation: why, questions };
  }

  /* Best library neighbour by shared words (used to explain, never to silently relabel). */
  function nearest(name) {
    const words = new Set(norm(name).split(' ').filter(w => w.length > 1));
    let best = null, score = 0;
    for (const ex of DB.LIBRARY) for (const n of [ex.name, ...(ex.aliases || [])]) {
      const w = norm(n).split(' '); const hit = w.filter(x => words.has(x)).length;
      const s = hit / Math.max(words.size, w.length);
      if (s > score) { score = s; best = ex; }
    }
    return score >= 0.5 ? { ex: best, score } : null;
  }

  /* Build a full exercise record (schema.json → ExerciseRecord). */
  function newRecord(name, cls, source, extra) {
    const now = new Date().toISOString();
    const r = Object.assign({
      id: 'u-' + slug(name), name: String(name).trim(), aliases: [],
    }, cls.record, {
      classification: { confidence: cls.confidence, source, classifierVersion: CLASSIFIER_VERSION, explanation: cls.explanation, questions: cls.questions },
      auto: null, overridden: [], created: now, modified: now, history: [],
    }, extra || {});
    r.auto = JSON.parse(JSON.stringify({ ...cls.record, confidence: cls.confidence, source, explanation: cls.explanation, questions: cls.questions, at: now }));
    r.history.push({ at: now, by: source, action: 'created', snapshot: r.auto });
    return r;
  }

  /* Main entry: offline, deterministic. */

  if (!rows.length) { read.innerHTML = `No ${fs.map(f => esc(f.label)).join(' or ')} logged in ${range}. Try <b>All time</b> above.`; return; }
  const bits = [];
  const sum = f => { const v = rows.map(r => nv(r, f)).filter(x => x != null); return v.length ? `<b style="color:${colors[fs.indexOf(f)]}">${esc(f.label)}</b> averaged ${f.t === 'bool' ? Math.round(mean(v) * 100) + '% of days' : fmtStat(f, mean(v))} (${v.length} days)` : `no <b>${esc(f.label)}</b> in this range`; };
  bits.push(fs.map(sum).join(', ') + ` over ${range}.`);
  for (const [i, j] of [[0, 1], [0, 2], [1, 2]]) {
    if (!fs[i] || !fs[j]) continue;
    const p = pairs(fs[i], fs[j], 0).filter(x => x.d > from), pr = pearson(p);
    if (!pr) { bits.push(`Only ${p.length} day${p.length === 1 ? '' : 's'} have both ${esc(fs[i].label)} and ${esc(fs[j].label)}, so it's too early to compare them.`); continue; }
    bits.push(`<b>${strength(pr.r)[0].toUpperCase() + strength(pr.r).slice(1)}</b> link between ${esc(fs[i].label)} and ${esc(fs[j].label)} (r = ${pr.r > 0 ? '+' : ''}${pr.r.toFixed(2)}, ${p.length} days)${Math.abs(pr.r) >= .15 ? `: when ${esc(fs[i].label)} is higher, ${esc(fs[j].label)} tends to be <b>${pr.r > 0 ? 'higher' : 'lower'}</b>` : ''}${p.length < 10 ? '. Small sample, so treat it as a hint' : ''}.`);
  }
  read.innerHTML = bits.join('<br>') + ` <a href="#insights" id="cmp-deeper">Dig deeper in Insights →</a>`;
  $('#cmp-deeper').onclick = e => { e.preventDefault(); S.ins.x = fs[0].k; S.ins.y = (fs[1] || fs[0]).k; S.ins.target = (fs[1] || fs[0]).k; go('insights'); };
}

RENDER.dash = function () {

  const first = rows[0].date;
  const since = Math.round((fromIso(last) - fromIso(first)) / 864e5) + 1;
  const throwDays = rows.filter(r => r.throw).length;
  const liftDays = rows.filter(r => r.lift).length;
  const st = Store.stats;
  const latestWith = k => { const p = st[k]?.latest; return p ? { date: p[0], v: p[1] } : null; };
  const avgLast = (k, days, end = last) => { const v = rows.filter(r => r.date > addDays(end, -days) && r.date <= end).map(r => nv(r, FK[k])).filter(x => x != null); return v.length ? mean(v) : null; };
  const lastNote = [...rows].reverse().find(r => r.notes && /ft|live|pen|bullpen|inning|first|start/i.test(r.notes));
  const rd = readiness(last) || readiness(addDays(last, -1));

  const trend = (now, prev, good = 1, unitFmt = fmtNum) => {
    if (now == null || prev == null) return '<span class="flat">no comparison yet</span>';
    const d = now - prev; const cls = (Math.abs(d) < 1e-9 || !good) ? 'flat' : (d * good > 0 ? 'up' : 'down');
    return `<span class="${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : '•'} ${unitFmt(Math.abs(d))}</span>`;
  };
  const hrv7 = avgLast('hrv', 7), hrv30 = avgLast('hrv', 30);
  const rec7 = avgLast('recovery', 7), rec30 = avgLast('recovery', 30);
  const sl7 = avgLast('sleep', 7), sl30 = avgLast('sleep', 30);
  const bw = latestWith('bw'); const bw30 = (() => { const v = rows.filter(r => r.bw != null && r.date <= addDays(last, -30)); return v.length ? v[v.length-1].bw : null; })();
  const arm = latestWith('armScore'); const armBest = st.armScore.best;
  const velo = st.liveMax.best || st.penMax.best;
  const liveAvgLatest = latestWith('liveAvg');
  const sp = latestWith('strikePct');

  el.innerHTML = `
  <div class="hero">
    <div class="hero-inner">
      <div>
        <div class="eyebrow">UC San Diego Tritons · Left-handed pitcher</div>
        <h1>Branden Jackel</h1>
        <div class="muted">The road back — from the first 45-ft toss to live ABs. Data through ${longDate(last)}.</div>
        <div class="hero-tags">
          <span class="tag gold">Day ${since} of the comeback</span>
          ${lastNote ? `<span class="tag">Latest milestone: ${esc(lastNote.notes)} · ${short(lastNote.date)}</span>` : ''}
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="big">${throwDays}</div><div class="lbl">Throw days</div></div>
        <div class="hero-stat"><div class="big">${liftDays}</div><div class="lbl">Lift days</div></div>
        <div class="hero-stat"><div class="big">${velo ? fmtNum(velo[1]) : '—'}</div><div class="lbl">Top velo (mph)</div></div>
      </div>
    </div>
  </div>

  <div class="page-head">
    <div><h2>Summary</h2><p>7-day averages compared with the 30-day baseline. Green is moving the right way.</p></div>
    <div class="toolbar" style="margin:0">
      <div class="seg" id="range-seg">
        ${[[30,'30 days'],[90,'90 days'],[9999,'All time']].map(([v,l]) => `<button data-r="${v}" class="${S.range==v?'on':''}">${l}</button>`).join('')}
      </div>
      <div class="seg"><button id="sec-collapse">Collapse all</button><button id="sec-expand">Expand all</button></div>
    </div>
  </div>

  <section class="dash-sec" data-sec="kpis"><div class="card-head sec-title"><h3>Key numbers</h3><span class="muted small">Tap a tile to compare it below</span></div>
  <div class="grid kpis">
    <div class="card kpi">
      <div class="kpi-lbl">Readiness · ${rd ? short(Store.byDate[last] && readiness(last) ? last : addDays(last,-1)) : ''}</div>
      ${rd ? `<div class="ring" style="margin-top:6px">${ringSVG(rd.score, readinessColor(rd.score))}<div class="kpi-sub" style="margin:0">${rd.parts.map(p => `${p[0]}: <b style="color:var(--text)">${Math.round(p[1])}</b>`).join('<br>')}</div></div>` : '<div class="kpi-val">—</div><div class="kpi-sub">Log sleep / HRV / recovery to score</div>'}
    </div>
    <div class="card kpi"><div class="kpi-lbl">HRV · 7-day avg</div><div class="kpi-val">${fmtNum(hrv7)}<small class="muted" style="font-size:16px"> ms</small></div><div class="kpi-sub">${trend(hrv7, hrv30)} vs 30-day ${fmtNum(hrv30)}</div></div>
    <div class="card kpi"><div class="kpi-lbl">Recovery · 7-day avg</div><div class="kpi-val">${fmtNum(rec7)}<small class="muted" style="font-size:16px">%</small></div><div class="kpi-sub">${trend(rec7, rec30)} vs 30-day ${fmtNum(rec30)}%</div></div>
    <div class="card kpi"><div class="kpi-lbl">Sleep · 7-day avg</div><div class="kpi-val">${fmtDur(sl7)}</div><div class="kpi-sub">${trend(sl7, sl30, 1, v => fmtDur(v))} vs 30-day ${fmtDur(sl30)}</div></div>
    <div class="card kpi"><div class="kpi-lbl">Bodyweight</div><div class="kpi-val">${bw ? fmtNum(bw.v) : '—'}<small class="muted" style="font-size:16px"> lb</small></div><div class="kpi-sub">${trend(bw?.v, bw30, 0)} over 30 days${bw ? ' · ' + short(bw.date) : ''}</div></div>
    <div class="card kpi"><div class="kpi-lbl">Arm Score</div><div class="kpi-val">${arm ? fmtNum(arm.v) + '%' : '—'}</div><div class="kpi-sub">${armBest ? `Best ${fmtNum(armBest[1])}% · ${short(armBest[0])}` : ''}</div></div>
    <div class="card kpi"><div class="kpi-lbl">Live Velo Avg</div><div class="kpi-val">${liveAvgLatest ? fmtNum(liveAvgLatest.v) : '—'}<small class="muted" style="font-size:16px"> mph</small></div><div class="kpi-sub">${liveAvgLatest ? 'Last live · ' + short(liveAvgLatest.date) : ''}${st.liveMax.max ? ` · max ${fmtNum(st.liveMax.max)}` : ''}</div></div>
    <div class="card kpi"><div class="kpi-lbl">Strike % (live)</div><div class="kpi-val">${sp ? fmtNum(sp.v) + '%' : '—'}</div><div class="kpi-sub">${sp ? `Avg ${fmtNum(st.strikePct.mean)}% over ${st.strikePct.n} lives` : ''}</div></div>
  </div>
  </section>

  <div class="grid charts">
    <div class="card span-12" data-sec="compare" id="cmp-card">
      <div class="card-head"><h3>Compare stats</h3><span class="muted small">Pick up to 3 stats and see them on one chart</span></div>
      <div class="cmp-pick">
        ${['a','b','c'].map((k, i) => `<label class="field"><span><i class="sw" style="background:${[C.gold, C.teal, C.stitch][i]}"></i>Stat ${i + 1}${i === 2 ? ' (optional)' : ''}</span><select class="input" id="cmp-${k}">${i === 2 ? `<option value="">None</option>` : ''}${metricOptions(S.cmp[k], 3)}</select></label>`).join('')}
      </div>
      <div class="toolbar" style="margin:12px 0 4px;justify-content:space-between"><div class="chips" id="cmp-presets"></div><label class="chk"><input type="checkbox" id="cmp-smooth" ${S.cmp.smooth ? 'checked' : ''}> Smooth (7-day average)</label></div>
      <div class="chart-box tall"><canvas id="ch-cmp"></canvas></div>
      <div class="callout" id="cmp-read" style="margin-top:12px"></div>
    </div>
    <div class="card span-8"><div class="card-head"><h3>Velocity progression</h3><span class="muted small">Catch play → bullpen → live ABs (all sessions)</span></div><div class="chart-box tall"><canvas id="ch-velo"></canvas></div></div>
    <div class="card span-4"><div class="card-head"><h3>Rehab milestones</h3><span class="muted small">From the notes column</span></div><div class="timeline" id="timeline"></div></div>

    <div class="card span-7"><div class="card-head"><h3>HRV & recovery</h3><span class="muted small">Daily, with 7-day HRV trend</span></div><div class="chart-box"><canvas id="ch-hrv"></canvas></div></div>
    <div class="card span-5"><div class="card-head"><h3>Sleep breakdown</h3><span class="muted small">Deep · REM · light</span></div><div class="chart-box"><canvas id="ch-sleep"></canvas></div></div>

    <div class="card span-6"><div class="card-head"><h3>Arm care</h3><span class="muted small">Arm Score & total fresh strength</span></div><div class="chart-box"><canvas id="ch-arm"></canvas></div></div>
    <div class="card span-6"><div class="card-head"><h3>Bodyweight</h3><span class="muted small">With 7-day average</span></div><div class="chart-box"><canvas id="ch-bw"></canvas></div></div>

    <div class="card span-6"><div class="card-head"><h3>Live ABs — command</h3><span class="muted small">Strike % and pitches per live session</span></div><div class="chart-box"><canvas id="ch-live"></canvas></div></div>
    <div class="card span-6"><div class="card-head"><h3>Power</h3><span class="muted small">CMJ (force plates & camera) and RSI</span></div><div class="chart-box"><canvas id="ch-power"></canvas></div></div>

    <div class="card span-12"><div class="card-head"><h3>Training calendar</h3><span class="muted small">Every day since the first throw</span></div><div class="heat" id="heat"></div>
      <div class="legend"><span><i style="background:var(--navy-3)"></i>Rest / no throw</span><span><i style="background:rgba(255,205,0,.45)"></i>Throw day</span><span><i style="background:var(--gold)"></i>Bullpen / live / game</span><span><i style="background:var(--navy-3);box-shadow:inset 0 0 0 4px var(--navy-3);position:relative"></i><span class="dot blue" style="margin-left:-14px;margin-right:6px;width:5px;height:5px"></span>Lift day</span></div>
    </div>
  </div>`;

  $$('#range-seg button').forEach(b => b.onclick = () => { S.range = +b.dataset.r; RENDER.dash(); });

  // every chart card is collapsible; ids come from the card title
  $$('#v-dash .charts > .card:not([data-sec])').forEach(c => { const t = $('h3', c); if (t) c.dataset.sec = t.textContent.toLowerCase().replace(/[^a-z]+/g, '-'); });
  setupCollapse($('#v-dash'));
  $('#sec-collapse').onclick = () => { setAllCollapsed($('#v-dash'), true); RENDER.dash(); };
  $('#sec-expand').onclick = () => { setAllCollapsed($('#v-dash'), false); RENDER.dash(); };

  // compare panel
  ['a','b','c'].forEach(k => $('#cmp-' + k).onchange = e => { S.cmp[k] = e.target.value; drawCompare(); });
  $('#cmp-smooth').onchange = e => { S.cmp.smooth = e.target.checked; drawCompare(); };
  const KPI_KEYS = [null, 'hrv', 'recovery', 'sleep', 'bw', 'armScore', 'liveAvg', 'strikePct'];
  $$('#v-dash .kpis .kpi').forEach((t, i) => {
    const k = KPI_KEYS[i]; if (!k) return;
    t.classList.add('tap'); t.title = 'Compare ' + FK[k].label;
    t.onclick = () => {
      if (S.cmp.a !== k) { S.cmp.b = S.cmp.a; S.cmp.a = k; }
      $('#cmp-a').value = S.cmp.a; $('#cmp-b').value = S.cmp.b;
      const card = $('#cmp-card');
      if (card.classList.contains('collapsed')) $('.sec-toggle', card).click();
      drawCompare(); card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
  drawCompare();

  const inRange = rows.filter(r => r.date > addDays(last, -S.range));

  // velocity (all-time: sparse sessions)
  const vRows = rows.filter(r => ['cpMax','penMax','liveAvg','liveMax','cpAvg','penAvg'].some(k => r[k] != null));
  chart('ch-velo', { type: 'line', data: { labels: vRows.map(r => short(r.date)), datasets: [
    lineDs('Catch play max', vRows.map(r => r.cpMax ?? null), C.sky, { pointRadius: 3 }),
    lineDs('Bullpen max', vRows.map(r => r.penMax ?? null), C.teal, { pointRadius: 3 }),
    lineDs('Live avg', vRows.map(r => r.liveAvg ?? null), C.gold2, { pointRadius: 3, borderDash: [5,4] }),
    lineDs('Live max', vRows.map(r => r.liveMax ?? null), C.gold, { pointRadius: 4, borderWidth: 3 }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'mph' } } } } });

  // timeline
  const notes = rows.filter(r => r.notes).reverse();
  $('#timeline').innerHTML = notes.map(r => `<div class="tl"><div class="d">${short(r.date)}</div><div class="pin ${/ft|live|pen|bullpen|inning|first|throw|scrimmage/i.test(r.notes) ? '' : 'alt'}"></div><div>${esc(r.notes)}${r.throwing ? `<div class="muted small">${esc(r.throwing)}${r.location ? ' · ' + esc(r.location) : ''}</div>` : ''}</div></div>`).join('') || '<div class="muted">No notes yet.</div>';

  // HRV / recovery
  const hr = inRange;
  const roll = (arr, n) => arr.map((_, i) => { const w = arr.slice(Math.max(0, i-n+1), i+1).filter(x => x != null); return w.length ? mean(w) : null; });
  const hrvVals = hr.map(r => r.hrv ?? null);
  chart('ch-hrv', { type: 'line', data: { labels: hr.map(r => short(r.date)), datasets: [
    lineDs('Recovery %', hr.map(r => r.recovery ?? null), C.teal, { yAxisID: 'y1', fill: true, backgroundColor: 'rgba(0,198,215,.08)', borderWidth: 1.5 }),
    lineDs('HRV', hrvVals, 'rgba(255,205,0,.45)', { borderWidth: 1 }),
    lineDs('HRV 7-day', roll(hrvVals, 7), C.gold, { borderWidth: 3 }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'HRV (ms)' } }, y1: { position: 'right', min: 0, max: 100, grid: { display: false }, title: { display: true, text: 'Recovery %' } }, x: { ticks: { maxTicksLimit: 10 } } } } });

  // sleep
  const sl = inRange.filter(r => r.sleep != null).slice(-Math.min(S.range, 60));
  chart('ch-sleep', { type: 'bar', data: { labels: sl.map(r => short(r.date)), datasets: [
    { label: 'Deep', data: sl.map(r => r.deep ?? 0), backgroundColor: C.blue, stack: 's' },
    { label: 'REM', data: sl.map(r => r.rem ?? 0), backgroundColor: C.teal, stack: 's' },
    { label: 'Light', data: sl.map(r => Math.max(0, (r.sleep || 0) - (r.deep || 0) - (r.rem || 0))), backgroundColor: 'rgba(143,163,191,.35)', stack: 's' },
  ]}, options: { plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtDur(c.raw)}`, footer: items => 'Total: ' + fmtDur(sl[items[0].dataIndex].sleep) } } }, scales: { x: { stacked: true, ticks: { maxTicksLimit: 8 } }, y: { stacked: true, title: { display: true, text: 'hours' } } } } });

  // arm care
  const ar = rows.filter(r => r.armScore != null || r.totalStrength != null);
  chart('ch-arm', { type: 'line', data: { labels: ar.map(r => short(r.date)), datasets: [
    lineDs('Arm Score %', ar.map(r => r.armScore ?? null), C.gold, { pointRadius: 3, borderWidth: 3 }),
    lineDs('Total strength (lb)', ar.map(r => r.totalStrength ?? null), C.sky, { yAxisID: 'y1', pointRadius: 2 }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'Arm Score %' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'lb' } } } } });

  // bodyweight
  const bwr = inRange.filter(r => r.bw != null);
  const bwv = bwr.map(r => r.bw);
  chart('ch-bw', { type: 'line', data: { labels: bwr.map(r => short(r.date)), datasets: [
    lineDs('Bodyweight', bwv, 'rgba(79,163,227,.5)', { borderWidth: 1, pointRadius: 2 }),
    lineDs('7-day avg', roll(bwv, 7), C.gold, { borderWidth: 3 }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'lb' } }, x: { ticks: { maxTicksLimit: 8 } } } } });

  // live
  const lv = rows.filter(r => r.strikePct != null || r.livePitches != null);
  chart('ch-live', { data: { labels: lv.map(r => short(r.date)), datasets: [
    { type: 'bar', label: 'Live pitches', data: lv.map(r => r.livePitches ?? null), backgroundColor: 'rgba(0,98,155,.7)', borderRadius: 6, yAxisID: 'y1' },
    { type: 'line', label: 'Strike %', data: lv.map(r => r.strikePct ?? null), borderColor: C.gold, backgroundColor: C.gold, borderWidth: 3, pointRadius: 4, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { min: 0, max: 100, title: { display: true, text: 'Strike %' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'pitches' } } } } });

  // power
  const pw = rows.filter(r => r.cmjFP != null || r.cmjCam != null || r.rsi != null);
  chart('ch-power', { type: 'line', data: { labels: pw.map(r => short(r.date)), datasets: [
    lineDs('CMJ force plates', pw.map(r => r.cmjFP ?? null), C.gold, { pointRadius: 3, borderWidth: 3 }),
    lineDs('CMJ camera', pw.map(r => r.cmjCam ?? null), C.sky, { pointRadius: 3 }),
    lineDs('RSI', pw.map(r => r.rsi ?? null), C.stitch, { pointRadius: 3, yAxisID: 'y1' }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'CMJ' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'RSI' } } } } });

  // heatmap
  const start = fromIso(first); start.setDate(start.getDate() - start.getDay());
  const end = fromIso(last);
  let html = '', d = new Date(start);
  while (d <= end) {
    html += '<div class="col">';
    for (let i = 0; i < 7; i++) {
      const k = iso(d), r = Store.byDate[k];
      let bg = 'var(--navy-3)', cls = 'c';
      if (k < first || d > end) bg = 'transparent';
      else if (r?.throw) bg = (/pen|live|scrim|game|inning/i.test((r.throwing || '') + ' ' + (r.notes || '')) || r.pitches) ? C.gold : 'rgba(255,205,0,.45)';
      if (r?.lift) cls += ' lift';
      const tip = r ? `${longDate(k)}${r.throw ? ' · threw' + (r.throwing ? ': ' + r.throwing : '') : ''}${r.lift ? ' · lifted' : ''}${r.notes ? ' · ' + r.notes : ''}` : longDate(k);
      html += `<div class="${cls}" style="background:${bg}" title="${esc(tip)}"></div>`;
      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
  }
  $('#heat').innerHTML = html;
};

  const L = S.log;
  const el = $('#v-log');
  el.innerHTML = `
  <div class="page-head"><div><h2>Data Log</h2><p>Every day, every metric. Click a column to sort, click a row to edit that day. <span class="p-top" style="padding:1px 6px;border-radius:4px">Gold</span> = top 10% of his history, <span class="p-hi" style="padding:1px 6px;border-radius:4px">green</span> = top third, <span class="p-lo" style="padding:1px 6px;border-radius:4px">red</span> = bottom third.</p></div>
  <button class="btn ghost" id="log-export">⇩ Export view as CSV</button></div>
  <div class="toolbar">
    <input class="input" id="log-q" placeholder="Search notes, location, program…" value="${esc(L.q)}" style="min-width:220px;flex:1">

  const upd = () => drawLogTable();

function xValue(f, date, lag) {
  if (lag === 0) return nv(Store.byDate[date], f);
  if (lag === 1) return nv(Store.byDate[addDays(date, -1)], f);
  if (lag === 3) { const v = [1,2,3].map(i => nv(Store.byDate[addDays(date, -i)], f)).filter(x => x != null); return v.length ? mean(v) : null; }
  return null;
}
function pairs(fx, fy, lag) {
  const out = [];
  for (const r of Store.rows) {
    const y = nv(r, fy); if (y == null) continue;
    const x = xValue(fx, r.date, lag); if (x == null) continue;
    out.push({ x, y, d: r.date });
  }
  return out;
}
function pearson(p) {
  const n = p.length; if (n < 3) return null;
  const mx = mean(p.map(a => a.x)), my = mean(p.map(a => a.y));
  let sxy = 0, sxx = 0, syy = 0;
  for (const a of p) { sxy += (a.x-mx)*(a.y-my); sxx += (a.x-mx)**2; syy += (a.y-my)**2; }
  if (!sxx || !syy) return null;
  return { r: sxy / Math.sqrt(sxx*syy), slope: sxy / sxx, icpt: my - (sxy/sxx)*mx };
}
const strength = r => { const a = Math.abs(r); return a >= .7 ? 'very strong' : a >= .5 ? 'strong' : a >= .3 ? 'moderate' : a >= .15 ? 'weak' : 'little to no'; };
const lagLabel = l => l === 0 ? 'same day' : l === 1 ? 'the day before' : 'the 3 days before (avg)';
function metricOptions(sel, minN = 3) {
  const grouped = {};
  FIELDS.filter(f => (NUMERIC_T.has(f.t) || f.t === 'bool') && (f.t === 'bool' ? Store.rows.some(r => r[f.k] != null) : (Store.stats[f.k]?.n || 0) >= minN)).forEach(f => (grouped[f.g] = grouped[f.g] || []).push(f));
  return Object.entries(grouped).map(([g, fs]) => `<optgroup label="${GROUPS[g]}">${fs.map(f => `<option value="${f.k}" ${f.k === sel ? 'selected' : ''}>${esc(f.label)}${f.t === 'bool' ? ' (yes/no)' : ''}</option>`).join('')}</optgroup>`).join('');
}

  // full record for an id (user record or library entry), normalised to the ExerciseRecord shape

  },

      </tbody></table></div>
      <p class="muted small" style="margin-bottom:0">Direct = the muscle is a primary target; indirect = a meaningful helper. Hard = 3 or fewer reps in reserve. These are set counts, not measures of muscle activation or growth.</p>
    </div>
    <div class="card span-5" data-sec="wl-flags"><div class="card-head"><h3>Data quality</h3></div>
      ${flagsAll.length ? `<div class="flags" style="margin-top:0">${flagsAll.map(f => `<div>• ${esc(FLAG_TEXT[f] || f)}</div>`).join('')}</div>` : '<div class="muted small">No issues in this period.</div>'}

    <div class="card span-6" data-sec="wl-volume"><div class="card-head"><h3>Volume load by week</h3><span class="muted small">Upper · lower · trunk · total-body lifts</span></div><div class="chart-box"><canvas id="ch-wl-vol"></canvas></div></div>
    <div class="card span-6" data-sec="wl-exposure"><div class="card-head"><h3>Exposure by week</h3><span class="muted small">High-intensity, explosive, axial sets</span></div><div class="chart-box"><canvas id="ch-wl-exp"></canvas></div></div>
    <div class="card span-12" data-sec="wl-load"><div class="card-head"><h3>Session load · rolling averages</h3><span class="muted small">Daily session-RPE load with 7- and 28-day daily averages</span></div><div class="chart-box"><canvas id="ch-wl-roll"></canvas></div></div>
    <div class="card span-6" data-sec="wl-next"><div class="card-head"><h3>Lifting vs next day</h3><span class="muted small">His own data so far</span></div><div id="wl-next"></div></div>
    <div class="card span-6" data-sec="wl-lwi"><div class="card-head"><h3>Lifting Workload Index <span class="badge b-exp">Experimental</span></h3></div>
      <label class="chk"><input type="checkbox" id="lwi-show" ${cfg.show ? 'checked' : ''}> Show the experimental index</label>
      <div id="lwi-body"></div>
    </div>
  </div>`;
  $$('#wl-period button').forEach(b => b.onclick = () => { S.wlPeriod = b.dataset.p; renderWorkload(date); });
  setupCollapse($('#lift-body'));

  // effort split
  const eff = { 'very-close': 0, near: 0, moderate: 0, lower: 0, unknown: 0 };
  ANALYSES.filter(a => a.date >= range[0] && a.date <= range[1]).forEach(a => { for (const k in eff) eff[k] += a.effort[k]; });
  const totE = Object.values(eff).reduce((s, x) => s + x, 0) || 1;
  const effCol = { 'very-close': C.stitch, near: C.gold, moderate: C.teal, lower: C.sky, unknown: 'rgba(143,163,191,.35)' };
  const effLbl = { 'very-close': '0–1 RIR', near: '2–3 RIR', moderate: '4–5 RIR', lower: '6+ RIR', unknown: 'no RPE' };
  $('#wl-effort').innerHTML = `<div class="stackbar">${Object.entries(eff).map(([k, v]) => v ? `<i style="width:${v / totE * 100}%;background:${effCol[k]}" title="${effLbl[k]}: ${v}"></i>` : '').join('')}</div><div class="legend">${Object.entries(eff).map(([k, v]) => `<span><i style="background:${effCol[k]}"></i>${effLbl[k]} · ${v}</span>`).join('')}</div>`;

  // weekly charts
  const wl = weeks.map(w => short(w.from));
  chart('ch-wl-weeks', { data: { labels: wl, datasets: [
    { type: 'bar', label: 'Upper hard sets', data: weeks.map(w => w.regions.upper.hardDirectSets), backgroundColor: C.sky, stack: 'h' },
    { type: 'bar', label: 'Lower hard sets', data: weeks.map(w => w.regions.lower.hardDirectSets), backgroundColor: C.gold, stack: 'h2' },
    { type: 'bar', label: 'Trunk hard sets', data: weeks.map(w => w.regions.trunk.hardDirectSets), backgroundColor: C.teal, stack: 'h3' },
    { type: 'line', label: 'Session load (AU)', data: weeks.map(w => w.sessionLoadDays ? w.sessionLoad : null), borderColor: C.stitch, backgroundColor: C.stitch, yAxisID: 'y1', pointRadius: 4, borderWidth: 2, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'hard sets' }, beginAtZero: true }, y1: { position: 'right', grid: { display: false }, beginAtZero: true, title: { display: true, text: 'AU' } } } } });
  chart('ch-wl-vol', { type: 'bar', data: { labels: wl, datasets: [
    { label: 'Upper', data: weeks.map(w => w.volume.upper), backgroundColor: C.sky, stack: 'v' },
    { label: 'Lower', data: weeks.map(w => w.volume.lower), backgroundColor: C.gold, stack: 'v' },
    { label: 'Trunk', data: weeks.map(w => w.volume.trunk), backgroundColor: C.teal, stack: 'v' },
    { label: 'Total-body', data: weeks.map(w => w.volume.totalBody), backgroundColor: C.stitch, stack: 'v' },
  ]}, options: { scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: 'lb' } } } } });
  chart('ch-wl-exp', { type: 'bar', data: { labels: wl, datasets: [
    { label: '≥80% 1RM', data: weeks.map(w => w.counts.highIntensitySets || 0), backgroundColor: C.stitch },
    { label: 'Explosive', data: weeks.map(w => w.counts.explosiveSets || 0), backgroundColor: C.gold },
    { label: 'Axial', data: weeks.map(w => w.counts.axialSets || 0), backgroundColor: C.sky },
  ]}, options: { scales: { y: { beginAtZero: true, title: { display: true, text: 'sets' } } } } });
  // rolling session load over 56 days
  const days = Array.from({ length: 56 }, (_, i) => addDays(date, i - 55));
  const loadOf = d => { const a = analysisOn(d); return a && a.session.load != null ? a.session.load : 0; };
  const daily = days.map(loadOf);
  const roll = n => days.map((d, i) => { const w = daily.slice(Math.max(0, i - n + 1), i + 1); return w.length === n || i >= n - 1 ? Math.round(w.reduce((s, x) => s + x, 0) / n) : null; });
  chart('ch-wl-roll', { data: { labels: days.map(short), datasets: [
    { type: 'bar', label: 'Session load', data: daily.map(x => x || null), backgroundColor: 'rgba(255,205,0,.45)', borderRadius: 4 },
    { type: 'line', label: '7-day daily avg', data: roll(7), borderColor: C.gold, borderWidth: 3, pointRadius: 0, spanGaps: true },
    { type: 'line', label: '28-day daily avg', data: days.map((d, i) => i >= 27 ? Math.round(daily.slice(i - 27, i + 1).reduce((s, x) => s + x, 0) / 28) : null), borderColor: C.teal, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, title: { display: true, text: 'AU' } } } } });

  // lifting vs next day (lag 1)
  const xs = ['liftHard', 'liftVol', 'liftSessLoad', 'liftExpl', 'liftHiInt'].map(k => FK[k]);
  const ys = ['soreness', 'feel', 'armFeel', 'energy', 'recovery', 'hrv'].map(k => FK[k]);
  const rowsN = [];
  for (const fx of xs) for (const fy of ys) { const p = pairs(fx, fy, 1), pr = pearson(p); rowsN.push({ fx, fy, n: p.length, r: pr ? pr.r : null }); }
  const usable = rowsN.filter(x => x.r != null && x.n >= 5).sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
  $('#wl-next').innerHTML = usable.length ? `<table class="recipe"><thead><tr><th>Lifting (day before)</th><th>Next day</th><th>r</th><th>days</th></tr></thead><tbody>${usable.slice(0, 8).map(x => `<tr><td>${esc(x.fx.label)}</td><td>${esc(x.fy.label)}</td><td style="color:${x.r >= 0 ? C.gold : C.sky};font-weight:700">${x.r > 0 ? '+' : ''}${x.r.toFixed(2)}</td><td class="muted">${x.n}</td></tr>`).join('')}</tbody></table><p class="muted small" style="margin-bottom:0">Correlation, not cause. Under ~20 days, treat as hints. Explore any pair on the Insights page with “Day before”.</p>`
    : `<div class="muted small">Needs at least 5 lifting days followed by a day with soreness, feel, recovery or HRV logged. ${ANALYSES.length} lifting day${ANALYSES.length === 1 ? '' : 's'} so far.</div>`;

  // experimental composite
  const drawLwi = () => {
    const c = (Store.local['cfg:lwi'] && !Store.local['cfg:lwi']._gone) ? Store.local['cfg:lwi'] : { show: false, weights: WE.DEFAULT_WEIGHTS };
    if (!c.show) { $('#lwi-body').innerHTML = '<p class="muted small">A single number comparing a session with his own recent sessions. Off by default because it is not validated. Not a measure of fatigue or CNS stress.</p>'; return; }
    const comp = analysisOn(date) && analysisOn(date).composite;
    const NAMES = { muscular: 'Hard sets', external: 'Volume load', internal: 'Session load', intensity: 'High-intensity + explosive sets' };
    $('#lwi-body').innerHTML = `
      <div style="display:flex;align-items:baseline;gap:10px;margin:8px 0"><div class="r-badge" style="color:var(--gold)">${comp && comp.value != null ? (comp.value > 0 ? '+' : '') + comp.value.toFixed(2) : '—'}</div><div class="muted small">${short(date)} · 0 = his typical session; +1 ≈ one SD above</div></div>
      ${comp ? `<table class="recipe"><tbody>${Object.entries(comp.components).map(([k, z]) => `<tr><td>${NAMES[k]}</td><td>${z == null ? '<span class="muted">not enough history</span>' : (z > 0 ? '+' : '') + z.toFixed(2)}</td><td style="width:42%"><input type="range" min="0" max="3" step="0.5" value="${c.weights[k] ?? 1}" data-w="${k}" aria-label="Weight for ${NAMES[k]}"></td><td class="muted small">w ${c.weights[k] ?? 1}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">No session on this day.</div>'}
      <p class="muted small" style="margin-bottom:0">Weighted mean of z-scores against his previous lifting days in the last 28 days (needs 6+). Only change the weights after the “Lifting vs next day” table shows a real relationship.</p>`;
    $$('#lwi-body [data-w]').forEach(inp => inp.onchange = () => {
      const c2 = Object.assign({ show: true, weights: Object.assign({}, WE.DEFAULT_WEIGHTS) }, strip(Store.local['cfg:lwi'] || {}));
      c2.weights = Object.assign({}, c2.weights, { [inp.dataset.w]: +inp.value });
      Store.local['cfg:lwi'] = Object.assign(c2, { _u: Date.now() }); Store.save(); Sync.queue(['cfg:lwi']); drawLwi();
    });
  };
  $('#lwi-show').onchange = e => { const c2 = Object.assign({ weights: Object.assign({}, WE.DEFAULT_WEIGHTS) }, strip(Store.local['cfg:lwi'] || {}), { show: e.target.checked }); Store.local['cfg:lwi'] = Object.assign(c2, { _u: Date.now() }); Store.save(); Sync.queue(['cfg:lwi']); drawLwi(); };
  drawLwi();
}

/* ---------- EXERCISES (database + classification review) ---------- */
function renderExercises() {
  Ex.ensure(Store.rows.flatMap(r => (r.lifts || []).map(x => x.n)));
  const used = new Map();
  for (const r of Store.rows) for (const x of r.lifts || []) { const e = Ex.resolve(x.n, x.id); used.set(e.id, (used.get(e.id) || 0) + 1); }
  const q = (S.exQ || '').toLowerCase(), F = S.exF || 'used';
  const list = Ex.all().filter(e => {
    const src = (e.classification || {}).source || '';
    if (F === 'used' && !used.has(e.id)) return false;
    if (F === 'custom' && e.id in Ex.libById) return false;
    if (F === 'review' && !(((e.classification || {}).confidence || 0) < 0.6 || ((e.classification || {}).questions || []).length || src === 'rules')) return false;
    return !q || (e.name + ' ' + (e.aliases || []).join(' ') + ' ' + e.pattern).toLowerCase().includes(q);
  }).sort((a, b) => (used.get(b.id) || 0) - (used.get(a.id) || 0) || a.name.localeCompare(b.name));
  $('#lift-body').innerHTML = `
  <div class="entry-layout">
    <div>
      <div class="toolbar">
        <input class="input" id="ex-q" placeholder="Search exercises…" value="${esc(S.exQ || '')}" style="flex:1;min-width:180px">
        <div class="seg" id="ex-f">${[['used', 'Used'], ['all', 'All'], ['custom', 'Custom'], ['review', 'Needs review']].map(([k, l]) => `<button data-f="${k}" class="${F === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <button class="btn" id="ex-new">＋ New</button>
      </div>
      <div class="card" style="padding:0">${list.length ? list.map(e => { const c = e.classification || {}; return `<div class="ex-row ${S.exEdit === e.id ? 'on' : ''}" data-id="${esc(e.id)}">
        <div><b>${esc(e.name)}</b><div class="muted small">${esc(e.pattern)} · ${esc(e.category)} · ${esc(e.equipment)}${e.unilateral ? ' · unilateral' : ''}${e.explosive ? ' · explosive' : ''}</div><div class="small">Primary: ${esc(musList(e.primary))}${e.secondary && e.secondary.length ? ` <span class="muted">· Secondary: ${esc(musList(e.secondary))}</span>` : ''}</div></div>
        <div class="ex-meta">${confChip(c.confidence, c.source)}<span class="src">${esc(srcLabel(c.source))}${e.overridden && e.overridden.length ? ' · edited' : ''}</span>${used.get(e.id) ? `<span class="muted small">${used.get(e.id)}× logged</span>` : ''}</div>
      </div>`; }).join('') : '<div class="empty">No exercises match.</div>'}</div>
    </div>
    <div class="sticky-panel" id="ex-panel"></div>
  </div>`;
  $('#ex-q').oninput = e => { S.exQ = e.target.value; const p = e.target.selectionStart; renderExercises(); const i = $('#ex-q'); i.focus(); i.setSelectionRange(p, p); };
  $$('#ex-f button').forEach(b => b.onclick = () => { S.exF = b.dataset.f; renderExercises(); });
  $$('.ex-row').forEach(r => r.onclick = () => { S.exEdit = r.dataset.id; S.exNew = null; renderExercises(); if (window.innerWidth <= 1100) $('#ex-panel').scrollIntoView({ behavior: 'smooth' }); });
  $('#ex-new').onclick = () => { S.exEdit = null; S.exNew = { name: '', description: '', result: null }; renderExercises(); $('#ex-panel').scrollIntoView({ behavior: 'smooth' }); };
  if (S.exNew) renderNewExercise(); else if (S.exEdit) renderExerciseEditor(S.exEdit);
  else $('#ex-panel').innerHTML = `<div class="card"><h3>How classification works</h3><p class="small">Each exercise lists the muscles it trains <b>directly</b> (primary) and <b>indirectly</b> (secondary). Those lists turn sets into per-muscle counts. Exercises come from:</p><ul class="small" style="padding-left:18px"><li><b>Library</b>: curated entries, including every exercise he has logged.</li><li><b>Auto (rules)</b>: instant keyword reading of a new name, with a confidence level.</li><li><b>Auto (AI)</b>: Claude reads names the rules are unsure about, explains its reading and asks if unclear.</li><li><b>Edited</b>: changed by hand. The original automatic version is always kept.</li></ul><p class="small muted">Tap any exercise to review or correct it.</p></div>`;
}
function exForm(e) {

    <label class="field"><span>Name</span><input class="input" id="ef-name" value="${esc(e.name || '')}"></label>

      <label class="field"><span>Stability</span><select class="input" id="ef-stability">${opt(['stable', 'unstable'], e.stability)}</select></label>
      <label class="field"><span>Impact</span><select class="input" id="ef-impact">${opt(['none', 'low', 'high'], e.impact)}</select></label>

    <div class="mk-l">Primary muscles (direct sets)</div>${musRow('primary', e.primary || [])}
    <div class="mk-l">Secondary muscles (indirect sets)</div>${musRow('secondary', e.secondary || [])}
    <div class="mk-l">Stabilisers (listed, not counted)</div>${musRow('stabilizers', e.stabilizers || [])}
    <div class="lift-more-grid" style="margin-top:10px">
      <label class="field"><span>Tested 1RM</span><input class="input" id="ef-1rm" inputmode="decimal" value="${e.oneRm && e.oneRm.tested || ''}" placeholder="optional"></label>
      <label class="field"><span>Tested on</span><input class="input" type="date" id="ef-1rmdate" value="${e.oneRm && e.oneRm.testedDate || ''}"></label>
    </div>`;
}
function readForm(e) {
  const g = id => $('#ef-' + id);
  const out = { name: g('name').value.trim() || e.name, aliases: g('aliases').value.split(',').map(s => s.trim()).filter(Boolean),
    pattern: g('pattern').value, category: g('category').value, equipment: g('equipment').value, contraction: g('contraction').value, rom: g('rom').value,
    stability: g('stability').value, impact: g('impact').value, bwLoad: Math.max(0, Math.min(1, +g('bwLoad').value || 0)) };
  for (const k of ['unilateral', 'axial', 'explosive', 'compound', 'loadComparable']) out[k] = g(k).checked;
  for (const k of ['primary', 'secondary', 'stabilizers']) out[k] = $$(`.mus-pick[data-k="${k}"] .chip.on`).map(b => b.dataset.m);
  out.secondary = out.secondary.filter(m => !out.primary.includes(m));
  const t = +g('1rm').value; out.oneRm = t ? { tested: t, testedDate: g('1rmdate').value || todayIso(), unit: 'lb' } : null;
  return out;
}

function importWorkload(text) {

    for (const k of Object.keys(base)) if (k[0] === '_') delete base[k];
    base.lifts = s.exercises.map(x => { const o = { n: x.name, id: x.exerciseId, sets: x.sets.map(t => { const z = { w: /^bw$/i.test(String(t.load)) ? 0 : +t.load || 0, r: +t.reps || 0 }; if (t.rpe != null) z.rpe = t.rpe; if (t.rir != null) z.rir = t.rir; return z; }) }; if (x.unit && x.unit !== 'lb') o.unit = x.unit; if (x.note) o.note = x.note; if (x.tempo) o.tempo = x.tempo; return o; });

    }
    Store.save(); Sync.queue(dates); sideStats();
    $('#import-result').innerHTML = `<div class="callout">Imported <b>${dates.length}</b> days from <b>${esc(file.name)}</b> (${short(dates[0])} – ${short(dates[dates.length-1])}): ${added} new, ${updated} updated.${unmatched.length ? `<br><span class="muted small">Columns not recognised (skipped): ${unmatched.map(esc).join(', ')}</span>` : ''}</div>`;
    toast('Import complete');
  });
}

/* ---------------- boot ---------------- */
Store.load();
Sync.init();
sideStats();
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#burger').onclick = e => { e.stopPropagation(); setMenu(!$('.side').classList.contains('open')); };
document.addEventListener('click', e => { if (!e.target.closest('.side')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
const start = (location.hash || '').slice(1);
go(RENDER[start] ? start : 'dash');
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (RENDER[v] && v !== S.view) go(v); });
// pull other devices' entries on open, when the app comes back to the front, when back online, and every minute
Sync.sync(true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.sync(true); });
window.addEventListener('online', () => Sync.sync(true));
setInterval(() => { if (document.visibilityState === 'visible') Sync.sync(true); }, 60000);

</script>
</body>
</html>
