    <div class="card span-6" data-sec="wl-volume"><div class="card-head"><h3>Volume load by week</h3><span class="muted small">Upper · lower · trunk · total-body lifts</span></div><div class="chart-box"><canvas id="ch-wl-vol"></canvas></div></div>
    <div class="card span-6" data-sec="wl-exposure"><div class="card-head"><h3>Exposure by week</h3><span class="muted small">High-intensity, explosive, axial sets</span></div><div class="chart-box"><canvas id="ch-wl-exp"></canvas></div></div>
    <div class="card span-12" data-sec="wl-load"><div class="card-head"><h3>Session load · rolling averages</h3><span class="muted small">Daily session-RPE load with 7- and 28-day daily averages</span></div><div class="chart-box"><canvas id="ch-wl-roll"></canvas></div></div>
    <div class="card span-6" data-sec="wl-next"><div class="card-head"><h3>Lifting vs next day</h3><span class="muted small">His own data so far</span></div><div id="wl-next"></div></div>
    <div class="card span-6" data-sec="wl-lwi"><div class="card-head"><h3>Lifting Workload Index <span class="badge b-exp">Experimental</span></h3></div>
      <label class="chk"><input type="checkbox" id="lwi-show" ${cfg.show ? 'checked' : ''}> Show the experimental index</label>
      <div id="lwi-body"></div>
    </div>
  </div>`;
  $$('#wl-period button').forEach(b => b.onclick = () => { S.wlPeriod = b.dataset.p; renderWorkload(date); });
  setupCollapse($('#lift-body'));

  // effort split
  const eff = { 'very-close': 0, near: 0, moderate: 0, lower: 0, unknown: 0 };
  ANALYSES.filter(a => a.date >= range[0] && a.date <= range[1]).forEach(a => { for (const k in eff) eff[k] += a.effort[k]; });
  const totE = Object.values(eff).reduce((s, x) => s + x, 0) || 1;
  const effCol = { 'very-close': C.stitch, near: C.gold, moderate: C.teal, lower: C.sky, unknown: 'rgba(143,163,191,.35)' };
  const effLbl = { 'very-close': '0–1 RIR', near: '2–3 RIR', moderate: '4–5 RIR', lower: '6+ RIR', unknown: 'no RPE' };
  $('#wl-effort').innerHTML = `<div class="stackbar">${Object.entries(eff).map(([k, v]) => v ? `<i style="width:${v / totE * 100}%;background:${effCol[k]}" title="${effLbl[k]}: ${v}"></i>` : '').join('')}</div><div class="legend">${Object.entries(eff).map(([k, v]) => `<span><i style="background:${effCol[k]}"></i>${effLbl[k]} · ${v}</span>`).join('')}</div>`;

  // weekly charts
  const wl = weeks.map(w => short(w.from));
  chart('ch-wl-weeks', { data: { labels: wl, datasets: [
    { type: 'bar', label: 'Upper hard sets', data: weeks.map(w => w.regions.upper.hardDirectSets), backgroundColor: C.sky, stack: 'h' },
    { type: 'bar', label: 'Lower hard sets', data: weeks.map(w => w.regions.lower.hardDirectSets), backgroundColor: C.gold, stack: 'h2' },
    { type: 'bar', label: 'Trunk hard sets', data: weeks.map(w => w.regions.trunk.hardDirectSets), backgroundColor: C.teal, stack: 'h3' },
    { type: 'line', label: 'Session load (AU)', data: weeks.map(w => w.sessionLoadDays ? w.sessionLoad : null), borderColor: C.stitch, backgroundColor: C.stitch, yAxisID: 'y1', pointRadius: 4, borderWidth: 2, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'hard sets' }, beginAtZero: true }, y1: { position: 'right', grid: { display: false }, beginAtZero: true, title: { display: true, text: 'AU' } } } } });
  chart('ch-wl-vol', { type: 'bar', data: { labels: wl, datasets: [
    { label: 'Upper', data: weeks.map(w => w.volume.upper), backgroundColor: C.sky, stack: 'v' },
    { label: 'Lower', data: weeks.map(w => w.volume.lower), backgroundColor: C.gold, stack: 'v' },
    { label: 'Trunk', data: weeks.map(w => w.volume.trunk), backgroundColor: C.teal, stack: 'v' },
    { label: 'Total-body', data: weeks.map(w => w.volume.totalBody), backgroundColor: C.stitch, stack: 'v' },
  ]}, options: { scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: 'lb' } } } } });
  chart('ch-wl-exp', { type: 'bar', data: { labels: wl, datasets: [
    { label: '≥80% 1RM', data: weeks.map(w => w.counts.highIntensitySets || 0), backgroundColor: C.stitch },
    { label: 'Explosive', data: weeks.map(w => w.counts.explosiveSets || 0), backgroundColor: C.gold },
    { label: 'Axial', data: weeks.map(w => w.counts.axialSets || 0), backgroundColor: C.sky },
  ]}, options: { scales: { y: { beginAtZero: true, title: { display: true, text: 'sets' } } } } });
  // rolling session load over 56 days
  const days = Array.from({ length: 56 }, (_, i) => addDays(date, i - 55));
  const loadOf = d => { const a = analysisOn(d); return a && a.session.load != null ? a.session.load : 0; };
  const daily = days.map(loadOf);
  const roll = n => days.map((d, i) => { const w = daily.slice(Math.max(0, i - n + 1), i + 1); return w.length === n || i >= n - 1 ? Math.round(w.reduce((s, x) => s + x, 0) / n) : null; });
  chart('ch-wl-roll', { data: { labels: days.map(short), datasets: [
    { type: 'bar', label: 'Session load', data: daily.map(x => x || null), backgroundColor: 'rgba(255,205,0,.45)', borderRadius: 4 },
    { type: 'line', label: '7-day daily avg', data: roll(7), borderColor: C.gold, borderWidth: 3, pointRadius: 0, spanGaps: true },
    { type: 'line', label: '28-day daily avg', data: days.map((d, i) => i >= 27 ? Math.round(daily.slice(i - 27, i + 1).reduce((s, x) => s + x, 0) / 28) : null), borderColor: C.teal, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, title: { display: true, text: 'AU' } } } } });

  // lifting vs next day (lag 1)
  const xs = ['liftHard', 'liftVol', 'liftSessLoad', 'liftExpl', 'liftHiInt'].map(k => FK[k]);
  const ys = ['soreness', 'feel', 'armFeel', 'energy', 'recovery', 'hrv'].map(k => FK[k]);
  const rowsN = [];
  for (const fx of xs) for (const fy of ys) { const p = pairs(fx, fy, 1), pr = pearson(p); rowsN.push({ fx, fy, n: p.length, r: pr ? pr.r : null }); }
  const usable = rowsN.filter(x => x.r != null && x.n >= 5).sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
  $('#wl-next').innerHTML = usable.length ? `<table class="recipe"><thead><tr><th>Lifting (day before)</th><th>Next day</th><th>r</th><th>days</th></tr></thead><tbody>${usable.slice(0, 8).map(x => `<tr><td>${esc(x.fx.label)}</td><td>${esc(x.fy.label)}</td><td style="color:${x.r >= 0 ? C.gold : C.sky};font-weight:700">${x.r > 0 ? '+' : ''}${x.r.toFixed(2)}</td><td class="muted">${x.n}</td></tr>`).join('')}</tbody></table><p class="muted small" style="margin-bottom:0">Correlation, not cause. Under ~20 days, treat as hints. Explore any pair on the Insights page with “Day before”.</p>`
    : `<div class="muted small">Needs at least 5 lifting days followed by a day with soreness, feel, recovery or HRV logged. ${ANALYSES.length} lifting day${ANALYSES.length === 1 ? '' : 's'} so far.</div>`;

  // experimental composite
  const drawLwi = () => {
    const c = (Store.local['cfg:lwi'] && !Store.local['cfg:lwi']._gone) ? Store.local['cfg:lwi'] : { show: false, weights: WE.DEFAULT_WEIGHTS };
    if (!c.show) { $('#lwi-body').innerHTML = '<p class="muted small">A single number comparing a session with his own recent sessions. Off by default because it is not validated. Not a measure of fatigue or CNS stress.</p>'; return; }
    const comp = analysisOn(date) && analysisOn(date).composite;
    const NAMES = { muscular: 'Hard sets', external: 'Volume load', internal: 'Session load', intensity: 'High-intensity + explosive sets' };
    $('#lwi-body').innerHTML = `
      <div style="display:flex;align-items:baseline;gap:10px;margin:8px 0"><div class="r-badge" style="color:var(--gold)">${comp && comp.value != null ? (comp.value > 0 ? '+' : '') + comp.value.toFixed(2) : '—'}</div><div class="muted small">${short(date)} · 0 = his typical session; +1 ≈ one SD above</div></div>
      ${comp ? `<table class="recipe"><tbody>${Object.entries(comp.components).map(([k, z]) => `<tr><td>${NAMES[k]}</td><td>${z == null ? '<span class="muted">not enough history</span>' : (z > 0 ? '+' : '') + z.toFixed(2)}</td><td style="width:42%"><input type="range" min="0" max="3" step="0.5" value="${c.weights[k] ?? 1}" data-w="${k}" aria-label="Weight for ${NAMES[k]}"></td><td class="muted small">w ${c.weights[k] ?? 1}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">No session on this day.</div>'}
      <p class="muted small" style="margin-bottom:0">Weighted mean of z-scores against his previous lifting days in the last 28 days (needs 6+). Only change the weights after the “Lifting vs next day” table shows a real relationship.</p>`;
    $$('#lwi-body [data-w]').forEach(inp => inp.onchange = () => {
      const c2 = Object.assign({ show: true, weights: Object.assign({}, WE.DEFAULT_WEIGHTS) }, strip(Store.local['cfg:lwi'] || {}));
      c2.weights = Object.assign({}, c2.weights, { [inp.dataset.w]: +inp.value });
      Store.local['cfg:lwi'] = Object.assign(c2, { _u: Date.now() }); Store.save(); Sync.queue(['cfg:lwi']); drawLwi();
    });
  };
  $('#lwi-show').onchange = e => { const c2 = Object.assign({ weights: Object.assign({}, WE.DEFAULT_WEIGHTS) }, strip(Store.local['cfg:lwi'] || {}), { show: e.target.checked }); Store.local['cfg:lwi'] = Object.assign(c2, { _u: Date.now() }); Store.save(); Sync.queue(['cfg:lwi']); drawLwi(); };
  drawLwi();
}

/* ---------- EXERCISES (database + classification review) ---------- */
function renderExercises() {
  Ex.ensure(Store.rows.flatMap(r => (r.lifts || []).map(x => x.n)));
  const used = new Map();
  for (const r of Store.rows) for (const x of r.lifts || []) { const e = Ex.resolve(x.n, x.id); used.set(e.id, (used.get(e.id) || 0) + 1); }
  const q = (S.exQ || '').toLowerCase(), F = S.exF || 'used';
  const list = Ex.all().filter(e => {
    const src = (e.classification || {}).source || '';
    if (F === 'used' && !used.has(e.id)) return false;
    if (F === 'custom' && e.id in Ex.libById) return false;
    if (F === 'review' && !(((e.classification || {}).confidence || 0) < 0.6 || ((e.classification || {}).questions || []).length || src === 'rules')) return false;
    return !q || (e.name + ' ' + (e.aliases || []).join(' ') + ' ' + e.pattern).toLowerCase().includes(q);
  }).sort((a, b) => (used.get(b.id) || 0) - (used.get(a.id) || 0) || a.name.localeCompare(b.name));
  $('#lift-body').innerHTML = `
  <div class="entry-layout">
    <div>
      <div class="toolbar">
        <input class="input" id="ex-q" placeholder="Search exercises…" value="${esc(S.exQ || '')}" style="flex:1;min-width:180px">
        <div class="seg" id="ex-f">${[['used', 'Used'], ['all', 'All'], ['custom', 'Custom'], ['review', 'Needs review']].map(([k, l]) => `<button data-f="${k}" class="${F === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <button class="btn" id="ex-new">＋ New</button>
      </div>
      <div class="card" style="padding:0">${list.length ? list.map(e => { const c = e.classification || {}; return `<div class="ex-row ${S.exEdit === e.id ? 'on' : ''}" data-id="${esc(e.id)}">
        <div><b>${esc(e.name)}</b><div class="muted small">${esc(e.pattern)} · ${esc(e.category)} · ${esc(e.equipment)}${e.unilateral ? ' · unilateral' : ''}${e.explosive ? ' · explosive' : ''}</div><div class="small">Primary: ${esc(musList(e.primary))}${e.secondary && e.secondary.length ? ` <span class="muted">· Secondary: ${esc(musList(e.secondary))}</span>` : ''}</div></div>
        <div class="ex-meta">${confChip(c.confidence, c.source)}<span class="src">${esc(srcLabel(c.source))}${e.overridden && e.overridden.length ? ' · edited' : ''}</span>${used.get(e.id) ? `<span class="muted small">${used.get(e.id)}× logged</span>` : ''}</div>
      </div>`; }).join('') : '<div class="empty">No exercises match.</div>'}</div>
    </div>
    <div class="sticky-panel" id="ex-panel"></div>
  </div>`;
  $('#ex-q').oninput = e => { S.exQ = e.target.value; const p = e.target.selectionStart; renderExercises(); const i = $('#ex-q'); i.focus(); i.setSelectionRange(p, p); };
  $$('#ex-f button').forEach(b => b.onclick = () => { S.exF = b.dataset.f; renderExercises(); });
  $$('.ex-row').forEach(r => r.onclick = () => { S.exEdit = r.dataset.id; S.exNew = null; renderExercises(); if (window.innerWidth <= 1100) $('#ex-panel').scrollIntoView({ behavior: 'smooth' }); });
  $('#ex-new').onclick = () => { S.exEdit = null; S.exNew = { name: '', description: '', result: null }; renderExercises(); $('#ex-panel').scrollIntoView({ behavior: 'smooth' }); };
  if (S.exNew) renderNewExercise(); else if (S.exEdit) renderExerciseEditor(S.exEdit);
  else $('#ex-panel').innerHTML = `<div class="card"><h3>How classification works</h3><p class="small">Each exercise lists the muscles it trains <b>directly</b> (primary) and <b>indirectly</b> (secondary). Those lists turn sets into per-muscle counts. Exercises come from:</p><ul class="small" style="padding-left:18px"><li><b>Library</b>: curated entries, including every exercise he has logged.</li><li><b>Auto (rules)</b>: instant keyword reading of a new name, with a confidence level.</li><li><b>Auto (AI)</b>: Claude reads names the rules are unsure about, explains its reading and asks if unclear.</li><li><b>Edited</b>: changed by hand. The original automatic version is always kept.</li></ul><p class="small muted">Tap any exercise to review or correct it.</p></div>`;
}

function readForm(e) {
  const g = id => $('#ef-' + id);
  const out = { name: g('name').value.trim() || e.name, aliases: g('aliases').value.split(',').map(s => s.trim()).filter(Boolean),
    pattern: g('pattern').value, category: g('category').value, equipment: g('equipment').value, contraction: g('contraction').value, rom: g('rom').value,
    stability: g('stability').value, impact: g('impact').value, bwLoad: Math.max(0, Math.min(1, +g('bwLoad').value || 0)) };
  for (const k of ['unilateral', 'axial', 'explosive', 'compound', 'loadComparable']) out[k] = g(k).checked;
  for (const k of ['primary', 'secondary', 'stabilizers']) out[k] = $$(`.mus-pick[data-k="${k}"] .chip.on`).map(b => b.dataset.m);
  out.secondary = out.secondary.filter(m => !out.primary.includes(m));
  const t = +g('1rm').value; out.oneRm = t ? { tested: t, testedDate: g('1rmdate').value || todayIso(), unit: 'lb' } : null;
  return out;
}

/* ================= THROWING WORKLOAD =================

const PULSE_FIELDS = [['workload', 'One Day Workload'], ['totalThrows', 'Total throws'], ['highEffort', 'High-effort throws'], ['torque', 'Avg torque (Nm)'], ['torqueMax', 'Max torque (Nm)'], ['armSpeedAvg', 'Avg arm speed'], ['armSpeedMax', 'Max arm speed'], ['pulseArmHealth', 'Arm Health survey (1–10)']];

  const gThrows = (d, g) => (Store.byDate[d] && Store.byDate[d].throwActs || []).filter(a => (a.type === 'custom' ? ((twCustom()[a.customId] || {}).group || 'other') : (TT.ACTIVITIES.find(x => x.id === a.type) || {}).group) === g).reduce((s, a) => s + (+a.throws || 0), 0) || null;

  const vctx = VELO_CTX.map(([k, l, a, m]) => [l, veloSessions(k, a, m)]).filter(([, s]) => s.length);

  const ad = Store.rows.filter(r => r.date > addDays(date, -56) && r.date <= date && ['armHealth', 'readiness', 'elbow', 'shoulder', 'armSore', 'armFatigue'].some(k => r[k] != null));
  chart('ch-tw-arm', { type: 'line', data: { labels: ad.map(r => short(r.date)), datasets: [

    lineDs('Soreness', ad.map(r => r.armSore ?? null), C.gold, { pointRadius: 2, borderDash: [4, 4] }), lineDs('Fatigue', ad.map(r => r.armFatigue ?? null), C.teal, { pointRadius: 2, borderDash: [4, 4] }) ]},
    options: { interaction: { mode: 'index', intersect: false }, scales: { y: { min: 0, max: 10 } } } });

  // workload vs next-day response (lag 1) and weekly workload vs weekly symptoms
  const xs = ['twFinal', 'twHigh'].map(k => FK[k]), ys = ['elbow', 'shoulder', 'armSore', 'armFatigue', 'readiness', 'armHealth'].map(k => FK[k]);
  const res = []; for (const fx of xs) for (const fy of ys) { const p = pairs(fx, fy, 1), pr = pearson(p); res.push({ fx, fy, n: p.length, r: pr ? pr.r : null }); }
  const weeks = []; let ws = addDays(date, -6); for (let i = 0; i < 12; i++) { const w = TT.rolling(R, addDays(date, -7 * i), 7); const sx = Store.rows.filter(r => r.date >= w.from && r.date <= w.to && r.elbow != null).map(r => r.elbow); if (w.knownDays && sx.length) weeks.push({ x: w.total, y: mean(sx) }); }

/* ---------- MODEL ACCURACY ---------- */

  const entryPairs = Store.rows.filter(r => r.workload != null && r.twCalc && r.twCalc.estimatedPtw != null).map(r => ({ date: r.date, est: r.twCalc.estimatedPtw, act: r.workload, ver: r.twCalc.modelVersion }));
  $('#tw-body').innerHTML = `
  <div class="grid charts">
    <div class="card span-12"><div class="card-head"><h3>${STG[m.stage][0]}</h3><span class="badge ${m.stage === 'established' ? 'b-est' : m.stage === 'developing' ? 'b-evi' : 'b-exp'}">${m.stage}</span></div>
      <p class="small" style="margin-top:0">${STG[m.stage][1]}</p>
      <div class="grid kpis" style="margin-bottom:0">
        <div class="card kpi"><div class="kpi-lbl">Calibration days</div><div class="kpi-val">${m.nCalibration}</div><div class="kpi-sub">Pulse + activities on the same day${pulseNoActs ? ` · ${pulseNoActs} Pulse day(s) lack activity detail` : ''}</div></div>
        <div class="card kpi"><div class="kpi-lbl">Out-of-sample MAE</div><div class="kpi-val">${cv ? fmtNum(cv.mae) : '—'}</div><div class="kpi-sub">${cv ? `${m.cv.primary} · ${cv.n} unseen days` : 'needs 4+ calibration days'}</div></div>
        <div class="card kpi"><div class="kpi-lbl">Out-of-sample MAPE</div><div class="kpi-val">${cv && cv.mape != null ? fmtNum(cv.mape) + '%' : '—'}</div><div class="kpi-sub">${cv ? `RMSE ${fmtNum(cv.rmse)} · bias ${cv.bias > 0 ? '+' : ''}${fmtNum(cv.bias)}` : ''}</div></div>
        <div class="card kpi"><div class="kpi-lbl">Model version</div><div class="kpi-val" style="font-size:15px;word-break:break-all">${esc(m.version)}</div><div class="kpi-sub">${esc(TT.FEATURE_SETS[m.featureSet].label)}${m.alpha ? ` · α ${m.alpha}` : ''}${m.refV ? ` · ref velo ${m.refV}` : ''}</div></div>
      </div>
    </div>

function toCSV(rows) {
  if (!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const q = v => { const s = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [keys.join(',')].concat(rows.map(r => keys.map(k => q(r[k])).join(','))).join('\n');
}
function throwExport() {
  const days = [], activities = [];
  for (const r of Store.rows) {
    const res = TW.resolved[r.date]; if (!res) continue;
    if (res.mode === 'missing_data' && r.throw !== true) continue;
    const acts = (r.throwActs || []).filter(a => +a.throws > 0);
    const radarN = acts.reduce((s, a) => s + (+a.radarN || 0), 0), tot = acts.reduce((s, a) => s + (+a.throws || 0), 0);
    days.push({ date: r.date, measurement_mode: res.mode, pulse_one_day_workload: r.workload ?? null, pulse_total_throws: r.totalThrows ?? null, pulse_average_torque: r.torque ?? null, pulse_max_torque: r.torqueMax ?? null,
      pulse_high_effort_throws: r.highEffort ?? null, pulse_average_arm_speed: r.armSpeedAvg ?? null, pulse_max_arm_speed: r.armSpeedMax ?? null, pulse_arm_health: r.pulseArmHealth ?? null,
      estimated_workload: res.estimatedPtw ?? null, final_ptw: res.finalPtw, model_version: res.modelVersion, confidence: res.confidence ? res.confidence.level : null, confidence_interval: res.confidence ? res.confidence.interval : null,
      prediction_error: res.predictionError ?? null, percent_error: res.percentError ?? null, override: res.override || null, recorded_at_entry: r.twCalc || null,
      total_throws: res.throws, radar_coverage: tot ? Math.round(radarN / tot * 1000) / 10 : null, arm_health: r.armHealth ?? null, elbow_discomfort: r.elbow ?? null, shoulder_discomfort: r.shoulder ?? null,
      arm_soreness: r.armSore ?? null, arm_fatigue: r.armFatigue ?? null, arm_stiffness: r.armStiff ?? null, readiness: r.readiness ?? null, symptoms_during: r.sxDuring || '', symptoms_after: r.sxAfter || '',
      next_morning_response: r.nextMorning || '', notes: r.notes || '' });
    acts.forEach(a => activities.push({ date: r.date, activity_type: a.type === 'custom' ? 'custom:' + actLabel(a) : a.type, throw_count: +a.throws, effort_category: a.effort, ball_weight_grams: +a.ballG || 142,
      distance_feet: a.distFt ?? null, average_velocity_mph: a.avgV ?? null, maximum_velocity_mph: a.maxV ?? null, radar_measured_throws: a.radarN ?? null, radar_readings: a.readings || '', notes: a.notes || '' }));
  }
  return { format: 'triton-throwing/1', exportedAt: new Date().toISOString(), engine: { engineVersion: TT.ENGINE_VERSION, specVersion: TT.SPEC_VERSION }, model: TW.model,
    modelHistory: (cfgGet('twmodels') || {}).versions || [], customActivities: twCustom(), athlete: { name: 'Branden Jackel', throws: 'L' }, days, activities };
}
function importThrowing(text) {
  const j = JSON.parse(text); if (j.format !== 'triton-throwing/1') throw new Error('format');
  const now = Date.now(), keys = [], byDate = {};
  for (const a of j.activities || []) (byDate[a.date] = byDate[a.date] || []).push(a);
  for (const d of j.days || []) {
    const base = Store.edited(d.date) ? Object.assign({}, Store.local[d.date]) : { date: d.date };
    for (const k of Object.keys(base)) if (k[0] === '_') delete base[k];
    const map = { workload: 'pulse_one_day_workload', totalThrows: 'pulse_total_throws', torque: 'pulse_average_torque', torqueMax: 'pulse_max_torque', highEffort: 'pulse_high_effort_throws', armSpeedAvg: 'pulse_average_arm_speed', armSpeedMax: 'pulse_max_arm_speed', pulseArmHealth: 'pulse_arm_health',
      armHealth: 'arm_health', elbow: 'elbow_discomfort', shoulder: 'shoulder_discomfort', armSore: 'arm_soreness', armFatigue: 'arm_fatigue', armStiff: 'arm_stiffness', readiness: 'readiness' };
    for (const [k, src] of Object.entries(map)) if (d[src] != null) base[k] = d[src];
    if (d.symptoms_during) base.sxDuring = d.symptoms_during; if (d.symptoms_after) base.sxAfter = d.symptoms_after; if (d.next_morning_response) base.nextMorning = d.next_morning_response;
    const acts = (byDate[d.date] || []).map(a => { const custom = String(a.activity_type).startsWith('custom:'); const o = { type: custom ? 'custom' : a.activity_type, throws: +a.throw_count, effort: a.effort_category, ballG: +a.ball_weight_grams || 142 }; if (custom) o.customLabel = a.activity_type.slice(7); for (const [k, s] of [['distFt', 'distance_feet'], ['avgV', 'average_velocity_mph'], ['maxV', 'maximum_velocity_mph'], ['radarN', 'radar_measured_throws']]) if (a[s] != null) o[k] = +a[s]; if (a.radar_readings) o.readings = a.radar_readings; if (a.notes) o.notes = a.notes; return o; });
    if (acts.length) base.throwActs = acts;
    if (d.measurement_mode === 'rest_day') base.throw = false; else if (acts.length || d.pulse_one_day_workload != null) base.throw = true;
    if (d.override) base.twOverride = d.override;
    if (d.recorded_at_entry) base.twCalc = d.recorded_at_entry;
    Store.local[d.date] = Object.assign(base, { _u: now, _updated: new Date(now).toISOString() }); keys.push(d.date);
  }
  Store.save(); Sync.queue(keys); sideStats(); toast(`Imported ${(j.days || []).length} days`); RENDER.throwing();
}

function importCSV(file) {
  file.text().then(text => {
    const { records, unmatched } = csvToRecords(text);
    const dates = Object.keys(records).sort();
    if (!dates.length) { $('#import-result').innerHTML = '<div class="callout">No dated rows found. Make sure the first column is “Date”.</div>'; return; }
    let added = 0, updated = 0;
    const now = Date.now();
    for (const d of dates) {
      const had = !!Store.byDate[d];
      const base = Store.edited(d) ? Store.local[d] : {};
      Store.local[d] = Object.assign({}, base, records[d], { _updated: new Date(now).toISOString(), _u: now, _src: file.name });
      delete Store.deleted[d];
      had ? updated++ : added++;
    }
    Store.save(); Sync.queue(dates); sideStats();
    $('#import-result').innerHTML = `<div class="callout">Imported <b>${dates.length}</b> days from <b>${esc(file.name)}</b> (${short(dates[0])} – ${short(dates[dates.length-1])}): ${added} new, ${updated} updated.${unmatched.length ? `<br><span class="muted small">Columns not recognised (skipped): ${unmatched.map(esc).join(', ')}</span>` : ''}</div>`;
    toast('Import complete');
  });
}

$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#burger').onclick = e => { e.stopPropagation(); setMenu(!$('.side').classList.contains('open')); };
document.addEventListener('click', e => { if (!e.target.closest('.side')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
const start = (location.hash || '').slice(1);
go(RENDER[start] ? start : 'dash');
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (RENDER[v] && v !== S.view) go(v); });
// pull other devices' entries on open, when the app comes back to the front, when back online, and every minute
Sync.sync(true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.sync(true); });
window.addEventListener('online', () => Sync.sync(true));
setInterval(() => { if (document.visibilityState === 'visible') Sync.sync(true); }, 60000);

</script>
</body>
</html>
