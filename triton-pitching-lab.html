<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triton Lab">
<link rel="preload" as="image" href="bj-hero.jpg" media="(min-width: 821px)">
<link rel="preload" as="image" href="bj-hero-m.jpg" media="(max-width: 820px)">
<title>Triton Pitching Lab</title>
<link rel="apple-touch-icon" href="bj-icon-180.png">
<link rel="manifest" href="bj-manifest.webmanifest">
<meta name="description" content="Brandon Jackel pitching performance, recovery and arm-care dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#182B49; --navy-2:#0F1E36; --navy-3:#0A1528; --ink:#081120;
  --gold:#FFCD00; --gold-2:#C69214; --blue:#00629B; --sky:#4FA3E3; --teal:#00C6D7;
  --stitch:#E0544B; --green:#3DDC97; --amber:#FFB547; --red:#FF6B6B;
  --text:#EAF0F8; --muted:#8FA3BF; --line:rgba(143,163,191,.16); --card:#12233F; --card-2:#162A4A;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand-title,.kpi-val,.big{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em}
h1{font-size:34px;margin:0;font-weight:800;text-transform:uppercase}
h2{font-size:22px;margin:0 0 4px;font-weight:700;text-transform:uppercase}
h3{font-size:17px;margin:0;font-weight:700;text-transform:uppercase;color:var(--gold)}
a{color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-3) 100%);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,205,0,.25)}
.brand-mark svg{width:30px;height:30px}
.brand-title{font-size:20px;font-weight:800;text-transform:uppercase;line-height:1}
.brand-sub{color:var(--gold);font-size:12px;font-weight:600;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav button.active{background:rgba(255,205,0,.12);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:18px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
#side-stats{font-size:12px;color:var(--text)}

.main{flex:1;min-width:0;padding:24px 28px 60px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:260px;background:var(--navy) url('bj-hero.jpg') 78% 35%/cover no-repeat;display:flex;align-items:flex-end;margin-bottom:18px;border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,17,32,.95) 0%,rgba(8,17,32,.7) 45%,rgba(8,17,32,.15) 100%)}
.hero-inner{position:relative;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;width:100%;flex-wrap:wrap}
.eyebrow{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:46px;line-height:1;margin:6px 0}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hero-stats{display:flex;gap:22px}
.hero-stat .big{font-size:40px;font-weight:800;color:var(--gold);line-height:1}
.hero-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kpi .kpi-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.kpi .kpi-val{font-size:34px;font-weight:800;line-height:1.05;margin-top:6px}
.kpi .kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.charts{grid-template-columns:repeat(12,1fr)}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}

/* readiness ring */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:76px;height:76px;flex:0 0 76px}

/* segmented */
.seg{display:inline-flex;background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--navy)}

/* inputs */
.input,select.input,textarea.input{background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,0,.15)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:700;background:var(--gold);color:var(--navy);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,107,107,.4)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,205,0,.08)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
label.chk input{accent-color:var(--gold)}

/* table */
.table-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.data{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
table.data th{position:sticky;top:0;background:var(--navy);z-index:2;cursor:pointer;user-select:none;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
table.data th.grp{top:0;color:var(--gold);text-align:left;cursor:default;border-bottom:none}
table.data thead tr:nth-child(2) th{top:31px}
table.data th:hover{color:var(--text)}
table.data th.sorted{color:var(--gold)}
table.data td.txt,table.data th.txt{text-align:left}
table.data td.wrap{white-space:normal;min-width:180px;max-width:280px}
table.data .sticky{position:sticky;left:0;background:var(--navy-2);z-index:1;text-align:left}
table.data th.sticky{z-index:3;background:var(--navy)}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:rgba(255,205,0,.05)}
.p-top{background:rgba(255,205,0,.22)!important;color:#fff;font-weight:700}
.p-hi{background:rgba(61,220,151,.13)}
.p-lo{background:rgba(255,107,107,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dot.blue{background:var(--sky)}

/* bests */
.bests-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.best{display:flex;flex-direction:column;gap:6px}
.best .name{font-weight:700}
.best .big{font-size:30px;font-weight:800;color:var(--gold);line-height:1}
.best .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--navy-3);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.spark{width:100%;height:34px}
.group-title{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* insights */
.r-badge{font-family:"Barlow Condensed";font-size:40px;font-weight:800;line-height:1}
.drivers{display:flex;flex-direction:column;gap:6px}
.driver{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 54px 40px;align-items:center;gap:10px;font-size:12.5px;cursor:pointer;padding:3px 4px;border-radius:6px}
.driver:hover{background:rgba(255,255,255,.04)}
.driver .track{height:10px;background:var(--navy-3);border-radius:6px;position:relative}
.driver .track i{position:absolute;top:0;bottom:0;border-radius:6px}
.driver .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.recipe{width:100%;border-collapse:collapse;font-size:13px}
.recipe td,.recipe th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.recipe th{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:right}
.recipe td:first-child,.recipe th:first-child{text-align:left}
.callout{background:rgba(0,198,215,.08);border:1px solid rgba(0,198,215,.25);border-radius:12px;padding:12px 14px;font-size:13px}

/* form */
.entry-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
details.sec{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
details.sec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-size:20px;color:var(--gold)}
details.sec[open] summary::after{content:"–"}
details.sec .body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field.wide{grid-column:1/-1}
.field .unit{font-size:10px;color:var(--gold-2);margin-left:4px}
.toggle{display:flex;gap:6px}
.toggle button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.toggle button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.scale{display:flex;gap:4px}
.scale button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:7px 0;border-radius:8px;background:var(--navy-3);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.scale button.on{background:var(--gold);color:var(--navy)}
textarea.input{min-height:110px;resize:vertical}
.sticky-panel{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.entry-photo{background:var(--navy) url('bj-jersey.jpg') center 22%/cover no-repeat;min-height:300px;position:relative;overflow:hidden;padding:0}
.ins-pick{grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}

/* journal */
.j-card{display:flex;flex-direction:column;gap:8px}
.j-date{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase}
.j-text{white-space:pre-wrap}
.mini{display:inline-flex;gap:4px;align-items:center;background:var(--navy-3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.mini b{color:var(--gold)}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:0;max-height:320px;overflow:auto;padding-right:6px}
.tl{display:grid;grid-template-columns:70px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.tl .d{color:var(--muted);font-size:12px;text-align:right}
.tl .pin{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:4px;box-shadow:0 0 0 3px rgba(255,205,0,.15)}
.tl .pin.alt{background:var(--sky);box-shadow:0 0 0 3px rgba(79,163,227,.15)}

/* heatmap */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .c{width:13px;height:13px;border-radius:3px;background:var(--navy-3);position:relative}
.heat .c.lift::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sky)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.dropzone{border:2px dashed rgba(255,205,0,.35);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:.2s}
.dropzone.over,.dropzone:hover{background:rgba(255,205,0,.06);border-color:var(--gold)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--navy);font-weight:700;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;text-align:center;color:var(--muted)}

@media (max-width:1100px){
  .span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}
  .entry-layout{grid-template-columns:1fr}
  .sticky-panel{position:static}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{position:sticky;top:0;z-index:20;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;overflow:hidden}
  .brand-sub,.side-foot{display:none}
  .brand-title{font-size:16px}
  .brand-mark{width:34px;height:34px}.brand-mark svg{width:22px;height:22px}
  .nav{flex-direction:row;overflow-x:auto;flex:1}
  .nav button{padding:8px 10px;white-space:nowrap;font-size:13px}
  .nav button.active{box-shadow:inset 0 -2px 0 var(--gold)}
  .nav .ico{display:none}
  .brand > div:last-child{display:none}
  .main{padding:16px 16px 60px}
  .hero h1{font-size:34px}
  .hero-stat .big{font-size:30px}
  .driver{grid-template-columns:1fr 1.2fr 46px}
  .driver .n{display:none}
  .table-wrap{max-height:70vh}
  /* phone */
  .view.active{animation:none}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .side{padding-top:calc(10px + env(safe-area-inset-top))}
  .nav{-webkit-overflow-scrolling:touch;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .input,select.input,textarea.input{font-size:16px}
  .hero{background:#0A1528 url('bj-hero-m.jpg') center top/100% auto no-repeat;min-height:0;border-radius:16px;padding-top:min(68vw,300px)}
  .hero::before{background:linear-gradient(180deg,rgba(10,21,40,0) 0,rgba(10,21,40,0) min(45vw,190px),rgba(10,21,40,.94) min(80vw,340px),#0A1528 100%)}
  .hero-inner{padding:20px 18px}
  .hero-stats{gap:18px;width:100%;justify-content:space-between}
  .hero-stat .big{font-size:28px}
  .hero-tags .tag{font-size:11px}
  h1{font-size:28px} h2{font-size:20px}
  .page-head{margin-bottom:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis .kpi:first-child{grid-column:1/-1}
  .card{padding:13px}
  .kpi .kpi-val{font-size:26px}
  .kpi .kpi-sub{font-size:11px}
  .chart-box{height:220px}.chart-box.tall{height:260px}
  .ins-pick{grid-template-columns:1fr}
  .bests-grid{grid-template-columns:1fr}
  details.sec .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry-layout{display:flex;flex-direction:column}
  .entry-layout > *{width:100%;min-width:0}
  #v-entry .page-head .toolbar{width:100%}
  #v-entry #e-date{flex:1}
  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--ink) 70%,transparent)}
  #v-entry{padding-bottom:70px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .recipe{font-size:12px}
  table.data th,table.data td{padding:6px 8px}
}
@media (max-width:380px){ details.sec .body{grid-template-columns:1fr} .hero h1{font-size:30px} }

/* hamburger menu (phones) */
.burger,.cur-page{display:none}
.burger{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);flex-direction:column;justify-content:center;align-items:center;gap:5px;flex:0 0 44px;margin-left:auto;display:none}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:var(--gold);transition:transform .2s,opacity .2s}
.side.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.side.open .burger span:nth-child(2){opacity:0}
.side.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media (max-width:820px){
  .side{overflow:visible;justify-content:space-between}
  .brand{flex:1;min-width:0;padding:0}
  .brand > div:last-child{display:block;min-width:0}
  .brand-title{font-size:15px;white-space:nowrap}
  .cur-page{display:block;color:var(--gold);font-size:12px;font-weight:700;margin-top:3px}
  .burger{display:flex}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;overflow:visible;mask-image:none;-webkit-mask-image:none;background:var(--navy-2);border-bottom:1px solid var(--line);padding:8px 12px 16px;gap:2px;box-shadow:0 24px 50px rgba(0,0,0,.55)}
  .side.open .nav{display:flex;animation:drop .18s ease}
  .nav button{padding:14px;font-size:16px;white-space:normal}
  .nav .ico{display:inline-block}
  .nav button.active{box-shadow:inset 3px 0 0 var(--gold)}
}
@keyframes drop{from{transform:translateY(-6px)}to{transform:none}}
#top10{overflow-x:auto;-webkit-overflow-scrolling:touch}
#top10 .recipe{min-width:560px}

function parseCSV(text) {

      else cur += c;
    } else if (c === '"') q = true;

}

})();

const LS_KEY = 'triton-pitching-lab.v1';
const Store = {
  seed: {}, local: {}, deleted: {},
  load() {
    this.seed = csvToRecords(window.SEED_CSV || '').records;
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      this.local = s.local || {}; this.deleted = s.deleted || {};
    } catch (e) { this.local = {}; this.deleted = {}; }
    this.rebuild();
  },
  save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ local: this.local, deleted: this.deleted })); }
    catch (e) { toast('Could not save in this browser — export a backup!'); }
    this.rebuild();
  },
  rebuild() {
    const dates = new Set([...Object.keys(this.seed), ...Object.keys(this.local)]);
    const all = [];
    for (const d of dates) {
      if (this.deleted[d]) continue;
      const r = Object.assign({}, this.seed[d] || {}, this.local[d] || {}, { date: d });
      for (const k of Object.keys(r)) if (r[k] === null) delete r[k];
      all.push(r);
    }
    all.sort((a, b) => a.date < b.date ? -1 : 1);
    this.rows = all;
    this.byDate = Object.fromEntries(all.map(r => [r.date, r]));
    this.computeStats();
  },
  computeStats() {
    this.stats = {};
    for (const f of NUM_FIELDS) {
      const pts = this.rows.map(r => [r.date, nv(r, f)]).filter(p => p[1] != null);
      const vals = pts.map(p => p[1]);
      const score = v => f.dir === 'T1' ? -Math.abs(v - 1) : f.dir === -1 ? -v : v;
      const sorted = vals.map(score).sort((a, b) => a - b);

};

function readiness(date) {
  const r = Store.byDate[date]; if (!r) return null;
  const parts = [];
  if (r.recovery != null) parts.push(['Recovery', clamp(r.recovery, 0, 100), .4]);
  if (r.hrv != null) {
    const base = Store.rows.filter(x => x.date < date && x.date >= addDays(date, -30) && x.hrv != null).map(x => x.hrv);
    if (base.length >= 5) parts.push(['HRV vs 30-day', clamp(((r.hrv / mean(base)) - .7) / .5 * 100, 0, 100), .3]);
  }
  if (r.sleep != null) parts.push(['Sleep', clamp(r.sleep / 8 * 100, 0, 100), .2]);
  if (r.feel != null) parts.push(['How you feel', r.feel * 10, .2]);
  if (r.armFeel != null) parts.push(['Arm feel', r.armFeel * 10, .2]);
  if (!parts.length) return null;
  const w = parts.reduce((s, p) => s + p[2], 0);

  $$('#range-seg button').forEach(b => b.onclick = () => { S.range = +b.dataset.r; RENDER.dash(); });

  // timeline

  $('#timeline').innerHTML = notes.map(r => `<div class="tl"><div class="d">${short(r.date)}</div><div class="pin ${/ft|live|pen|bullpen|inning|first|throw|scrimmage/i.test(r.notes) ? '' : 'alt'}"></div><div>${esc(r.notes)}${r.throwing ? `<div class="muted small">${esc(r.throwing)}${r.location ? ' · ' + esc(r.location) : ''}</div>` : ''}</div></div>`).join('') || '<div class="muted">No notes yet.</div>';

  // HRV / recovery
  const hr = inRange;
  const roll = (arr, n) => arr.map((_, i) => { const w = arr.slice(Math.max(0, i-n+1), i+1).filter(x => x != null); return w.length ? mean(w) : null; });
  const hrvVals = hr.map(r => r.hrv ?? null);

  // sleep
  const sl = inRange.filter(r => r.sleep != null).slice(-Math.min(S.range, 60));
  chart('ch-sleep', { type: 'bar', data: { labels: sl.map(r => short(r.date)), datasets: [

    { label: 'REM', data: sl.map(r => r.rem ?? 0), backgroundColor: C.teal, stack: 's' },

  // arm care
  const ar = rows.filter(r => r.armScore != null || r.totalStrength != null);
  chart('ch-arm', { type: 'line', data: { labels: ar.map(r => short(r.date)), datasets: [
    lineDs('Arm Score %', ar.map(r => r.armScore ?? null), C.gold, { pointRadius: 3, borderWidth: 3 }),
    lineDs('Total strength (lb)', ar.map(r => r.totalStrength ?? null), C.sky, { yAxisID: 'y1', pointRadius: 2 }),

  chart('ch-bw', { type: 'line', data: { labels: bwr.map(r => short(r.date)), datasets: [
    lineDs('Bodyweight', bwv, 'rgba(79,163,227,.5)', { borderWidth: 1, pointRadius: 2 }),
    lineDs('7-day avg', roll(bwv, 7), C.gold, { borderWidth: 3 }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'lb' } }, x: { ticks: { maxTicksLimit: 8 } } } } });

  // live
  const lv = rows.filter(r => r.strikePct != null || r.livePitches != null);
  chart('ch-live', { data: { labels: lv.map(r => short(r.date)), datasets: [
    { type: 'bar', label: 'Live pitches', data: lv.map(r => r.livePitches ?? null), backgroundColor: 'rgba(0,98,155,.7)', borderRadius: 6, yAxisID: 'y1' },
    { type: 'line', label: 'Strike %', data: lv.map(r => r.strikePct ?? null), borderColor: C.gold, backgroundColor: C.gold, borderWidth: 3, pointRadius: 4, spanGaps: true },
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { min: 0, max: 100, title: { display: true, text: 'Strike %' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'pitches' } } } } });

  // power
  const pw = rows.filter(r => r.cmjFP != null || r.cmjCam != null || r.rsi != null);
  chart('ch-power', { type: 'line', data: { labels: pw.map(r => short(r.date)), datasets: [
    lineDs('CMJ force plates', pw.map(r => r.cmjFP ?? null), C.gold, { pointRadius: 3, borderWidth: 3 }),
    lineDs('CMJ camera', pw.map(r => r.cmjCam ?? null), C.sky, { pointRadius: 3 }),
    lineDs('RSI', pw.map(r => r.rsi ?? null), C.stitch, { pointRadius: 3, yAxisID: 'y1' }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { title: { display: true, text: 'CMJ' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'RSI' } } } } });

  // heatmap
  const start = fromIso(first); start.setDate(start.getDate() - start.getDay());
  const end = fromIso(last);
  let html = '', d = new Date(start);
  while (d <= end) {
    html += '<div class="col">';
    for (let i = 0; i < 7; i++) {
      const k = iso(d), r = Store.byDate[k];
      let bg = 'var(--navy-3)', cls = 'c';
      if (k < first || d > end) bg = 'transparent';
      else if (r?.throw) bg = (/pen|live|scrim|game|inning/i.test((r.throwing || '') + ' ' + (r.notes || '')) || r.pitches) ? C.gold : 'rgba(255,205,0,.45)';
      if (r?.lift) cls += ' lift';
      const tip = r ? `${longDate(k)}${r.throw ? ' · threw' + (r.throwing ? ': ' + r.throwing : '') : ''}${r.lift ? ' · lifted' : ''}${r.notes ? ' · ' + r.notes : ''}` : longDate(k);
      html += `<div class="${cls}" style="background:${bg}" title="${esc(tip)}"></div>`;
      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
  }
  $('#heat').innerHTML = html;
};

function logCols() {
  return FIELDS.filter(f => f.k !== 'date' && S.log.groups.has(f.g) && (f.t === 'long' || f.t === 'text' || f.t === 'range' || f.t === 'frac' || f.t === 'bool' || (Store.stats[f.k]?.n || 0) > 0 || Object.keys(Store.local).length));
}
function logRows() {
  const L = S.log; const q = L.q.toLowerCase();
  let rows = Store.rows.filter(r =>
    (!L.from || r.date >= L.from) && (!L.to || r.date <= L.to) &&
    (!L.throwOnly || r.throw) && (!L.liftOnly || r.lift) &&
    (!q || [r.notes, r.location, r.throwing, r.warmup, r.journal].join(' ').toLowerCase().includes(q)));
  const f = FK[L.sort];
  rows = rows.slice().sort((a, b) => {
    if (L.sort === 'date') return (a.date < b.date ? -1 : 1) * L.dir;
    const va = NUMERIC_T.has(f.t) || f.t === 'bool' ? nv(a, f) : a[f.k], vb = NUMERIC_T.has(f.t) || f.t === 'bool' ? nv(b, f) : b[f.k];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * L.dir;
  });
  return rows;
}
function drawLogTable() {
  const cols = logCols().filter(f => {
    // hide numeric columns with no data at all, unless they're in a small group
    if (NUMERIC_T.has(f.t)) return (Store.stats[f.k]?.n || 0) > 0;
    return Store.rows.some(r => r[f.k] != null && r[f.k] !== '');
  });
  const rows = logRows(); const L = S.log;
  const groupsInOrder = [];
  cols.forEach(f => { const last = groupsInOrder[groupsInOrder.length-1]; if (last && last.g === f.g) last.n++; else groupsInOrder.push({ g: f.g, n: 1 }); });
  const arrow = k => L.sort === k ? (L.dir > 0 ? ' ▲' : ' ▼') : '';
  let h = `<table class="data"><thead><tr><th class="grp sticky"></th>${groupsInOrder.map(g => `<th class="grp" colspan="${g.n}">${GROUPS[g.g]}</th>`).join('')}</tr>`;
  h += `<tr><th class="sticky txt ${L.sort === 'date' ? 'sorted' : ''}" data-k="date">Date${arrow('date')}</th>${cols.map(f => `<th data-k="${f.k}" class="${L.sort === f.k ? 'sorted' : ''} ${['text','long','range'].includes(f.t) ? 'txt' : ''}" title="${esc(f.label)}">${esc(f.label)}${f.u && f.t !== 'pct' ? ` <span style="text-transform:none;opacity:.6">${f.u}</span>` : ''}${arrow(f.k)}</th>`).join('')}</tr></thead><tbody>`;
  for (const r of rows) {
    h += `<tr data-d="${r.date}"><td class="sticky txt"><b>${short(r.date)}</b> <span class="muted small">${DOW[fromIso(r.date).getDay()].slice(0,3)} '${r.date.slice(2,4)}</span>${Store.local[r.date] ? ' <span class="dot" title="Edited in app"></span>' : ''}</td>`;
    for (const f of cols) {
      const v = r[f.k];
      let cls = '';
      if (NUMERIC_T.has(f.t) && v != null) { const p = Store.pctile(f, nv(r, f)); if (p != null) cls = p >= .9 ? 'p-top' : p >= .667 ? 'p-hi' : p <= .333 ? 'p-lo' : ''; }
      if (['text','range'].includes(f.t)) cls += ' txt';
      if (f.t === 'long' || f.k === 'notes' || f.k === 'warmup') cls += ' txt wrap';
      h += `<td class="${cls}">${v == null || v === '' ? '<span class="muted">·</span>' : esc(fmt(f, v))}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  $('#log-table').innerHTML = rows.length ? h : '<div class="empty">No days match these filters.</div>';
  $('#log-count').textContent = `${rows.length} of ${Store.rows.length} days · ${cols.length} columns`;
  $$('#log-table th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; if (L.sort === k) L.dir *= -1; else { L.sort = k; L.dir = k === 'date' ? -1 : -1; } drawLogTable(); });
  $$('#log-table tbody tr').forEach(tr => tr.onclick = () => go('entry', { date: tr.dataset.d }));
}

  </div>`;
  $$('#bests-chips .chip').forEach(c => c.onclick = () => { S.bestsGroup = c.dataset.g; RENDER.bests(); });
  $$('#v-bests .best').forEach(c => c.onclick = () => { $('#top-metric').value = c.dataset.k; drawTop10(); $('#top10').scrollIntoView({ behavior: 'smooth', block: 'center' }); });

};
function bestCard(f) {
  const s = Store.stats[f.k];
  const best = s.best, latest = s.latest;
  let pctOf = null;
  if (best && latest) {
    if (f.dir === 'T1') pctOf = 100 - Math.abs(latest[1] - 1) * 100;
    else if (f.dir === -1) pctOf = latest[1] ? best[1] / latest[1] * 100 : null;
    else pctOf = best[1] ? latest[1] / best[1] * 100 : null;
  }
  const isPB = best && latest && best[0] === latest[0];
  return `<div class="card best" data-k="${f.k}" style="cursor:pointer">
    <div class="row"><span class="name" style="color:var(--text)">${esc(f.label)}</span><span>${s.n} logged</span></div>
    <div class="big">${fmtStat(f, best?.[1])}${f.u && !['%','h'].includes(f.u) && f.t !== 'pct' ? `<small style="font-size:14px;color:var(--muted)"> ${f.u}</small>` : ''}</div>
    <div class="row"><span>Best · ${best ? short(best[0]) + " '" + best[0].slice(2,4) : '—'}${f.dir === -1 ? ' (lower is better)' : f.dir === 'T1' ? ' (closest to 1.0)' : ''}</span>${isPB ? '<span style="color:var(--gold);font-weight:700">★ Current PB</span>' : ''}</div>
    ${sparkSVG(s.pts.slice(-40).map(p => p[1]))}
    <div class="row"><span>Latest <b style="color:var(--text)">${fmtStat(f, latest?.[1])}</b> · ${latest ? short(latest[0]) : ''}</span><span>Avg ${fmtStat(f, s.mean)}</span></div>
    <div class="bar"><i style="width:${clamp(pctOf || 0, 0, 100)}%"></i></div>
    <div class="row"><span>${pctOf != null ? Math.round(pctOf) + '% of best' : ''}</span></div>
  </div>`;
}
function drawTop10() {

/* ================= INSIGHTS ================= */
function xValue(f, date, lag) {
  if (lag === 0) return nv(Store.byDate[date], f);
  if (lag === 1) return nv(Store.byDate[addDays(date, -1)], f);
  if (lag === 3) { const v = [1,2,3].map(i => nv(Store.byDate[addDays(date, -i)], f)).filter(x => x != null); return v.length ? mean(v) : null; }
  return null;
}
function pairs(fx, fy, lag) {
  const out = [];
  for (const r of Store.rows) {
    const y = nv(r, fy); if (y == null) continue;
    const x = xValue(fx, r.date, lag); if (x == null) continue;
    out.push({ x, y, d: r.date });
  }
  return out;
}
function pearson(p) {
  const n = p.length; if (n < 3) return null;
  const mx = mean(p.map(a => a.x)), my = mean(p.map(a => a.y));
  let sxy = 0, sxx = 0, syy = 0;
  for (const a of p) { sxy += (a.x-mx)*(a.y-my); sxx += (a.x-mx)**2; syy += (a.y-my)**2; }
  if (!sxx || !syy) return null;
  return { r: sxy / Math.sqrt(sxx*syy), slope: sxy / sxx, icpt: my - (sxy/sxx)*mx };
}
const strength = r => { const a = Math.abs(r); return a >= .7 ? 'very strong' : a >= .5 ? 'strong' : a >= .3 ? 'moderate' : a >= .15 ? 'weak' : 'little to no'; };
const lagLabel = l => l === 0 ? 'same day' : l === 1 ? 'the day before' : 'the 3 days before (avg)';
function metricOptions(sel, minN = 3) {
  const grouped = {};
  FIELDS.filter(f => (NUMERIC_T.has(f.t) || f.t === 'bool') && (f.t === 'bool' ? Store.rows.some(r => r[f.k] != null) : (Store.stats[f.k]?.n || 0) >= minN)).forEach(f => (grouped[f.g] = grouped[f.g] || []).push(f));
  return Object.entries(grouped).map(([g, fs]) => `<optgroup label="${GROUPS[g]}">${fs.map(f => `<option value="${f.k}" ${f.k === sel ? 'selected' : ''}>${esc(f.label)}${f.t === 'bool' ? ' (yes/no)' : ''}</option>`).join('')}</optgroup>`).join('');
}

function drawScatter() {
  const I = S.ins, fx = FK[I.x], fy = FK[I.y];
  const p = pairs(fx, fy, I.lag), pr = pearson(p);
  const xs = p.map(a => a.x);
  const line = pr ? [{ x: Math.min(...xs), y: pr.icpt + pr.slope * Math.min(...xs) }, { x: Math.max(...xs), y: pr.icpt + pr.slope * Math.max(...xs) }] : [];
  chart('ch-scatter', { type: 'scatter', data: { datasets: [
    { label: 'Days', data: p, backgroundColor: 'rgba(255,205,0,.75)', borderColor: C.gold, pointRadius: 5, pointHoverRadius: 7 },
    { type: 'line', label: 'Trend', data: line, borderColor: C.teal, borderWidth: 2, borderDash: [6,4], pointRadius: 0 },
  ]}, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw.d ? `${short(c.raw.d)}: ${fx.label} ${fmtStat(fx, c.raw.x)} → ${fy.label} ${fmtStat(fy, c.raw.y)}` : 'Trend' } } },
    scales: { x: { title: { display: true, text: `${fx.label} (${lagLabel(I.lag)})` }, ticks: { callback: v => fx.t === 'dur' ? fmtDur(v) : v } }, y: { title: { display: true, text: fy.label }, ticks: { callback: v => fy.t === 'dur' ? fmtDur(v) : v } } } } });
  const el = $('#ins-read');
  if (!pr) { el.innerHTML = `<div class="callout">Only <b>${p.length}</b> day(s) have both <b>${esc(fx.label)}</b> and <b>${esc(fy.label)}</b>. Need at least 3 to compare — keep logging both.</div>`; return; }
  const col = pr.r > 0 ? C.gold : C.sky;
  const dirWord = pr.r > 0 ? 'higher' : 'lower';
  const per = fx.t === 'dur' ? 'per extra hour' : fx.t === 'bool' ? 'on "yes" days' : `per +1 ${fx.u || 'unit'}`;
  el.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:12px"><div class="r-badge" style="color:${col}">${pr.r > 0 ? '+' : ''}${pr.r.toFixed(2)}</div><div class="muted">correlation (r) · ${p.length} days</div></div>
    <p><b>${strength(pr.r)[0].toUpperCase() + strength(pr.r).slice(1)}</b> relationship. When <b>${esc(fx.label)}</b> (${lagLabel(I.lag)}) is higher, <b>${esc(fy.label)}</b> tends to be <b style="color:${col}">${dirWord}</b>.</p>
    <p class="muted">Trend line: about <b style="color:var(--text)">${pr.slope > 0 ? '+' : ''}${fmtNum(pr.slope)}</b> ${esc(fy.u || '')} of ${esc(fy.label)} ${per}.</p>
    ${p.length < 10 ? `<div class="callout">Small sample (${p.length} days) — treat this as a hint, not a rule. It gets more reliable with every entry.</div>` : ''}
    <p class="muted small">Correlation shows what moves together, not what causes what. Use it to pick what to test next.</p>`;
}
function drawDrivers() {
  const I = S.ins, ft = FK[I.target];
  $('#drv-name').textContent = ft.label; $('#drv-lag').textContent = lagLabel(I.lag);
  const res = [];
  for (const f of FIELDS) {
    if (f.k === ft.k || !(NUMERIC_T.has(f.t) || f.t === 'bool')) continue;
    if (!I.same && f.g === ft.g) continue;
    const p = pairs(f, ft, I.lag); if (p.length < 6) continue;
    const pr = pearson(p); if (!pr) continue;
    res.push({ f, r: pr.r, n: p.length });
  }
  res.sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
  $('#drivers').innerHTML = res.slice(0, 16).map(x => `<div class="driver" data-k="${x.f.k}"><span>${esc(x.f.label)}</span><div class="track"><i style="${x.r >= 0 ? `left:50%;width:${Math.abs(x.r)*50}%;background:${C.gold}` : `right:50%;width:${Math.abs(x.r)*50}%;background:${C.sky}`}"></i></div><b style="text-align:right;color:${x.r >= 0 ? C.gold : C.sky}">${x.r > 0 ? '+' : ''}${x.r.toFixed(2)}</b><span class="n muted small">n${x.n}</span></div>`).join('') || '<div class="muted">Not enough overlapping days yet (need 6+).</div>';
  $$('#drivers .driver').forEach(d => d.onclick = () => { S.ins.x = d.dataset.k; S.ins.y = I.target; $('#ins-x').value = S.ins.x; $('#ins-y').value = S.ins.y; drawScatter(); $('#ch-scatter').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
}
function drawRecipe() {
  const I = S.ins, ft = FK[I.target], s = Store.stats[ft.k];
  const el = $('#recipe');
  if (!s || s.n < 8 || !ft.dir) { el.innerHTML = `<div class="callout">Pick an outcome with a clear "better" direction and at least 8 logged days. <b>${esc(ft.label)}</b> has ${s?.n || 0}.</div>`; return; }
  const scored = s.pts.map(p => ({ d: p[0], v: p[1], sc: s.score(p[1]) })).sort((a, b) => b.sc - a.sc);
  const cut = Math.max(2, Math.round(scored.length / 4));
  const best = new Set(scored.slice(0, cut).map(x => x.d));
  const rows = [];
  for (const f of FIELDS) {
    if (f.k === ft.k || !(NUMERIC_T.has(f.t))) continue;
    if (!I.same && f.g === ft.g) continue;
    const b = [], o = [];
    for (const p of scored) { const x = xValue(f, p.d, I.lag); if (x == null) continue; (best.has(p.d) ? b : o).push(x); }
    if (b.length < 3 || o.length < 3) continue;
    const all = b.concat(o), sdev = sd(all); if (!sdev) continue;
    const eff = (mean(b) - mean(o)) / sdev;
    rows.push({ f, mb: mean(b), mo: mean(o), eff, nb: b.length });
  }
  rows.sort((a, b) => Math.abs(b.eff) - Math.abs(a.eff));
  const top = rows.slice(0, 10);
  const threshold = scored[cut - 1].v;
  el.innerHTML = `
    <p class="muted small" style="margin-top:0">Best days = top ${cut} of ${scored.length} for <b style="color:var(--text)">${esc(ft.label)}</b> (${ft.dir === -1 ? '≤' : '≥'} ${fmtStat(ft, threshold)}). Inputs measured ${lagLabel(I.lag)}.</p>
    ${top.length ? `<table class="recipe"><thead><tr><th>Stat</th><th>Best days</th><th>Other days</th><th>Gap</th></tr></thead><tbody>
    ${top.map(x => `<tr><td>${esc(x.f.label)}</td><td style="color:var(--gold);font-weight:700">${fmtStat(x.f, x.mb)}</td><td class="muted">${fmtStat(x.f, x.mo)}</td><td style="color:${x.eff >= 0 ? C.gold : C.sky}">${x.eff >= 0 ? '▲' : '▼'} ${Math.abs(x.eff).toFixed(1)}σ</td></tr>`).join('')}
    </tbody></table>
    <div class="callout" style="margin-top:12px"><b>Aim for:</b> ${top.slice(0, 3).map(x => `${esc(x.f.label)} around <b>${fmtStat(x.f, x.mb)}</b>`).join(', ')} — that's what his best ${esc(ft.label)} days looked like.</div>` : '<div class="muted">Not enough overlapping data yet.</div>'}`;
}

  $$('#v-journal .j-card').forEach(c => c.onclick = () => go('entry', { date: c.dataset.d }));
  if (withFeel.length >= 2) chart('ch-feel', { type: 'line', data: { labels: withFeel.map(r => short(r.date)), datasets: [
    lineDs('Overall', withFeel.map(r => r.feel ?? null), C.gold, { pointRadius: 3, borderWidth: 3 }),
    lineDs('Arm', withFeel.map(r => r.armFeel ?? null), C.teal, { pointRadius: 3 }),
    lineDs('Energy', withFeel.map(r => r.energy ?? null), C.sky, { pointRadius: 2 }),
    lineDs('Soreness', withFeel.map(r => r.soreness ?? null), C.stitch, { pointRadius: 2, borderDash: [4,4] }),
  ]}, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { min: 0, max: 10 } } } });
};

/* ================= IMPORT / EXPORT ================= */
RENDER.data = function () {
  const n = Object.keys(Store.local).length;
  $('#v-data').innerHTML = `
  <div class="page-head"><div><h2>Import / Export</h2><p>Upload new spreadsheet exports, back everything up, or move the data to another device.</p></div></div>
  <div class="grid charts">
    <div class="card span-6">
      <div class="card-head"><h3>Upload a spreadsheet (CSV)</h3></div>
      <p class="muted" style="margin-top:0">Same columns as the “Data - 2026” sheet (File → Download → CSV in Google Sheets). Matching dates are updated, new dates are added, blank cells never wipe existing numbers.</p>
      <div class="dropzone" id="drop"><div style="font-size:28px">⇪</div><b>Drop a CSV here</b><div class="muted small">or click to choose a file</div><input type="file" id="file" accept=".csv,text/csv" hidden></div>
      <div id="import-result" style="margin-top:12px"></div>
    </div>
    <div class="card span-6">
      <div class="card-head"><h3>Export & back up</h3></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" id="x-csv">⇩ Download full data as CSV</button>
        <span class="muted small">Every day with every metric plus the wellness scores and journal — opens in Google Sheets / Excel and can be re-uploaded here.</span>
        <button class="btn ghost" id="x-json">⇩ Download app backup (.json)</button>
        <label class="btn ghost" style="justify-content:flex-start">⇧ Restore app backup<input type="file" id="x-restore" accept=".json,application/json" hidden></label>
        <span class="muted small">${n} day(s) edited or added in this browser.</span>
        ${n ? '<button class="btn danger" id="x-reset">Clear all in-app edits</button>' : ''}
      </div>
    </div>
    <div class="card span-12">
      <div class="card-head"><h3>What's tracked</h3><span class="muted small">${FIELDS.length} fields across ${Object.keys(GROUPS).length} categories</span></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${Object.entries(GROUPS).map(([g, l]) => `<div><div style="color:var(--gold);font-weight:700;margin-bottom:4px">${l}</div><div class="muted small">${FIELDS.filter(f => f.g === g && f.k !== 'date').map(f => `${esc(f.label)}${Store.stats[f.k] ? ` <span style="opacity:.6">(${Store.stats[f.k].n})</span>` : ''}`).join(' · ')}</div></div>`).join('')}</div>
    </div>
  </div>`;
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) importCSV(e.dataTransfer.files[0]); };
  file.onchange = () => file.files[0] && importCSV(file.files[0]);
  $('#x-csv').onclick = () => { download(`brandon-jackel-pitching-${todayIso()}.csv`, recordsToCSV(Store.rows)); toast('CSV downloaded'); };
  $('#x-json').onclick = () => { download(`triton-pitching-lab-backup-${todayIso()}.json`, JSON.stringify({ app: 'triton-pitching-lab', version: 1, exported: new Date().toISOString(), local: Store.local, deleted: Store.deleted }, null, 1), 'application/json'); toast('Backup downloaded'); };
  $('#x-restore').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const j = JSON.parse(t); if (!j.local) throw 0; Store.local = j.local; Store.deleted = j.deleted || {}; Store.save(); sideStats(); toast('Backup restored'); RENDER.data(); }).catch(() => toast('That file is not a Triton Pitching Lab backup'));
  };
  const rs = $('#x-reset');
  if (rs) rs.onclick = () => { if (confirm('Remove every edit and entry made in this browser? Spreadsheet data stays. Download a backup first if unsure.')) { Store.local = {}; Store.deleted = {}; Store.save(); sideStats(); toast('Cleared'); RENDER.data(); } };
};
function importCSV(file) {
  file.text().then(text => {
    const { records, unmatched } = csvToRecords(text);
    const dates = Object.keys(records).sort();
    if (!dates.length) { $('#import-result').innerHTML = '<div class="callout">No dated rows found. Make sure the first column is “Date”.</div>'; return; }
    let added = 0, updated = 0;
    for (const d of dates) {
      const had = !!Store.byDate[d];
      Store.local[d] = Object.assign({}, Store.local[d] || {}, records[d], { _updated: new Date().toISOString(), _src: file.name });
      delete Store.deleted[d];
      had ? updated++ : added++;
    }
    Store.save(); sideStats();
    $('#import-result').innerHTML = `<div class="callout">Imported <b>${dates.length}</b> days from <b>${esc(file.name)}</b> (${short(dates[0])} – ${short(dates[dates.length-1])}): ${added} new, ${updated} updated.${unmatched.length ? `<br><span class="muted small">Columns not recognised (skipped): ${unmatched.map(esc).join(', ')}</span>` : ''}</div>`;
    toast('Import complete');
  });
}

/* ---------------- boot ---------------- */
Store.load();
sideStats();
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#burger').onclick = e => { e.stopPropagation(); setMenu(!$('.side').classList.contains('open')); };
document.addEventListener('click', e => { if (!e.target.closest('.side')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
const start = (location.hash || '').slice(1);
go(RENDER[start] ? start : 'dash');
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (RENDER[v] && v !== S.view) go(v); });

</script>
</body>
</html>
