<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDLR Digital E-Card</title>
<style>
  :root{
    --bg:#0e1726; --panel:#142033; --panel2:#1b2a42; --line:#27374f;
    --text:#eef2f8; --muted:#94a3b8; --accent:#34d399;
    --header-h:54px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

  header{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b1220;border-bottom:1px solid var(--line);position:relative;z-index:30}
  .menu-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .menu-btn:active{transform:scale(.95)}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#0b1220;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .htitle{font-size:1rem;font-weight:700;line-height:1.1}
  .hsub{font-size:.72rem;color:var(--muted)}
  .current-pill{margin-left:auto;font-size:.72rem;color:var(--accent);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);padding:5px 10px;border-radius:999px;white-space:nowrap}

  .body{display:flex;height:calc(100% - var(--header-h));position:relative}
  aside{width:288px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;transition:transform .22s ease;z-index:20}
  .aside-title{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 16px 8px;font-weight:700}
  .date-group{border-bottom:1px solid var(--line)}
  .date-head{width:100%;text-align:left;background:none;border:0;color:var(--text);cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:600}
  .date-head:hover{background:var(--panel2)}
  .chev{margin-left:auto;transition:transform .18s ease;color:var(--muted);flex:0 0 auto}
  .date-group.open .chev{transform:rotate(90deg)}
  .count{font-size:.7rem;color:var(--muted);font-weight:600;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .items{display:none;padding:2px 10px 12px}
  .date-group.open .items{display:block}
  .item{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);cursor:pointer;border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;flex-direction:column;gap:2px}
  .item:hover{border-color:#3a4d72}
  .item.active{border-color:var(--accent);background:rgba(52,211,153,.10)}
  .item-name{font-size:.9rem;font-weight:600}
  .item-note{font-size:.74rem;color:var(--muted)}

  main{flex:1 1 auto;position:relative;background:#0b1220}
  iframe{width:100%;height:100%;border:0;background:#556B5D}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;pointer-events:none;opacity:0;transition:opacity .2s}
  .loading.show{opacity:1}
  .scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:15}

  @media (max-width:760px){
    aside{position:absolute;top:0;left:0;height:100%;transform:translateX(-100%);box-shadow:6px 0 24px rgba(0,0,0,.4)}
    body.nav-open aside{transform:translateX(0)}
    body.nav-open .scrim{display:block}
  }
</style>
</head>
<body>
  <header>
    <button class="menu-btn" id="menuBtn" title="Versions" aria-label="Toggle versions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="logo">SDLR</div>
    <div>
      <div class="htitle">Digital E-Card</div>
      <div class="hsub">Version history</div>
    </div>
    <div class="current-pill" id="currentPill">—</div>
  </header>

  <div class="body">
    <aside id="aside">
      <div class="aside-title">Updated versions</div>
      <div id="dateList"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main>
      <div class="loading" id="loading">Loading e-card…</div>
      <iframe id="viewer" title="Digital e-card"></iframe>
    </main>
  </div>

<script>
// Newest first. To add a future iteration: upload the new e-card file, then add
// an entry at the TOP of the matching date below (or a new date group at the very top).
const VERSIONS = [
  { date: '2026-07-08', label: 'Wednesday, July 8, 2026', items: [
    { file: 'sdlr-ecard-v1-2026-07-08.html', name: 'Version 1', note: 'Current — Gio · Co-Founder card' }
  ]}
];

const viewer = document.getElementById('viewer');
const loading = document.getElementById('loading');
const currentPill = document.getElementById('currentPill');
const dateList = document.getElementById('dateList');

function load(file, name, btn) {
  loading.classList.add('show');
  viewer.src = file;
  currentPill.textContent = name;
  document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (window.matchMedia('(max-width:760px)').matches) document.body.classList.remove('nav-open');
}
viewer.addEventListener('load', () => loading.classList.remove('show'));

VERSIONS.forEach((grp, gi) => {
  const group = document.createElement('div');
  group.className = 'date-group' + (gi === 0 ? ' open' : '');
  const head = document.createElement('button');
  head.className = 'date-head';
  head.innerHTML = '<span>' + grp.label + '</span>' +
    '<span class="count">' + grp.items.length + (grp.items.length > 1 ? ' versions' : ' version') + '</span>' +
    '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>';
  head.onclick = () => group.classList.toggle('open');
  group.appendChild(head);

  const items = document.createElement('div');
  items.className = 'items';
  grp.items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = '<span class="item-name">' + it.name + '</span><span class="item-note">' + it.note + '</span>';
    b.onclick = () => load(it.file, it.name, b);
    items.appendChild(b);
  });
  group.appendChild(items);
  dateList.appendChild(group);
});

document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
document.getElementById('scrim').onclick = () => document.body.classList.remove('nav-open');

const firstBtn = document.querySelector('.item');
load(VERSIONS[0].items[0].file, VERSIONS[0].items[0].name, firstBtn);
</script>
</body>
</html>
