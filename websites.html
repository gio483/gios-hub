<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Our Websites &#8212; Gio's Hub</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b1220; --card:#151f33; --card-hover:#1c2a44; --text:#f1f5f9; --muted:#94a3b8; --line:#26344f;
    --accent:#38bdf8; --svm:#fb7a3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16233e 0%, var(--bg) 55%) fixed;
    color:var(--text);min-height:100vh;
    padding:max(24px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
  }
  main{max-width:760px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 2px;margin-bottom:14px;font-weight:600;text-decoration:none}
  .back:hover{color:var(--text)}
  .head{display:flex;align-items:center;gap:13px;margin:2px 4px 6px}
  .head .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb, var(--svm) 16%, transparent)}
  h1{font-size:1.4rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.92rem;margin:4px 4px 22px}
  .list{display:flex;flex-direction:column;gap:14px}
  .site{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .site-top{display:flex;align-items:flex-start;gap:14px}
  .dot{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#0b1220}
  .site h2{margin:0;font-size:1.12rem;line-height:1.2}
  .site .url{color:var(--muted);font-size:.82rem;margin:3px 0 0;word-break:break-all}
  .site p{margin:9px 0 0;font-size:.9rem;color:#cbd5e1;line-height:1.45}
  .status{display:inline-block;margin-top:11px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:20px}
  .st-live{background:rgba(52,211,153,.14);color:#34d399}
  .st-built{background:rgba(251,191,36,.14);color:#fbbf24}
  .actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:.86rem;font-weight:600;padding:9px 15px;border-radius:11px;border:1px solid var(--line)}
  .btn-edit{background:var(--svm);color:#0b1220;border-color:var(--svm)}
  .btn-edit:hover{filter:brightness(1.07)}
  .btn-visit{background:transparent;color:var(--text)}
  .btn-visit:hover{background:var(--card-hover)}
  .btn-dim{opacity:.5;pointer-events:none}
  footer{max-width:760px;margin:30px auto 0;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html#svm">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Shift Vision Media
  </a>
  <div class="head">
    <div class="ico">&#127760;</div>
    <h1>Our Websites</h1>
  </div>
  <p class="sub">Every website we've built together. Hit <b>Edit text</b> to change the words yourself.</p>

  <div class="list" id="list"></div>

  <footer>To change words, open the <b>Website Editor</b> first (on your Mac), then click Edit text.</footer>
</main>

<script>
const EDITOR = 'website-editor.html';
const SITES = [
  {
    name:'Shift Vision Media', initials:'SV', color:'#fb7a3c',
    url:'shiftvisionmedia.com', visit:'https://shiftvisionmedia.com',
    desc:'Your agency site \u2014 marketing for contractors and trades. Hero, services, packages, work, and contact pages.',
    status:'built', editable:true
  },
  {
    name:'KSH Construction', initials:'KSH', color:'#fbbf24',
    url:'kshconstruction.com', visit:'https://kshconstruction.com',
    desc:'The KSH Construction company website \u2014 services, projects, and contact.',
    status:'built', editable:true
  },
  {
    name:'San Diego Landscape Remodeling', initials:'SD', color:'#34d399',
    url:'sandiegolandscaperemodeling.com', visit:'https://sandiegolandscaperemodeling.com',
    desc:'Live at sandiegolandscaperemodeling.com. Hosted on a website platform \u2014 not the local editor setup, so edits go through Claude for now.',
    status:'live', editable:false
  },
  {
    name:'Starts With One', initials:'S1', color:'#38bdf8',
    url:'startswith1.com', visit:'https://startswith1.com',
    desc:'The Starts With One website \u2014 live at startswith1.com. Connected to GitHub, so it can publish updates.',
    status:'live', editable:true
  }
];

document.getElementById('list').innerHTML = SITES.map(s => `
  <div class="site">
    <div class="site-top">
      <div class="dot" style="background:${s.color}">${s.initials}</div>
      <div style="flex:1;min-width:0">
        <h2>${s.name}</h2>
        <p class="url">${s.url}</p>
      </div>
    </div>
    <p>${s.desc}</p>
    <div>
      <span class="status ${s.status==='live'?'st-live':'st-built'}">${s.status==='live'?'Live':'Built \u2014 ready to edit'}</span>
    </div>
    <div class="actions">
      ${s.editable
        ? `<a class="btn btn-edit" href="${EDITOR}">\u270f\ufe0f Edit text</a>`
        : `<span class="btn btn-visit btn-dim">\u270f\ufe0f Edits via Claude</span>`}
      ${s.visit
        ? `<a class="btn btn-visit" href="${s.visit}" target="_blank" rel="noopener">Visit site \u2197</a>`
        : `<span class="btn btn-visit btn-dim">No public link yet</span>`}
    </div>
  </div>`).join('');
</script>
</body>
</html>
