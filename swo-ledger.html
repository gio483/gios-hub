<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="swo-ledger-icon-180.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22One%20Ledger%22%2C%22short_name%22%3A%22One%20Ledger%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0b0c%22%2C%22theme_color%22%3A%22%230b0b0c%22%7D">
<style>
:root{
  --bg:#f6f4ee;--surface:#fff;--surface-2:#fbfaf6;--ink:#15171b;--muted:#6b6f76;--line:#e6e1d4;
  --gold:#b8923d;--gold-ink:#86661f;--gold-soft:#f5edd9;--in:#2e7d4f;--in-soft:#e5f2ea;--out:#15171b;
  --warn:#9a5b06;--warn-soft:#fdf3e2;--danger:#b42318;--danger-soft:#fdecea;
  --side:#0b0b0c;--side-ink:#e9e4d6;--side-muted:#8f8a7c;
  --shadow:0 1px 2px rgba(20,18,10,.05),0 6px 20px rgba(20,18,10,.06);--r:14px;--tab-h:64px;color-scheme:light;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0e;--surface:#17171a;--surface-2:#121214;--ink:#f1eee6;--muted:#9c998f;--line:#2b2a27;
  --gold:#d4b26a;--gold-ink:#e0c27e;--gold-soft:#2a2416;--in:#62c28f;--in-soft:#16291e;--out:#f1eee6;
  --warn:#f0b45a;--warn-soft:#33281a;--danger:#f2877d;--danger-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0e;--surface:#17171a;--surface-2:#121214;--ink:#f1eee6;--muted:#9c998f;--line:#2b2a27;
  --gold:#d4b26a;--gold-ink:#e0c27e;--gold-soft:#2a2416;--in:#62c28f;--in-soft:#16291e;--out:#f1eee6;
  --warn:#f0b45a;--warn-soft:#33281a;--danger:#f2877d;--danger-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:13px}[hidden]{display:none!important}
.serif{font-family:var(--serif)}
/* layout */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.shell>div,.dgrid>*{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.side .logo{display:block;padding:4px 10px 0}.side .logo img{width:100%;max-width:200px;display:block}
.side .app-name{font-family:var(--serif);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px;margin-top:-6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--side-muted);font-weight:500}
.nav a:hover{background:#1b1a17;color:var(--side-ink)}.nav a.on{background:#2a2416;color:#e8cf8f}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--gold);color:#16130a;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side h4{margin:0 10px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.side .plist a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--side-ink);font-size:14px}
.side .plist a:hover,.side .plist a.on{background:#1b1a17}.side .plist a.over{outline:1.5px dashed var(--gold)}
.side .plist .dot{width:7px;height:7px;border-radius:50%;flex:none}
.side .plist span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px}
.main{min-width:0;padding:28px 32px 120px;max-width:1240px;width:100%}
.top{display:none}
.tabs{display:none}
/* headings */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0;line-height:1.1;letter-spacing:-.01em}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:28px 0 10px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:550;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold)}.btn svg{width:16px;height:16px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16130a}.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--danger)}.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:1280px){.kpis{grid-template-columns:repeat(6,1fr)}.kpis .kpi .v{font-size:24px}}
.kpi{padding:16px 18px}.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-family:var(--serif);font-size:27px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--in)}.neg{color:var(--danger)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--warn-soft)}
.banner .btn{margin-left:auto}.banner>svg{width:20px;height:20px;flex:none;color:var(--gold-ink)}
.small>svg{width:14px;height:14px;vertical-align:-2px}
/* property cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.pcard:hover{border-color:var(--gold)}.pcard.over{outline:2px dashed var(--gold)}
.pcard .t{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.2}
.pcard .a{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{min-width:0}.stats .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.stats .v{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}.bar i.over{background:var(--danger)}
/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px 1fr 170px 130px 120px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.row:first-child{border-top:0}.row:hover{background:var(--surface-2)}
.row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.row .amt.in{color:var(--in)}
.row.head{cursor:default;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.row.head:hover{background:var(--surface-2)}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500}
.mini svg{width:11px;height:11px}
.mini.rv{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.totals{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.totals b{font-variant-numeric:tabular-nums}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
.filters input[type=search]{flex:1;min-width:180px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 14px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t thead th{border-top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
table.t tr.g td{background:var(--surface-2);font-weight:650}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
.tscroll{overflow-x:auto}
/* property detail */
.dgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.numbers{display:grid;grid-template-columns:repeat(2,1fr)}
.numbers>div{padding:13px 18px;border-top:1px solid var(--line)}
.numbers>div:nth-child(-n+2){border-top:0}.numbers>div:nth-child(odd){border-right:1px solid var(--line)}
.numbers .l{font-size:12px;color:var(--muted)}.numbers .v{font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.big{font-family:var(--serif);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabsbar a{padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabsbar a.on{color:var(--ink);border-color:var(--gold)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumb{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;cursor:pointer;position:relative;display:grid;place-items:center;font-size:12px;color:var(--muted);overflow:hidden}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11.5px;text-align:left}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.hbar .track i{display:block;height:100%;background:var(--gold)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(5,5,5,.5);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .15s}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.wide{max-width:860px}
.sheet header{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);z-index:2}
.sheet header h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:600}
.sheet header .x{margin-left:auto}
.sheet .body{padding:18px 20px}
.sheet footer{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet footer .sp{flex:1}
@keyframes fade{from{opacity:0}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-color:var(--gold)}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.amount-in{font-family:var(--serif);font-size:30px!important;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.in{color:var(--in)}
.att{display:flex;gap:8px;flex-wrap:wrap}
.att .thumb{width:84px;aspect-ratio:3/4}
.att .add svg{width:22px;height:22px}
.att .add{width:84px;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center;background:none}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.viewer .vb{display:flex;gap:8px;padding:12px;justify-content:flex-end}
.viewer .vb .btn{background:#222;color:#eee;border-color:#333}
.viewer .vc{flex:1;display:grid;place-items:center;overflow:auto;padding:10px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-weight:550;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.drop{position:fixed;inset:12px;z-index:80;border:3px dashed var(--gold);border-radius:22px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;font-family:var(--serif);font-size:26px;pointer-events:none}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;background:var(--gold);border:0;color:#16130a;box-shadow:0 10px 30px rgba(140,105,30,.4);cursor:pointer;z-index:40;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.menu{display:grid;gap:8px}
.menu button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer}
.menu button:hover{border-color:var(--gold)}
.menu .ic{width:40px;height:40px;border-radius:11px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.menu .ic svg{width:21px;height:21px}
.menu b{display:block}.menu span{font-size:13px;color:var(--muted)}
.maprow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.maprow select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 9px}
.preview-t{font-size:12.5px}.preview-t td,.preview-t th{padding:6px 8px!important}
/* mobile */
@media (max-width:860px){
  .shell{display:block}.side{display:none}
  .main{padding:14px 16px calc(var(--tab-h) + 96px)}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--side);color:var(--side-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .top img{width:34px;height:34px;border-radius:8px}
  .top .tt{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.1}
  .top .ts{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .top .btn{margin-left:auto;background:#1b1a17;border-color:#2c2a24;color:var(--side-ink)}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tab-h) + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;position:relative}
  .tabs a svg{width:22px;height:22px}.tabs a.on{color:var(--gold-ink)}
  .tabs a .badge{position:absolute;top:7px;left:calc(50% + 6px);margin:0}
  .fab{right:18px;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom))}
  .ph h1{font-size:25px}.ph .act{margin-left:0;width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:13px 14px}.kpi .v{font-size:22px}
  .row{grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px}
  .row .c-date,.row .c-prop,.row .c-cat{display:none}
  .row .m-meta{display:block}
  .row.head{display:none}
  .dgrid{grid-template-columns:1fr}
  .sheet-wrap{place-items:end stretch;padding:0}
  .sheet{max-width:none;border-radius:20px 20px 0 0;max-height:92vh}
  .form{grid-template-columns:1fr 1fr}
  .hbar{grid-template-columns:110px 1fr 80px}
  .pgrid{grid-template-columns:1fr}
  .filters select{flex:1 1 40%}
  .banner{font-size:13.5px;padding:10px 12px;gap:8px}.banner>svg{display:none}
}
.m-meta{display:none}
@media print{.side,.top,.tabs,.fab,.ph .act,.filters,.no-print{display:none!important}.shell{display:block}.main{padding:0}.card{box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <header class="top"><img src="swo-ledger-icon-180.png" alt=""><div><div class="tt" id="top-title">One Ledger</div><div class="ts">Starts With One</div></div><button class="btn sm" id="top-year" type="button"></button></header>
    <main class="main" id="main"></main>
  </div>
</div>
<nav class="tabs" id="tabs"></nav>
<button class="fab" id="fab" type="button" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="drop" class="drop" hidden>Drop receipts to add them</div>
<input id="f-camera" type="file" accept="image/*" capture="environment" hidden>
<input id="f-pick" type="file" accept="image/*,application/pdf" multiple hidden>
<input id="f-csv" type="file" accept=".csv,text/csv" hidden>
<input id="f-json" type="file" accept=".json,application/json" hidden>
<script>
"use strict";
/* ============================================================
   ONE LEDGER — Starts With One Properties
   v1 (2026-11-14): runs fully in the browser. Data + receipt
   files are stored on this device (IndexedDB). Next step: a
   shared server (like Tally) so office + owner see the same data.

/* ---------- tiny IndexedDB wrapper ---------- */
const DBX = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('swo-one-ledger', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error); }); };
  return {
    get: (store, k) => tx(store, 'readonly', s => s.get(k)),
    put: (store, k, v) => tx(store, 'readwrite', s => { s.put(v, k); }),
    del: (store, k) => tx(store, 'readwrite', s => { s.delete(k); }),
    keys: (store) => tx(store, 'readonly', s => s.getAllKeys()),
  };
})();

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const n0 = v => Number(v) || 0;
const usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = v => usd0.format(Math.round(n0(v)));
const money2 = v => usd2.format(n0(v));
const short = v => { v = n0(v); const a = Math.abs(v); if (a >= 1e6) return (v < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M'; if (a >= 1e4) return (v < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k'; return money(v); };
const pct = v => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(Math.abs(v) < .1 ? 1 : 0) + '%';
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const TODAY = () => isoDate(new Date());
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
const fmtShortDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); const yr = new Date().getFullYear(); return new Date(y, m - 1, d).toLocaleDateString('en-US', y === yr ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: '2-digit' }); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------- state ---------- */
let S = null;
const blank = () => ({ v: 1, properties: [], txns: [], fixed: [], skipped: [], ui: { year: String(new Date().getFullYear()) }, sampleLoaded: false });
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => DBX.put('kv', 'state', S).catch(e => toast('Could not save: ' + e.message)), 150); }

/* ---------- recurring (fixed) costs → posted entries ---------- */
function postRecurring() {
  const today = TODAY(); const have = new Set(S.txns.filter(t => t.auto).map(t => t.auto + '|' + t.period)); const skip = new Set(S.skipped); let added = 0;
  for (const f of S.fixed) {
    if (!f.active || !f.start || !n0(f.amount)) continue;
    const p = prop(f.pid); const stopAt = [f.end, p && p.status === 'Sold' ? p.saleDate : null, today].filter(Boolean).sort()[0];
    const step = (FREQS[f.freq] || FREQS.monthly)[1];
    let [y, m, d] = f.start.split('-').map(Number); let guard = 0;
    while (guard++ < 600) {
      const dim = new Date(y, m, 0).getDate(); const date = `${y}-${pad2(m)}-${pad2(Math.min(d, dim))}`;
      if (date > stopAt) break;
      const period = `${y}-${pad2(m)}`; const key = f.id + '|' + period;
      if (!have.has(key) && !skip.has(key)) {
        S.txns.push({ id: uid(), pid: f.pid, type: f.type, cat: f.cat, amt: n0(f.amount), date, payee: f.label || f.cat, method: f.method || 'ACH / transfer', memo: 'Recurring', files: [], auto: f.id, period, sample: f.sample || undefined });
        have.add(key); added++;
      }
      m += step; while (m > 12) { m -= 12; y++; }
    }
  }
  return added;
}
const monthlyOf = f => n0(f.amount) / ((FREQS[f.freq] || FREQS.monthly)[1]);

/* ---------- math ---------- */
function inYear(t, yr) { return yr === 'all' || t.date.slice(0, 4) === yr; }
function sumBy(list, type) { return list.reduce((a, t) => a + (t.type === type ? n0(t.amt) : 0), 0); }
function metrics(p) {
  const ts = S.txns.filter(t => t.pid === p.id && !t.review);
  const out = sumBy(ts, 'out'), inc = sumBy(ts, 'in');
  const by = {}; ts.forEach(t => { if (t.type === 'out') { const g = groupOf(t.cat); by[g] = (by[g] || 0) + n0(t.amt); } });
  const arvs = (p.arvs || []).slice().sort((a, b) => a.date < b.date ? 1 : -1); const arv = arvs[0] ? n0(arvs[0].value) : 0;
  const purchase = n0(p.purchasePrice), loan = n0(p.loanAmount);
  const totalCost = purchase + out;
  const sold = p.status === 'Sold' && n0(p.salePrice) > 0;
  const profit = sold ? n0(p.salePrice) + inc - totalCost : null;
  const sellPct = p.sellPct == null || p.sellPct === '' ? 6 : n0(p.sellPct);
  const projected = !sold && arv ? arv * (1 - sellPct / 100) + inc - totalCost - (by.Selling || 0) * 0 : null;
  const cashIn = Math.max(0, totalCost - loan);
  const result = sold ? profit : projected;
  const roi = result != null && cashIn > 0 ? result / cashIn : null;
  const fx = S.fixed.filter(f => f.pid === p.id && f.active && (!f.end || f.end >= TODAY()));
  const fixedOut = fx.filter(f => f.type === 'out').reduce((a, f) => a + monthlyOf(f), 0);
  const fixedIn = fx.filter(f => f.type === 'in').reduce((a, f) => a + monthlyOf(f), 0);
  const rent = n0(p.monthlyRent) || fixedIn;
  const reno = by.Renovation || 0, budget = n0(p.rehabBudget);
  const days = p.purchaseDate ? Math.max(0, Math.round(((sold && p.saleDate ? new Date(p.saleDate) : new Date()) - new Date(p.purchaseDate)) / 864e5)) : null;
  return { out, inc, by, arv, arvs, purchase, loan, totalCost, sold, profit, projected, result, roi, cashIn, fixedOut, fixedIn, rent, cashflow: rent - fixedOut, reno, budget, equity: arv ? arv - loan : null, days, count: ts.length, sellPct };
}
function yearList() { const ys = new Set(S.txns.map(t => t.date.slice(0, 4))); ys.add(String(new Date().getFullYear())); return [...ys].sort().reverse(); }
function reviewCount() { return S.txns.filter(t => t.review).length; }

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------- files (receipts) ---------- */
const urlCache = new Map();
async function fileURL(id) { if (urlCache.has(id)) return urlCache.get(id); const f = await DBX.get('files', id); if (!f) return null; const u = URL.createObjectURL(f.blob); urlCache.set(id, u); return u; }
async function fileMeta(id) { const f = await DBX.get('files', id); return f ? { name: f.name, type: f.type } : null; }
async function compress(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file); const max = 1800; const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82)); return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}
async function storeFile(file) { const id = uid(); const blob = await compress(file); await DBX.put('files', id, { blob, name: file.name || 'receipt.jpg', type: blob.type || file.type, added: TODAY() }); return id; }
async function hydrateThumbs(root = document) {
  for (const el of $$('[data-file]', root)) {
    const id = el.dataset.file; const meta = await fileMeta(id); if (!meta) { el.textContent = 'Missing'; continue; }
    if (meta.type.startsWith('image/')) { el.style.backgroundImage = `url("${await fileURL(id)}")`; }
    else { el.innerHTML = `${ic('file')}<div class="small">PDF</div>` + (el.dataset.cap ? `<div class="cap">${esc(el.dataset.cap)}</div>` : ''); el.querySelector('svg').style.cssText = 'width:28px;height:28px'; }
  }
}
async function viewFile(id) {
  const meta = await fileMeta(id); const u = await fileURL(id); if (!u) return toast('File not found on this device');
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<div class="vb"><a class="btn sm" href="${u}" download="${esc(meta.name)}">${ic('dl')} Download</a><button class="btn sm" type="button">${ic('x')} Close</button></div><div class="vc">${meta.type.startsWith('image/') ? `<img src="${u}" alt="Receipt">` : `<iframe src="${u}" title="Receipt"></iframe>`}</div>`;
  v.querySelector('button').onclick = () => v.remove(); v.addEventListener('click', e => { if (e.target.classList.contains('vc')) v.remove(); });
  document.body.appendChild(v);
}

/* ---------- sheet (modal) ---------- */
function openSheet(title, body, foot = '', wide = false) {
  const w = $('#sheet'); w.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><header><h3>${title}</h3><button class="btn ghost sm x" type="button" data-close aria-label="Close">${ic('x')}</button></header><div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ''}</div>`;
  w.hidden = false; document.body.style.overflow = 'hidden';
  $$('[data-close]', w).forEach(b => b.onclick = closeSheet);
  w.onclick = e => { if (e.target === w) closeSheet(); };
  return w.firstElementChild;
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const v = $('.viewer'); if (v) v.remove(); else if (!$('#sheet').hidden) closeSheet(); } });

/* ---------- transaction editor ---------- */
function editTxn(t, { onSaved } = {}) {
  const isNew = !S.txns.includes(t);
  const d = JSON.parse(JSON.stringify(t));
  d.type ||= 'out'; d.files ||= []; d.date ||= TODAY();
  const body = `
  <div class="form">

    <div class="field"><label for="e-method">Paid by</label><select id="e-method">${opts(METHODS, d.method || 'Check')}</select></div>
    <div class="field full"><label for="e-memo">Notes</label><textarea id="e-memo" rows="2" placeholder="Invoice #, draw #, what it was for…">${esc(d.memo)}</textarea></div>
    <div class="field full"><label>Receipts &amp; documents</label><div class="att" id="att"></div></div>
    ${d.auto ? `<div class="full small muted">${ic('repeat')} Posted automatically from a recurring cost. Editing changes only this entry.</div>` : ''}
  </div>`;
  const foot = `${isNew ? '' : `<button class="btn danger" type="button" id="e-del">Delete</button>`}<span class="sp"></span><button class="btn" type="button" data-close>Cancel</button><button class="btn gold" type="button" id="e-save">Save</button>`;
  const sh = openSheet(isNew ? (d.review ? 'New receipt' : d.type === 'in' ? 'Money in' : 'Money out') : (d.review ? 'Review receipt' : 'Edit entry'), body, foot);
  const renderAtt = async () => {
    $('#att', sh).innerHTML = d.files.map(f => `<div class="thumb" data-file="${f}" data-id="${f}"></div>`).join('') + `<button type="button" class="add" id="att-add">${ic('camera')}<br>Add photo<br>or PDF</button>`;
    $$('#att .thumb', sh).forEach(el => el.onclick = () => viewFile(el.dataset.id));
    $('#att-add', sh).onclick = () => pickFiles(async files => { for (const f of files) d.files.push(await storeFile(f)); renderAtt(); });
    hydrateThumbs(sh);
  };
  renderAtt();
  $$('#seg button', sh).forEach(b => b.onclick = () => { d.type = b.dataset.t; $$('#seg button', sh).forEach(x => x.classList.toggle('on', x === b)); $('#e-cat', sh).innerHTML = catOptions(d.type, ''); $('#l-payee', sh).textContent = d.type === 'in' ? 'From' : 'Paid to'; });
  if (isNew && !d.amt) setTimeout(() => $('#e-amt', sh).focus({ preventScroll: true }), 60);
  $('#e-save', sh).onclick = () => {
    const amt = parseFloat(String($('#e-amt', sh).value).replace(/[$,\s]/g, ''));
    Object.assign(d, { amt: isFinite(amt) ? Math.abs(amt) : 0, pid: $('#e-pid', sh).value, cat: $('#e-cat', sh).value, date: $('#e-date', sh).value || TODAY(), payee: $('#e-payee', sh).value.trim(), method: $('#e-method', sh).value, memo: $('#e-memo', sh).value.trim() });
    if (!d.amt) { if (!d.files.length) return toast('Enter an amount'); d.review = true; } else d.review = false;
    if (isNew) { d.id ||= uid(); S.txns.push(d); } else Object.assign(t, d);

  };
  const del = $('#e-del', sh);

}
function removeTxn(t) { if (t.auto) S.skipped.push(t.auto + '|' + t.period); (t.files || []).forEach(f => DBX.del('files', f)); S.txns = S.txns.filter(x => x !== t); }

$('#f-pick').onchange = e => { if (pickCb && e.target.files.length) pickCb([...e.target.files]); };
async function receiptsFromFiles(files, pid) {

/* ---------- chart: monthly in vs out ---------- */
function monthlyChart(list, yr) {
  let months;
  if (yr === 'all') { const d = new Date(); months = []; for (let i = 11; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push(`${x.getFullYear()}-${pad2(x.getMonth() + 1)}`); } }
  else months = MONTHS.map((_, i) => `${yr}-${pad2(i + 1)}`);
  const data = months.map(m => ({ m, inc: list.filter(t => t.type === 'in' && t.date.startsWith(m)).reduce((a, t) => a + n0(t.amt), 0), out: list.filter(t => t.type === 'out' && t.date.startsWith(m)).reduce((a, t) => a + n0(t.amt), 0) }));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.out)));
  const W = 720, H = 220, pl = 46, pb = 24, pt = 8, bw = (W - pl) / 12;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, .5, 1].map(f => max * f);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out by month">`;
  ticks.forEach(v => s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`);
  data.forEach((d, i) => {
    const x = pl + i * bw + bw * .18, w = bw * .3;
    s += `<rect x="${x}" y="${y(d.inc)}" width="${w}" height="${H - pb - y(d.inc)}" rx="3" fill="var(--in)"><title>${MONTHS[+d.m.slice(5) - 1]} in: ${money(d.inc)}</title></rect>`;
    s += `<rect x="${x + w + 2}" y="${y(d.out)}" width="${w}" height="${H - pb - y(d.out)}" rx="3" fill="var(--gold)"><title>${MONTHS[+d.m.slice(5) - 1]} out: ${money(d.out)}</title></rect>`;
    s += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${MONTHS[+d.m.slice(5) - 1]}</text>`;
  });
  return `<div class="legend"><span><i style="background:var(--in)"></i>Money in</span><span><i style="background:var(--gold)"></i>Money out</span></div>` + s + '</svg>';
}
function groupBars(list) {
  const by = {}; list.filter(t => t.type === 'out').forEach(t => { const g = groupOf(t.cat); by[g] = (by[g] || 0) + n0(t.amt); });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]); const max = Math.max(1, ...rows.map(r => r[1]));
  if (!rows.length) return `<div class="muted small">No spending in this period.</div>`;
  return rows.map(([g, v]) => `<div class="hbar"><div>${g}</div><div class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div><div class="v">${short(v)}</div></div>`).join('');
}

function viewProperties() {
  const f = S.ui.pfilter || 'active';
  const list = S.properties.filter(p => f === 'all' ? true : f === 'sold' ? p.status === 'Sold' : p.status !== 'Sold');
  return `<div class="ph"><div><h1>Properties</h1><div class="sub">Every deal, its numbers and where it stands</div></div><div class="act"><div class="chips">${['active', 'sold', 'all'].map(k => `<button class="chip ${f === k ? 'on' : ''}" data-pf="${k}" type="button">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div><button class="btn gold" type="button" id="new-prop">${ic('house')} New property</button></div></div>
  ${propCards(list)}
  <h2>At a glance</h2>
  <div class="card tscroll"><table class="t"><thead><tr><th>Property</th><th>Status</th><th>Purchase</th><th>Renovation</th><th>Total cost</th><th>ARV</th><th>Profit / proj.</th><th>ROI</th></tr></thead><tbody>
  ${list.map(p => { const m = metrics(p); return `<tr style="cursor:pointer" onclick="location.hash='#/p/${p.id}'"><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.strategy || '')}</div></td><td>${esc(p.status)}</td><td>${money(m.purchase)}</td><td>${money(m.reno)}${m.budget ? `<div class="small muted">of ${money(m.budget)}</div>` : ''}</td><td>${money(m.totalCost)}</td><td>${m.arv ? money(m.arv) : '—'}</td><td class="${n0(m.result) >= 0 ? 'pos' : 'neg'}">${m.result == null ? '—' : money(m.result)}</td><td>${pct(m.roi)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function viewProperty(id, tab) {
  const p = prop(id); if (!p) return `<div class="card empty">Property not found. <a href="#/properties">Back to properties</a></div>`;
  const m = metrics(p); tab ||= 'activity';
  const isRental = /rental|BRRRR/i.test(p.strategy);
  const ts = sortDesc(S.txns.filter(t => t.pid === p.id));
  const fx = S.fixed.filter(f => f.pid === p.id);
  const files = ts.flatMap(t => (t.files || []).map(f => ({ f, t })));
  const tabs = [['activity', 'Activity', ts.length], ['fixed', 'Recurring', fx.length], ['arv', 'ARV history', (p.arvs || []).length], ['receipts', 'Receipts', files.length], ['breakdown', 'Breakdown']];
  let content = '';
  if (tab === 'activity') {
    const inc = sumBy(ts.filter(t => !t.review), 'in'), out = sumBy(ts.filter(t => !t.review), 'out');
    content = `<div class="card list"><div class="totals"><span>In <b class="pos">${money(inc)}</b></span><span>Out <b>${money(out)}</b></span><span>${ts.length} entries</span></div>${ts.length ? ts.map(t => txnRow(t, false)).join('') : '<div class="empty">No entries yet. Tap + to add one, or drop receipts here.</div>'}</div>`;
  } else if (tab === 'fixed') {
    content = `<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" type="button" id="add-fixed">${ic('repeat')} Add recurring cost or rent</button></div>
    ${fx.length ? `<div class="card tscroll"><table class="t"><thead><tr><th>What</th><th>Amount</th><th>How often</th><th>Per month</th><th>Per year</th><th>Since</th></tr></thead><tbody>${fx.map(f => `<tr data-fixed="${f.id}" style="cursor:pointer"><td><b>${esc(f.cat)}</b><div class="small muted">${esc(f.label || '')}${f.active ? '' : ' · paused'}${f.end ? ' · ends ' + fmtDate(f.end) : ''}</div></td><td class="${f.type === 'in' ? 'pos' : ''}">${money2(f.amount)}</td><td>${FREQS[f.freq][0]}</td><td>${money(monthlyOf(f))}</td><td>${money(monthlyOf(f) * 12)}</td><td>${fmtShortDate(f.start)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Fixed costs</td><td></td><td></td><td>${money(m.fixedOut)}</td><td>${money(m.fixedOut * 12)}</td><td></td></tr>${m.fixedIn ? `<tr><td>Recurring income</td><td></td><td></td><td class="pos">${money(m.fixedIn)}</td><td class="pos">${money(m.fixedIn * 12)}</td><td></td></tr>` : ''}</tfoot></table></div>` : `<div class="card empty">Add the mortgage, insurance, property tax, HOA, utilities — anything that repeats. They post to the ledger automatically.</div>`}`;
  } else if (tab === 'arv') {
    const arvs = m.arvs;
    content = `<div style="margin-bottom:10px"><button class="btn gold" type="button" id="add-arv">${ic('trend')} Add ARV evaluation</button></div>
    ${arvs.length ? `<div class="card tscroll"><table class="t"><thead><tr><th>Date</th><th>Source</th><th>ARV</th><th>Change</th><th>Spread over all-in</th></tr></thead><tbody>${arvs.map((a, i) => { const prev = arvs[i + 1]; return `<tr data-arv="${a.id}" style="cursor:pointer"><td>${fmtDate(a.date)}${a.note ? `<div class="small muted">${esc(a.note)}</div>` : ''}</td><td>${esc(a.source)}</td><td><b>${money(a.value)}</b></td><td>${prev ? `<span class="${a.value >= prev.value ? 'pos' : 'neg'}">${a.value >= prev.value ? '+' : ''}${money(a.value - prev.value)}</span>` : '—'}</td><td>${money(a.value - m.totalCost)}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="card empty">No ARV evaluations yet. Log each appraisal, BPO or comp check to watch the value move.</div>`}`;
  } else if (tab === 'receipts') {
    content = `<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" type="button" id="snap-here">${ic('camera')} Snap receipt</button><button class="btn" type="button" id="upload-here">${ic('upload')} Upload files</button></div>
    ${files.length ? `<div class="thumbs">${files.map(({ f, t }) => `<div class="thumb" data-file="${f}" data-open="${t.id}" data-cap="${esc((t.payee || 'Receipt') + (t.amt ? ' · ' + money(t.amt) : ''))}"><div class="cap">${esc(t.payee || 'Receipt')}${t.amt ? ' · ' + money(t.amt) : ''}</div></div>`).join('')}</div>` : `<div class="card empty">No receipts yet for this property.</div>`}`;
  } else {
    const groups = CATS.filter(c => c.type === 'out').map(c => ({ g: c.g, items: c.items.map(i => [i, ts.filter(t => !t.review && t.cat === i).reduce((a, t) => a + n0(t.amt), 0)]).filter(x => x[1]) })).filter(g => g.items.length);
    const custom = ts.filter(t => !t.review && t.type === 'out' && !CAT_GROUP[t.cat]);
    content = `<div class="card tscroll"><table class="t"><thead><tr><th>Category</th><th>Spent</th><th>Share</th></tr></thead><tbody>
      <tr class="g"><td>Purchase price</td><td>${money(m.purchase)}</td><td>${pct(m.purchase / (m.totalCost || 1))}</td></tr>
      ${groups.map(g => `<tr class="g"><td>${g.g}</td><td>${money(g.items.reduce((a, x) => a + x[1], 0))}</td><td>${pct(g.items.reduce((a, x) => a + x[1], 0) / (m.totalCost || 1))}</td></tr>${g.items.map(([i, v]) => `<tr><td style="padding-left:28px">${i}</td><td>${money(v)}</td><td></td></tr>`).join('')}`).join('')}
      ${custom.length ? `<tr class="g"><td>Other (imported)</td><td>${money(custom.reduce((a, t) => a + n0(t.amt), 0))}</td><td></td></tr>` : ''}
    </tbody><tfoot><tr><td>Total cost in deal</td><td>${money(m.totalCost)}</td><td>100%</td></tr><tr><td>Money in</td><td class="pos">${money(m.inc)}</td><td></td></tr></tfoot></table></div>`;
  }
  const rehabPct = m.budget ? m.reno / m.budget : 0;
  return `<div class="ph"><div><div class="small muted" style="margin-bottom:6px"><a href="#/properties" style="text-decoration:none">← Properties</a></div><h1>${esc(p.name)}</h1><div class="sub">${esc([p.address, p.city].filter(Boolean).join(', '))}</div><div class="chips" style="margin-top:10px">${statusTag(p.status)}<span class="tag">${esc(p.strategy || '')}</span>${p.lender ? `<span class="tag">${esc(p.lender)}</span>` : ''}${m.days != null ? `<span class="tag">${m.days} days</span>` : ''}</div></div>
    <div class="act"><button class="btn" type="button" id="edit-prop">Edit details</button><button class="btn" type="button" id="exp-prop">${ic('dl')} Export</button><button class="btn gold" type="button" id="add-here">${ic('minus')} Add entry</button></div></div>
  <div class="dgrid">
    <div class="card"><div class="pad" style="padding-bottom:6px"><div class="small muted">${m.sold ? 'Profit on sale' : m.arv ? 'Projected profit at ARV' : 'Total cost in deal'}</div><div class="big ${m.result == null ? '' : m.result >= 0 ? 'pos' : 'neg'}">${m.result == null ? money(m.totalCost) : money(m.result)}</div><div class="small muted">${m.result == null ? 'Add an ARV to see projected profit' : `ROI on cash ${pct(m.roi)} · cash in ${money(m.cashIn)}${m.sold ? '' : ` · after ${m.sellPct}% selling costs`}`}</div></div>
      <div class="numbers" style="border-top:1px solid var(--line)">
        <div><div class="l">Purchase price</div><div class="v">${money(m.purchase)}</div></div>
        <div><div class="l">${m.sold ? 'Sale price' : 'Current ARV'}</div><div class="v">${m.sold ? money(p.salePrice) : m.arv ? money(m.arv) : '—'}</div></div>
        <div><div class="l">Renovation spent</div><div class="v">${money(m.reno)}${m.budget ? ` <span class="small muted">/ ${money(m.budget)}</span>` : ''}</div></div>
        <div><div class="l">Holding &amp; financing</div><div class="v">${money((m.by.Holding || 0) + (m.by.Financing || 0))}</div></div>
        <div><div class="l">Total cost in deal</div><div class="v">${money(m.totalCost)}</div></div>
        <div><div class="l">Loan · equity</div><div class="v">${m.loan ? money(m.loan) : '—'}${m.equity != null && !m.sold ? ` <span class="small muted">· ${money(m.equity)}</span>` : ''}</div></div>
      </div>
      ${m.budget ? `<div class="pad" style="border-top:1px solid var(--line)"><div class="small muted" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Renovation budget used</span><span>${pct(rehabPct)}${rehabPct > 1 ? ' · over budget' : ` · ${money(m.budget - m.reno)} left`}</span></div><div class="bar"><i class="${rehabPct > 1 ? 'over' : ''}" style="width:${Math.min(100, rehabPct * 100).toFixed(1)}%"></i></div></div>` : ''}
    </div>
    <div class="card"><div class="pad" style="padding-bottom:6px"><div class="small muted">${isRental ? 'Monthly cash flow' : 'Monthly carrying cost'}</div><div class="big ${isRental ? (m.cashflow >= 0 ? 'pos' : 'neg') : ''}">${money(isRental ? m.cashflow : m.fixedOut)}</div><div class="small muted">${isRental ? `${money(m.rent)} rent − ${money(m.fixedOut)} fixed costs` : `${money(m.fixedOut * 12)} a year in fixed costs`}</div></div>
      <div class="numbers" style="border-top:1px solid var(--line)">
        <div><div class="l">Money in to date</div><div class="v pos">${money(m.inc)}</div></div>
        <div><div class="l">Money out to date</div><div class="v">${money(m.out)}</div></div>
        ${isRental ? `<div><div class="l">Cap rate (on cost)</div><div class="v">${m.totalCost ? pct((m.rent - m.fixedOut + (m.by.Financing ? S.fixed.filter(f => f.pid === p.id && f.active && groupOf(f.cat) === 'Financing').reduce((a, f) => a + monthlyOf(f), 0) : 0)) * 12 / m.totalCost) : '—'}</div></div>
        <div><div class="l">Cash-on-cash</div><div class="v">${m.cashIn ? pct(m.cashflow * 12 / m.cashIn) : '—'}</div></div>` : `<div><div class="l">Carrying cost / day</div><div class="v">${money(m.fixedOut * 12 / 365)}</div></div><div><div class="l">Purchased</div><div class="v">${p.purchaseDate ? fmtDate(p.purchaseDate) : '—'}</div></div>`}
      </div>
      ${p.notes ? `<div class="pad small" style="border-top:1px solid var(--line);white-space:pre-wrap">${esc(p.notes)}</div>` : ''}
    </div>
  </div>
  <div class="tabsbar">${tabs.map(([k, l, c]) => `<a href="#/p/${p.id}/${k}" class="${tab === k ? 'on' : ''}">${l}${c ? ` <span class="muted small">${c}</span>` : ''}</a>`).join('')}</div>
  ${content}`;
}

function viewActivity() {
  const F = S.ui.af ||= { pid: '*', type: '', cat: '', q: '', from: '', to: '' };
  let list = S.txns.filter(t => !t.review);
  if (F.pid !== '*') list = list.filter(t => t.pid === F.pid);
  if (F.type) list = list.filter(t => t.type === F.type);
  if (F.cat) list = list.filter(t => F.cat.startsWith('g:') ? groupOf(t.cat) === F.cat.slice(2) : t.cat === F.cat);
  if (F.from) list = list.filter(t => t.date >= F.from);
  if (F.to) list = list.filter(t => t.date <= F.to);
  if (F.q) { const q = F.q.toLowerCase(); list = list.filter(t => [t.payee, t.memo, t.cat, propName(t.pid), String(t.amt)].join(' ').toLowerCase().includes(q)); }
  list = sortDesc(list); const shown = list.slice(0, S.ui.alimit || 200);
  const inc = sumBy(list, 'in'), out = sumBy(list, 'out');
  return `<div class="ph"><div><h1>Activity</h1><div class="sub">Every dollar in and out</div></div><div class="act"><button class="btn" type="button" id="exp-csv">${ic('dl')} Export CSV</button><button class="btn" type="button" id="imp-csv">${ic('upload')} Import CSV</button></div></div>
  <div class="filters">
    <input type="search" id="af-q" placeholder="Search payee, notes, amount…" value="${esc(F.q)}">
    <select id="af-pid">${propOptions(F.pid, true)}</select>
    <select id="af-type"><option value="">In &amp; out</option><option value="in" ${F.type === 'in' ? 'selected' : ''}>Money in</option><option value="out" ${F.type === 'out' ? 'selected' : ''}>Money out</option></select>
    <select id="af-cat"><option value="">All categories</option>${CATS.map(c => `<optgroup label="${c.g}"><option value="g:${c.g}" ${F.cat === 'g:' + c.g ? 'selected' : ''}>All ${c.g.toLowerCase()}</option>${c.items.map(i => `<option ${F.cat === i ? 'selected' : ''}>${i}</option>`).join('')}</optgroup>`).join('')}</select>
    <input type="date" id="af-from" value="${F.from}" aria-label="From date"><input type="date" id="af-to" value="${F.to}" aria-label="To date">
    ${Object.values(F).some(v => v && v !== '*') ? `<button class="btn ghost" type="button" id="af-clear">Clear</button>` : ''}
  </div>
  <div class="card list"><div class="totals"><span>In <b class="pos">${money(inc)}</b></span><span>Out <b>${money(out)}</b></span><span>Net <b class="${inc - out >= 0 ? 'pos' : 'neg'}">${money(inc - out)}</b></span><span class="muted">${list.length} entries</span></div>
  ${shown.length ? `<div class="row head"><div>Date</div><div>Paid to / from</div><div>Property</div><div>Category</div><div style="text-align:right">Amount</div></div>` + shown.map(t => txnRow(t)).join('') : '<div class="empty">No entries match.</div>'}</div>
  ${list.length > shown.length ? `<div style="margin-top:10px"><button class="btn" type="button" id="more">Show more (${list.length - shown.length} left)</button></div>` : ''}`;
}

function viewReview() {
  const list = sortDesc(S.txns.filter(t => t.review));
  return `<div class="ph"><div><h1>To review</h1><div class="sub">Receipts that still need an amount, property or category</div></div><div class="act"><button class="btn gold" type="button" id="snap-r">${ic('camera')} Snap receipt</button><button class="btn" type="button" id="upload-r">${ic('upload')} Upload</button></div></div>
  ${list.length ? `<div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${list.map(t => `<div class="thumb" ${t.files?.[0] ? `data-file="${t.files[0]}"` : ''} data-open="${t.id}" data-cap="${esc(propName(t.pid))}"><div class="cap">${esc(t.pid ? propName(t.pid) : 'No property yet')}<br>${fmtShortDate(t.date)}</div></div>`).join('')}</div>` : `<div class="card empty">All caught up. Snap a receipt on the go and fill it in later — it waits here.</div>`}
  <p class="small muted" style="margin-top:16px">Tip: on a computer, drag receipt photos or PDFs anywhere on this page — or onto a property — to add them.</p>`;
}

function viewContractors() {
  const yr = S.ui.year;
  const pay = S.txns.filter(t => !t.review && t.type === 'out' && t.payee && ['Renovation', 'Operating'].includes(groupOf(t.cat)) && !t.auto);
  const by = {};
  pay.forEach(t => { const k = t.payee.trim(); const o = by[k] ||= { name: k, total: 0, yr: 0, n: 0, props: new Set(), cats: new Set(), nonCard: 0, last: '' }; o.total += n0(t.amt); o.n++; if (inYear(t, yr)) { o.yr += n0(t.amt); if (t.method !== 'Card') o.nonCard += n0(t.amt); } o.props.add(t.pid); o.cats.add(t.cat); if (t.date > o.last) o.last = t.date; });
  const rows = Object.values(by).sort((a, b) => b.yr - a.yr || b.total - a.total);
  return `<div class="ph"><div><h1>Contractors &amp; vendors</h1><div class="sub">Who you've paid, for which property, and who may need a 1099</div></div><div class="act">${yearChips()}</div></div>
  ${rows.length ? `<div class="card tscroll"><table class="t"><thead><tr><th>Paid to</th><th>Properties</th><th>Payments</th><th>${yr === 'all' ? 'All time' : yr}</th><th>All time</th><th>Last paid</th></tr></thead><tbody>
  ${rows.map(r => `<tr data-payee="${esc(r.name)}" style="cursor:pointer"><td><b>${esc(r.name)}</b>${yr !== 'all' && r.nonCard >= 600 ? ` <span class="mini rv" title="Paid $600+ by check, ACH, Zelle or cash this year. Ask your CPA about a 1099-NEC.">1099?</span>` : ''}<div class="small muted">${esc([...r.cats].join(', '))}</div></td><td style="white-space:normal;text-align:left">${[...r.props].map(id => `<span class="tag" style="margin:2px">${esc(propName(id))}</span>`).join('')}</td><td>${r.n}</td><td><b>${money(r.yr)}</b></td><td>${money(r.total)}</td><td>${fmtShortDate(r.last)}</td></tr>`).join('')}
  </tbody></table></div><p class="small muted">"1099?" flags anyone paid $600 or more this year by check, ACH, Zelle, wire or cash. It's a reminder to check with your CPA, not tax advice.</p>` : `<div class="card empty">Payments to contractors and vendors show up here once you log them.</div>`}`;
}

function viewReports() {
  const yr = S.ui.year; const list = S.txns.filter(t => !t.review && inYear(t, yr));
  const pids = [...S.properties.map(p => p.id), ''];
  const row = pid => { const ts = list.filter(t => t.pid === pid); const g = k => ts.filter(t => t.type === 'out' && groupOf(t.cat) === k).reduce((a, t) => a + n0(t.amt), 0); const inc = sumBy(ts, 'in'), out = sumBy(ts, 'out'); return { pid, inc, acq: g('Acquisition'), fin: g('Financing'), hold: g('Holding'), reno: g('Renovation'), op: g('Operating'), sell: g('Selling'), out, net: inc - out, n: ts.length }; };
  const rows = pids.map(row).filter(r => r.n);
  const tot = rows.reduce((a, r) => { for (const k of ['inc', 'acq', 'fin', 'hold', 'reno', 'op', 'sell', 'out', 'net']) a[k] = (a[k] || 0) + r[k]; return a; }, {});
  const cats = {}; list.forEach(t => { const k = t.type + '|' + t.cat; cats[k] = (cats[k] || 0) + n0(t.amt); });
  const yrLabel = yr === 'all' ? 'All time' : yr;
  return `<div class="ph"><div><h1>Reports</h1><div class="sub">${yrLabel} · by property and by category</div></div><div class="act">${yearChips()}<button class="btn" type="button" id="exp-rep">${ic('dl')} CSV</button><button class="btn" type="button" onclick="print()">${ic('print')} Print</button></div></div>
  <h2 style="margin-top:4px">Profit &amp; loss by property</h2>
  <div class="card tscroll"><table class="t"><thead><tr><th>Property</th><th>Money in</th><th>Acquisition</th><th>Financing</th><th>Holding</th><th>Renovation</th><th>Operating</th><th>Selling</th><th>Total out</th><th>Net</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><b>${esc(propName(r.pid))}</b></td><td class="pos">${money(r.inc)}</td><td>${money(r.acq)}</td><td>${money(r.fin)}</td><td>${money(r.hold)}</td><td>${money(r.reno)}</td><td>${money(r.op)}</td><td>${money(r.sell)}</td><td>${money(r.out)}</td><td class="${r.net >= 0 ? 'pos' : 'neg'}"><b>${money(r.net)}</b></td></tr>`).join('') || `<tr><td colspan="10" class="muted">No entries in ${yrLabel}.</td></tr>`}
  </tbody><tfoot><tr><td>Total</td><td class="pos">${money(tot.inc)}</td><td>${money(tot.acq)}</td><td>${money(tot.fin)}</td><td>${money(tot.hold)}</td><td>${money(tot.reno)}</td><td>${money(tot.op)}</td><td>${money(tot.sell)}</td><td>${money(tot.out)}</td><td class="${n0(tot.net) >= 0 ? 'pos' : 'neg'}">${money(tot.net)}</td></tr></tfoot></table></div>
  <p class="small muted">Cash view: purchase prices and sale prices aren't in this table (they live on each property). Mortgage payments include principal.</p>
  <div class="dgrid">
  <div><h2>By category</h2><div class="card tscroll"><table class="t"><thead><tr><th>Category</th><th>${yrLabel}</th></tr></thead><tbody>
  ${CATS.map(c => { const items = c.items.map(i => [i, cats[c.type + '|' + i] || 0]).filter(x => x[1]); if (!items.length) return ''; const s = items.reduce((a, x) => a + x[1], 0); return `<tr class="g"><td>${c.g}</td><td class="${c.type === 'in' ? 'pos' : ''}">${money(s)}</td></tr>` + items.map(([i, v]) => `<tr><td style="padding-left:28px">${i}</td><td>${money(v)}</td></tr>`).join(''); }).join('')}
  ${Object.entries(cats).filter(([k]) => !CAT_GROUP[k.split('|')[1]]).map(([k, v]) => `<tr><td>${esc(k.split('|')[1])} <span class="small muted">(imported)</span></td><td>${money(v)}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div><h2>Fixed costs run-rate</h2><div class="card tscroll"><table class="t"><thead><tr><th>Property</th><th>Per month</th><th>Per year</th></tr></thead><tbody>
  ${S.properties.filter(p => p.status !== 'Sold').map(p => { const m = metrics(p); return m.fixedOut ? `<tr><td>${esc(p.name)}</td><td>${money(m.fixedOut)}</td><td>${money(m.fixedOut * 12)}</td></tr>` : ''; }).join('')}

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
function download(name, content, type = 'text/csv') { const b = content instanceof Blob ? content : new Blob([content], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  const head = ['Date', 'Property', 'Address', 'Type', 'Group', 'Category', 'Paid to / from', 'Amount', 'Signed amount', 'Method', 'Notes', 'Receipts', 'Recurring'];
  const lines = [head.join(',')].concat(sortDesc(list).map(t => { const p = prop(t.pid); return [t.date, propName(t.pid), p ? [p.address, p.city].filter(Boolean).join(', ') : '', t.type === 'in' ? 'Money in' : 'Money out', groupOf(t.cat), t.cat, t.payee, n0(t.amt).toFixed(2), (t.type === 'in' ? 1 : -1) * n0(t.amt), t.method, t.memo, (t.files || []).length, t.auto ? 'yes' : ''].map(csvCell).join(','); }));
  download(name, lines.join('\n'));
}
const GUESS = { date: /date|posted|paid on|when/i, amount: /^amount$|amount|total|cost|price|\$/i, inAmt: /credit|deposit|money in|income|received/i, outAmt: /debit|withdraw|money out|expense|paid out|payment/i, payee: /payee|vendor|contractor|paid to|name|merchant|description|desc/i, prop: /property|project|address|job|deal|house/i, cat: /category|type of|class|account|item/i, type: /^type$|in\/out|direction|transaction type/i, memo: /note|memo|detail|comment/i, method: /method|paid by|check|form/i };

    const cols = hdr.map((h, i) => ({ i, h: h || `Column ${i + 1}` }));
    const guess = key => { const re = GUESS[key]; const c = cols.find(c => re.test(c.h) && !Object.values(map).includes(c.i)); return c ? c.i : -1; };
    const map = {}; ['date', 'prop', 'cat', 'memo', 'method', 'type', 'inAmt', 'outAmt'].forEach(k => map[k] = guess(k)); map.amount = guess('amount'); map.payee = guess('payee');
    const fields = [['date', 'Date *'], ['amount', 'Amount'], ['outAmt', 'Money out column'], ['inAmt', 'Money in column'], ['payee', 'Paid to / from'], ['prop', 'Property / project'], ['cat', 'Category'], ['type', 'In / out column'], ['memo', 'Notes'], ['method', 'Paid by']];
    const sel = k => `<select data-map="${k}"><option value="-1">— skip —</option>${cols.map(c => `<option value="${c.i}" ${map[k] === c.i ? 'selected' : ''}>${esc(c.h)}</option>`).join('')}</select>`;
    const body = `<p class="small muted" style="margin-top:0">${data.length} rows found in <b>${esc(file.name)}</b>. Match the columns, check the preview, then import.</p>

      <div class="maprow"><label class="small"><b>Single amount column</b></label><select id="sign"><option value="neg">Negative numbers are money out</option><option value="out">Every row is money out</option><option value="in">Every row is money in</option></select></div>
      <div class="maprow"><label class="small"><b>Unknown properties</b></label><select id="newprops"><option value="create">Create them as new properties</option><option value="general">Put under Company / general</option></select></div>
      <h3 class="serif" style="margin:18px 0 8px">Preview</h3><div id="pv" class="card tscroll"></div>`;
    const sh = openSheet('Import CSV', body, `<span class="sp"></span><button class="btn" type="button" data-close>Cancel</button><button class="btn gold" type="button" id="do-imp">Import</button>`, true);
    const num = v => { if (v == null) return NaN; let s = String(v).trim(); const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s); s = s.replace(/[^0-9.]/g, ''); const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : NaN; };
    const toDate = v => { v = String(v || '').trim(); if (!v) return ''; let m; if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; if ((m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad2(m[1])}-${pad2(m[2])}`; } const d = new Date(v); return isNaN(d) ? '' : isoDate(d); };
    const matchCat = (raw, type) => { if (!raw) return type === 'in' ? 'Other income' : 'Other expense'; const r = raw.toLowerCase(); for (const c of CATS) for (const i of c.items) if (i.toLowerCase() === r) return i;
      const kw = [[/rent/, 'Rent'], [/deposit/, 'Security deposit'], [/late/, 'Late fees'], [/mortgage|loan pay|p&i|piti/, 'Mortgage payment'], [/hard money|interest/, 'Hard money interest'], [/point|origination|lender fee/, 'Loan points & fees'], [/heloc/, 'HELOC payment'], [/insur/, 'Insurance'], [/tax/, 'Property tax'], [/hoa/, 'HOA'], [/util|water|electric|gas|sdg&e|sewer|trash/, 'Utilities'], [/labor|contractor|sub|plumb|electric|roof|paint|framing|drywall|tile|floor|hvac|handyman/, 'Contractor labor'], [/material|home depot|lowe|lumber|supply|supplies/, 'Materials'], [/permit/, 'Permits'], [/dumpster|haul|debris/, 'Dumpster & haul-off'], [/appliance/, 'Appliances'], [/design|architect|plans|engineer/, 'Design & plans'], [/repair|maint/, 'Repairs & maintenance'], [/manage/, 'Property management'], [/landscap|yard/, 'Landscaping'], [/clean/, 'Cleaning & turnover'], [/pest/, 'Pest control'], [/advert|marketing|listing fee/, 'Advertising'], [/legal|attorney|cpa|account/, 'Legal & professional'], [/commission|realtor|agent/, 'Agent commission'], [/stag|photo/, 'Staging & photos'], [/closing|escrow|title/, 'Closing costs'], [/inspect/, 'Inspection'], [/apprais/, 'Appraisal']];

  const tabs = [['overview', 'Portfolio', 'home'], ['properties', 'Properties', 'build'], ['activity', 'Activity', 'list'], ['review', 'Review', 'inbox'], ['more', 'More', 'more']];
  $('#tabs').innerHTML = tabs.map(([k, l, i]) => `<a href="#/${k}" class="${route === k || (k === 'properties' && route === 'p') || (k === 'more' && ['contractors', 'reports', 'settings', 'more'].includes(route)) ? 'on' : ''}">${ic(i)}${l}${k === 'review' && rv ? `<span class="badge">${rv}</span>` : ''}</a>`).join('');
  const titles = { overview: 'Portfolio', properties: 'Properties', activity: 'Activity', review: 'To review', contractors: 'Contractors', reports: 'Reports', settings: 'Settings', more: 'More', p: prop(cur)?.name || 'Property' };
  $('#top-title').textContent = titles[route] || 'One Ledger';
  const yb = $('#top-year'); yb.hidden = !['overview', 'reports', 'contractors'].includes(route); yb.textContent = S.ui.year === 'all' ? 'All time' : S.ui.year;
  yb.onclick = () => { const ys = [...yearList(), 'all']; S.ui.year = ys[(ys.indexOf(S.ui.year) + 1) % ys.length]; save(); render(); };
}
function viewMore() {
  return `<div class="ph"><div><h1>More</h1></div></div><div class="menu">
    <button type="button" onclick="location.hash='#/contractors'"><span class="ic">${ic('hammer')}</span><span><b>Contractors &amp; vendors</b><span>Who's been paid, by property · 1099 reminders</span></span></button>
    <button type="button" onclick="location.hash='#/reports'"><span class="ic">${ic('chart')}</span><span><b>Reports</b><span>Profit &amp; loss by property and category, by year</span></span></button>
    <button type="button" onclick="location.hash='#/settings'"><span class="ic">${ic('gear')}</span><span><b>Settings &amp; data</b><span>Import CSV, backups, sample data</span></span></button></div>`;
}
function render() {
  if (!S) return;
  const parts = (location.hash.replace(/^#\/?/, '') || 'overview').split('/');
  let route = parts[0]; const main = $('#main');
  renderShell(route);
  let html;
  switch (route) {
    case 'p': html = viewProperty(parts[1], parts[2]); break;
    case 'properties': html = viewProperties(); break;
    case 'activity': html = viewActivity(); break;
    case 'review': html = viewReview(); break;
    case 'contractors': html = viewContractors(); break;
    case 'reports': html = viewReports(); break;
    case 'settings': html = viewSettings(); break;
    case 'more': html = viewMore(); break;
    default: route = 'overview'; html = viewOverview();
  }
  main.innerHTML = html;
  bindYear(main); bindRows(main); hydrateThumbs(main);
  $$('[data-open]', main).forEach(el => el.onclick = () => { const t = S.txns.find(x => x.id === el.dataset.open); if (t) editTxn(t); });
  const on = (sel, fn) => { const el = $(sel, main); if (el) el.onclick = fn; };
  on('#clear-sample', () => { if (confirm('Remove all sample properties and their entries?')) clearSample(); });
  on('#new-prop', () => editProp({}));
  $$('[data-pf]', main).forEach(b => b.onclick = () => { S.ui.pfilter = b.dataset.pf; save(); render(); });
  if (route === 'p') {
    const p = prop(parts[1]); if (p) {
      on('#edit-prop', () => editProp(p)); on('#add-here', () => editTxn({ type: 'out', pid: p.id, cat: 'Contractor labor', method: 'Check' }));
      on('#exp-prop', () => exportTxns(S.txns.filter(t => t.pid === p.id && !t.review), `${p.name.replace(/[^\w]+/g, '-')}-${TODAY()}.csv`));
      on('#add-fixed', () => editFixed({ pid: p.id })); on('#add-arv', () => editArv(p));
      $$('[data-fixed]', main).forEach(r => r.onclick = () => editFixed(S.fixed.find(f => f.id === r.dataset.fixed)));
      $$('[data-arv]', main).forEach(r => r.onclick = () => editArv(p, p.arvs.find(a => a.id === r.dataset.arv)));
      on('#snap-here', () => snapReceipt(p.id, true)); on('#upload-here', () => snapReceipt(p.id, false));
    }
  }
  if (route === 'activity') {
    const F = S.ui.af; const set = (k, v) => { F[k] = v; S.ui.alimit = 200; save(); render(); };
    const q = $('#af-q', main); q.oninput = () => { clearTimeout(q._t); q._t = setTimeout(() => { F.q = q.value; save(); render(); const n = $('#af-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
    ['pid', 'type', 'cat', 'from', 'to'].forEach(k => $('#af-' + k, main).onchange = e => set(k, e.target.value));
    on('#af-clear', () => { S.ui.af = { pid: '*', type: '', cat: '', q: '', from: '', to: '' }; save(); render(); });
    on('#more', () => { S.ui.alimit = (S.ui.alimit || 200) + 200; render(); });
    on('#exp-csv', () => { const F2 = S.ui.af; let l = S.txns.filter(t => !t.review); if (F2.pid !== '*') l = l.filter(t => t.pid === F2.pid); exportTxns(l, `one-ledger-activity-${TODAY()}.csv`); });
    on('#imp-csv', startCSV);
  }
  if (route === 'review') { on('#snap-r', () => snapReceipt(undefined, true)); on('#upload-r', () => snapReceipt(undefined, false)); }
  if (route === 'contractors') $$('[data-payee]', main).forEach(r => r.onclick = () => { S.ui.af = { pid: '*', type: '', cat: '', q: r.dataset.payee, from: '', to: '' }; location.hash = '#/activity'; });
  if (route === 'reports') on('#exp-rep', () => exportTxns(S.txns.filter(t => !t.review && inYear(t, S.ui.year)), `one-ledger-${S.ui.year}-${TODAY()}.csv`));
  if (route === 'settings') {
    on('#s-csv', startCSV); on('#s-backup', backup); on('#s-restore', () => $('#f-json').click()); on('#s-csv-out', () => exportTxns(S.txns.filter(t => !t.review), `one-ledger-all-${TODAY()}.csv`));
    on('#s-clear', () => { if (confirm('Remove all sample properties and their entries?')) clearSample(); });
    on('#s-sample', () => { loadSample(); toast('Sample properties loaded'); location.hash = '#/overview'; });
    on('#s-wipe', async () => { if (!confirm('Erase ALL properties, entries and receipts on this device? Download a backup first if you need it.')) return; for (const k of await DBX.keys('files')) await DBX.del('files', k); S = blank(); S.sampleLoaded = true; await DBX.put('kv', 'state', S); toast('Everything erased'); render(); });
  }
  if (route !== 'activity') window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', () => { if (!$('#sheet').hidden) closeSheet(); const v = $('.viewer'); if (v) v.remove(); render(); });

/* ---------- drag & drop receipts (desktop) ---------- */
let dragN = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN++; $('#drop').hidden = false; });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').hidden = true; });
window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); $$('.over').forEach(x => x.classList.remove('over')); const t = e.target.closest?.('[data-drop-pid]'); if (t) t.classList.add('over'); $('#drop').textContent = t ? `Drop to file under ${prop(t.dataset.dropPid)?.name}` : 'Drop receipts to add them'; });
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; $('#drop').hidden = true; $$('.over').forEach(x => x.classList.remove('over'));
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf'); if (!files.length) return toast('Only photos and PDFs');
  const t = e.target.closest?.('[data-drop-pid]'); const pid = t ? t.dataset.dropPid : currentPid();
  const created = await receiptsFromFiles(files, pid);
  if (created.length === 1) { render(); editTxn(created[0]); } else { toast(`${created.length} receipts added to Review`); render(); }
});

/* ---------- boot ---------- */
(async () => {
  try { S = await DBX.get('kv', 'state'); } catch (e) { console.warn(e); }
  if (!S || !Array.isArray(S.properties)) { S = blank(); loadSample(); }
  S.ui ||= { year: String(new Date().getFullYear()) }; S.skipped ||= [];
  if (postRecurring()) save();
  render();
})();
</script>
</body>
</html>
