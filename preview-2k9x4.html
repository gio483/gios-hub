<style>
  :root{--ink:#1b1b21;--champ:#bd9a5f;--champ-dk:#9a7c45;--cream:#faf7f2;--line:#e6ddcf;--muted:#7a756c;--rose:#c97e6d;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,rgba(189,154,95,.16),var(--cream) 60%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:22px;max-width:420px;width:100%;padding:46px 40px;text-align:center;box-shadow:0 30px 70px rgba(27,27,33,.12)}
  .logo{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin-bottom:26px}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--champ);margin-bottom:3px}
  .lock{width:54px;height:54px;border-radius:50%;background:rgba(189,154,95,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin-bottom:8px}
  p.sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:26px}
  input{width:100%;font-family:'Inter',sans-serif;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink);text-align:center;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--champ);background:var(--white)}
  button{width:100%;font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600;padding:14px;border-radius:999px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;transition:.15s}
  button:hover{background:#000}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--rose);font-size:13.5px;min-height:18px;margin-top:12px;font-weight:500}
  .note{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.5}
</style>
</head>

    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},key,b2u(CT));
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    $('#err').textContent='That password didn‚Äôt work. Try again.';
    btn.textContent='Unlock';btn.disabled=false;
  }
}
$('#btn').addEventListener('click',unlock);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
$('#pw').focus();
</script>
