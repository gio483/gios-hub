<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Verses</title>
<meta name="theme-color" content="#0b0907">
<link rel="manifest" href="/vibe/manifest.webmanifest">
<link rel="apple-touch-icon" href="/vibe/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Making">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--bg2:#14110d;--ink:#efe8dc;--muted:#a39885;--gold:#c9a35a;--gold2:#e6c88a;--line:rgba(201,163,90,.22);
  --serif:'Cormorant Garamond',Georgia,serif;--roman:'Cinzel','Times New Roman',serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));background:rgba(11,9,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar a{font-family:var(--roman);letter-spacing:.18em;font-size:11px;text-decoration:none;color:var(--muted)}
.bar a.on{color:var(--gold2)}
.bar .sp{flex:1}
.bar .appbtn{color:var(--gold2);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.head{text-align:center;padding:34px 20px 10px}
.head h1{font-family:var(--roman);font-weight:400;letter-spacing:.1em;font-size:clamp(26px,5vw,42px)}
.head p{color:var(--muted);margin-top:8px;font-size:14px;line-height:1.6;max-width:520px;margin-inline:auto}
.modes{display:flex;justify-content:center;gap:6px;margin:20px 0 6px;flex-wrap:wrap;padding:0 12px}
.mode{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mode.on{background:var(--gold);color:#120e08;border-color:var(--gold)}
.stage{max-width:720px;margin:0 auto;padding:16px 18px 40px}
.card{position:relative;border-radius:16px;border:1px solid var(--line);overflow:hidden;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;background:#000}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.35)}
.card .in{position:relative;padding:30px 26px;text-align:center}
.card .day{font-family:var(--roman);letter-spacing:.3em;font-size:11px;color:var(--gold2)}
.card .ref{font-family:var(--roman);letter-spacing:.2em;font-size:13px;color:var(--gold);margin-top:16px;text-transform:uppercase}
.verse{font-family:var(--serif);font-size:clamp(24px,4vw,34px);line-height:1.4;margin-top:14px;min-height:96px}
.verse .w{display:inline}
.verse .blank{color:transparent;border-bottom:1px solid rgba(230,200,138,.6)}
.verse .hint{color:var(--gold2)}
.reveal{margin-top:16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
textarea{width:100%;min-height:110px;margin-top:16px;padding:14px;border-radius:10px;border:1px solid var(--line);background:rgba(11,9,7,.8);color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.5}
.score{margin-top:10px;font-size:13px;color:var(--gold2);min-height:18px}
.rate{display:flex;gap:8px;margin-top:16px}
.rate button{flex:1;padding:14px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.rate .good{border-color:var(--gold);color:var(--gold2)}
.rate .got{background:var(--gold);color:#120e08;border-color:var(--gold)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:13px}
.nav button{padding:10px 14px;border:1px solid var(--line);border-radius:99px;font-size:11px;letter-spacing:.14em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:28px}
.chip{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:var(--bg2);text-align:left}
.chip b{display:block;font-family:var(--roman);font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.chip span{display:block;font-size:13px;margin-top:4px}
.chip .dots{margin-top:8px;display:flex;gap:4px}
.chip .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.chip .dots i.f{background:var(--gold);border-color:var(--gold)}
.chip.on{border-color:var(--gold)}
.chip.lock{opacity:.4}
.toggle{display:block;margin:18px auto 0;font-size:12px;color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<div class="bar">
  <a href="readings.html">&#8592; READINGS</a>
  <span class="sp"></span>
  <a href="verses.html" class="on">VERSES</a>
  <a href="#" data-settings class="appbtn">&#9881; APP</a>
</div>
<div class="head">
  <h1>HIDE IT IN YOUR HEART</h1>
  <p>Thy word have I hid in mine heart, that I might not sin against thee. One verse per reading. Practice until you can say it without looking.</p>
</div>
<div class="modes" id="modes">
  <button class="mode on" data-m="read">Read</button>
  <button class="mode" data-m="hint">First letters</button>
  <button class="mode" data-m="blank">Fill in</button>
  <button class="mode" data-m="type">Type it</button>
</div>
<div class="stage">
  <div class="card" id="card"></div>
  <div class="rate">
    <button id="again">Again</button>
    <button class="good" id="good">Getting there</button>
    <button class="got" id="got">I know it</button>
  </div>
  <div class="nav"><button id="prev">&#8592; PREV</button><span id="count"></span><button id="next">NEXT &#8594;</button></div>
  <div class="grid" id="grid"></div>
  <button class="toggle" id="showAll"></button>
</div>
<script src="mom-core.js"></script>
<script>
(async function(){
const D=await MOM.load(); const R=D.R;
let mode='read', cur=1, showAll=false, revealed=false;
const unlocked=()=> showAll ? 21 : Math.max(1, Math.min(21, (MOM.nextDay()||21)));
const words=s=>s.split(/\s+/);
function render(){
  const d=R[cur-1]; const [txt,ref]=d.m; const ws=words(txt);
  let verse='';
  if(mode==='read' || revealed) verse=txt;
  else if(mode==='hint') verse=ws.map(w=>{const m=w.match(/^([^A-Za-z]*)([A-Za-z])(.*)$/); return m?`<span class="hint">${m[1]}${m[2]}</span>${m[3].replace(/[A-Za-z]/g,'_')}`:w;}).join(' ');
  else if(mode==='blank'){ verse=ws.map((w,i)=> (i%3===1||i%4===3) ? `<span class="blank">${w}</span>` : w).join(' '); }
  else if(mode==='type') verse='';
  document.getElementById('card').innerHTML=`<img src="img/${d.img}.jpg" alt=""><div class="in"><div class="day">DAY ${cur} · ${d.t.toUpperCase()}</div>
    <div class="verse">${verse}</div><div class="ref">${ref}</div>
    ${mode==='type'&&!revealed?'<textarea id="typed" placeholder="Type the verse from memory"></textarea><div class="score" id="score"></div>':''}
    ${mode!=='read'?`<button class="reveal" id="rev">${revealed?'Hide':'Reveal'}</button>`:''}</div>`;
  const rv=document.getElementById('rev'); if(rv) rv.onclick=()=>{revealed=!revealed; render();};
  const ty=document.getElementById('typed'); if(ty){ ty.focus(); ty.oninput=()=>{ const norm=s=>s.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean); const a=norm(txt), b=norm(ty.value); let hit=0; a.forEach((w,i)=>{ if(b[i]===w) hit++; }); document.getElementById('score').textContent = b.length? `${Math.round(hit/a.length*100)}% word for word` : ''; }; }
  document.getElementById('count').textContent=`${cur} of ${unlocked()}`;
  grid();
}
function grid(){
  const u=unlocked();
  document.getElementById('grid').innerHTML=R.map((d,i)=>{const n=i+1, l=MOM.verse(n), lock=n>u;
    return `<button class="chip ${n===cur?'on':''} ${lock?'lock':''}" data-n="${n}" ${lock?'disabled':''}><b>DAY ${n}</b><span>${d.m[1]}</span><div class="dots">${[1,2,3].map(k=>`<i class="${l>=k?'f':''}"></i>`).join('')}</div></button>`}).join('');
  document.getElementById('showAll').textContent = showAll ? 'Show only the verses I have reached' : 'Unlock all 21 verses';
}
function go(n){ const u=unlocked(); cur=((n-1+u)%u)+1; revealed=false; history.replaceState(null,'','#d-'+cur); render(); }
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.chip'); if(c&&!c.disabled) go(+c.dataset.n);};
document.getElementById('modes').onclick=e=>{const b=e.target.closest('.mode'); if(!b) return; mode=b.dataset.m; revealed=false; document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b)); render();};
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('again').onclick=()=>{ MOM.setVerse(cur,0); revealed=false; render(); };
document.getElementById('good').onclick=()=>{ MOM.setVerse(cur,Math.max(1,Math.min(2,MOM.verse(cur)+1))); go(cur+1); };
document.getElementById('got').onclick=()=>{ MOM.setVerse(cur,3); go(cur+1); };
document.getElementById('showAll').onclick=()=>{ showAll=!showAll; render(); };
document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=e=>{e.preventDefault(); MOM.openSettings();});
const m=location.hash.match(/^#d-(\d+)$/); if(m){ cur=+m[1]; if(cur>unlocked()) showAll=true; }
MOM.on(()=>grid());
render();
})();
</script>
</body>
</html>
