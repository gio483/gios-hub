<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Academy</title>
<meta name="theme-color" content="#0b0907">
<link rel="manifest" href="/vibe/manifest.webmanifest">
<link rel="apple-touch-icon" href="/vibe/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Making">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--bg2:#14110d;--bg3:#1c1813;--ink:#efe8dc;--muted:#a39885;--gold:#c9a35a;--gold2:#e6c88a;--line:rgba(201,163,90,.22);--good:#7fb58a;--bad:#d07a6a;
  --serif:'Cormorant Garamond',Georgia,serif;--roman:'Cinzel','Times New Roman',serif;--sans:'Inter',system-ui,sans-serif;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:calc(14px + var(--st)) 20px 14px;background:rgba(11,9,7,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar a{font-family:var(--roman);letter-spacing:.18em;font-size:11px;text-decoration:none;color:var(--muted)}
.bar a.on{color:var(--gold2)}
.bar .sp{flex:1}
.bar .appbtn{color:var(--gold2);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px calc(40px + var(--sb))}
.eyebrow{font-family:var(--roman);letter-spacing:.4em;font-size:11px;color:var(--gold2)}
h1{font-family:var(--roman);font-weight:400;letter-spacing:.08em;font-size:clamp(30px,6vw,46px);margin:8px 0 4px}
.lead{color:var(--muted);font-size:14px;line-height:1.6}
/* rank card */
.rank{margin-top:20px;padding:20px;border-radius:16px;border:1px solid var(--line);background:radial-gradient(ellipse at top left,rgba(201,163,90,.16),transparent 60%),var(--bg2);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f1d9a2,#a8813d 70%);color:#2a1d08;font-family:var(--roman);font-size:24px;font-weight:600;box-shadow:0 0 0 3px rgba(201,163,90,.25),0 8px 24px rgba(0,0,0,.4)}
.rk-name{font-family:var(--roman);letter-spacing:.14em;font-size:18px}
.rk-sub{color:var(--muted);font-size:12px;margin-top:2px}
.xpbar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#a8813d,#f1d9a2);border-radius:99px;transition:width .8s ease}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{padding:12px 8px;border-radius:10px;background:rgba(255,255,255,.03);text-align:center}
.stat b{display:block;font-family:var(--roman);font-size:20px;color:var(--gold2);font-weight:400}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* today */
.sec{font-family:var(--roman);letter-spacing:.3em;font-size:11px;color:var(--gold);margin:30px 0 12px}
.today{position:relative;display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden;aspect-ratio:4/4.2;max-height:520px;background:#000;border:1px solid var(--line)}
.today img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.today::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 35%,rgba(8,6,4,.92))}
.today .in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px}
.today .meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.today h2{font-family:var(--roman);font-weight:400;font-size:clamp(26px,5vw,38px);letter-spacing:.04em;margin:8px 0 6px;line-height:1.1}
.today p{color:#d9cfbe;font-size:14px}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:12px 20px;border-radius:99px;background:var(--gold);color:#120e08;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid rgba(255,255,255,.06)}
.wk img{width:100%;height:100%;object-fit:cover;filter:brightness(.7)}
.wk span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--roman);font-size:12px;text-shadow:0 1px 6px #000}
.wk.lock img{filter:grayscale(1) brightness(.25)}
.wk.lock::after{content:"\1F512";position:absolute;inset:0;display:grid;place-items:center;font-size:14px;opacity:.7}
.wk.done{border-color:var(--gold)}
.wk.done::before{content:"\2713";position:absolute;top:4px;right:5px;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#120e08;font-size:11px;display:grid;place-items:center}
.wk.cur{outline:2px solid var(--gold2);outline-offset:2px}
/* tools row */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{padding:18px 16px;border-radius:14px;background:var(--bg2);border:1px solid rgba(255,255,255,.06);text-align:left}
.tool b{display:block;font-family:var(--roman);font-weight:400;letter-spacing:.1em;font-size:15px}
.tool span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.tool.locked{opacity:.45}
.tool.gold{border-color:var(--gold);background:radial-gradient(ellipse at top,rgba(201,163,90,.14),transparent 70%),var(--bg2)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:8px 0 14px}
.tli::before{content:"";position:absolute;left:-20px;top:13px;width:9px;height:9px;border-radius:50%;background:#2a241b;border:1px solid var(--line)}
.tli.on::before{background:var(--gold);box-shadow:0 0 10px rgba(230,200,138,.6)}
.tli b{font-family:var(--roman);font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--gold2)}
.tli div{font-family:var(--serif);font-size:19px}
.tli span{color:var(--muted);font-size:12px}
.tli:not(.on){opacity:.4}
/* word bank */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wb{padding:14px;border-radius:12px;background:var(--bg2);border:1px solid rgba(255,255,255,.06);text-align:left}
.wb b{font-family:var(--serif);font-size:21px;font-weight:600}
.wb span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px}
.test{margin-top:26px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
.test b{font-family:var(--roman);font-weight:400;letter-spacing:.12em;font-size:13px;color:var(--gold2)}
.test p{color:#d9cfbe;font-family:var(--serif);font-size:19px;line-height:1.5;margin-top:6px}

/* ---------- deck (session player) ---------- */
.deck{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
.deck.open{display:flex}
.dtop{padding:calc(10px + var(--st)) 14px 8px;display:flex;align-items:center;gap:10px}
.dtop .x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);font-size:20px;line-height:1}
.segs{flex:1;display:flex;gap:3px}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.segs i.on{background:var(--gold2)}
.dxp{font-family:var(--roman);font-size:12px;color:var(--gold2);min-width:54px;text-align:right}
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.card{max-width:640px;margin:0 auto;padding:10px 20px 30px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.card.back{animation:inb .35s ease}
@keyframes inb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.cover{position:relative;margin:-10px -20px 0;height:62svh;min-height:360px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,9,7,0) 40%,var(--bg))}
.ctitle{position:relative;z-index:2;margin-top:-90px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.ctitle h2,.card h2{font-family:var(--roman);font-weight:400;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;line-height:1.1;margin:10px 0 10px}
.strip{margin:-10px -20px 18px;height:150px;overflow:hidden;position:relative}
.strip img{width:100%;height:100%;object-fit:cover;filter:brightness(.75)}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--bg))}
.prose{font-family:var(--serif);font-size:23px;line-height:1.6;color:#efe7d8}
.prose.first::first-letter{font-family:var(--roman);float:left;font-size:64px;line-height:.9;padding:6px 10px 0 0;color:var(--gold2)}
.tag{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#120e08;background:var(--gold);padding:5px 9px;border-radius:4px}
.box{margin-top:16px;padding:18px;border-radius:14px;background:var(--bg2);border:1px solid rgba(255,255,255,.07)}
.box h4{font-family:var(--roman);font-weight:400;letter-spacing:.16em;font-size:12px;color:var(--gold2);margin-bottom:8px}
.box p{font-size:16px;line-height:1.65;color:#ddd3c3}
.box.warn{border-color:rgba(208,122,106,.35)}
.box.warn h4{color:#e6a596}
.src{margin-top:14px;font-size:12px;color:var(--muted);font-style:italic}
.wordbig{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1}
.say{color:var(--gold2);font-size:14px;letter-spacing:.1em;margin-top:8px}
.pos{color:var(--muted);font-style:italic;font-size:14px;margin-top:2px}
.def{font-family:var(--serif);font-size:24px;line-height:1.45;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.hear{margin-top:12px;padding:9px 14px;border-radius:99px;border:1px solid var(--gold);color:var(--gold2);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.q{font-family:var(--serif);font-size:24px;line-height:1.45;margin:6px 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:15px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--bg2);font-size:16px;line-height:1.4;transition:background .2s,border-color .2s}
.opt.good{border-color:var(--good);background:rgba(127,181,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(208,122,106,.12)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:15px;line-height:1.6;display:none}
.why.show{display:block}
.why.g{background:rgba(127,181,138,.1);border:1px solid rgba(127,181,138,.4)}
.why.b{background:rgba(208,122,106,.08);border:1px solid rgba(208,122,106,.35)}
.why b{display:block;font-family:var(--roman);font-weight:400;letter-spacing:.12em;font-size:12px;margin-bottom:4px}
.ring{width:150px;height:150px;margin:18px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--gold2);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--roman);font-size:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{padding:12px 18px;border-radius:99px;border:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.pill.solid{background:var(--gold);color:#120e08;border-color:var(--gold);font-weight:600}
.pill.rec{background:#b4483a;border-color:#b4483a;color:#fff}
audio{width:100%;margin-top:12px}
.verse{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.5;padding:22px 20px;border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(201,163,90,.08),transparent)}
.verse cite{display:block;font-style:normal;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:10px}
.result{text-align:center;padding-top:30px}
.result .big{font-family:var(--roman);font-size:58px;color:var(--gold2);line-height:1}
.result .lines{max-width:360px;margin:18px auto 0;text-align:left}
.result .lines div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.result .lines b{color:var(--gold2);font-weight:500}
.levelup{margin:18px auto 0;max-width:360px;padding:16px;border-radius:14px;border:1px solid var(--gold);background:radial-gradient(ellipse at top,rgba(201,163,90,.2),transparent 70%)}
.levelup b{font-family:var(--roman);letter-spacing:.2em;font-size:13px;color:var(--gold2)}
.dbot{padding:10px 16px calc(12px + var(--sb));display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.06);background:rgba(11,9,7,.96)}
.dbot button{padding:16px;border-radius:14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.dbot .prev{width:64px;border:1px solid var(--line)}
.dbot .next{flex:1;background:var(--gold);color:#120e08}
.dbot .next:disabled{background:#3a3226;color:#8f8573}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%) translateY(16px);opacity:0;z-index:400;padding:10px 16px;border-radius:99px;background:var(--gold);color:#120e08;font-weight:600;font-size:13px;transition:all .35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.bar a:not(.home),.bar .appbtn{display:none}.bar a.home{font-size:12px}}
@media (min-width:761px){.today{aspect-ratio:16/9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <a href="readings.html" class="home">&#8592; READINGS</a>
  <span class="sp"></span>
  <a href="academy.html" class="on">ACADEMY</a>
  <a href="verses.html">VERSES</a>
  <a href="#" data-settings class="appbtn">&#9881; APP</a>
</div>

<main class="wrap" id="home">
  <div class="eyebrow">THE ACADEMY</div>
  <h1 id="weekTitle">Week 1</h1>
  <p class="lead" id="weekSub"></p>

  <div class="rank" id="rank"></div>

  <div class="sec">TODAY</div>
  <button class="today" id="today"></button>

  <div class="sec">THIS WEEK</div>
  <div class="week" id="week"></div>

  <div class="sec">TRAIN</div>
  <div class="tools">
    <button class="tool" id="reviewBtn"><b>Quick Review</b><span>Five questions from what you have learned. Keeps it from fading.</span></button>
    <button class="tool" id="bossBtn"><b>Sunday Boss Round</b><span>A harder mixed test of the whole week. Unlocks after session 7.</span></button>
  </div>

  <div class="sec">YOUR WORDS</div>
  <div class="words" id="words"></div>

  <div class="sec">YOUR TIMELINE</div>
  <div class="tl" id="timeline"></div>

  <div class="test"><b>THE TEST FOR EVERY TACTIC</b><p>Would it still work if the other person knew exactly what you were doing? If yes, it is persuasion. If it only works in the dark, it is manipulation.</p></div>
</main>

<div class="deck" id="deck">
  <div class="dtop"><button class="x" id="dClose" aria-label="Close">&times;</button><div class="segs" id="segs"></div><div class="dxp" id="dxp"></div></div>
  <div class="stage" id="stage"></div>
  <div class="dbot"><button class="prev" id="dPrev" aria-label="Back">&#8592;</button><button class="next" id="dNext">Continue</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="mom-core.js"></script>
<script>
(async function(){
const A = await fetch('/vibe/academy-data.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>null);
if(!A){ document.getElementById('home').innerHTML='<p class="lead" style="padding:40px 0">The Academy could not load. Check your connection and <a href="" style="color:#e6c88a">try again</a>.</p>'; return; }
const S=A.sessions, XP=A.xp, RANKS=A.ranks;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- progress model (rides on the synced "done" and "vm" maps) ----------
const st=()=>MOM.state;
const rec=k=>st().done[k];
const isDoneA=n=>!!(rec('a'+n)&&rec('a'+n).v);
const unlocked=n=> n===1 || isDoneA(n-1);
const nextA=()=>{ for(let n=1;n<=S.length;n++) if(!isDoneA(n)) return n; return 0; };
function totalXP(){
  let x=0; const d=st().done;
  for(const [k,v] of Object.entries(d)){ if(!v||!v.v) continue; if(/^(a\d+|boss\d+|r\d{8})$/.test(k)) x+=Number(v.x||0); else if(/^\d+$/.test(k)) x+=XP.reading; }
  for(const [k,v] of Object.entries(st().vm)){ if(/^\d+$/.test(k)) x+=Number(v.l||0)*XP.verse; }
  return x;
}
function rankOf(x){ let i=0; RANKS.forEach((r,k)=>{ if(x>=r[1]) i=k; }); const cur=RANKS[i], nxt=RANKS[i+1]; return {i,name:cur[0],min:cur[1],next:nxt?nxt[1]:null,nextName:nxt?nxt[0]:null}; }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function streak(){
  const days=new Set(); Object.values(st().done).forEach(v=>{ if(v&&v.v&&v.u) days.add(dayKey(v.u)); });
  let n=0; const d=new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); } return n;
}
const wordsLearned=()=>S.filter(s=>isDoneA(s.n));
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600); }

// ---------- home ----------
function renderHome(){
  $('#weekTitle').textContent='Week '+A.week.n+': '+A.week.title;
  $('#weekSub').textContent=A.week.sub;
  const x=totalXP(), r=rankOf(x);
  const pct = r.next ? Math.round((x-r.min)/(r.next-r.min)*100) : 100;
  $('#rank').innerHTML=`<div class="badge">${r.name[0]}</div><div><div class="rk-name">${r.name.toUpperCase()}</div>
    <div class="rk-sub">${r.next?`${r.next-x} XP to ${r.nextName}`:'Highest rank reached'}</div><div class="xpbar"><i style="width:${pct}%"></i></div></div>
    <div class="stats"><div class="stat"><b>${x}</b><span>XP</span></div><div class="stat"><b>${streak()}</b><span>Day streak</span></div><div class="stat"><b>${wordsLearned().length}</b><span>Words</span></div></div>`;
  const n=nextA(); const s=S[(n||1)-1];
  $('#today').innerHTML=`<img src="img/${s.img}.jpg" alt=""><div class="in"><div class="meta">${n?`Session ${n} of ${S.length}`:'Week complete'} · ${esc(s.era)} · ${esc(s.year)}</div>
    <h2>${n?esc(s.title):'You finished the week'}</h2><p>${n?esc(s.pattern.name)+' · word: '+esc(s.word.w):'Take the Boss Round, or replay any session.'}</p>
    <span class="go">${n?(isDoneA(n)?'Replay':'Start · 12 min'):'Boss Round'} &#8594;</span></div>`;
  $('#today').onclick=()=> n ? openSession(n) : openBoss();
  $('#week').innerHTML=S.map(s=>`<button class="wk ${isDoneA(s.n)?'done':''} ${!unlocked(s.n)?'lock':''} ${s.n===n?'cur':''}" data-n="${s.n}" aria-label="Session ${s.n}"><img src="img/${s.img}.jpg" alt=""><span>${['I','II','III','IV','V','VI','VII'][s.n-1]}</span></button>`).join('');
  $('#week').onclick=e=>{ const b=e.target.closest('.wk'); if(!b) return; const k=+b.dataset.n; if(!unlocked(k)){ toast('Finish session '+(k-1)+' first'); return; } openSession(k); };
  const allDone=!nextA();
  const bb=$('#bossBtn'); bb.classList.toggle('locked',!allDone); bb.classList.toggle('gold',allDone);
  const best=rec('boss'+A.week.n); bb.querySelector('span').textContent = allDone ? (best&&best.v?`Best: ${best.s} of 7. Go again for the record.`:'Seven questions across the whole week. Ready when you are.') : 'A harder mixed test of the whole week. Unlocks after session 7.';
  const rv=$('#reviewBtn'); const can=wordsLearned().length>0; rv.classList.toggle('locked',!can);
  const learned=wordsLearned();
  $('#words').innerHTML = learned.length ? learned.map(s=>`<button class="wb" data-n="${s.n}"><b>${esc(s.word.w)}</b><span>${esc(s.word.d)}</span></button>`).join('') : '<div class="empty">Finish a session to add its word to your bank.</div>';
  $('#words').onclick=e=>{ const b=e.target.closest('.wb'); if(!b) return; const s=S[+b.dataset.n-1]; openCards([wordCard(s,true)], {title:'Word'}); };
  const tl=[...S].sort((a,b)=>a.yearNum-b.yearNum);
  $('#timeline').innerHTML=tl.map(s=>`<div class="tli ${isDoneA(s.n)?'on':''}"><b>${esc(s.year)}</b><div>${isDoneA(s.n)?esc(s.title):'Locked'}</div><span>${esc(s.place)}</span></div>`).join('');
}
$('#reviewBtn').onclick=()=>{ if(!wordsLearned().length){ toast('Finish your first session to unlock review'); return; } openReview(); };
$('#bossBtn').onclick=()=>{ if(nextA()){ toast('Finish all 7 sessions to unlock'); return; } openBoss(); };
document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=e=>{e.preventDefault(); MOM.openSettings();});

// ---------- deck engine ----------
let deck=null;
function openCards(cards, opts={}){
  deck={cards, i:0, xp:0, correct:0, total:0, opts, answered:{}, speakIdx:cards.speakIdx};
  $('#deck').classList.add('open'); document.body.style.overflow='hidden';
  history.pushState({deck:1},'',location.pathname+'#play');
  show(0,1);
}
function closeDeck(fromPop){
  if(!deck) return; $('#deck').classList.remove('open'); document.body.style.overflow=''; $('#stage').innerHTML=''; deck=null;
  try{ speechSynthesis.cancel(); }catch(e){}
  stopRec(); clearInterval(timer);
  if(!fromPop && location.hash==='#play') history.back();
  renderHome();
}
addEventListener('popstate',()=>{ if(deck) closeDeck(true); });
$('#dClose').onclick=()=>closeDeck();
$('#dPrev').onclick=()=>{ if(deck && deck.i>0) show(deck.i-1,-1); };
$('#dNext').onclick=()=>{ if(!deck) return; const c=deck.cards[deck.i]; if(c.onNext){ c.onNext(); return; } if(deck.i<deck.cards.length-1) show(deck.i+1,1); else closeDeck(); };
function show(i,dir){
  deck.i=i; const c=deck.cards[i];
  $('#segs').innerHTML=deck.cards.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
  $('#dxp').textContent = deck.xp?('+'+deck.xp+' XP'):'';
  const stg=$('#stage'); stg.innerHTML=`<div class="card ${dir<0?'back':''}">${c.html}</div>`; stg.scrollTop=0;
  $('#dPrev').style.visibility = i>0 ? 'visible':'hidden';
  const nx=$('#dNext'); nx.textContent=c.next||(i===deck.cards.length-1?'Finish':'Continue');
  nx.disabled = !!c.gate && !deck.answered[i];
  if(c.mount) c.mount(stg.firstElementChild, i);
}
function award(n){ if(!deck) return; deck.xp+=n; $('#dxp').textContent='+'+deck.xp+' XP'; }
// swipe between cards (not on questions until answered)
let sx=0,sy=0; $('#stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('#stage').addEventListener('touchend',e=>{ if(!deck) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)<70||Math.abs(dy)>60) return;
  if(dx<0){ if(!$('#dNext').disabled) $('#dNext').click(); } else { $('#dPrev').click(); } });

// ---------- card builders ----------
function mcCard(qtext, o, a, why, xp, label){
  return { gate:true, html:`${label?`<span class="tag">${label}</span>`:''}<p class="q">${esc(qtext)}</p><div class="opts">${o.map((t,k)=>`<button class="opt" data-k="${k}">${esc(t)}</button>`).join('')}</div><div class="why" id="why"></div>`,
    mount(el,i){
      const done=deck.answered[i];
      const reveal=(k)=>{ el.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===a) b.classList.add('good'); else if(j===k) b.classList.add('bad'); });
        const w=el.querySelector('#why'); const ok=k===a; w.className='why show '+(ok?'g':'b'); w.innerHTML=`<b>${ok?'CORRECT':'NOT QUITE'}</b>${esc(why)}`; };
      if(done!==undefined){ reveal(done.k); return; }
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; deck.answered[i]={k}; deck.total++; if(k===a){ deck.correct++; award(xp); toast('+'+xp+' XP'); } reveal(k); $('#dNext').disabled=false; try{navigator.vibrate&&navigator.vibrate(k===a?20:[30,40,30]);}catch(e){} });
    }};
}
function wordCard(s, standalone){
  const w=s.word;
  return { html:`<span class="tag">The Word</span><div style="margin-top:18px" class="wordbig">${esc(w.w)}</div><div class="say">${esc(w.say)}</div><div class="pos">${esc(w.pos)}</div>
    <p class="def">${esc(w.d)}</p><button class="hear" id="hear">&#9654; Hear it</button>
    <div class="box"><h4>THE ROOT</h4><p>${esc(w.root)}</p><div class="chips">${w.fam.map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>
    <div class="box"><h4>USE IT</h4><p style="font-family:var(--serif);font-size:20px;font-style:italic">“${esc(w.use)}”</p></div>
    <div class="box"><h4>THIS WEEK’S CHALLENGE</h4><p>Use <b>${esc(w.w)}</b> naturally in a real conversation before Sunday.</p></div>`,
    next: standalone?'Close':null,
    mount(el){ el.querySelector('#hear').onclick=()=>{ try{ const u=new SpeechSynthesisUtterance(w.w); u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }; } };
}
let timer=null, mr=null, chunks=[], stream=null;
function stopRec(){ try{ if(mr&&mr.state!=='inactive') mr.stop(); }catch(e){} try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} mr=null; stream=null; }
function speakCard(s){
  return { gate:true, next:'Continue', html:`<span class="tag">Speak It</span><h2>Say it out loud</h2><p class="prose" style="font-size:21px">${esc(s.speak)}</p>
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="arc" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg><span id="secs">60</span></div>
    <div class="row"><button class="pill solid" id="startT">Start 60 seconds</button><button class="pill" id="recB">&#9679; Record</button></div>
    <audio id="play" controls style="display:none"></audio>
    <div class="row"><button class="pill" id="saidIt">I said it out loud</button></div>
    <p class="src" style="text-align:center">Recordings stay on your phone and are not saved or uploaded. Play it back and listen for filler words.</p>`,
    mount(el,i){
      const arc=el.querySelector('#arc'), secs=el.querySelector('#secs'); let left=60;
      const claim=()=>{ if(!deck.answered[i]){ deck.answered[i]={k:1}; award(XP.speak); toast('+'+XP.speak+' XP'); } $('#dNext').disabled=false; el.querySelector('#saidIt').textContent='✓ Done'; };
      if(deck.answered[i]) claim();
      el.querySelector('#startT').onclick=()=>{ clearInterval(timer); left=60; secs.textContent=left; arc.style.strokeDashoffset=0;
        timer=setInterval(()=>{ left--; secs.textContent=left; arc.style.strokeDashoffset=339.3*(1-left/60); if(left<=0){ clearInterval(timer); secs.textContent='✓'; claim(); } },1000); };
      el.querySelector('#saidIt').onclick=claim;
      const rb=el.querySelector('#recB');
      if(!(navigator.mediaDevices&&window.MediaRecorder)){ rb.style.display='none'; return; }
      rb.onclick=async()=>{
        if(mr&&mr.state==='recording'){ stopRec(); rb.classList.remove('rec'); rb.innerHTML='&#9679; Record again'; return; }
        try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast('Microphone not allowed'); return; }
        chunks=[]; mr=new MediaRecorder(stream); mr.ondataavailable=e=>chunks.push(e.data);
        mr.onstop=()=>{ const b=new Blob(chunks,{type:mr&&mr.mimeType||'audio/mp4'}); const a=el.querySelector('#play'); a.src=URL.createObjectURL(b); a.style.display='block'; claim(); };
        mr.start(); rb.classList.add('rec'); rb.innerHTML='&#9632; Stop';
        el.querySelector('#startT').click();
      };
    }};
}
function sessionCards(s){
  const cards=[];
  cards.push({ html:`<div class="cover"><img src="img/${s.img}.jpg" alt=""></div><div class="ctitle"><div class="kicker">Session ${s.n} · ${esc(s.era)} · ${esc(s.year)}</div><h2>${esc(s.title)}</h2>
    <p class="lead">${esc(s.place)} · Story, pattern, word, game, quiz, speak, anchor. About 12 minutes.</p></div>`, next:'Begin' });
  s.story.forEach((p,k)=>cards.push({ html:`${k===0?`<div class="strip"><img src="img/${s.img}.jpg" alt="" style="object-position:center ${20+k*15}%"></div>`:''}<span class="tag">The Story · ${k+1}/${s.story.length}</span><p class="prose ${k===0?'first':''}" style="margin-top:16px">${esc(p)}</p>` }));
  cards.push({ html:`<span class="tag">The Pattern</span><h2>${esc(s.pattern.name)}</h2><p class="prose" style="font-size:21px">${esc(s.pattern.what)}</p><p class="src">${esc(s.pattern.source)}</p>` });
  cards.push({ html:`<span class="tag">The Pattern</span><h2 style="font-size:26px">Defense, discernment, and the line</h2>
    <div class="box"><h4>WATCH FOR IT: USED ON YOU</h4><p>${esc(s.pattern.onyou)}</p></div>
    <div class="box"><h4>USE IT WITH DISCERNMENT</h4><p>${esc(s.pattern.use)}</p></div>
    <div class="box warn"><h4>THE LINE NOT TO CROSS</h4><p>${esc(s.pattern.line)}</p></div>` });
  cards.push(wordCard(s));
  cards.push(mcCard(s.spot.q, s.spot.o, s.spot.a, s.spot.why, XP.spot, 'Pattern Spotter'));
  s.quiz.forEach((q,k)=>cards.push(mcCard(q.q,q.o,q.a,q.why,XP.quiz,'Quiz · '+(k+1)+'/'+s.quiz.length)));
  cards.speakIdx=cards.length; cards.push(speakCard(s));
  cards.push({ html:`<span class="tag">The Anchor</span><div class="verse" style="margin-top:18px">${esc(s.anchor.v)}<cite>${esc(s.anchor.ref)}</cite></div>
    <div class="box"><h4>TODAY’S HABIT</h4><p>${esc(s.anchor.habit)}</p></div>
    <div class="box"><h4>GO DEEPER</h4><p><b>${esc(s.read.t)}</b>, ${esc(s.read.by)}. ${esc(s.read.why)}</p></div>`, next:'Finish session' });
  // results card is built at the end
  cards.push({ html:'', mount(el){ finishSession(s, el); }, next:'Done' });
  return cards;
}
function finishSession(s, el){
  const before=totalXP(), rb=rankOf(before);
  const key='a'+s.n, prev=rec(key);
  const gained=XP.session+deck.xp;
  const best=Math.max(gained, prev&&prev.v?Number(prev.x||0):0);
  const qTotal=s.quiz.length+1;
  MOM.setRec(key,{s:deck.correct,x:best});
  const after=totalXP(), ra=rankOf(after);
  el.innerHTML=`<div class="result"><div class="kicker">Session ${s.n} complete</div><div class="big">+${gained}</div><div class="kicker" style="margin-top:6px">XP${prev&&prev.v?' (best score kept)':''}</div>
    <div class="lines"><div><span>Session complete</span><b>+${XP.session}</b></div><div><span>Answers right</span><b>${deck.correct} of ${qTotal}</b></div><div><span>Speak It</span><b>${deck.answered[deck.speakIdx]?'+'+XP.speak:'skipped'}</b></div><div><span>New word</span><b>${esc(s.word.w)}</b></div><div><span>Streak</span><b>${streak()} day${streak()===1?'':'s'}</b></div></div>
    ${ra.i>rb.i?`<div class="levelup"><b>RANK UP</b><p style="margin-top:6px;font-family:var(--serif);font-size:22px">You are now ${ra.name}.</p></div>`:''}
    <p class="lead" style="margin-top:22px">${s.n<S.length?`Tomorrow: ${esc(S[s.n].title)}`:'You finished the week. The Boss Round is unlocked.'}</p></div>`;
  $('#segs').innerHTML=deck.cards.map(()=>'<i class="on"></i>').join('');
  $('#dPrev').style.visibility='hidden';
}
function openSession(n){ const s=S[n-1]; openCards(sessionCards(s)); }

// ---------- boss & review ----------
function pool(onlyDone){
  const out=[]; S.forEach(s=>{ if(onlyDone && !isDoneA(s.n)) return;
    s.quiz.forEach(q=>out.push(q)); out.push({q:s.spot.q,o:s.spot.o,a:s.spot.a,why:s.spot.why});
    const others=S.filter(x=>x.n!==s.n).map(x=>x.word.d).sort(()=>Math.random()-.5).slice(0,3);
    const opts=[s.word.d,...others].sort(()=>Math.random()-.5);
    out.push({q:`What does “${s.word.w}” mean?`, o:opts, a:opts.indexOf(s.word.d), why:`${s.word.w}: ${s.word.d} (${s.word.root})`});
  }); return out.sort(()=>Math.random()-.5);
}
function openBoss(){
  const qs=pool(false).slice(0,7);
  const cards=[{ html:`<div class="cover"><img src="img/${S[6].img}.jpg" alt=""></div><div class="ctitle"><div class="kicker">Week ${A.week.n}</div><h2>Sunday Boss Round</h2><p class="lead">Seven questions from the whole week, mixed. ${XP.boss} XP each. Your best score is kept.</p></div>`, next:'Begin' }];
  qs.forEach((q,k)=>cards.push(mcCard(q.q,q.o,q.a,q.why,XP.boss,'Boss · '+(k+1)+'/7')));
  cards.push({ html:'', next:'Done', mount(el){
    const key='boss'+A.week.n, prev=rec(key); const x=deck.xp; const bestX=Math.max(x, prev&&prev.v?Number(prev.x||0):0); const bestS=Math.max(deck.correct, prev&&prev.v?Number(prev.s||0):0);
    MOM.setRec(key,{s:bestS,x:bestX});
    el.innerHTML=`<div class="result"><div class="kicker">Boss Round</div><div class="big">${deck.correct}/7</div><div class="kicker" style="margin-top:6px">+${x} XP · best ${bestS}/7</div>
      <p class="lead" style="margin-top:22px">${deck.correct>=6?'Outstanding. That is mastery.':deck.correct>=4?'Solid. Replay the sessions you missed and try again.':'Go back through the week and come back stronger.'}</p></div>`;
    $('#segs').innerHTML=deck.cards.map(()=>'<i class="on"></i>').join(''); $('#dPrev').style.visibility='hidden'; } });
  openCards(cards);
}
function openReview(){
  const qs=pool(true).slice(0,5); const today=new Date(); const key='r'+today.getFullYear()+String(today.getMonth()+1).padStart(2,'0')+String(today.getDate()).padStart(2,'0');
  const already=rec(key)&&rec(key).v;
  const cards=qs.map((q,k)=>mcCard(q.q,q.o,q.a,q.why,already?0:5,'Review · '+(k+1)+'/'+qs.length));
  cards.push({ html:'', next:'Done', mount(el){
    if(!already){ MOM.setRec(key,{s:deck.correct,x:deck.xp}); }
    el.innerHTML=`<div class="result"><div class="kicker">Quick Review</div><div class="big">${deck.correct}/${qs.length}</div><div class="kicker" style="margin-top:6px">${already?'Review XP already earned today':'+'+deck.xp+' XP'}</div><p class="lead" style="margin-top:22px">Come back tomorrow. Spaced review is how it sticks.</p></div>`;
    $('#segs').innerHTML=deck.cards.map(()=>'<i class="on"></i>').join(''); $('#dPrev').style.visibility='hidden'; } });
  openCards(cards);
}

renderHome(); MOM.on(()=>{ if(!deck) renderHome(); });
const m=location.hash.match(/^#s-(\d+)$/); if(m && S[+m[1]-1] && unlocked(+m[1])) openSession(+m[1]);
if(location.hash==='#play') history.replaceState(null,'',location.pathname);
})();
</script>
</body>
