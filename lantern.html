<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An emotional road map for people who have so much and still feel the space.">
<title>Lantern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<style>
/* Layout: one lit column in a dark room. Every station is a single centered page; a thin line of light at the top shows how far the lantern has walked. Single-theme by choice: this is a night piece. */
:root{
  --ink:#090a10;        /* the room */
  --ink-2:#10121b;      /* raised surfaces */
  --fog:#1b1e2b;        /* borders, dividers */
  --bone:#e9e3d6;       /* text */
  --dust:#8f8b93;       /* secondary text */
  --lantern:#e3a95b;    /* the one warm light */
  --lantern-soft:rgba(227,169,91,.16);
  --water:#7f9fc2;      /* cool secondary, used sparingly */
  --display:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --body:'Source Serif 4', Georgia, 'Times New Roman', serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--lantern);outline-offset:3px;border-radius:4px}
a{color:var(--lantern)}

/* ambient grain + vignette */
#grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background:radial-gradient(120% 90% at 50% 20%, rgba(227,169,91,.07), transparent 60%),
             radial-gradient(100% 100% at 50% 100%, rgba(0,0,0,.6), transparent 60%)}

/* progress light */
#progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:var(--fog);z-index:11}
#progress i{display:block;height:100%;width:0;background:var(--lantern);box-shadow:0 0 12px 2px rgba(227,169,91,.45);transition:width .6s ease}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:56px 48px}

.screen{animation:rise .7s ease both}
.screen.leaving{animation:sink .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sink{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.screen,.screen.leaving{animation:none}#progress i{transition:none}}

.eyebrow{font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust);margin:0 0 18px}
.eyebrow b{color:var(--lantern);font-weight:500}
h1,h2{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,10vw,64px);line-height:1;letter-spacing:.01em}
h2{font-size:clamp(28px,6.2vw,36px);line-height:1.15}
h2 em,.lead em{font-style:italic;color:var(--lantern)}
.lead{font-family:var(--display);font-size:clamp(21px,4.8vw,25px);line-height:1.35;color:var(--bone);margin:14px 0 0}
p{margin:0}
.muted{color:var(--dust)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid var(--lantern);color:var(--lantern);border-radius:999px;letter-spacing:.06em;font-size:15px;transition:background .2s,color .2s}
.btn:hover{background:var(--lantern);color:var(--ink)}
.btn.ghost{border-color:var(--fog);color:var(--dust)}
.btn.ghost:hover{background:var(--ink-2);color:var(--bone)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* options */
.options{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.opt{text-align:left;padding:16px 18px 16px 22px;border:1px solid var(--fog);border-left:2px solid var(--fog);background:var(--ink-2);border-radius:6px;line-height:1.45;font-size:16.5px;color:var(--bone);transition:border-color .2s,background .2s,transform .2s}
.opt:hover{border-left-color:var(--lantern);background:#141726}
.opt.picked{border-color:var(--lantern);border-left-color:var(--lantern);background:var(--lantern-soft);transform:translateX(2px)}
.options.revealed .opt{animation:rise .6s ease both}
.options.revealed .opt:nth-child(2){animation-delay:.08s}.options.revealed .opt:nth-child(3){animation-delay:.16s}.options.revealed .opt:nth-child(4){animation-delay:.24s}.options.revealed .opt:nth-child(5){animation-delay:.32s}

/* image stations */
.scene{margin-top:22px;border-radius:8px;overflow:hidden;border:1px solid var(--fog);background:#000;aspect-ratio:4/3;max-width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.scene svg{display:block;width:100%;height:100%}
.caption{font-family:var(--display);font-style:italic;font-size:19px;color:var(--dust);margin-top:14px}

/* sound stations */
.player{margin-top:22px;border:1px solid var(--fog);background:var(--ink-2);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px}
.player-top{display:flex;align-items:center;gap:16px}
.play{width:58px;height:58px;border-radius:50%;border:1px solid var(--lantern);color:var(--lantern);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.play:hover,.play.on{background:var(--lantern);color:var(--ink)}
.play svg{width:20px;height:20px;fill:currentColor}
.player-title{font-family:var(--display);font-size:22px;line-height:1.15}
.player-sub{color:var(--dust);font-size:13.5px;margin-top:3px}
canvas.viz{width:100%;height:54px;display:block;border-radius:4px}
.headphones{display:flex;gap:10px;align-items:center;color:var(--dust);font-size:13.5px}
.headphones svg{width:18px;height:18px;flex:none;stroke:var(--lantern);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.listen-note{color:var(--dust);font-style:italic;font-family:var(--display);font-size:18px;margin-top:22px;min-height:1.4em}

/* chapter interludes */
.breath{display:grid;place-items:center;margin:28px auto 34px;width:180px;height:180px}
.breath i{display:block;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle, rgba(227,169,91,.9), rgba(227,169,91,.15) 60%, transparent 72%);animation:breathe 8s ease-in-out infinite;box-shadow:0 0 40px rgba(227,169,91,.35)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(2.6);opacity:1}}
@media (prefers-reduced-motion:reduce){.breath i{animation:none;transform:scale(1.8)}}

/* threshold */
.flame{width:22px;height:34px;margin-bottom:26px}
.flame path{fill:var(--lantern);transform-origin:50% 100%;animation:flicker 2.8s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1)}30%{transform:scaleY(1.08) scaleX(.94)}60%{transform:scaleY(.95) scaleX(1.05)}}
@media (prefers-reduced-motion:reduce){.flame path{animation:none}}
.rule{height:1px;background:var(--fog);margin:30px 0}
.fine{font-size:13.5px;color:var(--dust);line-height:1.5}

/* reading */
.reading .name{font-size:clamp(40px,9vw,58px);line-height:1;margin-top:8px}
.reading .tag{font-family:var(--display);font-style:italic;font-size:24px;color:var(--lantern);margin-top:10px}
.section{margin-top:30px}
.section .eyebrow{margin-bottom:8px}
.section p{font-size:17px;line-height:1.6}
.keep{margin-top:34px;padding:26px 24px;border:1px solid var(--lantern);border-radius:8px;background:var(--lantern-soft);font-family:var(--display);font-size:clamp(24px,5.4vw,30px);line-height:1.25;text-wrap:balance}
.map{margin-top:34px;display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:14px}
.row span{color:var(--dust)}
.row.lead-row span{color:var(--bone)}
.bar{height:4px;background:var(--fog);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dust);border-radius:2px;width:0;transition:width 1.2s ease}
.row.lead-row .bar i{background:var(--lantern);box-shadow:0 0 10px rgba(227,169,91,.5)}
.second{margin-top:30px;padding-left:18px;border-left:2px solid var(--fog)}
.second .eyebrow{margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:420px){.row{grid-template-columns:120px 1fr}.player{padding:16px}}
</style>
</head>
<body>

<div id="grain"></div>
<div id="progress"><i></i></div>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast">Copied</div>

<script>
/* ============================================================
   LANTERN — an emotional road map for people who have a lot
   and still feel the space.
   Patterns are drawn from schema therapy, attachment research,
   and the literature on childhood emotional neglect. They are
   mirrors, not diagnoses.
   ============================================================ */

const P = {
  per:{ name:'The Performer', tag:'Loved for what you do.',
    opening:"Somewhere early, you learned that doing well was how you got to be close to people. So you did well. You kept doing well. And at some point the doing became the only language you trusted, because love you had to earn was the only love that felt real.",
    origin:"This often grows in homes where the warmth was real but arrived most reliably after a win. Nobody meant to teach you that you were a performance. They were proud of you, and pride is loud, and the quiet moments where you were simply there got less airtime. Children are brilliant at learning what works. You learned.",
    void:"The space you feel isn't the absence of achievement. It's that the achievements were never meant to fill it in the first place. You've been pouring into a glass that isn't yours. The part of you that was supposed to be loved for nothing is still waiting its turn, and every trophy walks right past it.",
    want:"To be seen on an ordinary Tuesday. To be chosen on a day you didn't win anything. To rest without sending an invoice.",
    door:"This week, tell one person something you did badly, or didn't do at all, and let the conversation go on anyway. Notice that they stay.",
    keep:"You were never the work. You were the one doing it.",
    second:"When things go quiet, you reach for the next thing to earn." },
  for:{ name:'The Fortress', tag:'Wanting closeness. Building walls.',
    opening:"You want people. That's the part no one sees, maybe not even you. You want to be known the way other people seem to be known, and every time someone gets close enough to do it, something in you reaches for the lock. It isn't a decision. It's faster than a decision.",
    origin:"Walls get built by people who needed them once. Maybe there was a moment, or a season, when being open cost you something, and you were young enough that the lesson went in deep. Maybe the people who loved you were also the people you learned to manage. The wall worked. That's the problem with walls that work: they don't know when to come down.",
    void:"The space is the room on the other side of the wall. It's where the people are. You can hear them. You've spent so long being safe that safe has become its own kind of alone, and it's hard to tell anymore whether you're protecting something or guarding an empty room.",
    want:"To be let in without having to open the door yourself. To be found. To not have to be brave about it.",
    door:"Pick the person who has stayed the longest. Tell them one true thing you'd normally keep. Something small. Let them have it.",
    keep:"The wall kept you alive. It doesn't get to keep you company.",
    second:"When someone gets close, part of you reaches for the lock." },
  kee:{ name:'The Keeper', tag:'Holding everyone. Held by no one.',
    opening:"You're the one people call. You know where everything is, how everyone's doing, what needs to happen next. You're good at it, and being good at it has quietly become the entire shape of your life. When someone asks what you need, the honest answer is that you stopped checking a long time ago.",
    origin:"Keepers are often made young, in homes where someone needed looking after and you were the one who noticed. Perhaps a parent was stretched thin, or sad, or simply needed you to be okay so they could manage. You became okay. You became useful. Being needed was the closest thing to being held, so you learned to be needed everywhere.",
    void:"The space is the place where someone should be holding you. You built your worth on carrying, and the thing about carrying is that nobody thinks to ask if your arms are tired. The loneliness of the Keeper is specific: you are surrounded by people who love you and not one of them knows how to take care of you, because you never let them learn.",
    want:"To be asked how you are, and to have someone wait for the real answer. To put something down and have it stay down. To be the one who gets checked on.",
    door:"Ask one person for one small thing this week that you could easily do yourself. Then let them do it, badly if they must, and don't fix it.",
    keep:"You don't have to be useful to be kept.",
    second:"You take care of the room before you check whether you're in it." },
  uns:{ name:'The Unseen', tag:'Loved, but never quite known.',
    opening:"Your childhood was fine. You'll say that first, and you'll mean it. There was food, there were birthdays, there was love. And yet you carry a loneliness you can't trace to any single thing, which makes it feel illegitimate, which makes you carry it alone. That is the whole trick of it.",
    origin:"There's a kind of neglect that leaves no marks because nothing bad happened. The feelings simply weren't noticed. Nobody asked what was going on inside you, not out of cruelty, but because no one had asked them either. You learned that your inner life wasn't a thing people looked at. So you stopped looking too. Psychologists call it emotional neglect. You probably just called it normal.",
    void:"The space is your own inner world, waiting to be visited. You feel far from people because you're far from the part of you that would connect. When someone asks what you want or what you feel, the blank isn't because there's nothing there. It's because no one ever showed you the way in.",
    want:"To be noticed without having to perform the noticing. For someone to say “you seem sad” and be right. To feel your feelings while they're happening, not three days later in the car.",
    door:"Three times a day, stop and name what you feel in one word, even if the word is “nothing.” You're not fixing anything. You're introducing yourself.",
    keep:"Nothing happened to you, and it still counts.",
    second:"You were loved in a house where feelings weren't really looked at." },
  cha:{ name:'The Chameleon', tag:'Becoming whoever the room needs.',
    opening:"People like you. Everywhere you go, you read the room in seconds and become what fits. You're easy, you're warm, you're whoever they were hoping for. And somewhere under all those versions, there's a quiet suspicion that no one has ever actually met you. Including you.",
    origin:"Chameleons learn early that the real self is negotiable and approval is not. Maybe love in your house had a mood to match. Maybe being agreeable kept the peace. Maybe you were simply so good at reading people that you never had to risk being read. Adaptation is a gift. It's also where you went to hide.",
    void:"The space is the self you keep trading away. Being liked by everyone turns out to feel nothing like being loved by anyone, because the one being liked is a performance you're exhausted from running. You can't feel chosen if you never showed up as yourself to be chosen.",
    want:"To disappoint someone and survive it. To say “I don't actually like that” out loud. To be loved in a way that would still be there if you stopped adjusting.",
    door:"This week, give one honest opinion you'd normally soften. Watch what happens. Most people don't leave. The ones who do were only ever there for the costume.",
    keep:"The one they'd meet if you stopped is the one worth meeting.",
    second:"You read the room so fast you forget to bring yourself into it." },
  wat:{ name:'The Watcher', tag:'Living your life from the next room.',
    opening:"You're in your life, technically. You're at the dinner, the wedding, the summit, the bed. And some part of you is slightly above it, narrating, observing, noting that this is the moment you're supposed to feel something. The feeling arrives late, or faint, or not at all. People say you're calm. You know it's something else.",
    origin:"Watching is what a nervous system does when feeling became too much, too early, or too often. It may not have been one big thing. It may have been a slow lesson that emotions were inconvenient, dangerous, or simply unwelcome, so you learned to step out of the room where they lived. The stepping out saved you. It just never let you back in.",
    void:"The space is the distance between you and your own life. The emptiness isn't an absence of feeling. The feelings are all there, on the other side of the glass. You've just spent so long watching that your body no longer trusts it's allowed to be inside the moment.",
    want:"To be hit by something and not step back. To cry at the right time, with the right person, and stay. To be in the room.",
    door:"The next time you catch yourself watching, put a hand flat on something solid and say, quietly, where you are. The floor, the chair, the person. Come back for ten seconds. That's enough to start.",
    keep:"You didn't lose the feeling. You stepped out of the room, and the door is still open.",
    second:"Big moments reach you a little late, and a little faint." },
  fla:{ name:'The Flaw', tag:'Sure that if they really knew you.',
    opening:"You could be loved by a thousand people and still believe each of them is making a mistake. There's a verdict in you, older than any evidence, that says something at the center is wrong, and that everything good in your life is a clerical error waiting to be caught. You work very hard to not be caught.",
    origin:"Shame this deep is usually learned, not born. Somewhere, you took in the message that you were too much, or not enough, or that being yourself was something to apologize for. It may have been said. It may only have been felt, in the way a sigh lands on a child. Children can't conclude that the adults were wrong. They conclude that they are.",
    void:"The space is where your own worth should sit. You keep trying to fill it from outside, with approval, with success, with being good, and none of it holds, because the verdict was never about any of those things. The void isn't that no one loves you. It's that you can't let it in past the bouncer.",
    want:"To be seen all the way through and have the person stay. To stop auditioning. To believe one kind thing someone says about you for a whole day.",
    door:"Write down one thing someone has said about you that you deflected. Read it tonight. Don't argue with it. Just let it sit in the room with you.",
    keep:"The verdict was wrong. It was always someone else's weather.",
    second:"Kind words bounce off something in you before they can land." },
  lea:{ name:'The First to Leave', tag:'Leaving before you can be left.',
    opening:"You're good at endings. You see them coming from a long way off, and you make sure you're already halfway out the door when they arrive. People remember you as easy to be with and hard to keep. What they don't see is the quiet part: you wanted to stay. Every time.",
    origin:"Somewhere, you learned that people go. Maybe someone did. Maybe someone was there in body and gone in every other way. Maybe the going was slow and ordinary, so no one called it a loss. Your nervous system called it one. It decided that the only safe way to love is with your coat on.",
    void:"The space is the relationship you never let reach its middle. You live in beginnings and endings, and the part in between, where people become known and chosen and ordinary, is exactly the part you've never let yourself have. You're lonely because you keep leaving before the loneliness could be cured.",
    want:"To be left and survive it. To stay past the point where it gets scary and find out what's there. To be the one who was chosen when things got boring.",
    door:"Pick one connection you've been quietly shrinking. Reach out. Don't make it a big thing. Just don't be the first one to go this time.",
    keep:"Staying is also a thing you can be good at.",
    second:"You keep one foot out the door, just in case." }
};
const KEYS = Object.keys(P);

/* ---------- WORD STATIONS ---------- */
const U = [ // universal, chapter one
 {q:"When someone asks how you're <em>really</em> doing, what actually happens?", o:[
  ["I say “good” and mean it, mostly. I just don't know what else there is to say.",{uns:2,wat:1}],
  ["I turn it around and ask about them.",{kee:2,cha:1}],
  ["I give them the version that fits what they want to hear.",{cha:2,per:1}],
  ["I feel something close, like a door shutting.",{for:2,fla:1}],
  ["I honestly don't know. I'd have to think about it, and I don't.",{wat:2,uns:1}]]},
 {q:"Picture the moment you were most proud. <em>Who was there?</em>", o:[
  ["Everyone. And it still felt like it was happening to someone else.",{wat:2,per:1}],
  ["People who were proud of what I did. I'm not sure anyone saw me.",{per:2,uns:1}],
  ["No one who mattered. I'd already stopped expecting that.",{lea:2,uns:1}],
  ["I was proud for about an hour. Then I needed the next one.",{per:2,fla:1}],
  ["I don't remember being proud. I remember relief.",{fla:2,per:1}]]},
 {q:"Growing up, feelings in your house were…", o:[
  ["Fine, as long as they were the good ones.",{uns:2,cha:1}],
  ["Mine to handle. Everyone else had enough going on.",{kee:2,uns:1}],
  ["Never really discussed. We were loved. We just didn't talk like that.",{uns:3}],
  ["Something that could get you in trouble.",{for:2,fla:1}],
  ["Loud. I learned to be the calm one.",{kee:1,wat:2}]]},
 {q:"Someone you like starts getting close. The first thing you notice is…", o:[
  ["A pull to become whatever they'd want.",{cha:2,fla:1}],
  ["A countdown. I'm already bracing for when it ends.",{lea:3}],
  ["That I'm performing, and I'm not sure where the real me went.",{cha:1,wat:1,per:1}],
  ["A wall going up that I didn't build on purpose.",{for:3}],
  ["Nothing yet. I feel things later, alone, if at all.",{wat:2,uns:1}]]},
 {q:"What does <em>rest</em> feel like?", o:[
  ["Like something I have to earn and never quite do.",{per:3}],
  ["Uncomfortable. Quiet makes the noise louder.",{wat:2,fla:1}],
  ["Like a job. I'm usually making sure everyone else is resting.",{kee:3}],
  ["Fine. I just don't know what I'm supposed to feel while doing it.",{uns:2}],
  ["Dangerous. If I stop, I might feel it.",{for:1,wat:1,fla:1}]]},
 {q:"Finish the sentence. <em>“If people really knew me…”</em>", o:[
  ["…they'd see there's less here than they think.",{fla:3}],
  ["…they'd leave. So I keep it light.",{lea:2,for:1}],
  ["…they'd be disappointed. The version they have is better.",{cha:2,fla:1}],
  ["…they'd be surprised how much I hold for them.",{kee:2}],
  ["…I'd have to know me first.",{wat:2,uns:1}]]},
 {q:"When you cry, which is rare or isn't, it's usually…", o:[
  ["At a movie or a song. Something safely not about me.",{uns:2,wat:1}],
  ["Alone, after I've been strong for everyone.",{kee:2,for:1}],
  ["When I feel I've let someone down.",{per:2,fla:1}],
  ["I don't. I used to.",{wat:2,for:1}],
  ["When someone is kind to me for no reason.",{uns:2,fla:1}]]},
 {q:"The success, the people, the good life. And still, something. <em>What's the shape of it?</em>", o:[
  ["A hum under everything. Like a room I can't find the door to.",{uns:2,wat:1}],
  ["A treadmill. Arriving never lasts.",{per:3}],
  ["A window. I can see the warmth. I'm on the wrong side of the glass.",{for:2,uns:1}],
  ["A stage. I'm never sure who they're actually clapping for.",{cha:2,fla:1}],
  ["An exit sign. I'm always half-looking for it.",{lea:2,wat:1}]]}
];

const T = [ // targeted, chapters two and three. t = which patterns the question separates
 {t:['per','fla'], q:"A friend tells you to take the week off. No consequences, no catch.", o:[
  ["I'd spend it worrying about what I was supposed to be doing.",{per:3}],
  ["I'd feel like a fraud for taking it.",{fla:3}],
  ["I'd fill it with something productive and call that rest.",{per:2,kee:1}],
  ["I'd enjoy it. And feel guilty that I enjoyed it.",{fla:2,per:1}]]},
 {t:['for','lea'], q:"Someone says, <em>“I'm not going anywhere.”</em> Your gut says…", o:[
  ["Everyone says that.",{lea:3}],
  ["I'd like to believe you. I just won't let myself.",{for:3}],
  ["Okay. But I'll keep one foot out, just in case.",{lea:2,for:1}],

  function env(g,t,peak,att,dec){ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec); }
  function tone(freq,type,peak,att,dec,out,t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=freq; env(g,t,peak,att,dec); o.connect(g).connect(out); o.start(t); o.stop(t+att+dec+.05); return o; }
  function reverb(seconds,decay){ const len=ctx.sampleRate*seconds, buf=ctx.createBuffer(2,len,ctx.sampleRate); for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } const cv=ctx.createConvolver(); cv.buffer=buf; return cv; }

  const scapes={
    rain(out){ const n=noise('pink'), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; const g=ctx.createGain(); g.gain.value=.7;
      const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=.25; lfo.connect(lg).connect(g.gain);
      n.connect(lp).connect(g).connect(out); n.start(); lfo.start();
      const t=setInterval(()=>{ tone(1600+Math.random()*1800,'sine',.05,.004,.12,out,ctx.currentTime); },260+Math.random()*600);
      const t2=setInterval(()=>{ tone(600+Math.random()*300,'triangle',.02,.01,.4,out,ctx.currentTime); },1800+Math.random()*2600);
      return ()=>{ clearInterval(t); clearInterval(t2); n.stop(); lfo.stop(); }; },
    room(out){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=.7; const g=ctx.createGain(); g.gain.value=.22; lp.connect(g).connect(out);
      const chords=[[220,261.6,329.6],[174.6,220,261.6],[130.8,164.8,196],[196,246.9,293.7]]; let i=0;
      function play(){ const t=ctx.currentTime; chords[i%4].forEach(f=>{ const o=ctx.createOscillator(), og=ctx.createGain(); o.type='triangle'; o.frequency.value=f; o.detune.value=(Math.random()-.5)*8;
        og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(.5,t+.9); og.gain.setValueAtTime(.5,t+2.3); og.gain.linearRampToValueAtTime(0,t+3.4); o.connect(og).connect(lp); o.start(t); o.stop(t+3.5); }); i++; }
      play(); const t=setInterval(play,3400);
      const m=noise('pink'), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=330; bp.Q.value=1.2; const mg=ctx.createGain(); mg.gain.value=.35;
      const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.type='sine'; lfo.frequency.value=.9; lg.gain.value=.18; lfo.connect(lg).connect(mg.gain);
      m.connect(bp).connect(mg).connect(out); m.start(); lfo.start();
      return ()=>{ clearInterval(t); m.stop(); lfo.stop(); }; },
    heart(out){ const sea=noise('pink'), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.11; lg.gain.value=300; lfo.connect(lg).connect(lp.frequency);
      const sg=ctx.createGain(); sg.gain.value=.55; sea.connect(lp).connect(sg).connect(out); sea.start(); lfo.start();
      const t=setInterval(()=>{ const now=ctx.currentTime; tone(52,'sine',.9,.012,.16,out,now); tone(48,'sine',.6,.012,.14,out,now+.2); },900);
      return ()=>{ clearInterval(t); sea.stop(); lfo.stop(); }; },
    note(out){ const rv=reverb(3.2,3), rg=ctx.createGain(); rg.gain.value=.9; rv.connect(rg).connect(out); const dry=ctx.createGain(); dry.gain.value=.35; dry.connect(out);
      let n=0; function hit(){ const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=440; env(g,t,.5,.015,2.2); o.connect(g); g.connect(rv); g.connect(dry); o.start(t); o.stop(t+2.4);
        if(n>=8 && n%2===0){ const o2=ctx.createOscillator(), g2=ctx.createGain(); o2.type='sine'; o2.frequency.value=329.6; env(g2,t+1.1,.22,.02,2.2); o2.connect(g2); g2.connect(rv); o2.start(t+1.1); o2.stop(t+3.5); } n++; }
      hit(); const t=setInterval(hit,2400); return ()=>{ clearInterval(t); }; },
    dawn(out){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; const pad=ctx.createGain(); pad.gain.setValueAtTime(0,ctx.currentTime); pad.gain.linearRampToValueAtTime(.16,ctx.currentTime+16); lp.connect(pad).connect(out);
      const oscs=[]; [146.8,220,370,587.3].forEach(f=>{ [0,4].forEach(dt=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=dt; const vg=ctx.createGain(); vg.gain.value=.5; const v=ctx.createOscillator(), vgn=ctx.createGain(); v.frequency.value=.15+Math.random()*.2; vgn.gain.value=2; v.connect(vgn).connect(o.detune); o.connect(vg).connect(lp); o.start(); v.start(); oscs.push(o,v); }); });
      const rv=reverb(2.5,2.5), rg=ctx.createGain(); rg.gain.value=.6; rv.connect(rg).connect(out);
      const bells=setInterval(()=>{ tone([1174.7,1480,1760][Math.floor(Math.random()*3)],'sine',.08,.01,2.4,rv,ctx.currentTime); },4200+Math.random()*2500);
      const birds=setInterval(()=>{ const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(2300,t); o.frequency.exponentialRampToValueAtTime(3600,t+.07); o.frequency.exponentialRampToValueAtTime(2700,t+.16); env(g,t,.035,.01,.18); o.connect(g).connect(rv); o.start(t); o.stop(t+.25);
        setTimeout(()=>{ const t2=ctx.currentTime, o2=ctx.createOscillator(), g2=ctx.createGain(); o2.type='sine'; o2.frequency.setValueAtTime(2800,t2); o2.frequency.exponentialRampToValueAtTime(3900,t2+.06); env(g2,t2,.03,.01,.14); o2.connect(g2).connect(rv); o2.start(t2); o2.stop(t2+.2); },220); },1800+Math.random()*2600);
      return ()=>{ clearInterval(bells); clearInterval(birds); oscs.forEach(o=>{ try{o.stop()}catch(e){} }); }; }
  };

  function play(name){ ensure(); stop(true); const bus=ctx.createGain(); bus.gain.value=1; bus.connect(master); const stopFn=scapes[name](bus); live={stopFn,bus};
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value,ctx.currentTime); master.gain.linearRampToValueAtTime(1,ctx.currentTime+1.6); }
  function stop(instant){ if(!live) return; const l=live; live=null; if(instant){ try{l.stopFn()}catch(e){} try{l.bus.disconnect()}catch(e){} master.gain.setValueAtTime(0,ctx.currentTime); return; }
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value,ctx.currentTime); master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.2);
    setTimeout(()=>{ try{l.stopFn()}catch(e){} try{l.bus.disconnect()}catch(e){} },1300); }
  function levels(arr){ if(!analyser) return false; analyser.getByteFrequencyData(arr); return true; }
  return {ensure,play,stop,levels,get playing(){return !!live}};
})();

/* ---------- JOURNEY ---------- */
const CHAPTERS=[
  {num:'I', name:'The Threshold', line:'There are no right answers here. Pick what is true, not what is nice.'},
  {num:'II', name:'The Rooms', line:'The lantern has found a direction. We walk closer now.'},
  {num:'III', name:'The Door', line:'Only a few more. Slow down. Let the last ones land.'}
];
const TOTAL=28;
let S={ screen:'threshold', chapter:0, idx:0, stations:[], usedT:new Set(), scores:{}, step:0, picks:[] };
KEYS.forEach(k=>S.scores[k]=0);

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ranked(){ return KEYS.slice().sort((a,b)=>S.scores[b]-S.scores[a]); }
function pickT(top,n){ const want=new Set(top); const pool=T.map((q,i)=>({q,i})).filter(x=>!S.usedT.has(x.i)).map(x=>({...x,hit:x.q.t.filter(k=>want.has(k)).length})).filter(x=>x.hit>0);
  const sorted=shuffle(pool).sort((a,b)=>b.hit-a.hit).slice(0,n); sorted.forEach(x=>S.usedT.add(x.i)); return sorted.map(x=>({type:'word',data:x.q})); }
function buildChapter(c){
  if(c===0){ const w=shuffle(U).map(q=>({type:'word',data:q})); return [w[0],w[1],{type:'img',key:'window'},w[2],w[3],{type:'snd',key:'rain'},w[4],{type:'img',key:'table'},w[5],w[6],w[7]]; }
  if(c===1){ const w=pickT(ranked().slice(0,3),5); return [w[0],{type:'img',key:'hands'},w[1],{type:'snd',key:'room'},w[2],{type:'img',key:'door'},w[3],{type:'snd',key:'heart'},w[4],{type:'img',key:'summit'}]; }
  const w=pickT(ranked().slice(0,2),3); return [w[0],{type:'img',key:'mask'},w[1],{type:'snd',key:'note'},w[2],{type:'img',key:'field'},{type:'snd',key:'dawn'}];
}

/* ---------- RENDER ---------- */
const app=document.getElementById('app');
function setProgress(){ document.querySelector('#progress i').style.width=(Math.min(S.step,TOTAL)/TOTAL*100)+'%'; }
function swap(html,after){ const cur=app.firstElementChild; const go=()=>{ app.innerHTML=`<div class="screen">${html}</div>`; window.scrollTo({top:0,behavior:'instant'}); if(after) after(app.firstElementChild); };
  if(cur && !matchMedia('(prefers-reduced-motion: reduce)').matches){ cur.classList.add('leaving'); setTimeout(go,330); } else go(); }
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function threshold(){
  Audio.stop(true); S.screen='threshold';
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('lantern.reading')||'null'); }catch(e){}
  swap(`
    <svg class="flame" viewBox="0 0 22 34" aria-hidden="true"><path d="M11 0c2 7 9 10 9 19a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 3 4 3 7 0 0 2-3 2-15z"/></svg>
    <h1>Lantern</h1>
    <p class="lead">For the ones who have so much, <em>and still feel the space.</em></p>
    <div class="rule"></div>
    <div class="stack">
      <p>You were loved. Things went well. By every outside measure, your life works. And still, around people, around family, in the middle of a good day, there's a quiet that doesn't have a name.</p>
      <p>This is a walk through that quiet. Twenty-eight small stations: questions, drawn scenes, and sounds. At each one, you choose what resonates. Nothing is scored right or wrong. The lantern just notices where you keep looking, and at the end it reads back what it found.</p>
      <p class="muted">About ten minutes. It adapts as you go, so two people rarely walk the same path.</p>
      <div class="headphones"><svg viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="13" width="4" height="7" rx="1.5"/><rect x="17" y="13" width="4" height="7" rx="1.5"/></svg><span>Headphones on. The sound stations don't work on a tiny speaker.</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="begin">Begin the walk</button>
      ${saved?`<button class="btn ghost" id="resume">Return to your reading</button>`:''}
    </div>
    <div class="rule"></div>
    <p class="fine">Lantern is a mirror, not a diagnosis, and not a replacement for a therapist. It isn't built for fresh grief or acute crisis. If you're in the US and in danger right now, call or text 988.</p>
  `, root=>{
    root.querySelector('#begin').onclick=()=>{ Audio.ensure(); start(); };
    const r=root.querySelector('#resume'); if(r) r.onclick=()=>{ S.scores=saved.scores; reading(); };
  });
}

function start(){ S={ screen:'walk', chapter:0, idx:0, stations:[], usedT:new Set(), scores:{}, step:0, picks:[] }; KEYS.forEach(k=>S.scores[k]=0); setProgress(); interlude(0); }

function interlude(c){
  S.chapter=c; S.stations=buildChapter(c); S.idx=0; const ch=CHAPTERS[c];
  swap(`
    <p class="eyebrow">Chapter <b>${ch.num}</b> of III</p>
    <h2>${ch.name}</h2>
    <div class="breath" aria-hidden="true"><i></i></div>
    <p class="lead" style="margin:0">${ch.line}</p>
    <p class="muted" style="margin-top:14px">Breathe in as the light grows. Out as it fades.</p>
    <div class="actions"><button class="btn" id="go" disabled>Walk on</button></div>
  `, root=>{ const b=root.querySelector('#go'); setTimeout(()=>{ b.disabled=false; },matchMedia('(prefers-reduced-motion: reduce)').matches?300:5000); b.onclick=()=>station(); });
}

function station(){
  const st=S.stations[S.idx]; if(!st){ if(S.chapter<2) return interlude(S.chapter+1); return reading(); }
  const ch=CHAPTERS[S.chapter]; const eyebrow=`<p class="eyebrow"><b>${ch.name}</b> &nbsp;·&nbsp; ${S.idx+1} of ${S.stations.length}</p>`;
  if(st.type==='word'){ const q=st.data;
    swap(`${eyebrow}<h2>${q.q}</h2>${optionsHTML(q.o)}`, root=>wireOptions(root,q.o)); }
  else if(st.type==='img'){ const im=IMG[st.key];
    swap(`${eyebrow}<h2>Look. Sit with it for a moment.</h2><div class="scene">${im.svg()}</div><p class="caption">${im.title}. ${im.caption}</p><p class="lead" style="font-size:21px">What does it stir?</p>${optionsHTML(im.o)}`, root=>wireOptions(root,im.o)); }
  else { const sn=SND[st.key];
    swap(`${eyebrow}<h2>Listen. Eyes closed if you can.</h2>
      <div class="player"><div class="player-top"><button class="play" id="play" aria-label="Play"><svg viewBox="0 0 20 20" id="playIcon"><path d="M5 3l12 7-12 7z"/></svg></button><div><div class="player-title">${sn.title}</div><div class="player-sub">${sn.sub}</div></div></div><canvas class="viz" id="viz" width="600" height="54"></canvas></div>
      <p class="listen-note" id="note">Press play. Give it at least a few breaths before you answer.</p>
      <p class="lead" id="prompt" hidden style="font-size:21px">${sn.prompt}</p>
      <div id="opts" hidden>${optionsHTML(sn.o)}</div>`, root=>{
        const play=root.querySelector('#play'), icon=root.querySelector('#playIcon'), note=root.querySelector('#note'), opts=root.querySelector('#opts'), prompt=root.querySelector('#prompt');
        const cv=root.querySelector('#viz'), cx=cv.getContext('2d'); const buf=new Uint8Array(64); let raf, listened=0, lastT=0, revealed=false;
        const gate=matchMedia('(prefers-reduced-motion: reduce)').matches?2000:9000;
        function draw(ts){ raf=requestAnimationFrame(draw); if(Audio.playing){ if(lastT) listened+=ts-lastT; lastT=ts; } else lastT=0;
          cx.clearRect(0,0,cv.width,cv.height); const ok=Audio.levels(buf); const n=48, w=cv.width/n;
          for(let i=0;i<n;i++){ const v=ok&&Audio.playing?buf[i+2]/255:0.03; const h=Math.max(2,v*cv.height); cx.fillStyle=i<n*.5?'rgba(227,169,91,.9)':'rgba(227,169,91,.5)'; cx.fillRect(i*w+1,cv.height-h,w-2,h); }
          if(!revealed && listened>gate){ revealed=true; note.textContent='Stay as long as you like. When you\u2019re ready:'; prompt.hidden=false; opts.hidden=false; opts.firstElementChild.classList.add('revealed'); } }
        draw(0);
        play.onclick=()=>{ if(Audio.playing){ Audio.stop(); play.classList.remove('on'); icon.innerHTML='<path d="M5 3l12 7-12 7z"/>'; play.setAttribute('aria-label','Play'); }
          else { Audio.play(st.key); play.classList.add('on'); icon.innerHTML='<rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/>'; play.setAttribute('aria-label','Pause'); if(!revealed) note.textContent='Listening…'; } };
        wireOptions(root,sn.o,()=>{ cancelAnimationFrame(raf); Audio.stop(); });
      }); }
}
function optionsHTML(o){ return `<div class="options">${o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>`; }
function wireOptions(root,o,before){ root.querySelectorAll('.opt').forEach(b=>{ b.onclick=()=>{ if(root.dataset.locked) return; root.dataset.locked=1; b.classList.add('picked'); const w=o[+b.dataset.i][1]; Object.keys(w).forEach(k=>S.scores[k]+=w[k]); S.picks.push(b.textContent); S.step++; setProgress(); if(before) before(); setTimeout(()=>{ S.idx++; station(); },420); }; }); }

function reading(){
  Audio.stop(true); S.screen='reading'; const r=ranked(); const top=r[0], sec=r[1]; const p=P[top], s=P[sec];
  const max=Math.max(1,S.scores[top]); try{ localStorage.setItem('lantern.reading',JSON.stringify({scores:S.scores,when:Date.now()})); }catch(e){}
  swap(`<div class="reading">
    <p class="eyebrow">What the lantern found</p>
    <h1 class="name">${p.name}</h1>
    <p class="tag">${p.tag}</p>
    <div class="section"><p class="eyebrow">You might know this</p><p>${p.opening}</p></div>
    <div class="section"><p class="eyebrow">Where it often comes from</p><p>${p.origin}</p></div>
    <div class="section"><p class="eyebrow">What the space actually is</p><p>${p.void}</p></div>
    <div class="section"><p class="eyebrow">What your heart may be asking for</p><p>${p.want}</p></div>
    <div class="section"><p class="eyebrow">One small door</p><p>${p.door}</p></div>
    <div class="keep">“${p.keep}”</div>
    <div class="second"><p class="eyebrow">Also in you: <b>${s.name}</b></p><p class="muted">${s.second} The two often travel together. If the first reading didn't land, read ${s.name.replace('The ','the ')} instead.</p></div>
    <div class="map" aria-label="Your map">
      <p class="eyebrow" style="margin-bottom:4px">Your map</p>
      ${r.map(k=>`<div class="row ${k===top?'lead-row':''}"><span>${P[k].name}</span><div class="bar"><i data-w="${Math.round(S.scores[k]/max*100)}"></i></div></div>`).join('')}
    </div>
    <div class="rule"></div>
    <p class="fine">This is a mirror, not a diagnosis. The patterns come from schema therapy, attachment research, and the work on childhood emotional neglect. If something here hit hard, that's information, not a verdict. A therapist who works with attachment, schema therapy, or Internal Family Systems can take it further than a page can. Two books that go deeper: <i>Running on Empty</i> by Jonice Webb, and <i>Adult Children of Emotionally Immature Parents</i> by Lindsay Gibson.</p>
    <div class="actions"><button class="btn" id="copy">Copy my reading</button><button class="btn ghost" id="again">Walk it again</button></div>
  </div>`, root=>{
    requestAnimationFrame(()=>root.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'));
    root.querySelector('#again').onclick=start;
    root.querySelector('#copy').onclick=()=>{ const txt=`Lantern found: ${p.name}. ${p.tag}\n\n“${p.keep}”\n\nAlso in me: ${s.name}.\n\nLantern is a mirror, not a diagnosis.`;
      const done=()=>{ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); } else fallback(txt,done); };
    function fallback(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity=0; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
  });
}

/* boot (hot-update aware, falls back to a plain start) */
function boot(){ threshold(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Audio.stop(); });
</script>
</body>
</html>
