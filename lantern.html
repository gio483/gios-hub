<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An emotional road map for people who have so much and still feel the space.">
<title>Lantern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
/* Layout: one thing on screen at a time. A short line of words, two or three answers. The light at the top is the only measure of time. Single dark world by choice. */
:root{
  --ink:#07070c; --ink-2:#0e0f17; --fog:#1a1c29;
  --bone:#ece6d9; --dust:#8a8792;
  --lantern:#e3a95b; --lantern-soft:rgba(227,169,91,.14);
  --violet:#5b3fa0; --teal:#2fd3c0;
  --display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --body:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--lantern);outline-offset:3px;border-radius:4px}
a{color:var(--lantern)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 15%,rgba(91,63,160,.12),transparent 60%),radial-gradient(100% 100% at 50% 100%,rgba(0,0,0,.7),transparent 60%)}
#progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:var(--fog);z-index:11}
#progress i{display:block;height:100%;width:0;background:var(--lantern);box-shadow:0 0 14px 2px rgba(227,169,91,.5);transition:width .8s ease}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:56px 48px}
.screen{animation:rise .9s ease both}
.screen.leaving{animation:sink .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sink{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.screen,.screen.leaving{animation:none}#progress i{transition:none}}

.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin:0 0 22px}
.eyebrow b{color:var(--lantern);font-weight:500}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(46px,11vw,70px);line-height:.98;letter-spacing:.01em}
h2{font-size:clamp(34px,8.4vw,48px);line-height:1.08}
h2 em,.lead em{font-style:italic;color:var(--lantern)}
.lead{font-family:var(--display);font-size:clamp(22px,5vw,26px);line-height:1.3;margin:14px 0 0}
p{margin:0}.muted{color:var(--dust)}.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border:1px solid var(--lantern);color:var(--lantern);border-radius:999px;letter-spacing:.08em;font-size:14px;text-transform:uppercase;transition:background .25s,color .25s}
.btn:hover{background:var(--lantern);color:var(--ink)}
.btn.ghost{border-color:var(--fog);color:var(--dust);text-transform:none;letter-spacing:.02em;font-size:15px}
.btn.ghost:hover{background:var(--ink-2);color:var(--bone)}
.btn[disabled]{opacity:.3;pointer-events:none}

/* answers: few, large, quiet */
.options{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.opt{text-align:left;padding:18px 8px 18px 0;border:0;border-bottom:1px solid var(--fog);background:none;font-family:var(--display);font-size:clamp(23px,5.6vw,28px);line-height:1.2;color:var(--bone);transition:color .25s,padding-left .3s,border-color .3s;position:relative}
.opt::before{content:"";position:absolute;left:-18px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--lantern);transform:translateY(-50%) scale(0);transition:transform .3s;box-shadow:0 0 10px var(--lantern)}
.opt:hover{color:var(--lantern)}
.opt.picked{color:var(--lantern);padding-left:14px;border-color:var(--lantern)}
.opt.picked::before{left:0;transform:translateY(-50%) scale(1)}
.options.revealed .opt{animation:rise .7s ease both}
.options.revealed .opt:nth-child(2){animation-delay:.1s}.options.revealed .opt:nth-child(3){animation-delay:.2s}

/* scenes */
.scene{margin-top:24px;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%;box-shadow:0 40px 80px -30px rgba(0,0,0,1),0 0 0 1px rgba(255,255,255,.04)}
.scene{position:relative}.scene svg{display:block;width:100%;height:100%}.scene img,.scene svg.ov{position:absolute;inset:0;width:100%;height:100%}.scene img{object-fit:cover;animation:drift 46s ease-in-out infinite alternate;transform-origin:50% 60%}@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.2%,.8%)}}@media (prefers-reduced-motion:reduce){.scene img{animation:none}}
.caption{font-family:var(--display);font-style:italic;font-size:20px;color:var(--dust);margin-top:16px}

/* sound */
.player{margin-top:24px;border:1px solid var(--fog);background:var(--ink-2);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px}
.player-top{display:flex;align-items:center;gap:18px}
.play{width:64px;height:64px;border-radius:50%;border:1px solid var(--lantern);color:var(--lantern);display:grid;place-items:center;flex:none;transition:background .25s,color .25s,box-shadow .25s}
.play:hover,.play.on{background:var(--lantern);color:var(--ink);box-shadow:0 0 30px rgba(227,169,91,.35)}
.play svg{width:22px;height:22px;fill:currentColor}
.player-title{font-family:var(--display);font-size:26px;line-height:1.1}
.player-sub{color:var(--dust);font-size:13.5px;margin-top:4px}
canvas.viz{width:100%;height:60px;display:block}
.headphones{display:flex;gap:10px;align-items:center;color:var(--dust);font-size:13.5px}
.headphones svg{width:18px;height:18px;flex:none;stroke:var(--lantern);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.listen-note{color:var(--dust);font-style:italic;font-family:var(--display);font-size:19px;margin-top:22px;min-height:1.4em}

/* interludes */
.breath{display:grid;place-items:center;margin:30px auto 36px;width:200px;height:200px}
.breath i{display:block;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,rgba(227,169,91,.95),rgba(227,169,91,.12) 60%,transparent 72%);animation:breathe 8s ease-in-out infinite;box-shadow:0 0 50px rgba(227,169,91,.35)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(2.9);opacity:1}}
@media (prefers-reduced-motion:reduce){.breath i{animation:none;transform:scale(1.9)}}
.flame{width:22px;height:34px;margin-bottom:26px}
.flame path{fill:var(--lantern);transform-origin:50% 100%;animation:flicker 2.8s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1)}30%{transform:scaleY(1.08) scaleX(.94)}60%{transform:scaleY(.95) scaleX(1.05)}}
@media (prefers-reduced-motion:reduce){.flame path{animation:none}}
.rule{height:1px;background:var(--fog);margin:30px 0}
.fine{font-size:13.5px;color:var(--dust);line-height:1.5}

/* letter station */
textarea{width:100%;min-height:120px;margin-top:28px;background:transparent;border:0;border-bottom:1px solid var(--fog);color:var(--bone);font-family:var(--display);font-size:clamp(22px,5.4vw,26px);line-height:1.3;padding:8px 0;resize:vertical}
textarea::placeholder{color:var(--dust);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;align-items:center}

/* reading */
.reading .name{font-size:clamp(42px,10vw,64px);line-height:.98;margin-top:8px}
.reading .tag{font-family:var(--display);font-style:italic;font-size:25px;color:var(--lantern);margin-top:12px}
.section{margin-top:32px}.section .eyebrow{margin-bottom:8px}.section p{font-size:17px;line-height:1.6}
.keep{margin-top:36px;padding:28px 24px;border:1px solid var(--lantern);border-radius:6px;background:var(--lantern-soft);font-family:var(--display);font-size:clamp(25px,5.8vw,32px);line-height:1.22;text-wrap:balance}
.narr{margin-top:28px;display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--fog);background:var(--ink-2);border-radius:6px}.narr .player-title{font-size:22px}.narr .player-sub{margin-top:2px}
.letter{margin-top:36px;padding-left:18px;border-left:2px solid var(--lantern);font-family:var(--display);font-style:italic;font-size:22px;line-height:1.3;color:var(--bone)}
.letter .eyebrow{font-style:normal;margin-bottom:8px}
.map{margin-top:36px;display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:14px}
.row span{color:var(--dust)}.row.lead-row span{color:var(--bone)}
.bar{height:3px;background:var(--fog);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dust);width:0;transition:width 1.4s ease}
.row.lead-row .bar i{background:var(--lantern);box-shadow:0 0 10px rgba(227,169,91,.5)}
.second{margin-top:32px;padding-left:18px;border-left:2px solid var(--fog)}.second .eyebrow{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:420px){.row{grid-template-columns:118px 1fr}.player{padding:18px}}
</style>
</head>
<body>

<div id="grain"></div>
<div id="progress"><i></i></div>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast">Copied</div>

<script>
/* LANTERN — an emotional road map for people who have a lot and still feel the space.
   Patterns draw on schema therapy, attachment research and the work on childhood emotional neglect. Mirrors, not diagnoses. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const P = {
  per:{ name:'The Performer', tag:'Loved for what you do.',
    opening:"Somewhere early, you learned that doing well was how you got to be close to people. So you did well. You kept doing well. And at some point the doing became the only language you trusted, because love you had to earn was the only love that felt real.",
    origin:"This often grows in homes where the warmth was real but arrived most reliably after a win. Nobody meant to teach you that you were a performance. They were proud of you, and pride is loud, and the quiet moments where you were simply there got less airtime. Children are brilliant at learning what works. You learned.",
    void:"The space you feel isn't the absence of achievement. It's that the achievements were never meant to fill it in the first place. You've been pouring into a glass that isn't yours. The part of you that was supposed to be loved for nothing is still waiting its turn, and every trophy walks right past it.",
    want:"To be seen on an ordinary Tuesday. To be chosen on a day you didn't win anything. To rest without sending an invoice.",
    door:"This week, tell one person something you did badly, or didn't do at all, and let the conversation go on anyway. Notice that they stay.",
    keep:"You were never the work. You were the one doing it.",
    second:"When things go quiet, you reach for the next thing to earn." },
  for:{ name:'The Fortress', tag:'Wanting closeness. Building walls.',
    opening:"You want people. That's the part no one sees, maybe not even you. You want to be known the way other people seem to be known, and every time someone gets close enough to do it, something in you reaches for the lock. It isn't a decision. It's faster than a decision.",
    origin:"Walls get built by people who needed them once. Maybe there was a moment, or a season, when being open cost you something, and you were young enough that the lesson went in deep. Maybe the people who loved you were also the people you learned to manage. The wall worked. That's the problem with walls that work: they don't know when to come down.",
    void:"The space is the room on the other side of the wall. It's where the people are. You can hear them. You've spent so long being safe that safe has become its own kind of alone, and it's hard to tell anymore whether you're protecting something or guarding an empty room.",
    want:"To be let in without having to open the door yourself. To be found. To not have to be brave about it.",
    door:"Pick the person who has stayed the longest. Tell them one true thing you'd normally keep. Something small. Let them have it.",
    keep:"The wall kept you alive. It doesn't get to keep you company.",
    second:"When someone gets close, part of you reaches for the lock." },
  kee:{ name:'The Keeper', tag:'Holding everyone. Held by no one.',
    opening:"You're the one people call. You know where everything is, how everyone's doing, what needs to happen next. You're good at it, and being good at it has quietly become the entire shape of your life. When someone asks what you need, the honest answer is that you stopped checking a long time ago.",
    origin:"Keepers are often made young, in homes where someone needed looking after and you were the one who noticed. Perhaps a parent was stretched thin, or sad, or simply needed you to be okay so they could manage. You became okay. You became useful. Being needed was the closest thing to being held, so you learned to be needed everywhere.",
    void:"The space is the place where someone should be holding you. You built your worth on carrying, and the thing about carrying is that nobody thinks to ask if your arms are tired. You are surrounded by people who love you and not one of them knows how to take care of you, because you never let them learn.",
    want:"To be asked how you are, and to have someone wait for the real answer. To put something down and have it stay down. To be the one who gets checked on.",
    door:"Ask one person for one small thing this week that you could easily do yourself. Then let them do it, badly if they must, and don't fix it.",
    keep:"You don't have to be useful to be kept.",
    second:"You take care of the room before you check whether you're in it." },
  uns:{ name:'The Unseen', tag:'Loved, but never quite known.',
    opening:"Your childhood was fine. You'll say that first, and you'll mean it. There was food, there were birthdays, there was love. And yet you carry a loneliness you can't trace to any single thing, which makes it feel illegitimate, which makes you carry it alone. That is the whole trick of it.",
    origin:"There's a kind of neglect that leaves no marks because nothing bad happened. The feelings simply weren't noticed. Nobody asked what was going on inside you, not out of cruelty, but because no one had asked them either. You learned that your inner life wasn't a thing people looked at. So you stopped looking too. Psychologists call it emotional neglect. You probably just called it normal.",
    void:"The space is your own inner world, waiting to be visited. You feel far from people because you're far from the part of you that would connect. When someone asks what you want or what you feel, the blank isn't because there's nothing there. It's because no one ever showed you the way in.",
    want:"To be noticed without having to perform the noticing. For someone to say “you seem sad” and be right. To feel your feelings while they're happening, not three days later in the car.",
    door:"Three times a day, stop and name what you feel in one word, even if the word is “nothing.” You're not fixing anything. You're introducing yourself.",
    keep:"Nothing happened to you, and it still counts.",
    second:"You were loved in a house where feelings weren't really looked at." },
  cha:{ name:'The Chameleon', tag:'Becoming whoever the room needs.',
    opening:"People like you. Everywhere you go, you read the room in seconds and become what fits. You're easy, you're warm, you're whoever they were hoping for. And somewhere under all those versions, there's a quiet suspicion that no one has ever actually met you. Including you.",
    origin:"Chameleons learn early that the real self is negotiable and approval is not. Maybe love in your house had a mood to match. Maybe being agreeable kept the peace. Maybe you were simply so good at reading people that you never had to risk being read. Adaptation is a gift. It's also where you went to hide.",
    void:"The space is the self you keep trading away. Being liked by everyone turns out to feel nothing like being loved by anyone, because the one being liked is a performance you're exhausted from running. You can't feel chosen if you never showed up as yourself to be chosen.",
    want:"To disappoint someone and survive it. To say “I don't actually like that” out loud. To be loved in a way that would still be there if you stopped adjusting.",
    door:"This week, give one honest opinion you'd normally soften. Watch what happens. Most people don't leave. The ones who do were only ever there for the costume.",
    keep:"The one they'd meet if you stopped is the one worth meeting.",
    second:"You read the room so fast you forget to bring yourself into it." },
  wat:{ name:'The Watcher', tag:'Living your life from the next room.',
    opening:"You're in your life, technically. You're at the dinner, the wedding, the summit, the bed. And some part of you is slightly above it, narrating, observing, noting that this is the moment you're supposed to feel something. The feeling arrives late, or faint, or not at all. People say you're calm. You know it's something else.",
    origin:"Watching is what a nervous system does when feeling became too much, too early, or too often. It may not have been one big thing. It may have been a slow lesson that emotions were inconvenient, dangerous, or simply unwelcome, so you learned to step out of the room where they lived. The stepping out saved you. It just never let you back in.",
    void:"The space is the distance between you and your own life. The emptiness isn't an absence of feeling. The feelings are all there, on the other side of the glass. You've just spent so long watching that your body no longer trusts it's allowed to be inside the moment.",
    want:"To be hit by something and not step back. To cry at the right time, with the right person, and stay. To be in the room.",
    door:"The next time you catch yourself watching, put a hand flat on something solid and say, quietly, where you are. The floor, the chair, the person. Come back for ten seconds. That's enough to start.",
    keep:"You didn't lose the feeling. You stepped out of the room, and the door is still open.",
    second:"Big moments reach you a little late, and a little faint." },
  fla:{ name:'The Flaw', tag:'Sure that if they really knew you.',
    opening:"You could be loved by a thousand people and still believe each of them is making a mistake. There's a verdict in you, older than any evidence, that says something at the center is wrong, and that everything good in your life is a clerical error waiting to be caught. You work very hard to not be caught.",
    origin:"Shame this deep is usually learned, not born. Somewhere, you took in the message that you were too much, or not enough, or that being yourself was something to apologize for. It may have been said. It may only have been felt, in the way a sigh lands on a child. Children can't conclude that the adults were wrong. They conclude that they are.",
    void:"The space is where your own worth should sit. You keep trying to fill it from outside, with approval, with success, with being good, and none of it holds, because the verdict was never about any of those things. The void isn't that no one loves you. It's that you can't let it in past the bouncer.",
    want:"To be seen all the way through and have the person stay. To stop auditioning. To believe one kind thing someone says about you for a whole day.",
    door:"Write down one thing someone has said about you that you deflected. Read it tonight. Don't argue with it. Just let it sit in the room with you.",
    keep:"The verdict was wrong. It was always someone else's weather.",
    second:"Kind words bounce off something in you before they can land." },
  lea:{ name:'The First to Leave', tag:'Leaving before you can be left.',
    opening:"You're good at endings. You see them coming from a long way off, and you make sure you're already halfway out the door when they arrive. People remember you as easy to be with and hard to keep. What they don't see is the quiet part: you wanted to stay. Every time.",
    origin:"Somewhere, you learned that people go. Maybe someone did. Maybe someone was there in body and gone in every other way. Maybe the going was slow and ordinary, so no one called it a loss. Your nervous system called it one. It decided that the only safe way to love is with your coat on.",
    void:"The space is the relationship you never let reach its middle. You live in beginnings and endings, and the part in between, where people become known and chosen and ordinary, is exactly the part you've never let yourself have. You're lonely because you keep leaving before the loneliness could be cured.",
    want:"To be left and survive it. To stay past the point where it gets scary and find out what's there. To be the one who was chosen when things got boring.",
    door:"Pick one connection you've been quietly shrinking. Reach out. Don't make it a big thing. Just don't be the first one to go this time.",
    keep:"Staying is also a thing you can be good at.",
    second:"You keep one foot out the door, just in case." }
};
const KEYS = Object.keys(P);

/* ---------- WORDS: short. two or three answers. ---------- */
const U = [
 {q:"How are you, <em>really?</em>", o:[["Fine.",{uns:2,wat:1}],["Tired.",{kee:2,per:1}],["I don't know.",{wat:2,uns:1}]]},
 {q:"Your proudest moment. <em>Who saw it?</em>", o:[["Everyone.",{per:2,cha:1}],["No one who mattered.",{lea:2,uns:1}],["It didn't feel like mine.",{wat:2,fla:1}]]},
 {q:"Feelings, growing up, were…", o:[["Not discussed.",{uns:3}],["Mine to handle.",{kee:2,for:1}],["Risky.",{for:2,fla:1}]]},
 {q:"Someone gets close. <em>You…</em>", o:[["Brace for the end.",{lea:3}],["Build the wall.",{for:3}],["Become what they want.",{cha:2,fla:1}]]},
 {q:"Rest feels…", o:[["Unearned.",{per:3}],["Loud.",{wat:2,fla:1}],["Like a job.",{kee:3}]]},
 {q:"If they really knew you…", o:[["They'd leave.",{lea:2,for:1}],["They'd be disappointed.",{fla:2,cha:1}],["I'd have to know me first.",{wat:2,uns:1}]]},
 {q:"You cry…", o:[["At movies. Never about me.",{uns:2,wat:1}],["Alone, after.",{kee:2,for:1}],["I don't anymore.",{wat:2,for:1}]]},
 {q:"The space. <em>What shape is it?</em>", o:[["A hum.",{uns:2,wat:1}],["A treadmill.",{per:3}],["A window.",{for:2,uns:1}]]}
];
const T = [
 {t:['per','fla'], q:"A week off. <em>No catch.</em>", o:[["I'd worry the whole time.",{per:3}],["I'd feel like a fraud.",{fla:3}],["I'd fill it.",{per:2,kee:1}]]},
 {t:['for','lea'], q:"<em>“I'm not going anywhere.”</em>", o:[["Everyone says that.",{lea:3}],["I can't let myself believe it.",{for:3}]]},
 {t:['kee','uns'], q:"Sick in bed. The house is quiet.", o:[["Who's handling things?",{kee:3}],["No one's coming. That's fine.",{uns:3}]]},
 {t:['cha','wat'], q:"Describe yourself. <em>No job. No people.</em>", o:[["I can't.",{wat:3}],["Which version?",{cha:3}]]},
 {t:['fla','uns'], q:"A compliment lands.", o:[["I deflect it.",{fla:3}],["It doesn't go in.",{uns:2,wat:1}]]},
 {t:['per','cha'], q:"What were you praised for?", o:[["Winning.",{per:3}],["Being easy.",{cha:2,uns:1}],["Being mature.",{kee:2,uns:1}]]},
 {t:['wat','for'], q:"A big feeling rises.", o:[["I watch it, like weather.",{wat:3}],["I shut it down.",{for:3}],["I get busy.",{per:1,wat:2}]]},
 {t:['lea','uns'], q:"They cancel.", o:[["Of course.",{lea:2,uns:1}],["It's fine. Always fine.",{uns:3}],["Relief.",{for:1,wat:2}]]},
 {t:['kee','cha'], q:"Last time you asked for help?", o:[["Can't remember.",{kee:3}],["I don't need anything.",{cha:2,kee:1}],["I wouldn't know what to ask.",{uns:2,wat:1}]]},

function grainDef(id){ return `<filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>`; }

function motes(n,col,x0=0,x1=400,y0=0,y1=300){ let s=''; for(let i=0;i<n;i++){ const x=R(x0,x1),y=R(y0,y1),d=R(14,34); s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${R(.6,1.8).toFixed(1)}" fill="${col}" opacity="${R(.25,.8).toFixed(2)}">${anim('cy',`${y.toFixed(0)};${(y-R(30,90)).toFixed(0)}`,d.toFixed(1))}${anim('opacity',`0;${R(.5,.9).toFixed(2)};0`,d.toFixed(1))}${anim('cx',`${x.toFixed(0)};${(x+R(-25,25)).toFixed(0)};${x.toFixed(0)}`,(d*1.3).toFixed(1))}</circle>`; } return s; }

/* Web Audio engine. Everything synthesized. Headphone-first: a wide stereo field, a long hall, and a faint binaural pulse (theta, ~5 Hz) under every piece. */
const Audio = (()=>{
  let ctx, master, analyser, hall, hallSend, live=null, voiceEl=null, musicEl=null, ambEl=null;
  const AMB={rain:[.95,.45],room:[.9,.55],heart:[.85,.6],note:[.55,1],dawn:[.9,.6]}; /* [ambience level, synth level] */

/* ---------- JOURNEY ---------- */
const CHAPTERS=[
  {num:'I', name:'The Threshold', line:'Pick what is true. Not what is nice.'},
  {num:'II', name:'The Rooms', line:'The light has found a direction.'},
  {num:'III', name:'The Door', line:'Slow down. Let the last ones land.'}

const TOTAL=27;
let S=fresh();
function fresh(){ const s={ chapter:0, idx:0, stations:[], usedT:new Set(), scores:{}, step:0, letter:'' }; KEYS.forEach(k=>s.scores[k]=0); return s; }

function ranked(){ return KEYS.slice().sort((a,b)=>S.scores[b]-S.scores[a]); }
function pickT(top,n){ const want=new Set(top); const pool=T.map((q,i)=>({q,i})).filter(x=>!S.usedT.has(x.i)).map(x=>({...x,hit:x.q.t.filter(k=>want.has(k)).length})).filter(x=>x.hit>0);
  const sorted=shuffle(pool).sort((a,b)=>b.hit-a.hit).slice(0,n); sorted.forEach(x=>S.usedT.add(x.i)); return sorted.map(x=>({type:'word',data:x.q})); }
function buildChapter(c){
  if(c===0){ const w=shuffle(U).map(q=>({type:'word',data:q})); return [w[0],w[1],{type:'img',key:'window'},w[2],w[3],{type:'snd',key:'rain'},w[4],{type:'img',key:'table'},w[5],w[6]]; }
  if(c===1){ const w=pickT(ranked().slice(0,3),5); return [w[0],{type:'img',key:'hands'},w[1],{type:'snd',key:'room'},w[2],{type:'img',key:'door'},w[3],{type:'snd',key:'heart'},w[4],{type:'img',key:'summit'}]; }
  const w=pickT(ranked().slice(0,2),3); return [w[0],{type:'img',key:'mask'},w[1],{type:'snd',key:'note'},w[2],{type:'img',key:'field'},{type:'snd',key:'dawn'},{type:'letter'}];
}

/* ---------- RENDER ---------- */
const app=document.getElementById('app');
function setProgress(){ document.querySelector('#progress i').style.width=(Math.min(S.step,TOTAL)/TOTAL*100)+'%'; }

  if(cur && !RM){ cur.classList.add('leaving'); setTimeout(go,380); } else go(); }

    <svg class="flame" viewBox="0 0 22 34" aria-hidden="true"><path d="M11 0c2 7 9 10 9 19a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 3 4 3 7 0 0 2-3 2-15z"/></svg>
    <h1>Lantern</h1>
    <p class="lead">For the ones who have so much, <em>and still feel the space.</em></p>
    <div class="rule"></div>
    <div class="stack">

}
function optionsHTML(o){ return `<div class="options">${o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>`; }
function wireOptions(root,o,before){ root.querySelectorAll('.opt').forEach(b=>{ b.onclick=()=>{ if(root.dataset.locked) return; root.dataset.locked=1; b.classList.add('picked'); const w=o[+b.dataset.i][1]; Object.keys(w).forEach(k=>S.scores[k]+=w[k]); S.step++; setProgress(); if(before) before(); setTimeout(()=>{ S.idx++; station(); },RM?150:650); }; }); }

function reading(){
  Audio.voiceStop(); Audio.musicStop(true); Audio.stop(true); const r=ranked(); const top=r[0], sec=r[1]; const p=P[top], s=P[sec]; const max=Math.max(1,S.scores[top]);
  try{ localStorage.setItem('lantern.reading',JSON.stringify({scores:S.scores,letter:S.letter,when:Date.now()})); }catch(e){}
  swap(`<div class="reading">
    <p class="eyebrow">What the lantern found</p><h1 class="name">${p.name}</h1><p class="tag">${p.tag}</p>
    <div class="narr"><button class="play" id="narr" aria-label="Listen"><svg viewBox="0 0 20 20" id="narrIcon"><path d="M5 3l12 7-12 7z"/></svg></button><div><div class="player-title">Hear it read to you</div><div class="player-sub">A voice, and the dawn underneath. About three minutes.</div></div></div>
    <div class="section"><p class="eyebrow">You might know this</p><p>${p.opening}</p></div>
    <div class="section"><p class="eyebrow">Where it often comes from</p><p>${p.origin}</p></div>
    <div class="section"><p class="eyebrow">What the space actually is</p><p>${p.void}</p></div>
    <div class="section"><p class="eyebrow">What your heart may be asking for</p><p>${p.want}</p></div>
    <div class="section"><p class="eyebrow">One small door</p><p>${p.door}</p></div>
    <div class="keep">“${p.keep}”</div>
    ${S.letter?`<div class="letter"><p class="eyebrow">What you sent back</p>${esc(S.letter)}</div>`:''}
    <div class="second"><p class="eyebrow">Also in you: <b>${s.name}</b></p><p class="muted">${s.second} The two often travel together.</p></div>
    <div class="map" aria-label="Your map"><p class="eyebrow" style="margin-bottom:4px">Your map</p>${r.map(k=>`<div class="row ${k===top?'lead-row':''}"><span>${P[k].name}</span><div class="bar"><i data-w="${Math.round(S.scores[k]/max*100)}"></i></div></div>`).join('')}</div>
    <div class="rule"></div>
    <p class="fine">A mirror, not a diagnosis. The patterns come from schema therapy, attachment research, and the work on childhood emotional neglect. If something hit hard, that's information, not a verdict. A therapist who works with attachment, schema therapy, or Internal Family Systems can take it further than a page can. Two books that go deeper: <i>Running on Empty</i> by Jonice Webb, and <i>Adult Children of Emotionally Immature Parents</i> by Lindsay Gibson.</p>
    <div class="actions"><button class="btn" id="copy">Copy my reading</button><button class="btn ghost" id="again">Walk it again</button></div>
  </div>`, root=>{
    requestAnimationFrame(()=>root.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'));
    root.querySelector('#again').onclick=()=>{ Audio.voiceStop(); start(); };
    const nb=root.querySelector('#narr'), ni=root.querySelector('#narrIcon'); const PLAY='<path d="M5 3l12 7-12 7z"/>', PAUSE='<rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/>';
    nb.onclick=()=>{ if(Audio.speaking){ Audio.voiceStop(); nb.classList.remove('on'); ni.innerHTML=PLAY; } else { Audio.voice(top,()=>{ nb.classList.remove('on'); ni.innerHTML=PLAY; }); nb.classList.add('on'); ni.innerHTML=PAUSE; } };
    root.querySelector('#copy').onclick=()=>{ const txt=`Lantern found: ${p.name}. ${p.tag}\n\n“${p.keep}”\n\nAlso in me: ${s.name}.${S.letter?`\n\nTo the kid in that room: ${S.letter}`:''}\n\nLantern is a mirror, not a diagnosis.`;
      const done=()=>{ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); };
      const fb=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity=0; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(fb); } else fb(); };
  });
}
function boot(){ threshold(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Audio.stop(); Audio.musicStop(); } });
</script>
