// ==================== YTD VIEW ====================
function YTDView({ transactions, categoriesDef }) {
  const year = useMemo(() => {
    const dates = transactions.map(t => t.date).sort();
    return parseInt((dates[dates.length-1] || today()).slice(0,4));
  }, [transactions]);

  const months = useMemo(() => ytdAggregate(transactions, year, categoriesDef), [transactions, year, categoriesDef]);
  const monthsWithData = months.filter(m => m.income > 0 || m.spend > 0 || m.investment > 0);

  const totals = monthsWithData.reduce((acc, m) => {
    acc.income += m.income;
    acc.spend += m.spend;
    acc.necessary += m.necessary;
    acc.discretionary += m.discretionary;
    acc.investment += m.investment;
    for (const [c, v] of Object.entries(m.byCategory)) {
      acc.byCategory[c] = (acc.byCategory[c] || 0) + v;
    }
    return acc;
  }, { income: 0, spend: 0, necessary: 0, discretionary: 0, investment: 0, byCategory: {} });

  const trendChartRef = useRef(null);
  const splitChartRef = useRef(null);
  const catChartRef = useRef(null);
  const trendInst = useRef(null);
  const splitInst = useRef(null);
  const catInst = useRef(null);

  useEffect(() => {
    const ctx = trendChartRef.current?.getContext('2d');
    if (!ctx) return;
    if (trendInst.current) trendInst.current.destroy();
    const labels = monthsWithData.map(m => fmtMonth(m.key).replace(/ \d{4}$/, ''));
    const cs = getComputedStyle(document.documentElement);
    trendInst.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Income', data: monthsWithData.map(m => m.income), borderColor: cs.getPropertyValue('--green').trim(), backgroundColor: 'transparent', tension: 0.25, borderWidth: 2 },
          { label: 'Spend', data: monthsWithData.map(m => m.spend), borderColor: cs.getPropertyValue('--red').trim(), backgroundColor: 'transparent', tension: 0.25, borderWidth: 2 },
          { label: 'Investing', data: monthsWithData.map(m => m.investment), borderColor: cs.getPropertyValue('--blue').trim(), backgroundColor: 'transparent', tension: 0.25, borderWidth: 2, borderDash: [4,4] },
        ]
      },
      options: chartOpts(cs, true),
    });
    return () => trendInst.current?.destroy();
  }, [monthsWithData]);

  useEffect(() => {
    const ctx = splitChartRef.current?.getContext('2d');
    if (!ctx) return;
    if (splitInst.current) splitInst.current.destroy();
    const labels = monthsWithData.map(m => fmtMonth(m.key).replace(/ \d{4}$/, ''));
    const cs = getComputedStyle(document.documentElement);
    splitInst.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Necessary', data: monthsWithData.map(m => m.necessary), backgroundColor: cs.getPropertyValue('--necessary').trim() },
          { label: 'Discretionary', data: monthsWithData.map(m => m.discretionary), backgroundColor: cs.getPropertyValue('--discretionary').trim() },
        ]
      },
      options: { ...chartOpts(cs, true), scales: { ...chartOpts(cs, true).scales, x: { ...chartOpts(cs, true).scales.x, stacked: true }, y: { ...chartOpts(cs, true).scales.y, stacked: true } } },
    });
    return () => splitInst.current?.destroy();
  }, [monthsWithData]);

  // Per-category running totals + averages with anomaly flags
  const perCat = useMemo(() => {
    const cats = Object.keys(totals.byCategory);
    return cats.map(cat => {
      const monthly = monthsWithData.map(m => m.byCategory[cat] || 0);
      const nonZero = monthly.filter(v => v > 0);
      const avg = nonZero.length ? nonZero.reduce((a,b) => a+b, 0) / nonZero.length : 0;
      const last = monthly[monthly.length - 1] || 0;
      const flag = avg > 0 ? (last > avg * 1.4 ? 'high' : last < avg * 0.6 && last > 0 ? 'low' : 'normal') : 'none';
      // trend slope on last 3 months
      const recent = monthly.slice(-3);
      let trend = 'flat';
      if (recent.length === 3) {
        if (recent[2] > recent[0] * 1.15 && recent[2] > 5) trend = 'rising';
        else if (recent[2] < recent[0] * 0.85 && recent[0] > 5) trend = 'falling';
      }
      return {
        cat, total: totals.byCategory[cat], avg, last, flag, trend,
        bucket: categoriesDef[cat]?.bucket || 'uncategorized',
        monthly,
      };
    }).sort((a,b) => b.total - a.total);
  }, [totals, monthsWithData, categoriesDef]);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Year to Date, {year}</div>
          <div className="page-sub">{monthsWithData.length} months of activity. Watch for categories creeping up over time.</div>
        </div>
      </div>

      <div className="grid cols-4" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">YTD Income</div>
          <div className="card-value mono">{fmt$(totals.income)}</div>
        </div>
        <div className="card">
          <div className="card-title">YTD Spend</div>
          <div className="card-value mono">{fmt$(totals.spend)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>
            <span style={{ color: 'var(--necessary)' }}>{fmt$(totals.necessary)}</span> necessary,{' '}
            <span style={{ color: 'var(--discretionary)' }}>{fmt$(totals.discretionary)}</span> discretionary.
          </div>
        </div>
        <div className="card">
          <div className="card-title">YTD Investing</div>
          <div className="card-value mono delta-pos">{fmt$(totals.investment)}</div>
        </div>
        <div className="card">
          <div className="card-title">Avg Monthly Spend</div>
          <div className="card-value mono">{fmt$(totals.spend / Math.max(monthsWithData.length, 1))}</div>
        </div>
      </div>

      <div className="grid cols-2" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Income, Spend, Investing</div>
          <div className="chart-wrap"><canvas ref={trendChartRef}></canvas></div>
        </div>
        <div className="card">
          <div className="card-title">Necessary versus Discretionary, by Month</div>
          <div className="chart-wrap"><canvas ref={splitChartRef}></canvas></div>
        </div>
      </div>

      <div className="card">
        <div className="card-title" style={{ marginBottom: 8 }}>Category Trends</div>
        <table className="table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Bucket</th>
              <th className="right">YTD Total</th>
              <th className="right">Monthly Avg</th>
              <th className="right">Last Month</th>
              <th className="center">Trend (last 3)</th>
              <th className="center">Flag</th>
            </tr>
          </thead>
          <tbody>
            {perCat.map(r => (
              <tr key={r.cat}>
                <td><span className="cat-pill"><span className={'dot ' + r.bucket} />{categoriesDef[r.cat]?.display_name || r.cat}</span></td>
                <td><span className={'tag ' + r.bucket}>{r.bucket}</span></td>
                <td className="right mono">{fmt$(r.total)}</td>
                <td className="right mono muted">{fmt$(r.avg)}</td>
                <td className="right mono">{fmt$(r.last)}</td>
                <td className="center">
                  {r.trend === 'rising' && <span className="delta-neg">▲ rising</span>}
                  {r.trend === 'falling' && <span className="delta-pos">▼ falling</span>}
                  {r.trend === 'flat' && <span className="muted">flat</span>}
                </td>
                <td className="center">
                  {r.flag === 'high' && <span className="tag discretionary">above avg</span>}
                  {r.flag === 'low' && <span className="tag investment">below avg</span>}
                  {r.flag === 'normal' && <span className="muted small">on pace</span>}
                </td>
              </tr>
            ))}
            {perCat.length === 0 && <tr><td colSpan="7" className="muted center">No data yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </>
  );
}

function chartOpts(cs, showLegend) {
  const fg2 = cs.getPropertyValue('--fg-2').trim();
  const fg1 = cs.getPropertyValue('--fg-1').trim();
  const border = cs.getPropertyValue('--border').trim();
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: !!showLegend, labels: { color: fg1, boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
      tooltip: {
        backgroundColor: cs.getPropertyValue('--bg-3').trim(),
        titleColor: cs.getPropertyValue('--fg-0').trim(),
        bodyColor: fg1,
        borderColor: border, borderWidth: 1,
        callbacks: { label: (c) => c.dataset.label + ': $' + c.parsed.y.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) }
      }
    },
    scales: {
      x: { ticks: { color: fg2, font: { size: 11 } }, grid: { display: false } },
      y: { ticks: { color: fg2, font: { size: 11 }, callback: (v) => '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v) }, grid: { color: border } }
    }
  };
}

// ==================== BUDGETS VIEW ====================
function BudgetsView({ transactions, selectedMonth, setSelectedMonth, userState, dispatch, defaults, categoriesDef, openDrawer }) {
  const cur = useMemo(() => aggregateForMonth(transactions, selectedMonth, categoriesDef), [transactions, selectedMonth, categoriesDef]);
  const dim = daysInMonth(selectedMonth);
  const elapsed = daysElapsed(selectedMonth);
  const paceMul = elapsed > 0 ? dim / elapsed : 1;

  const spendCats = Object.keys(categoriesDef).filter(c => ['necessary','discretionary'].includes(categoriesDef[c].bucket));

  const getBudget = (cat) => userState.budgets[cat] != null ? userState.budgets[cat] : (defaults[cat] || 0);

  const rows = spendCats.map(cat => {
    const spent = cur.byCategory[cat] || 0;
    const budget = getBudget(cat);
    const pace = spent * paceMul;
    return { cat, spent, budget, pace, bucket: categoriesDef[cat].bucket };
  }).sort((a, b) => {
    if (a.bucket !== b.bucket) return a.bucket === 'necessary' ? -1 : 1;
    return b.spent - a.spent;
  });

  const totalSpend = rows.reduce((a, r) => a + r.spent, 0);
  const totalBudget = rows.reduce((a, r) => a + r.budget, 0);
  const overallTarget = userState.overallBudget ?? defaults._OVERALL_SPEND ?? 0;

  const discRows = rows.filter(r => r.bucket === 'discretionary');
  const discSpent = discRows.reduce((a, r) => a + r.spent, 0);
  const discTarget = userState.discretionaryBudget ?? defaults._DISCRETIONARY_TOTAL ?? 0;

  const renderProgress = (spent, budget, pace) => {
    if (!budget || budget === 0) {
      return <div className="muted small">No target set.</div>;
    }
    const pct = Math.min(spent / budget, 1.4);
    const cls = spent > budget ? 'over' : (pace > budget ? 'warn' : 'under');
    return (
      <div>
        <div className="progress"><div className={'progress-fill ' + cls} style={{ width: (pct * 100) + '%' }} /></div>
        <div className="small" style={{ marginTop: 3 }}>
          <span className="mono">{fmt$(spent)}</span>
          <span className="muted"> of {fmt$(budget)}</span>
          {' '}
          {spent > budget && <span className="delta-neg"> over by {fmt$(spent - budget)}</span>}
          {spent <= budget && pace > budget && <span className="pace-over"> on pace to overshoot ({fmt$(pace)})</span>}
          {spent <= budget && pace <= budget && elapsed > 0 && <span className="pace-on"> on pace ({fmt$(pace)})</span>}
        </div>
      </div>
    );
  };

  const setBudget = (cat, v) => {
    dispatch({ type: 'SET_BUDGET', category: cat, amount: v });
  };

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Budget Targets</div>
          <div className="page-sub">Set per category, see progress and pace. Discretionary has its own combined cap.</div>
        </div>
        <div className="page-actions">
          <MonthPicker value={selectedMonth} onChange={setSelectedMonth} transactions={transactions} />
        </div>
      </div>

      <div className="grid cols-3" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Total Spend, {fmtMonth(selectedMonth)}</div>
          <div className="card-value mono">{fmt$(totalSpend)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>{elapsed} of {dim} days elapsed.</div>
        </div>
        <div className="card">
          <div className="card-title">Overall Target</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <input type="number" className="mono" style={{ width: 100, padding: '4px 8px', background: 'var(--bg-2)', color: 'var(--fg-0)', border: '1px solid var(--border)', borderRadius: 4 }}
              value={userState.overallBudget ?? defaults._OVERALL_SPEND ?? ''}
              onChange={(e) => dispatch({ type: 'SET_OVERALL_BUDGET', amount: e.target.value === '' ? null : parseFloat(e.target.value) })}/>
            <span className="muted small">per month</span>
          </div>
          {overallTarget > 0 && (
            <div style={{ marginTop: 8 }}>
              {renderProgress(totalSpend, overallTarget, totalSpend * paceMul)}
            </div>
          )}
        </div>
        <div className="card">
          <div className="card-title">Discretionary Cap</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <input type="number" className="mono" style={{ width: 100, padding: '4px 8px', background: 'var(--bg-2)', color: 'var(--fg-0)', border: '1px solid var(--border)', borderRadius: 4 }}
              value={userState.discretionaryBudget ?? defaults._DISCRETIONARY_TOTAL ?? ''}
              onChange={(e) => dispatch({ type: 'SET_DISC_BUDGET', amount: e.target.value === '' ? null : parseFloat(e.target.value) })}/>
            <span className="muted small">all optional spend, combined</span>
          </div>
          {discTarget > 0 && (
            <div style={{ marginTop: 8 }}>
              {renderProgress(discSpent, discTarget, discSpent * paceMul)}
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-title" style={{ marginBottom: 8 }}>By Category</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 110px 90px 1fr 100px', gap: 10, padding: '6px 10px', color: 'var(--fg-2)', fontSize: 11, textTransform: 'uppercase', letterSpacing: '.6px', fontWeight: 600 }}>
          <div>Category</div>
          <div className="right">Target</div>
          <div className="right">Spent</div>
          <div>Progress</div>
          <div className="right">Click</div>
        </div>
        {rows.map(r => (
          <div key={r.cat} className="budget-row">
            <div className="name">
              <span className="cat-pill"><span className={'dot ' + r.bucket} />{categoriesDef[r.cat]?.display_name || r.cat}</span>
            </div>
            <div className="right">
              <input type="number" className="mono"
                value={userState.budgets[r.cat] != null ? userState.budgets[r.cat] : (defaults[r.cat] != null ? defaults[r.cat] : '')}
                onChange={(e) => setBudget(r.cat, e.target.value === '' ? null : parseFloat(e.target.value))}
                placeholder="0" />
            </div>
            <div className="right mono">{fmt$(r.spent)}</div>
            <div>{renderProgress(r.spent, r.budget, r.pace)}</div>
            <div className="right">
              <button className="btn btn-sm" onClick={() => openDrawer({ type: 'category', category: r.cat, monthKey: selectedMonth })}>Drill in</button>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

// ==================== NET WORTH VIEW ====================
function NetWorthView({ snapshots, dispatch, userState, showToast }) {
  const chartRef = useRef(null);
  const inst = useRef(null);
  const [showAdd, setShowAdd] = useState(false);

  useEffect(() => {
    const ctx = chartRef.current?.getContext('2d');
    if (!ctx) return;
    if (inst.current) inst.current.destroy();
    const cs = getComputedStyle(document.documentElement);
    const labels = snapshots.map(s => s.date);
    const nw = snapshots.map(s => sumValues(s.assets) - sumValues(s.liabilities));
    const assets = snapshots.map(s => sumValues(s.assets));
    const liab = snapshots.map(s => -sumValues(s.liabilities));
    inst.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Net Worth', data: nw, borderColor: cs.getPropertyValue('--accent').trim(), backgroundColor: 'transparent', tension: 0.2, borderWidth: 2.5 },
          { label: 'Assets', data: assets, borderColor: cs.getPropertyValue('--green').trim(), backgroundColor: 'transparent', tension: 0.2, borderWidth: 1, borderDash: [3,3] },
          { label: 'Liabilities', data: liab, borderColor: cs.getPropertyValue('--red').trim(), backgroundColor: 'transparent', tension: 0.2, borderWidth: 1, borderDash: [3,3] },
        ]
      },
      options: chartOpts(cs, true),
    });
    return () => inst.current?.destroy();
  }, [snapshots]);

  const latest = snapshots[snapshots.length - 1];
  const prev = snapshots[snapshots.length - 2];
  const latestNW = latest ? sumValues(latest.assets) - sumValues(latest.liabilities) : 0;
  const prevNW = prev ? sumValues(prev.assets) - sumValues(prev.liabilities) : null;
  const dAbs = prevNW !== null ? latestNW - prevNW : null;
  const dPct = prevNW !== null && prevNW !== 0 ? dAbs / prevNW : null;

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Net Worth</div>
          <div className="page-sub">Assets minus liabilities, snapshot history. Latest snapshot {latest?.date}.</div>
        </div>
        <div className="page-actions">
          <button className="btn primary" onClick={() => setShowAdd(true)}>+ Add Snapshot</button>
        </div>
      </div>

      <div className="grid cols-3" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Net Worth</div>
          <div className="card-value lg mono">{fmt$(latestNW)}</div>
          {dAbs !== null && (
            <div className={'small mono ' + (dAbs >= 0 ? 'delta-pos' : 'delta-neg')} style={{ marginTop: 6 }}>
              {dAbs >= 0 ? '▲' : '▼'} {fmt$(Math.abs(dAbs))}
              {dPct !== null && ' (' + (dPct >= 0 ? '+' : '') + fmtPct(dPct) + ')'} since {prev.date}
            </div>
          )}
        </div>
        <div className="card">
          <div className="card-title">Total Assets</div>
          <div className="card-value mono delta-pos">{fmt$(latest ? sumValues(latest.assets) : 0)}</div>
        </div>
        <div className="card">
          <div className="card-title">Total Liabilities</div>
          <div className="card-value mono delta-neg">{fmt$(latest ? sumValues(latest.liabilities) : 0)}</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-title">Net Worth History</div>
        <div className="chart-wrap" style={{ minHeight: 260 }}><canvas ref={chartRef}></canvas></div>
      </div>

      <div className="grid cols-2">
        <div className="card">
          <div className="card-title" style={{ marginBottom: 8 }}>Asset Breakdown</div>
          <table className="table">
            <thead><tr><th>Account</th><th className="right">Balance</th><th className="right">Share</th></tr></thead>
            <tbody>
              {latest && Object.entries(latest.assets).sort((a,b) => b[1] - a[1]).map(([k, v]) => (
                <tr key={k}>
                  <td>{k}</td>
                  <td className="right mono">{fmt$(v)}</td>
                  <td className="right mono muted">{fmtPct(v / sumValues(latest.assets), 0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card">
          <div className="card-title" style={{ marginBottom: 8 }}>Liability Breakdown</div>
          <table className="table">
            <thead><tr><th>Account</th><th className="right">Balance</th></tr></thead>
            <tbody>
              {latest && Object.entries(latest.liabilities).sort((a,b) => b[1] - a[1]).map(([k, v]) => (
                <tr key={k}>
                  <td>{k}</td>
                  <td className="right mono">{fmt$(v)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-title" style={{ marginBottom: 8 }}>All Snapshots</div>
        <table className="table">
          <thead><tr><th>Date</th><th className="right">Assets</th><th className="right">Liabilities</th><th className="right">Net Worth</th><th>Note</th><th></th></tr></thead>
          <tbody>
            {snapshots.slice().reverse().map(s => {
              const a = sumValues(s.assets);
              const l = sumValues(s.liabilities);
              return (
                <tr key={s.date}>
                  <td className="mono">{s.date}</td>
                  <td className="right mono">{fmt$(a)}</td>
                  <td className="right mono">{fmt$(l)}</td>
                  <td className="right mono" style={{ fontWeight: 600 }}>{fmt$(a - l)}</td>
                  <td className="muted small">{s.note || ''}</td>
                  <td className="right">
                    {userState.manualSnapshots.find(ms => ms.date === s.date) && (
                      <button className="btn btn-sm danger" onClick={() => { dispatch({ type: 'DELETE_SNAPSHOT', date: s.date }); showToast('Snapshot removed.'); }}>Remove</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {showAdd && <AddSnapshotModal latest={latest} onClose={() => setShowAdd(false)} onAdd={(snap) => { dispatch({ type: 'ADD_SNAPSHOT', snapshot: snap }); showToast('Snapshot added.'); setShowAdd(false); }} />}
    </>
  );
}

function sumValues(obj) { return Object.values(obj || {}).reduce((a, b) => a + (b || 0), 0); }

function AddSnapshotModal({ latest, onClose, onAdd }) {
  const [date, setDate] = useState(today());
  const [note, setNote] = useState('');
  const [assets, setAssets] = useState(() => latest ? { ...latest.assets } : {});
  const [liab, setLiab] = useState(() => latest ? { ...latest.liabilities } : {});

  const updateAsset = (k, v) => setAssets({ ...assets, [k]: parseFloat(v) || 0 });
  const updateLiab = (k, v) => setLiab({ ...liab, [k]: parseFloat(v) || 0 });

    const name = prompt('New asset name (e.g., Crypto Wallet, Sub-account):');
    if (name) setAssets({ ...assets, [name]: 0 });
  };
  const addLiab = () => {
    const name = prompt('New liability name (e.g., Student Loan):');

  return (
    <div className="drawer-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="drawer" style={{ width: 'min(560px, 100%)' }}>

          <div className="page-title" style={{ fontSize: 18 }}>Add Net Worth Snapshot</div>
          <button className="btn subtle" onClick={onClose}>✕</button>

        <div className="snapshot-form">
          <div>
            <div className="card-title">Date</div>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div>
            <div className="card-title">Note</div>
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Optional context" />
          </div>
        </div>
        <hr className="divider" />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div className="card-title">Assets</div>
          <button className="btn btn-sm" onClick={addAsset}>+ add account</button>

        {Object.entries(assets).map(([k, v]) => (
          <div key={k} className="snapshot-form" style={{ marginTop: 6 }}>

        <div className="mono" style={{ textAlign: 'right', marginTop: 8 }}>Sum: {fmt$(sumValues(assets))}</div>
        <hr className="divider" />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div className="card-title">Liabilities</div>
          <button className="btn btn-sm" onClick={addLiab}>+ add liability</button>
        </div>
        {Object.entries(liab).map(([k, v]) => (
          <div key={k} className="snapshot-form" style={{ marginTop: 6 }}>
            <div style={{ alignSelf: 'center' }}>{k}</div>
            <input type="number" step="0.01" value={v} onChange={(e) => updateLiab(k, e.target.value)} />
          </div>
        ))}
        <div className="mono" style={{ textAlign: 'right', marginTop: 8 }}>Sum: {fmt$(sumValues(liab))}</div>
        <hr className="divider" />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div className="card-title">Net Worth</div>
            <div className="card-value mono">{fmt$(sumValues(assets) - sumValues(liab))}</div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn" onClick={onClose}>Cancel</button>
            <button className="btn primary" onClick={() => onAdd({ date, note, assets, liabilities: liab })}>Save Snapshot</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ==================== SAVINGS VIEW ====================
function SavingsView({ transactions, snapshots, userState, dispatch, incomeTarget, defaultGoal }) {
  const monthKeys = useMemo(() => {
    const s = new Set(transactions.map(t => monthKey(t.date)));
    return [...s].sort();
  }, [transactions]);

  const monthly = monthKeys.map(k => {
    const a = aggregateForMonth(transactions, k, window.__DATA__.categories);
    const baseSpend = a.spend; // does not include investments
    const savedDollars = a.income - baseSpend;
    const savingsRate = a.income > 0 ? savedDollars / a.income : 0;
    return { key: k, income: a.income, spend: baseSpend, saved: savedDollars, rate: savingsRate, investing: a.investment };
  });

  const ytd = monthly.reduce((acc, m) => {
    acc.income += m.income; acc.spend += m.spend; acc.investing += m.investing; return acc;
  }, { income: 0, spend: 0, investing: 0 });
  const ytdSaved = ytd.income - ytd.spend;
  const ytdRate = ytd.income > 0 ? ytdSaved / ytd.income : 0;

  const last = monthly[monthly.length - 1];

  const targetRate = userState.savingsTarget?.rate ?? defaultGoal.target_savings_rate;
  const targetMonthly = userState.savingsTarget?.monthly_amount ?? defaultGoal.target_dollar_per_month;

  const chartRef = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    const ctx = chartRef.current?.getContext('2d');
    if (!ctx) return;
    if (inst.current) inst.current.destroy();
    const cs = getComputedStyle(document.documentElement);
    inst.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: monthly.map(m => fmtMonth(m.key).replace(/ \d{4}$/, '')),
        datasets: [
          { type: 'bar', label: 'Saved (Income, less Spend)', data: monthly.map(m => m.saved), backgroundColor: monthly.map(m => m.saved >= 0 ? cs.getPropertyValue('--green').trim() : cs.getPropertyValue('--red').trim()) },
          { type: 'line', label: 'Savings Rate', data: monthly.map(m => m.rate * 100), borderColor: cs.getPropertyValue('--blue').trim(), backgroundColor: 'transparent', yAxisID: 'y1', tension: 0.25, borderWidth: 2, pointRadius: 3 },
        ]
      },
      options: {
        ...chartOpts(cs, true),
        scales: {
          ...chartOpts(cs, true).scales,
          y1: { position: 'right', ticks: { color: cs.getPropertyValue('--fg-2').trim(), callback: (v) => v + '%' }, grid: { display: false } }
        }
      }
    });
    return () => inst.current?.destroy();
  }, [monthly]);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Savings Rate &amp; Goal</div>
          <div className="page-sub">Savings rate is income, less spend. Investing is shown separately.</div>

const LOCKDOWN_OVERRIDES = {

  brokerageMonthly: 867,  // keep investing aggressive
  cushionMonthly: 500,    // pile cash

const LOCKDOWN_CAPS = {
  Restaurants: 80,
  Shopping: 20,
  Convenience: 5,
  'Coffee & Drinks': 5,
  Subscriptions: 52,   // current personal subs Netflix + Tesla x2
  Gifts: 0,
  'Tools & Home': 0,
};

const ONE_OFF_PATTERNS = [
  /broken windshield/i,
  /one-?off/i,
  /one-?time/i,
  /\bdmv\b/i,             // annual registration
];

function MyBudgetView({ transactions, selectedMonth, setSelectedMonth, userState, dispatch, categoriesDef }) {
  const baseCfg = { ...MY_BUDGET_DEFAULTS, ...(userState.myBudget || {}) };
  const cfg = baseCfg.lockdownMode ? { ...baseCfg, ...LOCKDOWN_OVERRIDES } : baseCfg;
  const setCfg = (patch) => dispatch({ type: 'SET_MY_BUDGET', patch });

  // Compute per-category caps in lockdown mode
  const monthlySpendCapByCategory = useMemo(() => {
    if (!baseCfg.lockdownMode) return {};
    return LOCKDOWN_CAPS;
  }, [baseCfg.lockdownMode]);

  // Compute planned totals
  const plannedNecessities =
    cfg.rent + cfg.utilities + cfg.wifi + cfg.rentersInsurance +
    cfg.familyBundle + cfg.autoLoan + cfg.carInsurance + cfg.phone +
    cfg.autoFuel + cfg.autoMaintenance + cfg.dmvAmortized +
    cfg.groceries + cfg.household;
  const plannedInvesting = cfg.rothMonthly + cfg.brokerageMonthly;
  const plannedOutflow = plannedNecessities + plannedInvesting + cfg.cushionMonthly + cfg.funMonthly;
  const plannedSurplus = cfg.income - plannedOutflow;

  // Compute actuals for the month
  const monthTxs = useMemo(() => transactions.filter(t => monthKey(t.date) === selectedMonth), [transactions, selectedMonth]);
  const oneOffTxs = useMemo(() => {
    if (!cfg.excludeOneOffs) return [];
    return monthTxs.filter(t => t.is_one_off || ONE_OFF_PATTERNS.some(p => p.test(t.description)));
  }, [monthTxs, cfg.excludeOneOffs]);
  const isOneOff = (tx) => cfg.excludeOneOffs && (tx.is_one_off || ONE_OFF_PATTERNS.some(p => p.test(tx.description)));

  const actuals = useMemo(() => {
    const out = { income: 0, necessary: 0, discretionary: 0, investing: 0, transfers: 0, oneOffSpend: 0 };
    for (const tx of monthTxs) {
      if (tx.category === 'Returns') continue;
      if (isOneOff(tx) && tx.amount < 0) { out.oneOffSpend += Math.abs(tx.amount); continue; }
      if (tx.bucket === 'income' && tx.amount > 0) out.income += tx.amount;
      else if (tx.bucket === 'investment') out.investing += Math.abs(tx.amount);
      else if (tx.bucket === 'necessary' && tx.amount < 0) out.necessary += Math.abs(tx.amount);
      else if (tx.bucket === 'discretionary' && tx.amount < 0) out.discretionary += Math.abs(tx.amount);
    }
    out.netCashFlow = out.income - out.necessary - out.discretionary - out.investing;
    out.actualOutflow = out.necessary + out.discretionary + out.investing;
    return out;
  }, [monthTxs, cfg.excludeOneOffs]);

  const variance = (actual, planned, lowerIsBetter = true) => {
    const diff = actual - planned;
    if (Math.abs(diff) < 0.01) return { diff: 0, pct: 0, good: true };
    const pct = planned > 0 ? diff / planned : 0;
    const good = lowerIsBetter ? diff < 0 : diff > 0;
    return { diff, pct, good };
  };

  const incomeVar = variance(actuals.income, cfg.income, false);
  const necessaryVar = variance(actuals.necessary, plannedNecessities, true);
  const discretionaryVar = variance(actuals.discretionary, cfg.funMonthly, true);
  const investingVar = variance(actuals.investing, plannedInvesting, false);
  const cushionActual = Math.max(0, actuals.netCashFlow);
  const cushionVar = variance(cushionActual, cfg.cushionMonthly, false);

  const tone = (good) => good ? 'delta-pos' : 'delta-neg';

  // Verdict

    if (actuals.netCashFlow < 0) return { tone: 'red', label: 'Negative cash flow this month', detail: 'Spending more than you earned. Check the variances below.' };
    if (actuals.netCashFlow < cfg.cushionMonthly) return { tone: 'yellow', label: 'Under savings target', detail: 'Cash flow positive but below your cushion target.' };
    return { tone: 'green', label: 'On or above plan', detail: 'Cash flow meets or beats your cushion target.' };

  return (

        </div>
        <div className="page-actions">
          <MonthPicker value={selectedMonth} onChange={setSelectedMonth} transactions={transactions} />
          <button className={'btn ' + (baseCfg.lockdownMode ? 'primary' : '')}
            style={baseCfg.lockdownMode ? { background: 'var(--red)', borderColor: 'var(--red)' } : {}}
            onClick={() => setCfg({ lockdownMode: !baseCfg.lockdownMode })}>
            {baseCfg.lockdownMode ? '⏻ Exit Lockdown' : '⏻ Lockdown Mode'}
          </button>
        </div>
      </div>

      {baseCfg.lockdownMode && (
        <div className="help-callout" style={{ marginBottom: 14, borderLeftColor: 'var(--red)' }}>
          <strong>Lockdown active.</strong> Spending caps tightened: Restaurants ${LOCKDOWN_CAPS.Restaurants}, Shopping ${LOCKDOWN_CAPS.Shopping}, Convenience ${LOCKDOWN_CAPS.Convenience}, Coffee ${LOCKDOWN_CAPS['Coffee & Drinks']}, Gifts ${LOCKDOWN_CAPS.Gifts}, Tools & Home ${LOCKDOWN_CAPS['Tools & Home']}. Brokerage stays at $200/wk. Cushion target bumped to ${LOCKDOWN_OVERRIDES.cushionMonthly}/mo. Tesla extra principal dropped (routes to cushion instead). Run this for 1-3 months to rebuild your buffer, then reassess.
        </div>
      )}

      <div className="grid cols-4" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Verdict</div>
          <div className="card-value mono" style={{ fontSize: 18, color: verdictColor, marginTop: 4 }}>{verdict.label}</div>
          <div className="small muted" style={{ marginTop: 6 }}>{verdict.detail}</div>
        </div>
        <div className="card">
          <div className="card-title">Net Cash Flow</div>
          <div className={'card-value mono ' + (actuals.netCashFlow >= 0 ? 'delta-pos' : 'delta-neg')}>{fmt$(actuals.netCashFlow)}</div>
          <div className="small muted" style={{ marginTop: 4 }}>Income − spend − investing</div>
        </div>
        <div className="card">
          <div className="card-title">Planned Surplus</div>
          <div className="card-value mono">{fmt$(plannedSurplus)}</div>
          <div className="small muted" style={{ marginTop: 4 }}>Income {fmt$(cfg.income)} − all outflows</div>
        </div>
        <div className="card">
          <div className="card-title">One-Offs Excluded</div>
          <div className="card-value mono">{fmt$(actuals.oneOffSpend)}</div>
          <div className="small muted" style={{ marginTop: 4 }}>{oneOffTxs.length} transaction{oneOffTxs.length === 1 ? '' : 's'} tagged as one-time</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-title" style={{ marginBottom: 8 }}>Plan vs Actual, {fmtMonth(selectedMonth)}</div>
        <table className="table">
          <thead>
            <tr>
              <th>Bucket</th>

          <tbody>
            <tr>
              <td><strong>Income</strong></td>
              <td className="right mono">{fmt$(cfg.income)}</td>
              <td className="right mono">{fmt$(actuals.income)}</td>
              <td className={'right mono ' + tone(incomeVar.good)}>{incomeVar.diff > 0 ? '+' : ''}{fmt$(incomeVar.diff)}</td>
              <td className="muted small">Plan low, exceed in real life</td>
            </tr>
            <tr>
              <td><strong>Necessities (hard expenses)</strong></td>
              <td className="right mono">{fmt$(plannedNecessities)}</td>
              <td className="right mono">{fmt$(actuals.necessary)}</td>
              <td className={'right mono ' + tone(necessaryVar.good)}>{necessaryVar.diff > 0 ? '+' : ''}{fmt$(necessaryVar.diff)}</td>
              <td className="muted small">Lower is better</td>
            </tr>
            <tr>
              <td><strong>Fun / discretionary</strong></td>
              <td className="right mono">{fmt$(cfg.funMonthly)}</td>
              <td className="right mono">{fmt$(actuals.discretionary)}</td>
              <td className={'right mono ' + tone(discretionaryVar.good)}>{discretionaryVar.diff > 0 ? '+' : ''}{fmt$(discretionaryVar.diff)}</td>
              <td className="muted small">Stay under, banks the rest</td>
            </tr>
            <tr>
              <td><strong>Investing (Roth + brokerage)</strong></td>
              <td className="right mono">{fmt$(plannedInvesting)}</td>
              <td className="right mono">{fmt$(actuals.investing)}</td>
              <td className={'right mono ' + tone(investingVar.good)}>{investingVar.diff > 0 ? '+' : ''}{fmt$(investingVar.diff)}</td>
              <td className="muted small">Hit or exceed the target</td>
            </tr>
            <tr>
              <td><strong>Cushion / cash saved</strong></td>
              <td className="right mono">{fmt$(cfg.cushionMonthly)}</td>
              <td className="right mono">{fmt$(cushionActual)}</td>
              <td className={'right mono ' + tone(cushionVar.good)}>{cushionVar.diff > 0 ? '+' : ''}{fmt$(cushionVar.diff)}</td>
              <td className="muted small">What stayed in checking</td>
            </tr>
            <tr style={{ borderTop: '2px solid var(--border-strong)' }}>
              <td style={{ fontWeight: 700 }}>Net result</td>
              <td className="right mono">{fmt$(plannedSurplus)}</td>
              <td className={'right mono ' + (actuals.netCashFlow >= 0 ? 'delta-pos' : 'delta-neg')} style={{ fontWeight: 700 }}>{fmt$(actuals.netCashFlow)}</td>
              <td className={'right mono ' + (actuals.netCashFlow >= plannedSurplus ? 'delta-pos' : 'delta-neg')}>{fmt$(actuals.netCashFlow - plannedSurplus)}</td>

                const pct = cap > 0 ? Math.min(1, spent / cap) : (spent > 0 ? 1 : 0);

                const fillColor = over ? 'var(--red)' : pct > 0.75 ? 'var(--yellow)' : 'var(--green)';
                return (
                  <tr key={cat}>
                    <td>{categoriesDef[cat]?.display_name || cat}</td>
                    <td className="right mono">{fmt$(cap)}</td>
                    <td className="right mono">{fmt$(spent)}</td>

                      </div>
                    </td>
                    <td className={'right small mono ' + (over ? 'delta-neg' : 'delta-pos')}>{over ? 'OVER by ' + fmt$(spent - cap) : (cap === 0 && spent > 0 ? 'OVER (cap $0)' : (cap - spent === cap ? 'untouched' : fmt$(cap - spent) + ' left'))}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

                </tr>
              ))}
            </tbody>
          </table>

          </div>
        </div>
      )}

}

// ==================== HABITS VIEW ====================
function HabitsView({ transactions, accounts, categoriesDef }) {
  const [year, setYear] = useState(() => {
    const dates = transactions.map(t => t.date).sort();
    return parseInt((dates[dates.length-1] || today()).slice(0,4));
  });
  const [filterBucket, setFilterBucket] = useState('all'); // 'all' | 'discretionary' | 'necessary'
  const [topN, setTopN] = useState(40);

  // Filter to year and exclude transfers/income/investing/returns
  const ytdTxs = useMemo(() => transactions.filter(t =>
    t.date.startsWith(String(year)) &&
    !t.excluded_from_spend &&
    t.amount < 0 &&
    t.category !== 'Returns'
  ), [transactions, year]);

  // Group by merchant_key (or fall back to clean description)
  const cleanMerchant = (desc) => {
    return desc
      .replace(/^(credit or withdrawal |home banking [a-z]+ (transfer|funds transfer)( to| from)? |ach (deposit|withdrawal) |external (deposit|withdrawal) |bill payment advance |now withdrawal )/i, '')
      .replace(/\s+terminal id:.+$/i, '')
      .replace(/\s+\d{3,}.*$/, '')
      .replace(/\*[a-z0-9]+/gi, '')
      .replace(/#\d+/g, '')
      .trim()
      .substring(0, 40);
  };

  const merchants = useMemo(() => {
    const m = {};
    for (const tx of ytdTxs) {
      if (filterBucket !== 'all' && tx.bucket !== filterBucket) continue;
      const key = cleanMerchant(tx.description);
      if (!m[key]) {
        m[key] = { name: key, count: 0, total: 0, category: tx.category, bucket: tx.bucket, lastDate: tx.date, txs: [] };
      }
      m[key].count++;
      m[key].total += Math.abs(tx.amount);
      m[key].txs.push(tx);
      if (tx.date > m[key].lastDate) m[key].lastDate = tx.date;
    }
    const arr = Object.values(m).map(x => ({ ...x, avg: x.total / x.count }));
    return arr.sort((a, b) => b.total - a.total);
  }, [ytdTxs, filterBucket]);

  // Subscriptions: detect recurring monthly charges
  // Heuristic: same merchant_key, same amount (within $1), 2+ occurrences spaced 25-35 days apart
  // Exclude: investments, transfers, family bundle, loans, CC payments, anything in income bucket
  const subscriptions = useMemo(() => {
    const EXCLUDE_BUCKETS = new Set(['investment', 'transfer', 'income', 'debt_principal']);
    const EXCLUDE_CATEGORIES = new Set(['Family Bundle', 'Auto Loan', 'Returns', 'Credit Card Payment', 'Transfer', 'Investment']);
    const allYear = transactions.filter(t =>
      t.date.startsWith(String(year)) &&
      t.amount < 0 &&
      !EXCLUDE_BUCKETS.has(t.bucket) &&
      !EXCLUDE_CATEGORIES.has(t.category) &&
      !t.is_transfer
    );
    const grouped = {};
    for (const tx of allYear) {
      const amt = Math.abs(tx.amount).toFixed(2);
      const key = tx.merchant_key + '|' + amt;
      if (!grouped[key]) grouped[key] = { key: tx.merchant_key, amount: parseFloat(amt), txs: [], category: tx.category, bucket: tx.bucket, name: cleanMerchant(tx.description) };
      grouped[key].txs.push(tx);
    }
    const subs = [];
    for (const g of Object.values(grouped)) {
      if (g.txs.length < 2) continue;
      const sorted = g.txs.slice().sort((a, b) => a.date.localeCompare(b.date));
      const intervals = [];
      for (let i = 1; i < sorted.length; i++) {
        const a = new Date(sorted[i-1].date + 'T00:00:00');
        const b = new Date(sorted[i].date + 'T00:00:00');
        intervals.push((b - a) / 86400000);
      }
      const avgInterval = intervals.reduce((x, y) => x + y, 0) / intervals.length;
      const isMonthly = avgInterval >= 25 && avgInterval <= 40;
      const isWeekly = avgInterval >= 5 && avgInterval <= 9;
      const isAnnual = avgInterval >= 350;
      if (isMonthly || isWeekly || isAnnual) {
        subs.push({
          ...g,
          cadence: isMonthly ? 'monthly' : isWeekly ? 'weekly' : 'annual',
          avgInterval,
          monthlyEquivalent: isMonthly ? g.amount : isWeekly ? g.amount * 4.33 : g.amount / 12,
          annualEquivalent: isMonthly ? g.amount * 12 : isWeekly ? g.amount * 52 : g.amount,
          lastDate: sorted[sorted.length - 1].date,
        });
      }
    }
    return subs.sort((a, b) => b.monthlyEquivalent - a.monthlyEquivalent);
  }, [transactions, year]);

  const flaggedSubs = subscriptions.filter(s => s.monthlyEquivalent >= 50);
  const totalSubsMonthly = subscriptions.reduce((sum, s) => sum + s.monthlyEquivalent, 0);
  const totalSubsAnnual = subscriptions.reduce((sum, s) => sum + s.annualEquivalent, 0);

  const totalMerchantsSpend = merchants.reduce((sum, m) => sum + m.total, 0);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Habits</div>
          <div className="page-sub">Where your money actually goes. The "open my eyes" view, ranked by total spend.</div>
        </div>
        <div className="page-actions">
          <div className="month-picker">
            <button onClick={() => setYear(year - 1)}>◀</button>
            <span className="label mono">{year}</span>
            <button onClick={() => setYear(year + 1)} disabled={year >= new Date().getFullYear()}>▶</button>
          </div>
        </div>
      </div>

      <div className="grid cols-4" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Subscriptions (annual)</div>
          <div className="card-value mono">{fmt$(totalSubsAnnual)}</div>
          <div className="small muted" style={{ marginTop: 4 }}>{subscriptions.length} detected, {fmt$(totalSubsMonthly)}/mo</div>
        </div>
        <div className="card">
          <div className="card-title">Flagged subs (≥$50/mo)</div>
          <div className={'card-value mono ' + (flaggedSubs.length > 0 ? 'delta-neg' : 'delta-pos')}>{flaggedSubs.length}</div>
          <div className="small muted" style={{ marginTop: 4 }}>{flaggedSubs.length === 0 ? 'None over your $50 threshold' : flaggedSubs.map(s => s.name.substring(0, 15)).join(', ')}</div>
        </div>
        <div className="card">
          <div className="card-title">Unique merchants ({year})</div>
          <div className="card-value mono">{merchants.length}</div>
          <div className="small muted" style={{ marginTop: 4 }}>{fmt$(totalMerchantsSpend)} total spend</div>
        </div>
        <div className="card">
          <div className="card-title">Avg per merchant</div>
          <div className="card-value mono">{fmt$(merchants.length > 0 ? totalMerchantsSpend / merchants.length : 0)}</div>
          <div className="small muted" style={{ marginTop: 4 }}>Across all places you spent</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
          <div className="card-title" style={{ margin: 0 }}>Detected Subscriptions {year}</div>
          <div className="small muted">Auto-detected from recurring patterns. Anything ≥ $50/mo gets a red flag.</div>
        </div>
        {subscriptions.length === 0 ? (
          <div className="muted small" style={{ padding: 12 }}>No recurring patterns detected yet (need at least 2 charges of the same amount, 25+ days apart).</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>Subscription</th>
                <th>Category</th>
                <th className="center">Cadence</th>
                <th className="right">Per charge</th>
                <th className="right">Monthly equiv</th>
                <th className="right">Annual</th>
                <th>Flag</th>
              </tr>
            </thead>
            <tbody>
              {subscriptions.map(s => (
                <tr key={s.key + s.amount}>
                  <td className="merchant">{s.name}</td>
                  <td><span className={'tag ' + s.bucket}>{categoriesDef[s.category]?.display_name || s.category}</span></td>
                  <td className="center muted small">{s.cadence}</td>
                  <td className="right mono">{fmt$(s.amount)}</td>
                  <td className="right mono">{fmt$(s.monthlyEquivalent)}</td>
                  <td className="right mono">{fmt$(s.annualEquivalent)}</td>
                  <td>{s.monthlyEquivalent >= 50 ? <span className="tag uncategorized">REVIEW ≥$50</span> : <span className="muted small">ok</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, flexWrap: 'wrap', gap: 10 }}>
          <div className="card-title" style={{ margin: 0 }}>By Merchant, {year}</div>
          <div className="filter-bar" style={{ margin: 0 }}>
            <select className="cat-select" value={filterBucket} onChange={(e) => setFilterBucket(e.target.value)}>
              <option value="all">All spend</option>
              <option value="necessary">Necessary only</option>
              <option value="discretionary">Discretionary only</option>
            </select>
            <select className="cat-select" value={topN} onChange={(e) => setTopN(parseInt(e.target.value))}>
              <option value="20">Top 20</option>
              <option value="40">Top 40</option>
              <option value="100">Top 100</option>
              <option value="999">All</option>
            </select>
          </div>
        </div>
        <table className="table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Merchant</th>
              <th>Category</th>
              <th className="center">Visits</th>
              <th className="right">Avg / visit</th>
              <th className="right">{year} total</th>
              <th className="right">Last visit</th>
            </tr>
          </thead>
          <tbody>
            {merchants.slice(0, topN).map((m, i) => (
              <tr key={m.name + i}>
                <td className="muted mono">{i + 1}</td>
                <td className="merchant">{m.name}</td>
                <td><span className="cat-pill"><span className={'dot ' + m.bucket} />{categoriesDef[m.category]?.display_name || m.category}</span></td>
                <td className="center mono">{m.count}</td>
                <td className="right mono muted">{fmt$(m.avg)}</td>
                <td className="right mono" style={{ fontWeight: 600 }}>{fmt$(m.total)}</td>
                <td className="right mono muted">{fmtDate(m.lastDate)}</td>
              </tr>
            ))}
            {merchants.length === 0 && <tr><td colSpan="7" className="muted center">No spend data for {year} yet.</td></tr>}
          </tbody>
        </table>
        <div className="small muted" style={{ marginTop: 8 }}>
          Pro tip: scroll down. The bottom of this list is often where the surprising patterns live (the $4 7-Eleven runs that quietly add up).
        </div>
      </div>
    </>
  );
}

// ==================== AFFORDABILITY VIEW ====================
const AFFORDABILITY_DEFAULTS = {
  rent: 2199,                 // Forest Park at Fletcher Hills, 1BR — IN-PERSON QUOTE (tour 2026-05-22). Website showed ~under $2,000; confirm/negotiate.
  utilities: 280,             // Forest Park tour: water/trash $150 + electric ~$100 + gas stove ~$30
  wifi: 70,                   // Not included in rent
  insurance: 20,              // Renter's insurance
  groceriesAddon: 350,        // Solo cooking: ~$250-450/mo for a single adult
  householdAddon: 125,        // TP, soap, cleaning, personal care + ~$25 communal laundry (no in-unit W/D)
  diningReduction: 100,       // Restaurant spend you'll reduce when you cook at home
  familyBundleAfter: 400,     // Drops from $700 to $400 (still covers parents' Cox/ATT/Geico share)
  pauseFSD: true,             // -$107/mo
  dropExtraPrincipal: true,   // -$87/mo (Tesla loan goes from $500 to $413)
  rollbackBrokerage: false,   // -$325/mo (brokerage from $200/wk to $125/wk)
  useIncomeOverride: true,    // Plan against a normal-month income, not the 5-paycheck spikes
  incomeOverride: 5200,       // $1,200/wk annualized ($62,400/yr ÷ 12 = $5,200/mo). Includes the 4 five-paycheck months/yr.
  excludeBusiness: true,      // Strip business operating from baseline (not personal spend)
  movein: 2750,               // deposit $500 + app fee $51 + first month $2,199 (per Gio 2026-05-22). If 1-month-free applies at signing, drops to ~$551.
  waitMonths: 4,              // ~4 months of saving (Jun-Sep) -> move in Oct 1, 2026
  baselineMonth: '',          // '' = use most recent completed
};

function AffordabilityView({ transactions, snapshots, userState, dispatch, categoriesDef }) {
  const cfg = { ...AFFORDABILITY_DEFAULTS, ...(userState.affordability || {}) };

  const setCfg = (patch) => dispatch({ type: 'SET_AFFORDABILITY', patch });

  // Available baseline months (those with real spend)
  const availableMonths = useMemo(() => {
    const months = [...new Set(
      transactions
        .filter(t => !t.excluded_from_spend && t.amount < 0)
        .map(t => monthKey(t.date))
    )].sort();
    const cur = monthKey(today());
    return months.filter(k => k !== cur);
  }, [transactions]);

  const baselineKey = cfg.baselineMonth || (availableMonths[availableMonths.length - 1] || monthKey(today()));

  const baseline = useMemo(() => aggregateForMonth(transactions, baselineKey, categoriesDef), [transactions, baselineKey, categoriesDef]);

  // Cash on hand from latest snapshot
  const latestSnap = snapshots[snapshots.length - 1];
  const liquidCash = latestSnap ? (
    (latestSnap.assets['North Island Checking'] || 0) +
    (latestSnap.assets['Cabrillo Advantage Checking'] || 0) +
    (latestSnap.assets['Ally HYSA'] || 0)
  ) : 0;

  // Compute apartment monthly cost
  const familyBundleSavings = 700 - cfg.familyBundleAfter; // savings vs. current $700
  const soloLivingNet = (cfg.groceriesAddon || 0) + (cfg.householdAddon || 0) - (cfg.diningReduction || 0);
  const apartmentMonthlyAdd = cfg.rent + cfg.utilities + cfg.wifi + cfg.insurance - familyBundleSavings + soloLivingNet;

  // Compute spending cuts
  const fsdCut = cfg.pauseFSD ? 107 : 0;
  const principalCut = cfg.dropExtraPrincipal ? 87 : 0;
  const brokerageCut = cfg.rollbackBrokerage ? 325 : 0;
  const totalSpendCuts = fsdCut + principalCut;       // these reduce SPEND
  const totalInvestmentCuts = brokerageCut;            // this reduces INVESTING (frees the cash)

  // Project the post-move month
  // Strip business operating from baseline if requested (Gio runs business through personal cards but it's not personal spend)
  const businessSpend = baseline.byCategory['Business Operating'] || 0;
  const baseSpendRaw = baseline.spend;
  const baseSpend = cfg.excludeBusiness ? Math.max(0, baseSpendRaw - businessSpend) : baseSpendRaw;
  const baseInvest = baseline.investment;
  // Use override if enabled (Gio prefers planning at $1,200/wk conservative)
  const baseIncome = cfg.useIncomeOverride ? (cfg.incomeOverride || 0) : baseline.income;
  const actualBaseIncome = baseline.income;

  const projSpend = Math.max(0, baseSpend - totalSpendCuts) + apartmentMonthlyAdd;
  const projInvest = Math.max(0, baseInvest - totalInvestmentCuts);
  const projSurplus = baseIncome - projSpend - projInvest;
  const todaySurplus = baseIncome - baseSpend - baseInvest;

  // Cash trajectory
  // Months 0..waitMonths: still saving at current pace; at wait month, sign lease and pay move-in
  // After: monthly = projSurplus
  const trajectory = [];
  const startCash = liquidCash;
  let cash = startCash;
  trajectory.push({ month: 0, label: 'Now', cash });
  for (let m = 1; m <= 12; m++) {
    if (m <= cfg.waitMonths) {
      cash += todaySurplus;
      trajectory.push({ month: m, label: 'Mo +' + m + ' (saving)', cash });
    } else if (m === cfg.waitMonths + 1) {
      // Move-in month: pay one-time costs THEN apply post-move surplus
      cash = cash - cfg.movein + projSurplus;
      trajectory.push({ month: m, label: 'Mo +' + m + ' (move-in)', cash, marker: true });
    } else {
      cash += projSurplus;
      trajectory.push({ month: m, label: 'Mo +' + m, cash });
    }
  }

  const cashAtMoveIn = trajectory[cfg.waitMonths]?.cash || startCash;
  const cashAfterMoveIn = cashAtMoveIn - cfg.movein;
  const monthsOfBuffer = projSpend > 0 ? cashAfterMoveIn / projSpend : 0;

  const verdict = (() => {
    if (projSurplus < 0) return { tone: 'red',    label: 'Negative monthly cash flow', detail: 'You would burn cash every month after moving. Adjust the dials.' };
    if (projSurplus < 200) return { tone: 'yellow', label: 'Razor thin',                detail: 'Less than $200/mo cushion leaves no room for the unexpected.' };
    if (projSurplus < 500) return { tone: 'yellow', label: 'Workable but tight',        detail: 'Manageable, but small surprises eat the buffer fast.' };
    return { tone: 'green', label: 'Comfortable cushion', detail: 'You stay positive every month with room to absorb shocks.' };
  })();

  // Trajectory chart
  const chartRef = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    const ctx = chartRef.current?.getContext('2d');
    if (!ctx) return;
    if (inst.current) inst.current.destroy();
    const cs = getComputedStyle(document.documentElement);
    const labels = trajectory.map(t => t.label);
    const data = trajectory.map(t => t.cash);
    inst.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Cash', data, borderColor: cs.getPropertyValue('--accent').trim(), backgroundColor: 'rgba(88,166,255,.1)', fill: true, tension: 0.2, borderWidth: 2 }
        ]
      },
      options: {
        ...chartOpts(cs, false),
        plugins: {
          ...chartOpts(cs, false).plugins,
          tooltip: { ...chartOpts(cs, false).plugins.tooltip, callbacks: { label: (c) => 'Cash: $' + c.parsed.y.toLocaleString('en-US', { maximumFractionDigits: 0 }) } }
        },
      }
    });
    return () => inst.current?.destroy();
  }, [trajectory]);

  const tone = verdict.tone === 'red' ? 'var(--red)' : verdict.tone === 'yellow' ? 'var(--yellow)' : 'var(--green)';

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Apartment Affordability</div>
          <div className="page-sub">
            Conservative-mode by default. Plans at $1,200/wk income and excludes business spending from baseline. Toggle off if you want to see the optimistic case.
          </div>
        </div>
      </div>

      <div className="grid cols-4" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Verdict</div>
          <div className="card-value mono" style={{ fontSize: 18, color: tone, marginTop: 4 }}>{verdict.label}</div>
          <div className="small muted" style={{ marginTop: 6 }}>{verdict.detail}</div>
        </div>
        <div className="card">
          <div className="card-title">Projected Surplus</div>
          <div className={'card-value mono ' + (projSurplus >= 0 ? 'delta-pos' : 'delta-neg')}>{fmt$(projSurplus)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>per month, after rent + dials</div>
        </div>
        <div className="card">
          <div className="card-title">Cash At Move-In</div>
          <div className="card-value mono">{fmt$(cashAtMoveIn)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>after waiting {cfg.waitMonths} mo, before move-in cost</div>
        </div>
        <div className="card">
          <div className="card-title">Buffer After Move</div>
          <div className="card-value mono">{fmt$(cashAfterMoveIn)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>{monthsOfBuffer.toFixed(1)} months of post-move spend</div>
        </div>
      </div>

      <div className="grid cols-2" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title" style={{ marginBottom: 10 }}>Apartment Inputs</div>
          <div style={{ display: 'grid', gap: 10 }}>
            <NumberRow label="Rent" value={cfg.rent} onChange={(v) => setCfg({ rent: v })} />
            <NumberRow label="Utilities (electric/gas/water)" value={cfg.utilities} onChange={(v) => setCfg({ utilities: v })} hint="Zillow range $158-$266" />
            <NumberRow label="Wi-Fi" value={cfg.wifi} onChange={(v) => setCfg({ wifi: v })} />
            <NumberRow label="Renter's insurance" value={cfg.insurance} onChange={(v) => setCfg({ insurance: v })} />
            <NumberRow label="Family bundle (post-move, to mom)" value={cfg.familyBundleAfter} onChange={(v) => setCfg({ familyBundleAfter: v })} hint="Currently $700/mo. You said it'd drop to ~$400" />
            <NumberRow label="Groceries (solo, monthly)" value={cfg.groceriesAddon} onChange={(v) => setCfg({ groceriesAddon: v })} hint="Single adult, cooking 4-5 nights/wk: ~$250-450" />
            <NumberRow label="Household essentials (TP, soap, etc.)" value={cfg.householdAddon} onChange={(v) => setCfg({ householdAddon: v })} hint="Cleaning, paper goods, personal care: ~$50-100" />
            <NumberRow label="Dining reduction (offset)" value={cfg.diningReduction} onChange={(v) => setCfg({ diningReduction: v })} hint="$ less you'll spend on restaurants now you have a kitchen" />
            <NumberRow label="One-time move-in cost" value={cfg.movein} onChange={(v) => setCfg({ movein: v })} hint="App fee $51 + deposit $300 + first month + setup" />
          </div>
        </div>
        <div className="card">
          <div className="card-title" style={{ marginBottom: 10 }}>Income & Baseline Lens</div>
          <div style={{ display: 'grid', gap: 8 }}>
            <ToggleRow checked={cfg.useIncomeOverride} onChange={(v) => setCfg({ useIncomeOverride: v })} label="Plan against conservative income" delta={cfg.useIncomeOverride ? '$' + (cfg.incomeOverride || 0).toLocaleString() + '/mo' : 'using actual'} />
            {cfg.useIncomeOverride && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingLeft: 24 }}>
                <span className="small muted">Override income</span>
                <span className="mono muted">$</span>
                <input type="number" className="mono" value={cfg.incomeOverride}
                  onChange={(e) => setCfg({ incomeOverride: parseFloat(e.target.value) || 0 })}
                  style={{ width: 90, padding: '4px 8px', background: 'var(--bg-2)', color: 'var(--fg-0)', border: '1px solid var(--border)', borderRadius: 4 }} />
                <span className="small muted">/mo (default $1,200/wk × 4)</span>
              </div>
            )}
            <ToggleRow checked={cfg.excludeBusiness} onChange={(v) => setCfg({ excludeBusiness: v })} label="Exclude business spending from baseline" delta={businessSpend > 0 ? '-' + fmt$(businessSpend) : 'no biz spend in this month'} />
          </div>
          <hr className="divider" style={{ margin: '14px 0' }} />
          <div className="card-title" style={{ marginBottom: 10 }}>Spending Adjustments</div>
          <div style={{ display: 'grid', gap: 8 }}>
            <ToggleRow checked={cfg.pauseFSD} onChange={(v) => setCfg({ pauseFSD: v })} label="Pause Tesla FSD" delta="-$107/mo" />
            <ToggleRow checked={cfg.dropExtraPrincipal} onChange={(v) => setCfg({ dropExtraPrincipal: v })} label="Drop extra Tesla principal" delta="-$87/mo (loan to base $413)" />
            <ToggleRow checked={cfg.rollbackBrokerage} onChange={(v) => setCfg({ rollbackBrokerage: v })} label="Roll brokerage back to $125/wk" delta="-$325/mo (Roth still maxes)" />
          </div>
          <hr className="divider" style={{ margin: '14px 0' }} />
          <div className="card-title" style={{ marginBottom: 10 }}>Timing</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span className="small muted">Wait</span>
            <input type="number" className="mono" min="0" max="12" value={cfg.waitMonths}
              onChange={(e) => setCfg({ waitMonths: Math.max(0, Math.min(12, parseInt(e.target.value) || 0)) })}
              style={{ width: 60, padding: '4px 8px', background: 'var(--bg-2)', color: 'var(--fg-0)', border: '1px solid var(--border)', borderRadius: 4 }} />
            <span className="small muted">months before signing the lease</span>
          </div>
          <div className="small muted" style={{ marginTop: 6 }}>
            Each month of waiting adds <span className="mono delta-pos">{fmt$(todaySurplus)}</span> to your cash buffer.
          </div>
          <hr className="divider" style={{ margin: '14px 0' }} />
          <div className="card-title" style={{ marginBottom: 6 }}>Baseline Month</div>
          <select className="cat-select" style={{ maxWidth: '100%' }}
            value={cfg.baselineMonth || ''}
            onChange={(e) => setCfg({ baselineMonth: e.target.value })}>
            <option value="">Most recent completed ({fmtMonth(availableMonths[availableMonths.length - 1] || '')})</option>
            {availableMonths.slice().reverse().map(k => (
              <option key={k} value={k}>{fmtMonth(k)}</option>
            ))}
          </select>
          <div className="small muted" style={{ marginTop: 6 }}>The model uses this month's actual income and spending as the baseline.</div>
        </div>
      </div>

      {(() => {
        const teslaLoan = cfg.dropExtraPrincipal ? 413 : 500;
        const fsd = cfg.pauseFSD ? 0 : 107;
        const items = [
          { label: 'Rent', amount: cfg.rent },
          { label: 'Tesla loan', amount: teslaLoan },
          { label: 'Family bundle (mom)', amount: cfg.familyBundleAfter },
          { label: 'Groceries', amount: cfg.groceriesAddon },
          { label: 'Utilities', amount: cfg.utilities },
          { label: 'Auto fuel + charging', amount: 110 },
          { label: 'Household + care', amount: cfg.householdAddon },
          { label: 'Wifi', amount: cfg.wifi },
          { label: 'DMV (per month)', amount: 60 },
          { label: 'Auto maintenance', amount: 50 },
          { label: "Renter's insurance", amount: cfg.insurance },
        ];
        if (fsd > 0) items.push({ label: 'Tesla FSD', amount: fsd });
        items.sort((a, b) => b.amount - a.amount);
        const totalExp = items.reduce((s, i) => s + i.amount, 0);
        const leftover = baseIncome - totalExp;
        const inc = baseIncome || 1;
        return (
          <div className="card" style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
              <div className="card-title" style={{ margin: 0 }}>Income vs Expenses, After Move</div>
              <div className="small muted">Easy-read breakdown. Bars are sized to your income.</div>
            </div>
            <div style={{ background: 'var(--bg-2)', borderRadius: 12, padding: '12px 16px', marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div className="small muted">Monthly income {cfg.useIncomeOverride && '(conservative)'}</div>
                <div className="mono" style={{ fontSize: 26, fontWeight: 700, color: 'var(--green)' }}>{fmt$(baseIncome)}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="small muted">Necessities</div>
                <div className="mono" style={{ fontSize: 18, fontWeight: 600 }}>{fmt$(totalExp)}</div>
              </div>
            </div>
