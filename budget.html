// ==================== TRANSACTIONS VIEW ====================
function TransactionsView({ transactions, accounts, categoriesDef, userState, dispatch, openDrawer, showToast }) {
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterAccount, setFilterAccount] = useState('');
  const [showExcluded, setShowExcluded] = useState(true);
  const [showOnlyOverridden, setShowOnlyOverridden] = useState(false);

  const filtered = useMemo(() => {
    return transactions.filter(t => {
      if (search && !t.description.toLowerCase().includes(search.toLowerCase())) return false;
      if (filterCat && t.category !== filterCat) return false;
      if (filterAccount && t.account_id !== filterAccount) return false;
      if (!showExcluded && t.excluded_from_spend) return false;
      if (showOnlyOverridden && !t.overridden) return false;
      return true;
    });
  }, [transactions, search, filterCat, filterAccount, showExcluded, showOnlyOverridden]);

  const accountById = Object.fromEntries(accounts.map(a => [a.id, a]));

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Transactions</div>
          <div className="page-sub">{filtered.length} of {transactions.length} shown. Click a row to recategorize.</div>
        </div>
      </div>

      <div className="filter-bar">
        <input type="text" placeholder="Search description (e.g., Tesla, Amazon)..." value={search} onChange={(e) => setSearch(e.target.value)} />
        <select className="cat-select" value={filterCat} onChange={(e) => setFilterCat(e.target.value)} style={{ maxWidth: 220 }}>
          <option value="">All categories</option>
          {Object.entries(categoriesDef).map(([k, v]) => (<option key={k} value={k}>{v.display_name}</option>))}
        </select>
        <select className="cat-select" value={filterAccount} onChange={(e) => setFilterAccount(e.target.value)} style={{ maxWidth: 220 }}>
          <option value="">All accounts</option>
          {accounts.map(a => (<option key={a.id} value={a.id}>{a.name}</option>))}
        </select>
        <label className="small muted" style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <input type="checkbox" checked={showExcluded} onChange={(e) => setShowExcluded(e.target.checked)} /> show transfers/income
        </label>
        <label className="small muted" style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <input type="checkbox" checked={showOnlyOverridden} onChange={(e) => setShowOnlyOverridden(e.target.checked)} /> only overridden
        </label>
      </div>

      <div className="card">
        <table className="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Account</th>
              <th>Category</th>
              <th className="right">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(tx => (
              <tr key={tx.id} className="row-clickable" onClick={() => openDrawer({ type: 'tx', txId: tx.id })}>
                <td className="mono">{fmtDate(tx.date)}</td>
                <td>
                  <div className="merchant">{tx.description.length > 60 ? tx.description.slice(0, 60) + '…' : tx.description}</div>
                  {tx.is_return && <span className="tag investment" style={{ marginTop: 2, display: 'inline-block' }}>return netted</span>}
                  {Math.abs(tx.amount) > 100 && tx.amount < 0 && !['Family Bundle','Auto Loan','Investment','Credit Card Payment','Transfer','Returns','Rent'].includes(tx.category) && (
                    <span style={{ marginTop: 2, marginLeft: 4, display: 'inline-block', background: 'var(--red-dim)', color: 'var(--red)', fontSize: 10.5, fontWeight: 700, padding: '1px 7px', borderRadius: 999, letterSpacing: '.3px' }}>
                      REVIEW &gt;$100
                    </span>
                  )}
                </td>
                <td className="muted">{accountById[tx.account_id]?.name || tx.account_id}</td>
                <td>
                  <span className="cat-pill">
                    <span className={'dot ' + tx.bucket} />
                    {categoriesDef[tx.category]?.display_name || tx.category}
                    {tx.overridden && <span className="muted" style={{ marginLeft: 4 }}>•</span>}
                  </span>
                </td>
                <td className={'right mono ' + (tx.amount > 0 ? 'delta-pos' : tx.amount < 0 ? '' : 'muted')}>{fmt$(tx.amount, true)}</td>
                <td className="right">
                  <span className="muted small">›</span>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="6" className="muted center">No transactions match.</td></tr>}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ==================== DRAWER ====================
function Drawer({ drawer, transactions, accounts, categoriesDef, userState, dispatch, onClose, showToast }) {
  if (!drawer) return null;
  const accountById = Object.fromEntries(accounts.map(a => [a.id, a]));

  if (drawer.type === 'category') {
    const items = transactions.filter(t =>
      monthKey(t.date) === drawer.monthKey && t.category === drawer.category
    ).sort((a, b) => b.date.localeCompare(a.date));
    const total = items.reduce((a, t) => a + (t.amount < 0 ? Math.abs(t.amount) : 0), 0);
    return (
      <div className="drawer-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="drawer">
          <div className="drawer-header">
            <div>
              <div className="page-title" style={{ fontSize: 18 }}>{categoriesDef[drawer.category]?.display_name || drawer.category}</div>
              <div className="muted small">{fmtMonth(drawer.monthKey)} • {items.length} transactions • {fmt$(total)}</div>
            </div>
            <button className="btn subtle" onClick={onClose}>✕</button>
          </div>
          <table className="table">
            <thead><tr><th>Date</th><th>Description</th><th>Account</th><th className="right">Amount</th></tr></thead>
            <tbody>
              {items.map(tx => (
                <tr key={tx.id} className="row-clickable" onClick={() => dispatch({ type: 'OVERRIDE_TX', txId: tx.id, category: tx.category }) || null /* noop placeholder */}>
                  <td className="mono">{fmtDate(tx.date)}</td>
                  <td>{tx.description.length > 50 ? tx.description.slice(0, 50) + '…' : tx.description}</td>
                  <td className="muted small">{accountById[tx.account_id]?.name}</td>
                  <td className={'right mono ' + (tx.amount > 0 ? 'delta-pos' : '')}>{fmt$(tx.amount, true)}</td>
                </tr>
              ))}
              {items.length === 0 && <tr><td colSpan="4" className="muted center">Nothing here for this month.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  if (drawer.type === 'tx') {
    const tx = transactions.find(t => t.id === drawer.txId);
    if (!tx) return null;
    return (
      <div className="drawer-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="drawer" style={{ width: 'min(560px, 100%)' }}>
          <div className="drawer-header">
            <div>
              <div className="page-title" style={{ fontSize: 18 }}>Transaction</div>
              <div className="muted small">{accountById[tx.account_id]?.name || tx.account_id} • {fmtDate(tx.date)}</div>
            </div>
            <button className="btn subtle" onClick={onClose}>✕</button>
          </div>
          <div className="card-value mono" style={{ fontSize: 24, marginBottom: 4, color: tx.amount > 0 ? 'var(--green)' : 'var(--fg-0)' }}>{fmt$(tx.amount, true)}</div>
          <div style={{ marginBottom: 12 }}>{tx.description}</div>
          {tx.is_return && (
            <div className="help-callout" style={{ marginBottom: 12 }}>
              This is a refund and was matched to a prior purchase. Both sides are excluded from spend.
            </div>
          )}
          <hr className="divider" />
          <div className="card-title" style={{ marginBottom: 6 }}>Category</div>
          <select className="cat-select" style={{ maxWidth: '100%' }}
            value={tx.category}
            onChange={(e) => { dispatch({ type: 'OVERRIDE_TX', txId: tx.id, category: e.target.value }); showToast('Category updated for this transaction.'); }}>
            {Object.entries(categoriesDef).map(([k, v]) => (<option key={k} value={k}>{v.display_name}</option>))}
          </select>
          <div style={{ marginTop: 8, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn btn-sm" onClick={() => { dispatch({ type: 'OVERRIDE_TX_CLEAR', txId: tx.id }); showToast('Transaction reset to default.'); }}>Reset to default</button>
            <button className="btn btn-sm primary" onClick={() => {
              dispatch({ type: 'OVERRIDE_MERCHANT', merchantKey: tx.merchant_key, category: tx.category });
              showToast('Stickied: future transactions from this merchant will use ' + (categoriesDef[tx.category]?.display_name || tx.category) + '.');
            }}>Apply to all "{tx.merchant_key}"</button>
            {userState.merchantOverrides[tx.merchant_key] && (
              <button className="btn btn-sm" onClick={() => { dispatch({ type: 'OVERRIDE_MERCHANT_CLEAR', merchantKey: tx.merchant_key }); showToast('Merchant rule cleared.'); }}>Clear merchant rule</button>
            )}
          </div>
          <hr className="divider" />
          <div className="small muted">
            Merchant key: <span className="mono">{tx.merchant_key}</span><br/>
            Source: <span className="mono">{tx.source_file}</span><br/>
            ID: <span className="mono">{tx.id}</span>
          </div>
        </div>
      </div>
    );
  }
  return null;
}

// ==================== SETTINGS VIEW ====================
function SettingsView({ userState, dispatch, data, exportAll, importFile, showToast }) {
  const fileRef = useRef(null);
  const overrideCount = Object.keys(userState.txOverrides).length + Object.keys(userState.merchantOverrides).length;

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Settings &amp; Data</div>
          <div className="page-sub">Backup, restore, and refresh.</div>
        </div>
      </div>

      <div className="grid cols-2" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Theme</div>
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <button className={'btn ' + (userState.theme === 'dark' ? 'primary' : '')} onClick={() => dispatch({ type: 'SET_THEME', theme: 'dark' })}>Dark</button>
            <button className={'btn ' + (userState.theme === 'light' ? 'primary' : '')} onClick={() => dispatch({ type: 'SET_THEME', theme: 'light' })}>Light</button>
          </div>
        </div>
        <div className="card">
          <div className="card-title">Backup &amp; Restore</div>
          <div style={{ display: 'flex', gap: 8, marginTop: 8, flexWrap: 'wrap' }}>
            <button className="btn primary" onClick={exportAll}>Export Everything (JSON)</button>
            <button className="btn" onClick={() => fileRef.current.click()}>Restore from Backup</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={(e) => e.target.files[0] && importFile(e.target.files[0])} />
          </div>
          <div className="small muted" style={{ marginTop: 8 }}>Saves a JSON file with the embedded data + your overrides + budgets + snapshots.</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-title" style={{ marginBottom: 8 }}>Refresh from Drive</div>
        <div className="help-callout">
          The app embeds your bank data at build time. To pull new statements, drop them in the Drive folder, then ask me in chat:{' '}
          <span className="mono">"Refresh my Money Terminal."</span>{' '}
          I will re-pull from Drive, re-parse, dedup against existing transactions, and rebuild this file.
          Your overrides, budgets, and snapshots are preserved (they live in your browser, not in the data file).
        </div>
        <div className="small muted" style={{ marginTop: 8 }}>Last build: <span className="mono">{data.generated_at}</span></div>
        <div className="small muted">Drop new files in: <span className="mono">My Drive / Claude AI / [account folder]</span></div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-title" style={{ marginBottom: 8 }}>Your Overrides</div>
        <div className="small muted" style={{ marginBottom: 8 }}>{overrideCount} active overrides ({Object.keys(userState.merchantOverrides).length} merchant rules, {Object.keys(userState.txOverrides).length} per-transaction).</div>
        {Object.keys(userState.merchantOverrides).length > 0 && (
          <table className="table">
            <thead><tr><th>Merchant key</th><th>Category</th><th></th></tr></thead>
            <tbody>
              {Object.entries(userState.merchantOverrides).map(([k, v]) => (
                <tr key={k}>
                  <td className="mono">{k}</td>
                  <td><span className="cat-pill"><span className={'dot ' + (data.categories[v]?.bucket || 'uncategorized')} />{data.categories[v]?.display_name || v}</span></td>
                  <td className="right">
                    <button className="btn btn-sm danger" onClick={() => { dispatch({ type: 'OVERRIDE_MERCHANT_CLEAR', merchantKey: k }); showToast('Rule removed.'); }}>Remove</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
        {overrideCount === 0 && <div className="muted small">No overrides yet. Click any transaction to recategorize.</div>}
      </div>

      <div className="card">
        <div className="card-title" style={{ marginBottom: 8 }}>Accounts in Scope</div>
        <table className="table">
          <thead><tr><th>Account</th><th>Type</th><th>Mask</th><th className="right">Latest Balance</th></tr></thead>
          <tbody>
            {data.accounts.map(a => (
              <tr key={a.id}>
                <td>{a.name}</td>
                <td><span className="muted">{a.type}</span></td>
                <td className="mono muted">{a.mask || '—'}</td>
                <td className="right mono">{a.latest_balance !== null ? fmt$(a.latest_balance) : '—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ==================== MOUNT ====================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
(function(){
  function init(){
    if (document.getElementById('navHamburger')) return;
    var ham = document.createElement('button');
    ham.id = 'navHamburger'; ham.className = 'nav-hamburger'; ham.setAttribute('aria-label','Menu');
    ham.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
    var scrim = document.createElement('div');
    scrim.id = 'navScrim'; scrim.className = 'nav-scrim';
    document.body.appendChild(ham); document.body.appendChild(scrim);
    ham.addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
    scrim.addEventListener('click', function(){ document.body.classList.remove('nav-open'); });
    document.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('.nav-item')) document.body.classList.remove('nav-open');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
