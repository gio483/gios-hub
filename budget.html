.app {

.nav-scrim { display: none; }

    transform: translateX(-100%); transition: transform .22s ease;
    overflow-y: auto;
  }
  body.nav-open .sidebar { transform: translateX(0); box-shadow: 6px 0 28px rgba(0,0,0,.45); }
  .nav-hamburger {
    display: flex; align-items: center; justify-content: center;
    position: fixed; top: 10px; left: 12px; z-index: 45;
    width: 42px; height: 42px; border-radius: 11px;
    background: var(--bg-2); border: 1px solid var(--border); color: var(--fg-0); cursor: pointer;
  }
  .nav-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 55; }
  body.nav-open .nav-scrim { display: block; }
  .main { padding-top: 64px; }

.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 14px 12px;
  gap: 16px;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px;
}
.sidebar-brand-mark {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 14px;
  box-shadow: 0 2px 8px rgba(124,131,255,.35);
}
.sidebar-brand-text { font-weight: 650; letter-spacing: -.1px; font-size: 14px; }
.sidebar-brand-sub { color: var(--fg-2); font-size: 11px; margin-top: -1px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  color: var(--fg-1); font-weight: 500; font-size: 13.5px;
  user-select: none; position: relative;
  transition: background .14s ease, color .14s ease;
}
.nav-item:hover { background: var(--bg-2); color: var(--fg-0); }
.nav-item.active { background: var(--bg-3); color: var(--fg-0); font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item .nav-key { font-size: 10px; color: var(--fg-3); margin-left: auto; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; }
.nav-item .nav-icon { width: 18px; text-align: center; opacity: .9; font-size: 15px; }
.sidebar-meta {
  margin-top: auto;
  padding: 10px 8px;
  border-top: 1px solid var(--border);
  color: var(--fg-2);
  font-size: 11px;
  display: flex; flex-direction: column; gap: 6px;
}
.sidebar-meta .small-link { color: var(--accent); cursor: pointer; }
.sidebar-meta .small-link:hover { text-decoration: underline; }

.main { overflow: auto; padding: 22px 28px 80px; }
@media (max-width: 768px) { .main { padding: 14px 14px 40px; } }
.page-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
}
.page-title { font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
.page-sub { color: var(--fg-2); font-size: 12.5px; margin-top: 3px; }
.page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: var(--bg-2); color: var(--fg-0);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  cursor: pointer;
  font: inherit; font-weight: 550; font-size: 13px;
  transition: background .14s ease, transform .08s ease, box-shadow .14s ease;
}
.btn:hover { background: var(--bg-3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(124,131,255,.3); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.subtle { background: transparent; border-color: transparent; }
.btn.subtle:hover { background: var(--bg-2); }
.btn.danger { color: var(--red); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

.month-picker {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-2); border: 1px solid var(--border-strong);
  border-radius: 6px; padding: 4px 8px;
}
.month-picker button {
  background: transparent; border: 0; color: var(--fg-1); cursor: pointer; padding: 2px 6px; border-radius: 4px;
}
.month-picker button:hover { background: var(--bg-3); color: var(--fg-0); }
.month-picker .label { font-weight: 600; padding: 0 4px; min-width: 100px; text-align: center; }

.grid { display: grid; gap: 12px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } .grid.cols-4 { grid-template-columns: 1fr 1fr; } }

.card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.card-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
  color: var(--fg-2); font-weight: 650; margin-bottom: 6px;
}
.card-value {
  font-size: 23px; font-weight: 700; letter-spacing: -.6px;
}
.card-value.lg { font-size: 32px; }
.card-sub { font-size: 11px; color: var(--fg-2); margin-top: 4px; }

.delta-pos { color: var(--green); }
.delta-neg { color: var(--red); }
.delta-zero { color: var(--fg-2); }

.split-bar {
  height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden;
  display: flex; margin-top: 10px;
}
.split-bar .seg-necessary { background: var(--necessary); }
.split-bar .seg-discretionary { background: var(--discretionary); }
.split-legend {
  display: flex; gap: 14px; margin-top: 8px;
  font-size: 11px; color: var(--fg-1);
}
.legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend-dot.necessary { background: var(--necessary); }
.legend-dot.discretionary { background: var(--discretionary); }
.legend-dot.income { background: var(--green); }
.legend-dot.investment { background: var(--blue); }

.chart-wrap { position: relative; width: 100%; min-height: 200px; }

.table {
  width: 100%; border-collapse: collapse;
  font-size: 12.5px;
}
.table th, .table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.table th { color: var(--fg-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.table tr:hover td { background: var(--bg-2); }
.table td.right, .table th.right { text-align: right; }
.table td.center, .table th.center { text-align: center; }
.table .row-clickable { cursor: pointer; }
.table .merchant { color: var(--fg-0); font-weight: 500; }
.table .desc-sub { color: var(--fg-2); font-size: 11px; }

.tag {
  display: inline-block;
  padding: 1px 7px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600;
  letter-spacing: .3px;
}
.tag.necessary { background: var(--necessary-dim); color: var(--necessary); }
.tag.discretionary { background: var(--discretionary-dim); color: var(--discretionary); }
.tag.investment { background: rgba(88,166,255,.12); color: var(--blue); }
.tag.income { background: var(--green-dim); color: var(--green); }
.tag.transfer { background: var(--bg-3); color: var(--fg-2); }
.tag.uncategorized { background: var(--yellow-dim); color: var(--yellow); }
.tag.debt_principal { background: rgba(163,113,247,.12); color: var(--purple); }

.budget-row {
  display: grid;
  grid-template-columns: 1.1fr 110px 90px 1fr 100px;
  gap: 10px; align-items: center;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);

.budget-row:hover { background: var(--bg-2); }
.budget-row .name { font-weight: 500; }

.budget-row .progress-fill.under { background: var(--green); }
.budget-row .progress-fill.warn { background: var(--yellow); }
.budget-row .progress-fill.over { background: var(--red); }
.budget-row .pace-over { color: var(--red); font-size: 11px; }
.budget-row .pace-on { color: var(--fg-2); font-size: 11px; }

  color: var(--fg-0); border: 1px solid var(--border); border-radius: 4px;
  font: inherit;
}
.budget-row input[type="number"]:focus { outline: none; border-color: var(--accent); }

.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex; justify-content: flex-end;
  z-index: 100;
}
.drawer {
  width: min(720px, 100%); height: 100%;
  background: var(--bg-1);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow-y: auto;
  padding: 20px 24px;
}
.drawer-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px;
}

.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--bg-3); color: var(--fg-0);
  border: 1px solid var(--border-strong);
  padding: 8px 14px; border-radius: 6px;
  z-index: 200; font-size: 12px;
  box-shadow: var(--shadow);
}

select.cat-select {

  border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 6px; font: inherit; font-size: 11.5px;
  max-width: 180px;
}
select.cat-select:focus { outline: none; border-color: var(--accent); }

.filter-bar {
  display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
}
.filter-bar input[type="text"] {
  padding: 6px 10px; background: var(--bg-2); color: var(--fg-0);
  border: 1px solid var(--border); border-radius: 6px;
  font: inherit; min-width: 200px;
}
.filter-bar input[type="text"]:focus { outline: none; border-color: var(--accent); }

.muted { color: var(--fg-2); }
.small { font-size: 11px; }
.spacer { flex: 1; }

.kbd {
  font-family: "JetBrains Mono", "SF Mono", monospace;
  font-size: 10px;
  background: var(--bg-3); color: var(--fg-1);
  border: 1px solid var(--border);
  padding: 1px 5px; border-radius: 4px;
}

hr.divider { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }

.cat-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid var(--border);
  font-size: 11.5px; color: var(--fg-1);
  cursor: pointer;
}
.cat-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.cat-pill .dot.necessary { background: var(--necessary); }
.cat-pill .dot.discretionary { background: var(--discretionary); }
.cat-pill .dot.income { background: var(--green); }
.cat-pill .dot.investment { background: var(--blue); }
.cat-pill .dot.transfer { background: var(--fg-3); }
.cat-pill .dot.uncategorized { background: var(--yellow); }
.cat-pill .dot.debt_principal { background: var(--purple); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

.snapshot-form {
  display: grid; gap: 8px;
  grid-template-columns: 1fr 1fr;
}
.snapshot-form input, .snapshot-form select {
  padding: 6px 8px; background: var(--bg-2); color: var(--fg-0);
  border: 1px solid var(--border); border-radius: 4px;
  font: inherit;
}
.snapshot-form input:focus { outline: none; border-color: var(--accent); }

.help-callout {
  background: var(--bg-2); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 10px 14px; border-radius: 4px;
  font-size: 12px; color: var(--fg-1);

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; border: 2px solid var(--bg-0); }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

const fmt$ = (n, withSign=false) => {
  if (n === null || n === undefined || isNaN(n)) return '$0.00';
  const sign = withSign ? (n > 0 ? '+' : n < 0 ? '' : '') : '';
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + sign + '$' + formatted;
};
const fmt$short = (n) => {
  if (n === null || n === undefined || isNaN(n)) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1000) return (n < 0 ? '-' : '') + '$' + (abs/1000).toFixed(abs >= 10000 ? 0 : 1) + 'k';
  return fmt$(n).replace(/\.00$/, '');
};
const fmtPct = (n, digits=1) => {
  if (n === null || n === undefined || isNaN(n)) return '0%';
  return (n * 100).toFixed(digits) + '%';
};
const fmtDate = (s) => {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};
const fmtMonth = (s) => {
  if (!s) return '';

  const d = new Date(parseInt(y), parseInt(m)-1, 1);
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

// ==================== INDEXEDDB ====================
const DB_NAME = 'MoneyTerminal';
const DB_VERSION = 1;
const STORE = 'state';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGet(key) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('IndexedDB unavailable, using in-memory fallback', e);
    return window.__memFallback?.[key];
  }
}
async function dbSet(key, value) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    window.__memFallback = window.__memFallback || {};
    window.__memFallback[key] = value;
  }
}

// ==================== STATE REDUCER ====================
const initialUserState = {
  merchantOverrides: {},   // merchant_key -> categoryName
  txOverrides: {},         // tx.id -> categoryName
  budgets: {},             // categoryName -> dollarAmount (loaded from defaults if missing)
  discretionaryBudget: null,
  overallBudget: null,
  savingsTarget: null,     // {rate, monthly_amount}
  manualSnapshots: [],     // additional NW snapshots added by user
  theme: 'dark',
  lastRefresh: null,
};

function userStateReducer(state, action) {
  switch (action.type) {
    case 'INIT': return { ...state, ...action.payload };
    case 'SET_THEME': return { ...state, theme: action.theme };
    case 'OVERRIDE_TX': {
      return { ...state, txOverrides: { ...state.txOverrides, [action.txId]: action.category } };
    }
    case 'OVERRIDE_TX_CLEAR': {
      const c = { ...state.txOverrides };
      delete c[action.txId];
      return { ...state, txOverrides: c };
    }
    case 'OVERRIDE_MERCHANT': {
      return { ...state, merchantOverrides: { ...state.merchantOverrides, [action.merchantKey]: action.category } };
    }
    case 'OVERRIDE_MERCHANT_CLEAR': {
      const c = { ...state.merchantOverrides };
      delete c[action.merchantKey];
      return { ...state, merchantOverrides: c };
    }
    case 'SET_BUDGET': {
      const next = { ...state.budgets };
      if (action.amount === null || action.amount === '') delete next[action.category];
      else next[action.category] = parseFloat(action.amount);
      return { ...state, budgets: next };
    }
    case 'SET_DISC_BUDGET': return { ...state, discretionaryBudget: action.amount };
    case 'SET_OVERALL_BUDGET': return { ...state, overallBudget: action.amount };
    case 'SET_SAVINGS_TARGET': return { ...state, savingsTarget: action.target };
    case 'ADD_SNAPSHOT': return { ...state, manualSnapshots: [...state.manualSnapshots, action.snapshot] };
    case 'DELETE_SNAPSHOT': return { ...state, manualSnapshots: state.manualSnapshots.filter(s => s.date !== action.date) };
    case 'SET_LAST_REFRESH': return { ...state, lastRefresh: action.iso };
    case 'SET_AFFORDABILITY': return { ...state, affordability: { ...(state.affordability || {}), ...action.patch } };
    case 'SET_MY_BUDGET': return { ...state, myBudget: { ...(state.myBudget || {}), ...action.patch } };
    case 'SET_GOALS': return { ...state, goals: { ...(state.goals || {}), ...action.patch } };
    case 'IMPORT_FULL': return { ...state, ...action.payload };
    default: return state;
  }
}

// ==================== DERIVE ====================
function applyOverrides(transactions, userState, baseRules, categoriesDef) {
  return transactions.map(tx => {
    let cat = tx.category;
    let overridden = false;
    // Tx-level override beats merchant override beats baseline
    if (userState.txOverrides[tx.id]) {
      cat = userState.txOverrides[tx.id];
      overridden = true;
    } else if (userState.merchantOverrides[tx.merchant_key]) {
      cat = userState.merchantOverrides[tx.merchant_key];
      overridden = true;
    }
    const bucket = categoriesDef[cat]?.bucket || 'uncategorized';
    const isReturn = tx.category === 'Returns' || cat === 'Returns';
    const excluded = isReturn || ['transfer','investment','income','debt_principal'].includes(bucket);
    return { ...tx, category: cat, bucket, excluded_from_spend: excluded, overridden };
  });
}

function aggregateForMonth(transactions, key, categoriesDef) {
  const inMonth = transactions.filter(tx => monthKey(tx.date) === key);
  const out = {
    income: 0,
    spend: 0,
    necessary: 0,
    discretionary: 0,
    investment: 0,
    debtPrincipal: 0,
    transfersNet: 0,
    byCategory: {},
    transactions: inMonth,
  };
  out.oneOffIncome = 0;
  out.oneOffSpend = 0;
  for (const tx of inMonth) {
    if (tx.category === 'Returns') continue;
    // One-offs are tracked separately and excluded from the headline monthly totals
    if (tx.is_one_off) {
      if (tx.amount > 0) out.oneOffIncome += tx.amount;
      else if (!tx.excluded_from_spend) out.oneOffSpend += Math.abs(tx.amount);
      continue;
    }
    if (tx.bucket === 'income' && tx.amount > 0) {
      out.income += tx.amount;
    } else if (tx.bucket === 'investment') {
      out.investment += Math.abs(tx.amount);
    } else if (tx.bucket === 'debt_principal') {
      out.debtPrincipal += Math.abs(tx.amount);
    } else if (tx.bucket === 'transfer') {
      out.transfersNet += tx.amount;
    } else if (!tx.excluded_from_spend && tx.amount < 0) {
      const a = Math.abs(tx.amount);
      out.spend += a;
      if (tx.bucket === 'necessary') out.necessary += a;
      else if (tx.bucket === 'discretionary') out.discretionary += a;
      out.byCategory[tx.category] = (out.byCategory[tx.category] || 0) + a;
    } else if (tx.bucket === 'uncategorized' && tx.amount < 0) {
      const a = Math.abs(tx.amount);
      out.byCategory[tx.category] = (out.byCategory[tx.category] || 0) + a;
      // Uncategorized doesn't count as necessary or discretionary, but we surface it
    }
  }
  out.netCashFlow = out.income - out.spend - out.investment - out.debtPrincipal;
  return out;
}

function ytdAggregate(transactions, year, categoriesDef) {
  const months = [];
  for (let m = 1; m <= 12; m++) {
    const key = year + '-' + String(m).padStart(2, '0');
    months.push({ key, ...aggregateForMonth(transactions, key, categoriesDef) });
  }
  return months;
}

// ==================== SUBSCRIPTIONS vs HABITS ====================
// A SUBSCRIPTION is a recurring bill for access to an app/service (Netflix, Canva, Tesla FSD, iCloud, gym).
// A HABIT is a frequent discretionary CHOICE you make each time (eating out, coffee, Amazon, shopping).
const SUB_MERCHANT_RE = /netflix|hulu|disney\+?|spotify|youtube|hbo|max\b|paramount|peacock|canva|adobe|openai|chatgpt|claude|anthropic|github|notion|figma|dropbox|icloud|apple\.com\/bill|google\s?(one|storage|drive)|amazon\s?prime|prime\s?video|audible|patreon|substack|wsj|nytimes|new york times|linkedin|microsoft|office\s?365|tesla.*(fsd|premium|connect)|peloton|dashpass|uber\s?one|gym|fitness|membership|\bsubscription\b/i;
function isSubscriptionTx(t) {
  if (t.amount >= 0 || t.excluded_from_spend) return false;
  if (t.category === 'Business Operating') return false; // business spend, not a personal subscription
  if (t.category === 'Subscriptions') return true;
  return SUB_MERCHANT_RE.test(t.description || '') || SUB_MERCHANT_RE.test(t.merchant_key || '');
}
const HABIT_CATS = new Set(['Restaurants', 'Coffee & Drinks', 'Convenience', 'Shopping', 'Tools & Home']);
function cleanMerchant(desc) {
  const s = (desc || '')
    .replace(/^(credit or withdrawal |card purchase (withdrawal|advance) |home banking.*?transfer (to|from) |tst\*\s?|sq ?\*|now withdrawal )/i, '')
    .replace(/\s+#?\d{2,}.*$/, '')
    .replace(/\*[a-z0-9]+/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  return (s || (desc || '')).slice(0, 28);
}
// Canonical brand names so e.g. "netflix com 408" + "netflix com netflix" collapse to one "Netflix"
const SUB_BRANDS = [[/netflix/i, 'Netflix'], [/tesla/i, 'Tesla'], [/canva/i, 'Canva'], [/spotify/i, 'Spotify'], [/adobe/i, 'Adobe'], [/hulu/i, 'Hulu'], [/disney/i, 'Disney+'], [/youtube/i, 'YouTube'], [/hbo|\bmax\b/i, 'Max'], [/openai|chatgpt|claude|anthropic/i, 'AI tools'], [/icloud|apple\.com/i, 'Apple / iCloud'], [/amazon ?prime|prime ?video/i, 'Amazon Prime'], [/github/i, 'GitHub'], [/notion/i, 'Notion'], [/figma/i, 'Figma'], [/dropbox/i, 'Dropbox'], [/peloton/i, 'Peloton'], [/gym|fitness/i, 'Gym / Fitness'], [/audible/i, 'Audible'], [/spotify/i, 'Spotify']];
function subBrand(t) {
  const s = (t.description || '') + ' ' + (t.merchant_key || '');
  for (const [re, n] of SUB_BRANDS) if (re.test(s)) return n;
  return cleanMerchant(t.description);
}
const GENERIC_KEY = /^(card purchase( (advance|withdrawal))?|withdrawal|purchase|pos|debit|credit|ach)\b/i;
// Canonical names for common chains so order-id noise collapses into one habit line
const HABIT_BRANDS = [[/amazon/i, 'Amazon'], [/home depot/i, 'Home Depot'], [/harbor freight/i, 'Harbor Freight'], [/buffalo wild/i, 'Buffalo Wild Wings'], [/mcdonald/i, "McDonald's"], [/starbucks/i, 'Starbucks'], [/taco bell/i, 'Taco Bell'], [/chipotle/i, 'Chipotle'], [/costco/i, 'Costco'], [/\btarget\b/i, 'Target'], [/walmart/i, 'Walmart'], [/7[\s-]?eleven/i, '7-Eleven'], [/chick[\s-]?fil/i, 'Chick-fil-A'], [/in[\s-]?n[\s-]?out/i, 'In-N-Out'], [/uber\s?eats/i, 'Uber Eats'], [/doordash/i, 'DoorDash'], [/grubhub/i, 'Grubhub'], [/dominos|domino's/i, "Domino's"], [/jack in the box/i, 'Jack in the Box'], [/el pollo/i, 'El Pollo Loco'], [/circle k/i, 'Circle K'], [/chevron/i, 'Chevron'], [/shell\b/i, 'Shell']];
function habitName(t) {
  const s = (t.description || '') + ' ' + (t.merchant_key || '');
  for (const [re, n] of HABIT_BRANDS) if (re.test(s)) return n;
  const mk = t.merchant_key;
  return (mk && !GENERIC_KEY.test(mk)) ? cleanMerchant(mk).replace(/\b\w/g, c => c.toUpperCase()) : cleanMerchant(t.description);
}
// Detect recurring subscriptions within the last `sinceMonths` months
function detectSubscriptions(transactions, sinceMonths) {
  const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - (sinceMonths || 12));
  const all = transactions.filter(t => isSubscriptionTx(t) && new Date(t.date + 'T00:00:00') >= cutoff);
  const grouped = {};
  for (const tx of all) {
    const key = subBrand(tx);
    if (!grouped[key]) grouped[key] = { name: key, category: tx.category, txs: [] };
    grouped[key].txs.push(tx);
  }
  const out = [];
  for (const g of Object.values(grouped)) {
    const sorted = g.txs.slice().sort((a, b) => a.date.localeCompare(b.date));
    const last = sorted[sorted.length - 1];
    const amt = Math.abs(last.amount);
    let monthly = amt, cadence = 'monthly';
    if (sorted.length >= 2) {
      const gaps = []; for (let i = 1; i < sorted.length; i++) gaps.push((new Date(sorted[i].date) - new Date(sorted[i - 1].date)) / 86400000);
      const avg = gaps.reduce((x, y) => x + y, 0) / gaps.length;
      if (avg >= 5 && avg <= 10) { monthly = amt * 4.33; cadence = 'weekly'; }
      else if (avg >= 300) { monthly = amt / 12; cadence = 'yearly'; }
    }
    out.push({ name: g.name, category: g.category, amount: amt, monthly, cadence, count: g.txs.length, last: last.date });
  }
  return out.sort((a, b) => b.monthly - a.monthly);
}
// Detect habits (frequent discretionary merchants), normalized to a monthly figure over `months`
function detectHabits(transactions, months) {
  const m = {};
  for (const t of transactions) {
    if (t.amount >= 0 || t.excluded_from_spend) continue;
    if (isSubscriptionTx(t)) continue;
    if (!HABIT_CATS.has(t.category)) continue;
    const key = habitName(t);
    if (!m[key]) m[key] = { name: key, category: t.category, count: 0, total: 0 };
    m[key].count++; m[key].total += Math.abs(t.amount);
  }
  const mo = Math.max(1, months || 1);
  return Object.values(m).map(x => ({ ...x, monthly: x.total / mo, avg: x.total / x.count }))
    .sort((a, b) => b.total - a.total);
}
// Resolve a scope token to the list of month keys it covers
function monthsForScope(transactions, scope, latestMonth) {
  const allMonths = [...new Set(transactions.map(t => monthKey(t.date)))].sort();
  if (scope === 'this-month') return [latestMonth];
  if (scope === 'all') return allMonths;
  if (/^\d{4}-\d{2}$/.test(scope)) return allMonths.includes(scope) ? [scope] : [scope];
  const n = scope === 'last-3' ? 3 : scope === 'last-12' ? 12 : scope === 'last-24' ? 24 : 12;
  return allMonths.slice(-n);
}
function scopeLabel(scope) {
  if (scope === 'this-month') return 'This month';
  if (scope === 'last-3') return 'Last 3 months';
  if (scope === 'last-12') return 'Last 12 months';
  if (scope === 'last-24') return 'Last 24 months';
  if (scope === 'all') return 'All time';
  if (/^\d{4}-\d{2}$/.test(scope)) return fmtMonth(scope);
  return scope;
}

// ==================== MONTH PICKER ====================
function MonthPicker({ value, onChange, transactions }) {
  const months = useMemo(() => {
    const s = new Set(transactions.map(t => monthKey(t.date)));
    return [...s].sort();
  }, [transactions]);
  const idx = months.indexOf(value);
  const prev = () => { if (idx > 0) onChange(months[idx-1]); };
  const next = () => { if (idx < months.length - 1) onChange(months[idx+1]); };
  return (
    <div className="month-picker">
      <button onClick={prev} disabled={idx <= 0} aria-label="Previous month">◀</button>
      <span className="label mono">{fmtMonth(value)}</span>
      <button onClick={next} disabled={idx >= months.length - 1} aria-label="Next month">▶</button>
    </div>
  );
}

              el.style.transform = 'translate(-50%, -100%)';
            }
          }
        }
      }
    });
    return () => donutInst.current?.destroy();
  }, [categoryTotals, chartStyle]);

  // ---- Food hard cap (strict): restaurants + coffee + convenience ----
  const FOOD_CATS = ['Restaurants', 'Coffee & Drinks', 'Convenience'];
  const FOOD_CAP = goals.foodCap || 200;
  const foodThisMonth = transactions
    .filter(t => monthKey(t.date) === latestMonth && t.amount < 0 && !t.excluded_from_spend && FOOD_CATS.includes(t.category))
    .reduce((s, t) => s + Math.abs(t.amount), 0);
  const groceriesThisMonth = transactions
    .filter(t => monthKey(t.date) === latestMonth && t.amount < 0 && !t.excluded_from_spend && t.category === 'Groceries')
    .reduce((s, t) => s + Math.abs(t.amount), 0);
  const _now = new Date();
  const _dim = new Date(_now.getFullYear(), _now.getMonth() + 1, 0).getDate();
  const _dom = Math.max(1, _now.getDate());
  const foodPace = foodThisMonth / _dom * _dim;
  const foodPct = FOOD_CAP > 0 ? foodThisMonth / FOOD_CAP : 0;
  const foodOver = foodThisMonth > FOOD_CAP;
  const foodOnPaceOver = !foodOver && foodPace > FOOD_CAP;

  // ---- Conversation starters: ranked talking points the gatekeeper surfaces ----
  const starters = [];
  if (foodOver) {
    starters.push({ sev: 3, icon: '🍔', title: 'Food is over your hard cap',
      body: `${fmt$(foodThisMonth)} eating out this month vs a ${fmt$(FOOD_CAP)} cap — ${fmt$(foodThisMonth - FOOD_CAP)} over. Groceries this month: only ${fmt$(groceriesThisMonth)}.`,
      cta: 'See month', view: 'this-month' });
  } else if (foodOnPaceOver) {
    starters.push({ sev: 2, icon: '🍔', title: 'Food is on pace to blow the cap',
      body: `${fmt$(foodThisMonth)} so far, tracking toward ~${fmt$(foodPace)} by month-end vs the ${fmt$(FOOD_CAP)} cap. Cook a few nights to stay under.`,
      cta: 'See month', view: 'this-month' });
  }
  if (rawCashFlow < 0) {
    starters.push({ sev: 3, icon: '🚨', title: 'You spent more than you made',
      body: `Money out (${fmt$(cur.spend)}) beat money in (${fmt$(cur.income)}) this month. Let's find what tipped it before it becomes a habit.`,
      cta: 'See month', view: 'this-month' });
  }
  const _moveOut = new Date(goals.moveOutDate + 'T00:00:00');
  const _monthsLeft = Math.max(0, (_moveOut - _now) / 2629800000);
  const neededPerMonth = _monthsLeft > 0 ? gap / _monthsLeft : gap;
  if (gap > 0 && neededPerMonth > goals.monthlySaveRate * 1.05) {
    starters.push({ sev: 2, icon: '🎯', title: 'Behind pace for the Oct 1 move-out',
      body: `To reach ${fmt$(totalNeeded)} by ${goals.moveOutDate} you'd need ${fmt$(neededPerMonth)}/mo; the plan is ${fmt$(goals.monthlySaveRate)}/mo. Gap left: ${fmt$(gap)}.`,
      cta: 'Net worth', view: 'net-worth' });
  }
  if (foodThisMonth > 100 && groceriesThisMonth < foodThisMonth * 0.25) {
    starters.push({ sev: 1, icon: '🛒', title: 'Almost all your food is takeout',
      body: `${fmt$(foodThisMonth)} eating out vs ${fmt$(groceriesThisMonth)} on groceries. Shifting half to home cooking is the fastest cut on the board.`,
      cta: 'See month', view: 'this-month' });
  }
  const _pricySub = subs.find(s => s.monthly >= 50);
  if (_pricySub) {
    starters.push({ sev: 1, icon: '🔁', title: `Review: ${_pricySub.name}`,
      body: `${fmt$(_pricySub.monthly)}/mo recurring — ${fmt$(_pricySub.monthly * 12)}/yr. Still pulling its weight?`,
      cta: 'See month', view: 'this-month' });
  }
  if (bigPurchases.length) {
    const _b = bigPurchases[0];
    starters.push({ sev: 1, icon: '💳', title: 'Big purchase to confirm',
      body: `${_b.description.slice(0, 40)} — ${fmt$(Math.abs(_b.amount))}. Planned, or impulse?`,
      cta: 'Review', view: 'transactions' });
  }
  const topStarters = starters.sort((a, b) => b.sev - a.sev).slice(0, 5);

  const flowColor = trueCashFlow >= 0 ? 'var(--green)' : 'var(--red)';
  const periodLabel = scopeLabel(scope);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Dashboard</div>
          <div className="page-sub">Your money at a glance. Data through {latestSnap?.date || latestMonth}.</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          {userState.myBudget?.lockdownMode && (
            <div style={{ padding: '6px 14px', background: 'var(--red-dim)', color: 'var(--red)', borderRadius: 999, fontSize: 13, fontWeight: 700 }}>🔒 Lockdown active</div>
          )}
          <button
            title="Log into Rocket Money in Chrome FIRST, then copy this prompt into Cowork to refresh your data."
            onClick={() => setShowRefresh(v => !v)}
            className="btn btn-sm"
            style={{ display: 'inline-flex', alignItems: 'center', gap: 6, borderRadius: 10, fontWeight: 600 }}>
            <span style={{ fontSize: 15, lineHeight: 1 }}>⚙</span> Refresh data
          </button>
        </div>
      </div>

      {/* REFRESH: paste-into-Cowork prompt that fires the gatekeeper to scrape Rocket Money */}
      {showRefresh && (
        <div style={{ ...card, marginBottom: 16, borderRadius: 20, padding: '18px 20px', border: '1px solid var(--accent)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
            <div style={{ fontSize: 16, fontWeight: 700 }}>⚙ Morning refresh — fire the gatekeeper</div>
            <button onClick={() => setShowRefresh(false)} className="btn btn-sm" style={{ borderRadius: 10 }}>Close</button>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'var(--yellow-dim)', color: 'var(--yellow)', borderRadius: 10, padding: '8px 12px', fontSize: 13, fontWeight: 700, marginBottom: 12 }}>
            <span style={{ fontSize: 15 }}>⚠</span> Log into Rocket Money in Chrome FIRST. Then copy this and paste it into Cowork.
          </div>
          <textarea id="refresh-prompt-ta" readOnly value={REFRESH_PROMPT} onFocus={e => e.target.select()}
            style={{ width: '100%', minHeight: 190, resize: 'vertical', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 12.5, lineHeight: 1.5, color: 'var(--fg-0)', background: 'var(--bg-2)', border: '1px solid var(--border)', borderRadius: 12, padding: '12px 14px', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 10, flexWrap: 'wrap' }}>
            <button onClick={copyPrompt} className="btn" style={{ borderRadius: 10, background: 'var(--accent)', color: '#fff', border: 0, fontWeight: 700, padding: '8px 16px' }}>{copied ? 'Copied ✓' : 'Copy prompt'}</button>
            <span className="small muted" style={{ flex: 1, minWidth: 200 }}>Paste it into Cowork while you get ready. He scrapes Rocket Money, fills any gaps (missing May, partial June), rebuilds the dashboard, and leaves notes in his log.</span>
          </div>
        </div>
      )}

      {/* CONVERSATION STARTERS: the executive layer — what to talk about, ranked */}
      {topStarters.length > 0 && (
        <div style={{ ...card, marginBottom: 16, borderRadius: 20, padding: '18px 20px', border: '1px solid var(--accent)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, gap: 8, flexWrap: 'wrap' }}>
            <div style={{ fontSize: 17, fontWeight: 700 }}>💬 Let's talk about this</div>
            <span className="small muted">{topStarters.length} thing{topStarters.length > 1 ? 's' : ''} your money guy flagged · bring these to chat</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {topStarters.map((s, i) => {
              const sc = s.sev >= 3 ? 'var(--red)' : s.sev === 2 ? 'var(--yellow)' : 'var(--blue)';
              const sb = s.sev >= 3 ? 'var(--red-dim)' : s.sev === 2 ? 'var(--yellow-dim)' : 'var(--bg-2)';
              const slabel = s.sev >= 3 ? 'ACT' : s.sev === 2 ? 'WATCH' : 'FYI';
              return (
                <div key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', background: sb, borderRadius: 12, padding: '12px 14px', borderLeft: '3px solid ' + sc }}>
                  <span style={{ background: sc, color: '#fff', fontSize: 10, fontWeight: 800, letterSpacing: '.5px', padding: '3px 8px', borderRadius: 999, flexShrink: 0, marginTop: 1 }}>{slabel}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: sc }}>{s.title}</div>
                    <div style={{ fontSize: 13, color: 'var(--fg-1)', marginTop: 2 }}>{s.body}</div>
                  </div>
                  <button className="btn btn-sm" style={{ borderRadius: 10, flexShrink: 0 }} onClick={() => setView(s.view)}>{s.cta} →</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* HERO: This month cash flow */}
      <div style={{ ...card, marginBottom: 16, borderRadius: 20, padding: '24px 28px', background: 'linear-gradient(180deg, var(--bg-1), var(--bg-2))' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <div style={{ fontSize: 13, color: 'var(--fg-2)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.6px' }}>Money Saved, {fmtMonth(latestMonth)} <span style={{ color: 'var(--fg-3)', fontWeight: 500 }}>(month to date)</span></div>
            <div className="mono" style={{ fontSize: 42, fontWeight: 700, color: flowColor, lineHeight: 1.1, marginTop: 4 }}>{fmt$(trueCashFlow, true)}</div>
            <div className="small muted" style={{ marginTop: 4 }}>
              Income minus spending. Of this, {fmt$(cur.investment)} went into investments. One-time items excluded ({fmt$(oneOffSpendThisMonth)}). More paychecks land later this month.
            </div>
          </div>
          <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
            <div style={{ textAlign: 'right' }}>
              <div className="small muted">Income</div>
              <div className="mono" style={{ fontSize: 20, fontWeight: 600, color: 'var(--green)' }}>{fmt$(cur.income)}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div className="small muted">True spend</div>
              <div className="mono" style={{ fontSize: 20, fontWeight: 600 }}>{fmt$(trueSpend)}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div className="small muted">Invested</div>
              <div className="mono" style={{ fontSize: 20, fontWeight: 600, color: 'var(--blue)' }}>{fmt$(cur.investment)}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div className="small muted">Savings rate</div>
              <div className="mono" style={{ fontSize: 20, fontWeight: 600 }}>{fmtPct(savingsRate, 0)}</div>
            </div>
          </div>
        </div>
      </div>

      {/* KPI row */}
      <div className="grid cols-4" style={{ marginBottom: 16 }}>
        <div style={softCard}>
          <div className="small muted">Liquid cash on hand</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 700, marginTop: 2 }}>{fmt$(liquidCash)}</div>
        </div>
        <div style={softCard}>
          <div className="small muted">Net worth</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 700, marginTop: 2 }}>{fmt$(latestSnap ? sumValues(latestSnap.assets) - sumValues(latestSnap.liabilities) : 0)}</div>
        </div>
        <div style={softCard}>
          <div className="small muted">Move-out ETA (at pace)</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 700, marginTop: 2, color: 'var(--purple)' }}>{etaDate}</div>
        </div>
        <div style={softCard}>
          <div className="small muted">Target date countdown</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 700, marginTop: 2 }}>{daysToTarget > 0 ? daysToTarget + ' days' : 'now'}</div>
        </div>
      </div>

      {/* Goal trackers */}
      <div style={{ ...card, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>🎯 Move-Out Mission</div>
          <div className="small muted">{fmt$(liquidCash)} of {fmt$(totalNeeded)} saved ({fmtPct(fundProgress, 0)})</div>
        </div>
        <FriendlyBar label="Overall fund" value={liquidCash} target={totalNeeded} color="var(--purple)" big />
        <div style={{ fontSize: 13, color: 'var(--fg-1)', margin: '6px 0 16px' }}>
          {gap > 0 ? <>You need <span className="mono" style={{ fontWeight: 600 }}>{fmt$(gap)}</span> more. At {fmt$(goals.monthlySaveRate)}/mo that's about <strong>{monthsToGoal.toFixed(1)} months</strong> ({etaDate}).</> : <>You have enough to move. 🎉</>}
        </div>
        <div className="grid cols-2">
          <GoalTile label="Move-in costs" value={Math.min(liquidCash, goals.moveInTarget)} target={goals.moveInTarget} color="var(--teal)" />
          <GoalTile label="Emergency cushion" value={Math.max(0, Math.min(liquidCash - goals.moveInTarget, goals.cushionTarget))} target={goals.cushionTarget} color="var(--green)" />
        </div>
      </div>

      {/* Food hard cap (strict) */}
      <div style={{ ...card, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, gap: 8, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>🍔 Food — hard cap {fmt$(FOOD_CAP)}/mo</div>
          <span className="small" style={{ fontWeight: 700, color: foodOver ? 'var(--red)' : foodOnPaceOver ? 'var(--yellow)' : 'var(--green)' }}>
            {fmt$(foodThisMonth)} spent {foodOver ? '· OVER CAP' : foodOnPaceOver ? '· on pace to overshoot' : '· under'}
          </span>
        </div>
        <div style={{ height: 12, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden', position: 'relative' }}>
          <div style={{ height: '100%', width: Math.min(100, foodPct * 100) + '%', background: foodOver ? 'var(--red)' : foodOnPaceOver ? 'var(--yellow)' : 'var(--green)', borderRadius: 999, transition: 'width .3s' }} />
        </div>
        <div className="small muted" style={{ marginTop: 8 }}>
          Restaurants + coffee + convenience only. Groceries ({fmt$(groceriesThisMonth)} this month) don't count — cooking is encouraged. The cap sits below your recent average on purpose; that's the squeeze.
        </div>
      </div>

      {/* Spending donut + period filter */}
      <div style={{ marginBottom: 16 }}>
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4, gap: 8, flexWrap: 'wrap' }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>Where it went</div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <div style={{ display: 'inline-flex', background: 'var(--bg-3)', borderRadius: 999, padding: 3 }}>
                {[['bars','Bars'],['pie','Pie']].map(([k, label]) => (
                  <button key={k} onClick={() => setChartStyle(k)} style={{
                    border: 0, cursor: 'pointer', padding: '4px 12px', borderRadius: 999, fontSize: 12, fontWeight: 600,
                    background: chartStyle === k ? 'var(--accent)' : 'transparent', color: chartStyle === k ? '#fff' : 'var(--fg-1)'
                  }}>{label}</button>
                ))}
              </div>
              <ScopeSelect scope={scope} setScope={setScope} months={scopeMonths} />
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 12 }}>
            <span className="mono" style={{ fontSize: 22, fontWeight: 700 }}>{fmt$(periodTotal)}</span>
            <span className="small muted">spent · {periodLabel}{scopeMonths.length > 1 ? ' · ' + fmt$(periodTotal / scopeMonths.length) + '/mo avg' : ''}</span>
          </div>
          {chartStyle === 'pie' ? (
            <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
              <div style={{ position: 'relative', width: 190, height: 190, flexShrink: 0 }}>
                <canvas ref={donutRef}></canvas>
                <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none' }}>
                  <div className="small muted">{periodLabel}</div>
                  <div className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{fmt$short(periodTotal)}</div>
                </div>
              </div>
              <div style={{ flex: 1, minWidth: 170 }}>
                {categoryTotals.slice(0, 7).map((c, i) => (
                  <div key={c.cat} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', cursor: 'pointer' }} onClick={() => openDrawer({ type: 'category', category: c.cat, monthKey: latestMonth })}>
                    <span style={{ width: 9, height: 9, borderRadius: 2, background: FRIENDLY_COLORS[i], flexShrink: 0 }} />
                    <span style={{ fontSize: 12.5, flex: 1 }}>{categoriesDef[c.cat]?.display_name || c.cat}</span>
                    <span className="mono" style={{ fontSize: 12.5, fontWeight: 600 }}>{fmt$(c.total)}</span>
                    <span className="small muted" style={{ width: 34, textAlign: 'right' }}>{periodTotal > 0 ? Math.round(c.total / periodTotal * 100) : 0}%</span>
                  </div>
                ))}
                {categoryTotals.length === 0 && <div className="muted small">No spend in this period.</div>}
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {(() => {
                const maxCat = categoryTotals.length ? categoryTotals[0].total : 1;
                return categoryTotals.slice(0, 8).map((c, i) => (
                  <div key={c.cat} style={{ cursor: 'pointer' }} onClick={() => openDrawer({ type: 'category', category: c.cat, monthKey: latestMonth })}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 3 }}>
                      <span style={{ width: 8, height: 8, borderRadius: 2, background: FRIENDLY_COLORS[i], flexShrink: 0, alignSelf: 'center' }} />
                      <span style={{ fontSize: 13, flex: 1 }}>{categoriesDef[c.cat]?.display_name || c.cat}</span>
                      <span className="mono" style={{ fontSize: 13, fontWeight: 600 }}>{fmt$(c.total)}</span>
                      <span className="small muted" style={{ width: 36, textAlign: 'right' }}>{periodTotal > 0 ? Math.round(c.total / periodTotal * 100) : 0}%</span>
                    </div>
                    <div style={{ height: 8, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden', marginLeft: 16 }}>
                      <div style={{ height: '100%', width: Math.max(2, c.total / maxCat * 100) + '%', background: FRIENDLY_COLORS[i], borderRadius: 999 }} />
                    </div>
                  </div>
                ));
              })()}
              {categoryTotals.length === 0 && <div className="muted small">No spend in this period.</div>}
            </div>
          )}
        </div>
      </div>

      {/* Subscriptions vs Habits — two clearly separated cards */}
      <div className="grid cols-2">
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>🔁 Subscriptions</div>
            <span className="small muted">{fmt$(totalSubsMonthly)}/mo · {subs.length} active</span>
          </div>
          <div className="small muted" style={{ marginBottom: 10 }}>Recurring bills for access — apps & services you pay on a cycle.</div>
          {subs.length === 0 ? <div className="muted small">No recurring subscriptions detected.</div> : subs.map((s, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: i < subs.length-1 ? '1px solid var(--border)' : 'none' }}>
              <span style={{ fontSize: 13, flex: 1 }}>{s.name}</span>
              <span className="small muted" style={{ textTransform: 'capitalize' }}>{s.cadence}</span>
              {s.monthly >= 50 && <span style={{ background: 'var(--yellow-dim)', color: 'var(--yellow)', fontSize: 10.5, fontWeight: 700, padding: '1px 7px', borderRadius: 999 }}>REVIEW</span>}
              <span className="mono" style={{ fontWeight: 600, minWidth: 64, textAlign: 'right' }}>{fmt$(s.monthly)}/mo</span>
            </div>
          ))}
          {subs.length > 0 && <div className="small muted" style={{ marginTop: 10 }}>That's {fmt$(totalSubsMonthly * 12)}/yr on subscriptions.</div>}
        </div>
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>🛍 Habits</div>
            <span className="small muted">{periodLabel}</span>
          </div>
          <div className="small muted" style={{ marginBottom: 10 }}>Frequent choices you make each time — eating out, coffee, Amazon, shopping.</div>
          {habits.length === 0 ? <div className="muted small">No repeat discretionary spending in this window.</div> : habits.map((h, i) => (
            <div key={h.name + i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: i < habits.length-1 ? '1px solid var(--border)' : 'none' }}>
              <div style={{ width: 28, height: 28, borderRadius: 9, background: 'var(--bg-3)', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700, color: 'var(--fg-1)', flexShrink: 0 }}>{(h.name || '?').charAt(0).toUpperCase()}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.name}</div>
                <div className="small muted">{h.count}× · {fmt$(h.avg)} avg{scopeMonths.length > 1 ? ' · ' + fmt$(h.monthly) + '/mo' : ''}</div>
              </div>
              <span className="mono" style={{ fontWeight: 600 }}>{fmt$(h.total)}</span>
            </div>
          ))}
          <button className="btn btn-sm" style={{ marginTop: 12, borderRadius: 10 }} onClick={() => setView('review')}>Full breakdown in Review →</button>
        </div>
      </div>
    </>
  );
}

// Scope dropdown: This month, each past month, Last 3/12/24 months, All time
function ScopeSelect({ scope, setScope, months, allMonths }) {
  const monthOpts = (allMonths || []).slice().reverse();
  return (
    <select value={scope} onChange={e => setScope(e.target.value)} style={{
      appearance: 'auto', cursor: 'pointer', padding: '5px 10px', borderRadius: 999, fontSize: 12, fontWeight: 600,
      background: 'var(--bg-3)', color: 'var(--fg-1)', border: '1px solid var(--border)'
    }}>
      <option value="this-month">This month</option>
      <option value="last-3">Last 3 months</option>
      <option value="last-12">Last 12 months</option>
      <option value="last-24">Last 24 months</option>
      <option value="all">All time</option>
      {monthOpts.length > 0 && <optgroup label="Specific month">
        {monthOpts.map(m => <option key={m} value={m}>{fmtMonth(m)}</option>)}
      </optgroup>}
    </select>
  );
}

function FriendlyBar({ label, value, target, color, big }) {
  const pct = target > 0 ? Math.min(1, value / target) : 0;
  return (
    <div>
      <div style={{ height: big ? 14 : 8, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: (pct * 100) + '%', background: color, borderRadius: 999, transition: 'width .3s ease' }} />
      </div>
    </div>
  );
}

function GoalTile({ label, value, target, color, sub }) {
  const pct = target > 0 ? Math.min(1, value / target) : 0;
  return (
    <div style={{ background: 'var(--bg-2)', borderRadius: 14, padding: '14px 16px' }}>
      <div className="small muted">{label}</div>
      <div className="mono" style={{ fontSize: 18, fontWeight: 700, margin: '2px 0 8px' }}>{fmt$(value)} <span className="small muted" style={{ fontWeight: 400 }}>/ {fmt$short(target)}</span></div>
      <div style={{ height: 8, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: (pct * 100) + '%', background: color, borderRadius: 999 }} />
      </div>
      <div className="small" style={{ marginTop: 6, color: pct >= 1 ? 'var(--green)' : 'var(--fg-2)' }}>{sub || (pct >= 1 ? 'Funded ✓' : Math.round(pct * 100) + '% there')}</div>
    </div>
  );
}

// ==================== THIS MONTH VIEW ====================
function ThisMonthView({ transactions, selectedMonth, setSelectedMonth, dispatch, userState, categoriesDef, openDrawer }) {
  const cur = useMemo(() => aggregateForMonth(transactions, selectedMonth, categoriesDef), [transactions, selectedMonth, categoriesDef]);
  const prevKey = addMonths(selectedMonth, -1);
  const prev = useMemo(() => aggregateForMonth(transactions, prevKey, categoriesDef), [transactions, prevKey, categoriesDef]);

  const delta = (a, b) => {
    if (b === 0 && a === 0) return { abs: 0, pct: 0 };
    if (b === 0) return { abs: a, pct: null };
    return { abs: a - b, pct: (a - b) / b };
  };
  const dInc = delta(cur.income, prev.income);
  const dSpend = delta(cur.spend, prev.spend);
  const dNec = delta(cur.necessary, prev.necessary);
  const dDis = delta(cur.discretionary, prev.discretionary);

  const renderDelta = (d, invert=false) => {
    if (d.abs === 0) return <span className="delta-zero small">flat vs last month</span>;
    const positive = invert ? d.abs < 0 : d.abs > 0;
    const cls = positive ? 'delta-pos' : 'delta-neg';
    const arrow = d.abs > 0 ? '▲' : '▼';
    return (
      <span className={cls + ' small'}>
        {arrow} {fmt$(Math.abs(d.abs))}{d.pct !== null && ' (' + fmtPct(Math.abs(d.pct)) + ')'} vs last month
      </span>
    );
  };

  const necShare = cur.spend > 0 ? cur.necessary / cur.spend : 0;
  const disShare = cur.spend > 0 ? cur.discretionary / cur.spend : 0;

  const catRows = useMemo(() => {
    const all = new Set([...Object.keys(cur.byCategory), ...Object.keys(prev.byCategory)]);
    const rows = [];
    for (const cat of all) {
      const a = cur.byCategory[cat] || 0;
      const b = prev.byCategory[cat] || 0;
      rows.push({
        cat, current: a, prev: b,
        bucket: categoriesDef[cat]?.bucket || 'uncategorized',
        delta: a - b,
        deltaPct: b > 0 ? (a - b) / b : null,
      });
    }
    return rows.sort((x, y) => y.current - x.current);
  }, [cur.byCategory, prev.byCategory, categoriesDef]);

  // Data completeness check: flag months where income looks anomalously low compared to spend
  const dataWarning = useMemo(() => {
    if (cur.spend === 0) return null;
    if (cur.income > 0 && cur.income < cur.spend * 0.5 && cur.spend > 500) {
      return 'Income for this month looks low compared to spend. You may be missing a bank statement (e.g. North Island checking deposits not yet imported). Drop the latest statement in Drive and ask me to refresh.';
    }
    return null;
  }, [cur]);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">This Month</div>
          <div className="page-sub">Compare current month against the prior month, with necessary versus discretionary always on top.</div>
        </div>
        <div className="page-actions">
          <MonthPicker value={selectedMonth} onChange={setSelectedMonth} transactions={transactions} />
        </div>
      </div>

      {dataWarning && (
        <div className="help-callout" style={{ marginBottom: 14, borderLeftColor: 'var(--yellow)' }}>
          <strong>Heads up.</strong> {dataWarning}
        </div>
      )}

      <div className="grid cols-4" style={{ marginBottom: 14 }}>
        <div className="card">
          <div className="card-title">Income</div>
          <div className="card-value mono">{fmt$(cur.income)}</div>
          <div style={{ marginTop: 6 }}>{renderDelta(dInc)}</div>
        </div>
        <div className="card">
          <div className="card-title">Spend</div>
          <div className="card-value mono">{fmt$(cur.spend)}</div>
          <div style={{ marginTop: 6 }}>{renderDelta(dSpend, true)}</div>
        </div>
        <div className="card">
          <div className="card-title">Net Cash Flow</div>
          <div className={'card-value mono ' + (cur.netCashFlow >= 0 ? 'delta-pos' : 'delta-neg')}>
            {fmt$(cur.netCashFlow)}
          </div>
          <div className="small muted" style={{ marginTop: 6 }}>
            Income, less spend, less investing, less debt principal.
          </div>
        </div>
        <div className="card">
          <div className="card-title">Investing</div>
          <div className="card-value mono delta-pos">{fmt$(cur.investment)}</div>
          <div className="small muted" style={{ marginTop: 6 }}>Excluded from spend totals.</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div>
            <div className="card-title">Necessary versus Discretionary</div>
            <div className="card-value mono" style={{ fontSize: 18 }}>
              <span style={{ color: 'var(--necessary)' }}>{fmt$(cur.necessary)}</span>
              <span className="muted" style={{ margin: '0 10px', fontSize: 14 }}>versus</span>
              <span style={{ color: 'var(--discretionary)' }}>{fmt$(cur.discretionary)}</span>
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div className="small muted">Necessary share</div>
            <div className="mono" style={{ fontSize: 18, fontWeight: 600 }}>{fmtPct(necShare, 0)}</div>
          </div>
        </div>
        <div className="split-bar">
          <div className="seg-necessary" style={{ width: (necShare * 100) + '%' }} />
          <div className="seg-discretionary" style={{ width: (disShare * 100) + '%' }} />
        </div>
        <div className="split-legend">
          <span><span className="legend-dot necessary" />Necessary {fmt$(cur.necessary)}</span>
          <span><span className="legend-dot discretionary" />Discretionary {fmt$(cur.discretionary)}</span>
          <span className="muted">Last month: {fmt$(prev.necessary)} versus {fmt$(prev.discretionary)}</span>
          <span style={{ marginLeft: 'auto' }}>{renderDelta(dDis, true)}</span>
        </div>
      </div>

      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
          <div className="card-title">Spend by Category</div>
          <div className="small muted">Click any row to drill into its transactions.</div>
        </div>
        <table className="table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Bucket</th>
              <th className="right">{fmtMonth(selectedMonth)}</th>
              <th className="right">{fmtMonth(prevKey)}</th>
              <th className="right">Delta</th>
            </tr>
          </thead>
          <tbody>
            {catRows.map(r => (
              <tr key={r.cat} className="row-clickable" onClick={() => openDrawer({ type: 'category', category: r.cat, monthKey: selectedMonth })}>
                <td>
                  <span className="cat-pill">
                    <span className={'dot ' + r.bucket} />
                    {categoriesDef[r.cat]?.display_name || r.cat}
                  </span>
                </td>
                <td><span className={'tag ' + r.bucket}>{r.bucket}</span></td>
                <td className="right mono">{fmt$(r.current)}</td>
                <td className="right mono muted">{fmt$(r.prev)}</td>
                <td className={'right mono ' + (r.delta > 0 ? 'delta-neg' : r.delta < 0 ? 'delta-pos' : 'delta-zero')}>
                  {r.delta === 0 ? '—' : (r.delta > 0 ? '+' : '') + fmt$(r.delta)}
                  {r.deltaPct !== null && r.delta !== 0 && (
                    <span className="small muted" style={{ marginLeft: 6 }}>({(r.deltaPct > 0 ? '+' : '') + fmtPct(r.deltaPct, 0)})</span>
                  )}
                </td>
              </tr>
            ))}
            {catRows.length === 0 && (
              <tr><td colSpan="5" className="muted center">No transactions for this month yet.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ==================== REVIEW VIEW ====================
// How each month went + the big picture (1yr / 2yr / all), with subscriptions and habits kept separate.
function ReviewView({ transactions, categoriesDef, openDrawer }) {
  const [scope, setScope] = useState('last-12');
  const card = { background: 'var(--bg-1)', border: '1px solid var(--border)', borderRadius: 16, padding: '18px 20px' };
  const softCard = { background: 'var(--bg-2)', borderRadius: 14, padding: '16px 18px' };

  const allMonths = useMemo(() => [...new Set(transactions.map(t => monthKey(t.date)))].sort(), [transactions]);
  const latestMonth = allMonths[allMonths.length - 1] || monthKey(today());
  const months = useMemo(() => monthsForScope(transactions, scope, latestMonth).filter(m => allMonths.includes(m)), [transactions, scope, latestMonth, allMonths]);

  const series = useMemo(() => months.map(mk => {
    const a = aggregateForMonth(transactions, mk, categoriesDef);
    return { mk, income: a.income, spend: a.spend, investment: a.investment, saved: a.income - a.spend, byCategory: a.byCategory };
  }), [months, transactions, categoriesDef]);

  const totals = useMemo(() => {
    const t = { income: 0, spend: 0, investment: 0 };
    for (const s of series) { t.income += s.income; t.spend += s.spend; t.investment += s.investment; }
    t.saved = t.income - t.spend;
    t.rate = t.income > 0 ? t.saved / t.income : 0;
    t.n = Math.max(1, series.length);
    return t;
  }, [series]);

  const scopeTxs = useMemo(() => {
    const set = new Set(months);
    return transactions.filter(x => set.has(monthKey(x.date)));
  }, [transactions, months]);

  const catTotals = useMemo(() => {
    const m = {};
    for (const s of series) for (const [c, v] of Object.entries(s.byCategory)) m[c] = (m[c] || 0) + v;
    return Object.entries(m).map(([cat, total]) => ({ cat, total })).sort((a, b) => b.total - a.total);
  }, [series]);
  const catMax = catTotals.length ? catTotals[0].total : 1;

  const habits = useMemo(() => detectHabits(scopeTxs, months.length).slice(0, 8), [scopeTxs, months]);
  const subs = useMemo(() => detectSubscriptions(transactions, 12), [transactions]);
  const totalSubsMonthly = subs.reduce((s, x) => s + x.monthly, 0);
  const bigPurchases = useMemo(() => scopeTxs.filter(t => t.amount < 0 && Math.abs(t.amount) > 100 &&
    !['Family Bundle', 'Auto Loan', 'Investment', 'Credit Card Payment', 'Transfer', 'Returns'].includes(t.category))
    .sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount)).slice(0, 8), [scopeTxs]);

  const barMax = Math.max(1, ...series.map(s => Math.max(s.income, s.spend)));
  const multi = series.length > 1;

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Review</div>
          <div className="page-sub">How each month went — and the big picture.</div>
        </div>
        <ScopeSelect scope={scope} setScope={setScope} months={months} allMonths={allMonths} />
      </div>

      <div className="grid cols-4" style={{ marginBottom: 16 }}>
        <div style={softCard}>
          <div className="small muted">Income {multi ? '(total)' : ''}</div>
          <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: 'var(--green)', marginTop: 2 }}>{fmt$(totals.income)}</div>
          {multi && <div className="small muted">{fmt$(totals.income / totals.n)}/mo avg</div>}
        </div>
        <div style={softCard}>
          <div className="small muted">Spend {multi ? '(total)' : ''}</div>
          <div className="mono" style={{ fontSize: 22, fontWeight: 700, marginTop: 2 }}>{fmt$(totals.spend)}</div>
          {multi && <div className="small muted">{fmt$(totals.spend / totals.n)}/mo avg</div>}
        </div>
        <div style={softCard}>
          <div className="small muted">Saved {multi ? '(total)' : ''}</div>
          <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: totals.saved >= 0 ? 'var(--green)' : 'var(--red)', marginTop: 2 }}>{fmt$(totals.saved, true)}</div>
          {multi && <div className="small muted">{fmt$(totals.saved / totals.n, true)}/mo avg</div>}
        </div>
        <div style={softCard}>
          <div className="small muted">Savings rate</div>
          <div className="mono" style={{ fontSize: 22, fontWeight: 700, marginTop: 2 }}>{fmtPct(totals.rate, 0)}</div>
          <div className="small muted">of income kept</div>
        </div>
      </div>

      {/* Month-by-month */}
      <div style={{ ...card, marginBottom: 16 }}>
        <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 14 }}>Month by month</div>
        {series.slice().reverse().map(s => {
          const over = s.spend > s.income;
          return (
            <div key={s.mk} style={{ padding: '10px 0', borderBottom: '1px solid var(--border)', cursor: 'pointer' }} onClick={() => setScope(s.mk)}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 6 }}>
                <span style={{ fontSize: 13, fontWeight: 600, width: 110 }}>{fmtMonth(s.mk)}</span>
                <span className="small muted">in {fmt$(s.income)} · out {fmt$(s.spend)}</span>
                <span className="mono" style={{ marginLeft: 'auto', fontWeight: 700, color: s.saved >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmt$(s.saved, true)}{over ? ' ⚠' : ''}</span>
              </div>
              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                <div style={{ flex: 1, height: 7, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: Math.max(2, s.income / barMax * 100) + '%', background: 'var(--green)', borderRadius: 999 }} />
                </div>
                <div style={{ flex: 1, height: 7, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: Math.max(2, s.spend / barMax * 100) + '%', background: over ? 'var(--red)' : 'var(--yellow)', borderRadius: 999 }} />
                </div>
              </div>
            </div>
          );
        })}
        <div className="small muted" style={{ marginTop: 10 }}>Green = income, amber = spend, red = a month you outspent income. Click a month to zoom into it.</div>
      </div>

      {/* Categories + Habits */}
      <div className="grid cols-2" style={{ marginBottom: 16 }}>
        <div style={card}>
          <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>Where it went · {scopeLabel(scope)}</div>
          {catTotals.slice(0, 9).map((c, i) => (
            <div key={c.cat} style={{ cursor: months.length === 1 ? 'pointer' : 'default', marginBottom: 9 }} onClick={() => months.length === 1 && openDrawer({ type: 'category', category: c.cat, monthKey: months[0] })}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 3 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: FRIENDLY_COLORS[i % FRIENDLY_COLORS.length], alignSelf: 'center' }} />
                <span style={{ fontSize: 13, flex: 1 }}>{categoriesDef[c.cat]?.display_name || c.cat}</span>
                <span className="mono" style={{ fontSize: 13, fontWeight: 600 }}>{fmt$(c.total)}</span>
              </div>
              <div style={{ height: 7, background: 'var(--bg-3)', borderRadius: 999, overflow: 'hidden', marginLeft: 16 }}>
                <div style={{ height: '100%', width: Math.max(2, c.total / catMax * 100) + '%', background: FRIENDLY_COLORS[i % FRIENDLY_COLORS.length], borderRadius: 999 }} />
              </div>
            </div>
          ))}
          {catTotals.length === 0 && <div className="muted small">No spend in this window.</div>}
        </div>
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>🛍 Habits</div>
            <span className="small muted">ranked by spend</span>
          </div>
          <div className="small muted" style={{ marginBottom: 10 }}>Frequent choices — not bills. {multi ? 'Monthly figures are averages over the window.' : ''}</div>
          {habits.length === 0 ? <div className="muted small">No repeat discretionary spending here.</div> : habits.map((h, i) => (
            <div key={h.name + i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: i < habits.length - 1 ? '1px solid var(--border)' : 'none' }}>

      {/* Subscriptions + Big purchases */}

            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: i < subs.length - 1 ? '1px solid var(--border)' : 'none' }}>
              <span style={{ fontSize: 13, flex: 1 }}>{s.name}</span>

              {s.monthly >= 50 && <span style={{ background: 'var(--yellow-dim)', color: 'var(--yellow)', fontSize: 10.5, fontWeight: 700, padding: '1px 7px', borderRadius: 999 }}>REVIEW</span>}
